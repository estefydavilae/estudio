<!DOCTYPE html>
<html lang="es">
<head>

<style>
:root{--bg:#f5efe6;--card:#fffaf3;--ink:#1e2733;--muted:#6b7380;--line:#e6dccd;--blue:#2f6db3;--coral:#d9654b;--green:#2e8b57;--yellow:#e8b931;--shadow:0 1px 2px rgba(60,40,20,.06),0 10px 30px rgba(60,40,20,.08)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:1080px;margin:0 auto;padding:22px 18px 60px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:700;letter-spacing:-.01em;margin:0}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin:10px 0 26px}
.hero h1{font-size:clamp(30px,5vw,46px);line-height:1.02}
.hero h1 em{font-style:normal;color:var(--coral)}
.hero p{color:var(--muted);margin:10px 0 0;max-width:560px;line-height:1.5}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;text-align:left;box-shadow:var(--shadow);transition:transform .15s,border-color .15s;display:flex;flex-direction:column;gap:8px;min-height:170px}
.mcard:hover{transform:translateY(-2px);border-color:#cdbca4}
.mcard .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px}
.mcard h3{font-size:19px}
.mcard p{margin:0;color:var(--muted);font-size:14px;line-height:1.45;flex:1}
.mcard .acc{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.bar{height:6px;background:#eee3d3;border-radius:6px;flex:1;overflow:hidden}
.bar div{height:100%;background:var(--green);border-radius:6px}
.mcard.exam{background:#1e2733;color:#fdf6ea;border-color:#1e2733}
.mcard.exam p{color:#c9c2b5}
.section-title{margin:34px 0 12px;font-size:22px}
.cheat{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:6px 20px 18px}
.cheat details{border-bottom:1px solid var(--line);padding:12px 0}
.cheat details:last-child{border-bottom:0}
.cheat summary{cursor:pointer;font-weight:600;font-size:15.5px;list-style:none;display:flex;justify-content:space-between}
.cheat summary::after{content:'+';color:var(--muted);font-weight:400}
.cheat details[open] summary::after{content:'–'}
.cheat p,.cheat li{font-size:14.5px;line-height:1.55;color:#38414d}
table{border-collapse:collapse;width:100%;font-size:13.5px;margin-top:10px}
th,td{border-bottom:1px solid var(--line);padding:8px 8px;text-align:left;vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.tag{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:600}
.t-ap{background:#fbe3dc;color:#a8432f}.t-dv{background:#dfe9f6;color:#2a5a9a}.t-lr{background:#dcefe3;color:#23704a}
/* game */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.ghost{background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px}
.ghost:hover{background:#fff}
.mode-title{font-family:Fraunces,serif;font-weight:700;font-size:20px;flex:1}
.chips{display:flex;gap:8px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600}
.chip.fire{color:var(--coral)}
.progress{height:6px;background:#e9dfd0;border-radius:6px;margin:-4px 0 14px;overflow:hidden}
.progress div{height:100%;background:var(--ink);transition:width .3s}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);overflow:hidden}
.qcard.textonly{grid-template-columns:1fr;max-width:720px;margin:0 auto}

canvas:active{cursor:grabbing}
.figtools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:12.5px;color:var(--muted)}

.figtools button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
svg.fig{width:100%;height:auto;max-height:440px;display:block}
.qside{padding:24px 24px 22px;display:flex;flex-direction:column;gap:12px}
.qside .cat{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.qside h2{font-size:23px;line-height:1.2}

.opts{display:grid;gap:9px;margin-top:4px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15.5px;font-weight:500;transition:border-color .12s,background .12s,transform .08s}
.opt:hover:not(:disabled){border-color:#bfae96;transform:translateX(2px)}
.opt .k{width:24px;height:24px;border-radius:7px;background:#f1e8db;display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--muted);flex:none}
.opt.correct,.dir.correct{border-color:var(--green);background:#e6f4ec}

.fb p{margin:6px 0 0}
.fb .tip{background:rgba(255,255,255,.6);border-radius:10px;padding:8px 10px;margin-top:10px}
.primary{background:var(--ink);color:#fff;border:0;border-radius:999px;padding:11px 20px;font-weight:600;font-size:15px;margin-top:12px}
.primary:hover{background:#000}

.dirgrid{display:grid;grid-template-columns:44px 1fr 44px;grid-template-rows:44px 1fr 44px;gap:6px;align-items:center;justify-items:center}
.dir{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:16px;color:var(--ink);display:grid;place-items:center;transition:transform .1s,border-color .1s}

.dir.wide{width:100%;border-radius:999px;height:40px}
.figcell{width:100%}
.lbl{opacity:0;transition:opacity .5s .55s}
.lbl.show{opacity:1}
.lt{font-family:Inter,sans-serif;font-size:13px;font-weight:600;fill:#1e2733;paint-order:stroke;stroke:#fffaf3;stroke-width:4px;stroke-linejoin:round}
.ll{stroke:#1e2733;stroke-width:1;opacity:.55}
.ld{fill:#1e2733}
.axt{font-family:Inter,sans-serif;font-size:13px;font-weight:700;letter-spacing:.08em;paint-order:stroke;stroke:#fbf6ee;stroke-width:4px}
.results{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:30px;max-width:640px;margin:0 auto;text-align:center}
.results .big{font-family:Fraunces,serif;font-size:72px;font-weight:700;line-height:1}
.results .rows{text-align:left;margin:22px 0 6px;display:grid;gap:10px}
.results .row{display:grid;grid-template-columns:170px 1fr 52px;gap:12px;align-items:center;font-size:14px}
.btnrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.btnrow .primary,.btnrow .ghost{margin-top:0}
.lab{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.lab .ctrl{padding:22px;display:flex;flex-direction:column;gap:16px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:7px 13px;font-size:14px}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.ctrl label{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;display:block;margin-bottom:6px}
input[type=range]{width:100%;accent-color:var(--blue)}
.desc{background:#f6efe3;border-radius:14px;padding:14px;font-size:14.5px;line-height:1.5}
.desc b{font-family:Fraunces,serif;font-size:18px;display:block;margin-bottom:4px}
.kbd{font-size:12px;color:var(--muted);margin-top:auto}
@media (max-width:820px){.qcard,.lab{grid-template-columns:1fr}.figwrap{border-right:0;border-bottom:1px solid var(--line);min-height:0}canvas{height:330px}.results .row{grid-template-columns:120px 1fr 44px}}
</style>

<body>
<div id="app"></div>
<script>
/* ================= utilidades ================= */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const sc=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];
const norm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l]};
const hexRgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];

const CATS={planos3d:'Planos en 3D',cortes:'Del corte al plano',vistas:'¿Desde dónde lo ves?',orienta:'Orienta la imagen',vocab:'Vocabulario'};
let STATS={};try{STATS=JSON.parse(localStorage.getItem('pp_stats_v1')||'{}')}catch(e){}
function record(cat,ok){const s=STATS[cat]||(STATS[cat]={ok:0,n:0});s.n++;if(ok)s.ok++;try{localStorage.setItem('pp_stats_v1',JSON.stringify(STATS))}catch(e){}}

/* ================= modelos 3D ================= */
const SKIN='#f0c4a8',CUT='#e07b62';
function E(c,r,col,cut,small){return {c,r,col:col||SKIN,cut:cut||CUT,small:!!small}}
function surfTop(parts,x){let b=-99;for(const p of parts){const dx=(x-p.c[0])/p.r[0];if(Math.abs(dx)>=1)continue;b=Math.max(b,p.c[1]+p.r[1]*Math.sqrt(1-dx*dx))}return b}
function surfSide(parts,x,y){let b=-99;for(const p of parts){const dx=(x-p.c[0])/p.r[0],dy=(y-p.c[1])/p.r[1],k=1-dx*dx-dy*dy;if(k<=0)continue;b=Math.max(b,p.c[2]+p.r[2]*Math.sqrt(k))}return b}

function buildEmbrion(){
  const base=[E([0,0,0],[2.2,.75,.62]),E([2.1,.15,0],[.95,.88,.78]),E([-2.4,0,0],[1.35,.36,.26])];
  const parts=[...base,E([.3,-.5,0],[1.25,.5,.5],'#f3d27a','#dcae35'),
    E([2.55,.38,.66],[.24,.24,.16],'#2b2b33','#22222a',true),E([2.55,.38,-.66],[.24,.24,.16],'#2b2b33','#22222a',true)];
  for(let x=-3.1;x<=2.31;x+=.2){const t=surfTop(base,x);parts.push(E([x,t-.05,0],[.13,.09,.13],'#5b8fd0','#2f5f9e',true))}
  for(let x=-2.5;x<=1.25;x+=.28){const y=.3,z=surfSide(base,x,y);if(z<0)continue;const k=1-Math.max(0,(-x-1.2)/1.6)*.5;
    parts.push(E([x,y,z-.04],[.11*k,.17*k,.07],'#e48a74','#a8432f',true));parts.push(E([x,y,-(z-.04)],[.11*k,.17*k,.07],'#e48a74','#a8432f',true))}
  return parts;
}
const ORGS={
  embrion:{name:'Embrión de vertebrado',human:false,A:[1,0,0],D:[0,1,0],L:[0,0,-1],parts:buildEmbrion(),
    trans:[-2.8,2.6],front:[-.15,.28],para:.4,
    lab:{A:['Anterior (craneal)','Posterior (caudal)'],D:['Dorsal','Ventral'],L:['Izquierda','Derecha']}},
  raton:{name:'Ratón (cuadrúpedo)',human:false,A:[1,0,0],D:[0,1,0],L:[0,0,-1],
    parts:[E([0,0,0],[1.8,.8,.75]),E([2.0,.35,0],[.78,.62,.56]),E([2.62,.22,0],[.38,.3,.3]),E([2.98,.25,0],[.1,.09,.09],'#c0606a','#8e3a42',true),
      E([1.8,.95,.35],[.12,.32,.26],'#e9a98f'),E([1.8,.95,-.35],[.12,.32,.26],'#e9a98f'),
      E([2.35,.55,.42],[.1,.1,.08],'#2b2b33','#22222a',true),E([2.35,.55,-.42],[.1,.1,.08],'#2b2b33','#22222a',true),
      E([1.1,-.95,.45],[.22,.6,.22]),E([1.1,-.95,-.45],[.22,.6,.22]),E([-1.1,-.95,.45],[.22,.6,.22]),E([-1.1,-.95,-.45],[.22,.6,.22]),
      E([-2.5,-.1,0],[1.0,.1,.1],'#e9a98f')],
    trans:[-1.9,2.7],front:[-.2,.3],para:.42,
    lab:{A:['Anterior (craneal)','Posterior (caudal)'],D:['Dorsal','Ventral'],L:['Izquierda','Derecha']}},
  humano:{name:'Humano (posición anatómica)',human:true,A:[0,1,0],D:[0,0,-1],L:[1,0,0],
    parts:[E([0,1.2,0],[.75,1.0,.4]),E([0,.2,0],[.7,.4,.38]),E([0,2.75,0],[.45,.55,.48]),
      E([0,2.95,-.08],[.47,.4,.47],'#4a3426','#3a2a20'),E([0,2.7,.5],[.08,.12,.1],SKIN,CUT,true),
      E([.17,2.85,.4],[.07,.05,.07],'#2b2b33','#22222a',true),E([-.17,2.85,.4],[.07,.05,.07],'#2b2b33','#22222a',true),
      E([.95,1.0,0],[.2,1.1,.2]),E([-.95,1.0,0],[.2,1.1,.2]),
      E([.32,-1.4,0],[.25,1.4,.27]),E([-.32,-1.4,0],[.25,1.4,.27]),
      E([.32,-2.85,.2],[.2,.1,.38]),E([-.32,-2.85,.2],[.2,.1,.38])],
    trans:[-2.5,3.0],front:[-.12,.12],para:.32,
    lab:{A:['Craneal (superior)','Caudal (inferior)'],D:['Dorsal (posterior)','Ventral (anterior)'],L:['Izquierda','Derecha']}}
};
function meshFor(org){
  if(org._F)return org._F;const F=[];
  for(const p of org.parts){const NT=p.small?6:14,NP=p.small?10:24,rgb=hexRgb(p.col);
    const P=(t,f)=>[p.c[0]+p.r[0]*Math.sin(t)*Math.cos(f),p.c[1]+p.r[1]*Math.cos(t),p.c[2]+p.r[2]*Math.sin(t)*Math.sin(f)];
    for(let i=0;i<NT;i++)for(let j=0;j<NP;j++){const t0=Math.PI*i/NT,t1=Math.PI*(i+1)/NT,f0=2*Math.PI*j/NP,f1=2*Math.PI*(j+1)/NP;
      const cc=P((t0+t1)/2,(f0+f1)/2);
      F.push({pts:[P(t0,f0),P(t1,f0),P(t1,f1),P(t0,f1)],cc,rgb,n:norm([(cc[0]-p.c[0])/(p.r[0]*p.r[0]),(cc[1]-p.c[1])/(p.r[1]*p.r[1]),(cc[2]-p.c[2])/(p.r[2]*p.r[2])])})}}
  const mn=[99,99,99],mx=[-99,-99,-99];
  for(const p of org.parts)for(let k=0;k<3;k++){mn[k]=Math.min(mn[k],p.c[k]-p.r[k]);mx[k]=Math.max(mx[k],p.c[k]+p.r[k])}
  org._bc=mn.map((v,k)=>(v+mx[k])/2);org._bh=mn.map((v,k)=>(mx[k]-v)/2);org._F=F;return F;
}
function planeNormal(org,type){return type==='transversal'?org.A:type==='frontal'?org.D:org.L}
function makePlane(org,type,off){
  meshFor(org);const n=planeNormal(org,type);const [e1,e2]=[org.A,org.D,org.L].filter(a=>a!==n);
  const bc=org._bc,bh=org._bh,ab=a=>Math.abs(a[0])*bh[0]+Math.abs(a[1])*bh[1]+Math.abs(a[2])*bh[2];
  const h1=ab(e1)+.3,h2=ab(e2)+.3;
  const o=add(add(sc(n,off),sc(e1,dot(bc,e1))),sc(e2,dot(bc,e2)));
  const corners=[[-1,-1],[1,-1],[1,1],[-1,1]].map(([a,b])=>add(add(o,sc(e1,a*h1)),sc(e2,b*h2)));
  const secs=[];
  for(const p of org.parts){const r=p.r;
    const w=[(o[0]-p.c[0])/r[0],(o[1]-p.c[1])/r[1],(o[2]-p.c[2])/r[2]],a1=[e1[0]/r[0],e1[1]/r[1],e1[2]/r[2]],a2=[e2[0]/r[0],e2[1]/r[1],e2[2]/r[2]];
    const A=dot(a1,a1),B=dot(a1,a2),C=dot(a2,a2),D=dot(a1,w),Ee=dot(a2,w),Fv=dot(w,w),det=A*C-B*B;
    const u0=(-D*C+Ee*B)/det,v0=(-Ee*A+D*B)/det,Qm=A*u0*u0+2*B*u0*v0+C*v0*v0+2*D*u0+2*Ee*v0+Fv;
    if(Qm>=1)continue;const pts=[];
    for(let k=0;k<40;k++){const th=2*Math.PI*k/40,dc=Math.cos(th),ds=Math.sin(th),q2=A*dc*dc+2*B*dc*ds+C*ds*ds,t=Math.sqrt((1-Qm)/q2);
      pts.push(add(add(o,sc(e1,u0+t*dc)),sc(e2,v0+t*ds)))}
    secs.push({pts,cut:p.cut})}
  return {n,o,e1,e2,corners,secs,type,off};
}
function randomCam(org,n){
  for(let i=0;i<120;i++){const yaw=Math.random()*Math.PI*2,pitch=org.human?rnd(-.55,.8):rnd(-.3,.8);
    const V=[Math.sin(yaw)*Math.cos(pitch),-Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch)],d=Math.abs(dot(n,V));
    if(d>.45&&d<.93)return {yaw,pitch}}
  return {yaw:.7,pitch:.35};
}
function render3D(cv,st){
  const org=st.org,F=meshFor(org),dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
  if(!W||!H)return;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
  const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  const bc=org._bc,bh=org._bh,s=Math.min(W,H)*.5/Math.hypot(bh[0],bh[1],bh[2])*1.12;
  const ya=st.cam.yaw,pi=st.cam.pitch,ca=Math.cos(ya),sa=Math.sin(ya),cb=Math.cos(pi),sb=Math.sin(pi);
  const rot=(x,y,z)=>{const x1=ca*x+sa*z,z1=-sa*x+ca*z;return [x1,cb*y-sb*z1,sb*y+cb*z1]};
  const proj=p=>{const q=rot(p[0]-bc[0],p[1]-bc[1],p[2]-bc[2]);return [W/2+s*q[0],H/2-s*q[1],q[2]]};
  const V=[sa*cb,-sb,-ca*cb],Lt=norm([-.45,.62,.65]),Hh=norm([Lt[0],Lt[1],Lt[2]+1]);
  const pl=st.plane;let sg=1;if(pl){sg=Math.sign(dot(pl.n,V))||1}
  const kept=[],ghost=[];
  for(const f of F){const nc=rot(f.n[0],f.n[1],f.n[2]);if(nc[2]<=.01)continue;
    const it={f,nc,z:proj(f.cc)[2],pp:f.pts.map(proj)};
    if(pl&&sg*dot(sub(f.cc,pl.o),pl.n)<0)ghost.push(it);else kept.push(it)}
  kept.sort((a,b)=>a.z-b.z);ghost.sort((a,b)=>a.z-b.z);
  const path=pts=>{ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath()};
  const face=(it,alpha)=>{const sh=.4+.6*Math.max(0,dot(it.nc,Lt)),sp=Math.pow(Math.max(0,dot(it.nc,Hh)),22)*60,[r,g,b]=it.f.rgb;
    const c=`rgb(${Math.min(255,r*sh+sp)|0},${Math.min(255,g*sh+sp)|0},${Math.min(255,b*sh+sp)|0})`;
    path(it.pp);ctx.globalAlpha=alpha;ctx.fillStyle=c;ctx.fill();if(alpha===1){ctx.strokeStyle=c;ctx.lineWidth=.7;ctx.stroke()}};
  for(const it of kept)face(it,1);
  ctx.globalAlpha=1;
  if(pl){const cs=pl.corners.map(proj);path(cs);ctx.fillStyle='rgba(47,109,179,0.15)';ctx.fill();
    const secs=pl.secs.map(x=>({pp:x.pts.map(proj),cut:x.cut}));ctx.lineJoin='round';
    for(const x of secs){path(x.pp);ctx.strokeStyle='#5a1f14';ctx.lineWidth=3;ctx.stroke()}
    for(const x of secs){path(x.pp);ctx.fillStyle=x.cut;ctx.fill()}}
  for(const it of ghost)face(it,.12);
  ctx.globalAlpha=1;
  if(pl){const cs=pl.corners.map(proj);path(cs);ctx.setLineDash([6,5]);ctx.strokeStyle='rgba(47,109,179,.9)';ctx.lineWidth=1.6;ctx.stroke();ctx.setLineDash([])}
  if(st.axes){
    const axes=[[org.A,'#c8513a',org.lab.A],[org.D,'#2f6db3',org.lab.D],[org.L,'#23704a',org.lab.L]];
    ctx.font='600 12.5px Inter, sans-serif';ctx.lineJoin='round';
    for(const [ax,col,lb] of axes){const len=Math.abs(ax[0])*bh[0]+Math.abs(ax[1])*bh[1]+Math.abs(ax[2])*bh[2]+.45;
      const p1=proj(add(bc,sc(ax,len))),p0=proj(add(bc,sc(ax,-len)));
      ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=2.4;ctx.beginPath();ctx.moveTo(p0[0],p0[1]);ctx.lineTo(p1[0],p1[1]);ctx.stroke();
      const dx=p1[0]-p0[0],dy=p1[1]-p0[1],dl=Math.hypot(dx,dy);
      if(dl>20){const ux=dx/dl,uy=dy/dl;ctx.beginPath();ctx.moveTo(p1[0],p1[1]);ctx.lineTo(p1[0]-11*ux-5*uy,p1[1]-11*uy+5*ux);ctx.lineTo(p1[0]-11*ux+5*uy,p1[1]-11*uy-5*ux);ctx.closePath();ctx.fill()}
      const ux=dl>1?dx/dl:0,uy=dl>1?dy/dl:-1;
      [[p1,lb[0],1],[p0,lb[1],-1]].forEach(([p,t,sgn])=>{const x=p[0]+sgn*ux*10,y=p[1]+sgn*uy*10+4;ctx.textAlign=(sgn*ux)>.3?'left':(sgn*ux)<-.3?'right':'center';
        ctx.strokeStyle='#fbf6ee';ctx.lineWidth=4;ctx.strokeText(t,x,y);ctx.fillStyle=col;ctx.fillText(t,x,y)})}
  }
}
function attach3D(cv,st){
  let drag=null;
  cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId)});
  cv.addEventListener('pointermove',e=>{if(!drag)return;st.cam.yaw+=(e.clientX-drag.x)*.011;st.cam.pitch=Math.max(-1.5,Math.min(1.5,st.cam.pitch+(e.clientY-drag.y)*.011));drag={x:e.clientX,y:e.clientY};render3D(cv,st)});
  const end=()=>{drag=null};cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  ACTIVE3D={cv,st};requestAnimationFrame(()=>render3D(cv,st));
}

const cub=(p0,p1,p2,p3,t)=>{const u=1-t;return [0,1].map(k=>u*u*u*p0[k]+3*u*u*t*p1[k]+3*u*t*t*p2[k]+t*t*t*p3[k])};
const cubD=(p0,p1,p2,p3,t)=>{const u=1-t;return [0,1].map(k=>3*u*u*(p1[k]-p0[k])+6*u*t*(p2[k]-p1[k])+3*t*t*(p3[k]-p2[k]))};

    out.push({x:p[0]+nx*16,y:p[1]+ny*16,ang:Math.atan2(dv[1],dv[0])*180/Math.PI})}
  return out})();

  <div class="qcard ${q.kind==='text'?'textonly':''}">
   ${q.kind!=='text'?`<div class="figwrap">${fig}</div>`:''}
   <div class="qside"><div class="cat">${CATS[q.cat]}${S.exam?` · ${S.exam.i}/${S.exam.queue.length}`:''}</div><h2>${q.prompt}</h2>${q.sub?`<p class="sub">${q.sub}</p>`:''}
    ${q.kind!=='dir'?`<div class="opts">${q.options.map((o,i)=>`<button class="opt" data-id="${o.id}"><span class="k">${i+1}</span>${o.label}</button>`).join('')}</div>`:''}
    <div id="fb"></div>
    <div class="kbd">${q.kind==='dir'?'Teclado: flechas para responder':'Teclado: 1–4 para responder'} · Enter para seguir</div></div>
  </div>`;
  $('#back').onclick=renderHome;
  $$('.opt,.dir').forEach(b=>b.onclick=()=>answer(b.dataset.id));
  if(q.kind==='3d'){const cv=$('#cv');attach3D(cv,q.st);
    $('#axbtn').onclick=e=>{q.st.axes=!q.st.axes;e.target.classList.toggle('on',q.st.axes);render3D(cv,q.st)};
    $('#camr').onclick=()=>{q.st.cam={...q.st.cam0};render3D(cv,q.st)}}
  else ACTIVE3D=null;
}
function answer(id){
  if(S.answered)return;S.answered=true;const q=S.q,ok=id===q.answer;
  S.total++;if(ok){S.score++;S.streak++;S.best=Math.max(S.best,S.streak)}else S.streak=0;
  record(q.cat,ok);if(S.exam)S.exam.res.push({cat:q.cat,ok});
  $$('.opt,.dir').forEach(b=>{b.disabled=true;if(b.dataset.id===q.answer)b.classList.add('correct');else if(b.dataset.id===id)b.classList.add('wrong')});
  if(q.kind==='svg'||q.kind==='dir')revealFig(q.fo);
  if(q.kind==='3d'){q.st.axes=true;const b=$('#axbtn');if(b)b.classList.add('on');render3D($('#cv'),q.st)}
  const corr=q.options.find(o=>o.id===q.answer);
  const last=S.exam&&S.exam.i>=S.exam.queue.length;
  $('#fb').innerHTML=`<div class="fb ${ok?'ok':'ko'}"><strong>${ok?pick(OKS):pick(KOS)}</strong>${ok?'':` La respuesta era <b>${q.kind==='dir'?corr.label:corr.label}</b>.`}<p>${q.explain}</p>${q.tip?`<p class="tip"><b>Truco:</b> ${q.tip}</p>`:''}<button class="primary" id="next">${last?'Ver resultados':'Siguiente →'}</button></div>`;
  $('.chips').outerHTML=chipsHTML();
  $('#next').onclick=nextQ;$('#next').focus({preventScroll:true});
}
function renderResults(){
  ACTIVE3D=null;const r=S.exam.res,n=r.length,ok=r.filter(x=>x.ok).length,nota=(10*ok/n).toFixed(1).replace('.',',');
  const by={};r.forEach(x=>{(by[x.cat]=by[x.cat]||{ok:0,n:0}).n++;if(x.ok)by[x.cat].ok++});
  const worst=Object.entries(by).sort((a,b)=>a[1].ok/a[1].n-b[1].ok/b[1].n)[0];
  const msg=ok===n?'Pleno. El examen no tiene nada que hacer.':ok>=n*.75?'Muy bien: ya tienes el ojo entrenado.':ok>=n*.5?'Vas bien; repasa la categoría que más fallas.':'Toca practicar un poco más: empieza por la chuleta y el laboratorio 3D.';
  $('#app').innerHTML=`<div class="topbar"><button class="ghost" id="back">← Menú</button><div class="mode-title">Resultados</div></div>
  <div class="results"><div class="big">${nota}</div><p style="color:var(--muted);margin:6px 0 0">${ok} de ${n} aciertos · mejor racha ${S.best}</p><p style="margin:14px 0 0;font-weight:500">${msg}</p>
  <div class="rows">${Object.entries(by).map(([c,v])=>`<div class="row"><span>${CATS[c]}</span><div class="bar"><div style="width:${100*v.ok/v.n}%;background:${v.ok/v.n>=.75?'var(--green)':v.ok/v.n>=.5?'var(--yellow)':'var(--coral)'}"></div></div><span>${v.ok}/${v.n}</span></div>`).join('')}</div>
  <div class="btnrow"><button class="primary" id="again">Repetir examen</button>${worst&&worst[1].ok<worst[1].n?`<button class="ghost" id="weak">Practicar: ${CATS[worst[0]]}</button>`:''}</div></div>`;
  $('#back').onclick=renderHome;$('#again').onclick=()=>startMode('exam');const w=$('#weak');if(w)w.onclick=()=>startMode(worst[0]);
}
/* ================= laboratorio ================= */
function renderLab(){
  S.mode='lab';const L={org:'embrion',type:'transversal',v:0};
  $('#app').innerHTML=`<div class="topbar"><button class="ghost" id="back">← Menú</button><div class="mode-title">Laboratorio 3D</div></div>
  <div class="lab"><div class="figwrap"><canvas id="cv"></canvas><div class="figtools"><span>Arrastra para girar · los ejes están siempre visibles</span></div></div>
  <div class="ctrl"><div><label>Organismo</label><div class="seg" id="sorg"><button data-v="embrion">Embrión</button><button data-v="raton">Ratón</button><button data-v="humano">Humano</button></div></div>
  <div><label>Plano</label><div class="seg" id="stype"><button data-v="transversal">Transversal</button><button data-v="sagital">Sagital / parasagital</button><button data-v="frontal">Frontal</button><button data-v="none">Sin corte</button></div></div>
  <div><label id="slbl">Posición del plano</label><input type="range" id="rng" min="-1" max="1" step="0.01" value="0"></div>
  <div class="desc" id="desc"></div></div></div>`;
  $('#back').onclick=renderHome;
  const cv=$('#cv'),st={org:ORGS.embrion,plane:null,cam:{yaw:.75,pitch:.4},axes:true};
  const upd=()=>{const org=ORGS[L.org];st.org=org;let name='Sin corte',txt='Gira el modelo y fíjate en los tres ejes: anteroposterior (rojo), dorsoventral (azul) e izquierda–derecha (verde).';
    if(L.type==='none'){st.plane=null;$('#rng').disabled=true}
    else{$('#rng').disabled=false;let off,t=L.type;
      if(t==='transversal'){const [a,b]=org.trans;off=(a+b)/2+L.v*(b-a)/2}
      else if(t==='frontal'){const [a,b]=org.front;off=(a+b)/2+L.v*Math.max(.35,(b-a))}
      else{off=L.v*org.para*1.6;if(Math.abs(off)>.06)t='parasagital';else t='sagital'}
      st.plane=makePlane(org,t,off);name=PLANE_OPTS.find(o=>o.id===t).label;txt=PLANE_INFO[t]+extraPlane(org,t)}
    $('#desc').innerHTML=`<b>${name}</b>${txt}`;
    $$('#sorg button').forEach(b=>b.classList.toggle('on',b.dataset.v===L.org));$$('#stype button').forEach(b=>b.classList.toggle('on',b.dataset.v===L.type));
    render3D(cv,st)};
  $$('#sorg button').forEach(b=>b.onclick=()=>{L.org=b.dataset.v;upd()});
  $$('#stype button').forEach(b=>b.onclick=()=>{L.type=b.dataset.v;L.v=0;$('#rng').value=0;upd()});
  $('#rng').oninput=e=>{L.v=+e.target.value;upd()};
  attach3D(cv,st);requestAnimationFrame(upd);
}
document.addEventListener('keydown',e=>{
  if(!S.q||!S.mode||S.mode==='lab'||!$('.qside'))return;
  if(S.answered&&(e.key==='Enter'||e.key===' ')){e.preventDefault();const n=$('#next');if(n)n.click();return}
  if(S.answered)return;
  if(S.q.kind==='dir'){const m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(m){e.preventDefault();answer(m)}}
  else{const i=parseInt(e.key,10);if(i>=1&&i<=S.q.options.length)answer(S.q.options[i-1].id)}
});
renderHome();
</script>
