<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Embriones · Biología del Desarrollo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5efe6;--card:#fffaf3;--ink:#1e2733;--muted:#6b7380;--line:#e6dccd;--blue:#2f6db3;--coral:#d9654b;--green:#2e8b57;--yellow:#e8b931;--shadow:0 1px 2px rgba(60,40,20,.06),0 10px 30px rgba(60,40,20,.08)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:1100px;margin:0 auto;padding:22px 18px 60px}
h1,h2,h3,h4{font-family:Fraunces,Georgia,serif;font-weight:700;letter-spacing:-.01em;margin:0}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin:10px 0 26px}
.hero h1{font-size:clamp(30px,5vw,46px);line-height:1.02}.hero h1 em{font-style:normal;color:var(--coral)}
.hero p{color:var(--muted);margin:10px 0 0;max-width:580px;line-height:1.5}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;text-align:left;box-shadow:var(--shadow);transition:transform .15s,border-color .15s;display:flex;flex-direction:column;gap:8px;min-height:175px}
.mcard:hover{transform:translateY(-2px);border-color:#cdbca4}
.mcard .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px}
.mcard h3{font-size:19px}.mcard p{margin:0;color:var(--muted);font-size:14px;line-height:1.45;flex:1}
.mcard .acc{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.mcard.exam{background:#1e2733;color:#fdf6ea;border-color:#1e2733}.mcard.exam p{color:#c9c2b5}
.bar{height:6px;background:#eee3d3;border-radius:6px;flex:1;overflow:hidden}.bar div{height:100%;background:var(--green);border-radius:6px}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.ghost{background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px}.ghost:hover{background:#fff}
.mode-title{font-family:Fraunces,serif;font-weight:700;font-size:20px;flex:1}
.chips{display:flex;gap:8px}.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600}.chip.fire{color:var(--coral)}
.progress{height:6px;background:#e9dfd0;border-radius:6px;margin:-4px 0 14px;overflow:hidden}.progress div{height:100%;background:var(--ink);transition:width .3s}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);overflow:hidden}
.qcard.wide{grid-template-columns:1fr}
.figwrap{background:#fbf6ee;border-right:1px solid var(--line);padding:12px;display:flex;flex-direction:column;justify-content:center;min-height:400px}
svg.fig{width:100%;height:auto;display:block}svg.fig.click{cursor:crosshair}
.qside{padding:24px;display:flex;flex-direction:column;gap:12px}
.cat{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.qside h2,.qhead h2{font-size:23px;line-height:1.2}
.sub{margin:-4px 0 0;color:var(--muted);font-size:14px;line-height:1.45}
.glabel{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;margin-top:4px}
.opts{display:grid;gap:8px}.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:10px;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:10px 13px;font-size:15px;font-weight:500;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:#bfae96}
.opt.sel{border-color:var(--ink);background:#f3ece1}
.opt.correct{border-color:var(--green);background:#e6f4ec}.opt.wrong{border-color:var(--coral);background:#fbe7e2}.opt:disabled{cursor:default}
.fb{border-radius:14px;padding:14px 16px;font-size:14.5px;line-height:1.55;animation:pop .25s ease}
.fb.ok{background:#e6f4ec;border:1px solid #bfe0cc}.fb.ko{background:#fbeae5;border:1px solid #f1c7bb}.fb.mid{background:#fdf3d8;border:1px solid #f0dc9e}
.fb p{margin:6px 0 0}
.primary{background:var(--ink);color:#fff;border:0;border-radius:999px;padding:11px 20px;font-weight:600;font-size:15px}.primary:hover{background:#000}.primary:disabled{opacity:.35;cursor:default}
.fb .primary{margin-top:12px}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.lbl{opacity:0;transition:opacity .4s;pointer-events:none}.lbl.show{opacity:1}
.lt{font-family:Inter,sans-serif;font-size:12.5px;font-weight:600;fill:#1e2733;paint-order:stroke;stroke:#fffaf3;stroke-width:4px;stroke-linejoin:round}
.lt.hi{fill:#1d6b41}
.ln{font-family:Inter,sans-serif;font-size:11px;font-weight:700;fill:#fff}
.leg{margin:0;padding-left:22px;line-height:1.55;font-size:14px;columns:2;column-gap:18px}.leg li{break-inside:avoid}.leg li.hi{color:#1d6b41;font-weight:700}
@media (max-width:820px){.leg{columns:1}}
.qhead{padding:22px 24px 6px}
.wbody{padding:8px 24px 24px}
.ocards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ocard{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13.5px;line-height:1.35;text-align:center;min-height:70px;justify-content:center;transition:border-color .12s,transform .08s}
.ocard:hover:not(:disabled){border-color:#bfae96;transform:translateY(-1px)}
.ocard svg{width:100%;height:auto;background:#fbf6ee;border-radius:9px}
.ocard .num{position:absolute;top:-9px;left:-9px;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;font-weight:700;font-size:14px;display:none;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.ocard.done .num{display:grid}.ocard.done{border-color:var(--ink);background:#f6f0e6}
.ocard.correct{border-color:var(--green);background:#e6f4ec}.ocard.correct .num{background:var(--green)}
.ocard.wrong{border-color:var(--coral);background:#fbe7e2}.ocard.wrong .num{background:var(--coral)}
.ocard .should{font-size:12px;font-weight:700;color:var(--coral)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.tray{display:flex;flex-wrap:wrap;gap:8px;min-height:54px;padding:12px;border:1.5px dashed #d6c8b2;border-radius:14px;background:#fbf6ee;margin-bottom:14px}
.tray.empty::after{content:'Todo colocado. Pulsa «Comprobar».';color:var(--muted);font-size:13.5px;align-self:center}
.tag{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:500;transition:transform .08s,border-color .12s}
.tag:hover{border-color:#bfae96}.tag.sel{border-color:var(--blue);background:#e3edf9;transform:scale(1.04)}
.tag.correct{border-color:var(--green);background:#e6f4ec}.tag.wrong{border-color:var(--coral);background:#fbe7e2}
.tag small{display:block;font-size:11.5px;color:var(--coral);font-weight:600}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.bin{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px;min-height:120px;transition:border-color .12s,background .12s;text-align:left}
.bin.armed{border-color:var(--blue);background:#f3f8fe}
.bin h4{font-size:15px;margin-bottom:8px;font-family:Inter,sans-serif;font-weight:700}
.bin .bi{display:flex;flex-wrap:wrap;gap:6px}
.atlas-grp{margin:22px 0 10px;font-size:20px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.thumb{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;text-align:left;font-size:13px;line-height:1.3;display:flex;flex-direction:column;gap:6px}
.thumb:hover{border-color:#bfae96}.thumb svg{width:100%;height:auto;background:#fbf6ee;border-radius:9px}
.thumb b{font-weight:600}.thumb span{color:var(--muted);font-size:12px}
.results{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:30px;max-width:640px;margin:0 auto;text-align:center}
.results .big{font-family:Fraunces,serif;font-size:72px;font-weight:700;line-height:1}
.results .rows{text-align:left;margin:22px 0 6px;display:grid;gap:10px}
.results .row{display:grid;grid-template-columns:170px 1fr 52px;gap:12px;align-items:center;font-size:14px}
.results .btnrow{justify-content:center}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:#efe6d8;color:#5c5346}
@media (max-width:820px){.qcard{grid-template-columns:1fr}.figwrap{border-right:0;border-bottom:1px solid var(--line);min-height:0}.opts.two{grid-template-columns:1fr}.results .row{grid-template-columns:120px 1fr 44px}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<radialGradient id="shine" cx="35%" cy="28%" r="70%"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".12"/></radialGradient>
<linearGradient id="gOpaca" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#e2c49a"/><stop offset=".26" stop-color="#e2c49a"/><stop offset=".3" stop-color="#fbf0df"/><stop offset=".7" stop-color="#fbf0df"/><stop offset=".74" stop-color="#e2c49a"/><stop offset="1" stop-color="#e2c49a"/></linearGradient>
<marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#5a4a40"/></marker>
<marker id="arrB" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2f6db3"/></marker>
</defs></svg>
<div id="app"></div>
<script>
/* ===== Dibujos de embriones (viewBox 0 0 400 300). Convención de color: ectodermo azul, mesodermo rojo, endodermo amarillo ===== */
const K={ecto:'#7eaad8',ectoD:'#3f6fa8',ectoL:'#a9c7e8',neu:'#5b8fd0',neuD:'#2a5a9a',neuL:'#bcd3ef',mes:'#e48a74',mesD:'#a8432f',mesL:'#f3b6a0',noto:'#b8433a',endo:'#f0c74e',endoD:'#a98318',endoL:'#f6dc8c',lum:'#fffaf2',pig:'#6e5048',veg:'#f1d98f',zp:'#cdb8e6',zpD:'#8d6fb6',tro:'#9fcf9b',troD:'#4f8a4b',sin:'#c9a3dc',sinD:'#7d4f97',icm:'#e07a6e',icmD:'#9e3b31',endom:'#f7d9de',endomD:'#c98a96',blood:'#c0392b',yolk:'#f3d27a',yolkD:'#c79d2c',opaca:'#e6cba2',opacaD:'#b89566',pel:'#fbf1e0',cell:'#f3e3d3',cellD:'#a88a74',sea:'#e8f0f7',seaD:'#7fa3c2',disc:'#f6d3c3',discD:'#c48f78'};
const ell=(cx,cy,rx,ry,f,s,sw,x='')=>`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${f}"${s?` stroke="${s}" stroke-width="${sw}"`:''} ${x}/>`;
const cir=(cx,cy,r,f,s,sw,x='')=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${f}"${s?` stroke="${s}" stroke-width="${sw}"`:''} ${x}/>`;
const pth=(d,f,s,sw,x='')=>`<path d="${d}" fill="${f||'none'}"${s?` stroke="${s}" stroke-width="${sw}"`:''} ${x}/>`;
const rct=(x,y,w,h,rx,f,s,sw,e='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${f}"${s?` stroke="${s}" stroke-width="${sw}"`:''} ${e}/>`;
function tex(cx,cy,r,s,col='rgba(60,40,20,.13)'){let o='',row=0;const h=s*.866;for(let y=cy-r;y<=cy+r;y+=h,row++)for(let x=cx-r+(row%2?s/2:0);x<=cx+r;x+=s){if((x-cx)**2+(y-cy)**2<(r-s*.45)**2)o+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(s*.47).toFixed(1)}" fill="none" stroke="${col}" stroke-width="1"/>`}return o}
const shine=(cx,cy,r)=>cir(cx,cy,r,'url(#shine)');
const zpRing=(r=112)=>cir(200,150,r,'none',K.zp,16)+cir(200,150,r+8,'none',K.zpD,1,'opacity=".55"')+cir(200,150,r-8,'none',K.zpD,1,'opacity=".55"');
const blasto=(cx,cy,rx,ry)=>ell(cx,cy,rx,ry,K.cell,K.cellD,1.6)+ell(cx,cy,Math.min(rx,ry)*.28,Math.min(rx,ry)*.24,'#fbf6ee',K.cellD,1,'opacity=".8"');

/* ---------- ANFIBIO ---------- */
function d_x_huevo(u){return `<defs><clipPath id="c${u}"><circle cx="200" cy="150" r="110"/></clipPath></defs>
${cir(200,150,110,K.veg,'#b79a55',2)}
<path d="M88 140 Q200 172 312 140 L312 30 L88 30Z" fill="${K.pig}" clip-path="url(#c${u})"/>
${pth('M262 142 Q292 134 309 120 Q315 150 305 180 Q284 166 262 154Z','#c9bdbd')}
${shine(200,150,110)}
${cir(118,88,5,'#222')}${pth('M114 84 q-20 -18 -38 -12 q-14 4 -26 -8','none','#333',1.5)}
${pth('M252 26 Q200 8 150 26','none','#5a4a40',2.5,'marker-end="url(#arr)"')}`}
function d_x_8cel(){return `<defs><clipPath id="c8"><circle cx="200" cy="150" r="105"/></clipPath></defs>
${cir(200,150,105,K.veg,'#b79a55',2)}
<path d="M95 120 Q200 150 305 120 L305 40 L95 40Z" fill="${K.pig}" clip-path="url(#c8)"/>
${shine(200,150,105)}
${pth('M200 45 L200 255','none','#3a2a24',2.5)}${pth('M200 45 C140 95 140 205 200 255','none','#3a2a24',2.2)}${pth('M200 45 C260 95 260 205 200 255','none','#3a2a24',2.2)}
${pth('M96 120 Q200 152 304 120','none','#3a2a24',2.5)}`}
function amphBall(u,cav){return `<defs><clipPath id="c${u}"><circle cx="200" cy="150" r="110"/></clipPath></defs>
<g clip-path="url(#c${u})"><rect x="80" y="30" width="240" height="88" fill="${K.ecto}"/><rect x="80" y="118" width="240" height="50" fill="${K.mes}"/><rect x="80" y="168" width="240" height="150" fill="${K.endo}"/>${tex(200,150,110,15)}</g>
${cav}
${pth('M110 87 A110 110 0 0 1 290 87','none',K.pig,6)}${cir(200,150,110,'none','#8a7a66',2)}`}
function d_x_blastula(u){return amphBall(u,ell(200,108,72,46,K.lum,'#d8c9b3',1.5))}
function d_x_gast_temprana(u){return amphBall(u,ell(188,108,78,48,K.lum,'#d8c9b3',1.5))+
pth('M310 166 L280 180 L306 194Z',K.endoD)+pth('M311 164 Q284 180 306 196','none','#4a3a1e',2.5)}
function d_x_gast_tardia(){return `${cir(200,150,110,K.ecto,'#8a7a66',2)}${cir(200,150,96,K.mes)}${cir(200,150,86,K.endo)}${tex(200,150,86,15)}
${pth('M255 245 C250 200 230 120 150 95 C120 88 105 110 125 125 C160 135 200 170 222 246Z',K.lum,K.endoD,2)}
${ell(150,195,34,20,K.lum,'#d8c9b3',1.5)}
${cir(240,255,20,K.endo,K.endoD,2)}
${pth('M212 250 Q240 228 268 250','none',K.mesD,4)}
${pth('M110 87 A110 110 0 0 1 290 87','none',K.pig,6)}`}
function d_x_neurula(){return `${ell(200,155,150,115,'#f8e6dc',K.ecto,8)}
${ell(200,212,108,50,K.endo,K.endoD,1.5)}${tex(200,212,50,14)}
${ell(200,180,58,14,K.lum,K.endoD,1.5)}
${pth('M95 140 Q78 200 122 250','none',K.mes,7,'stroke-linecap="round"')}${pth('M305 140 Q322 200 278 250','none',K.mes,7,'stroke-linecap="round"')}
${rct(112,96,52,48,16,K.mes,K.mesD,2)}${rct(236,96,52,48,16,K.mes,K.mesD,2)}
${cir(200,122,15,K.noto)}
${pth('M142 60 Q150 42 172 54 Q190 90 200 92 Q210 90 228 54 Q250 42 258 60','none',K.neu,16,'stroke-linecap="round"')}
${cir(148,47,7,'#9b7fd0','#5e3f99',1.5)}${cir(252,47,7,'#9b7fd0','#5e3f99',1.5)}`}

/* ---------- ERIZO ---------- */
function seaWall(icx,icy,irx,iry){let s=cir(200,150,108,K.sea,K.seaD,2)+ell(icx,icy,irx,iry,K.lum,K.seaD,1.5);
  for(let k=0;k<44;k++){const a=2*Math.PI*k/44,c=Math.cos(a),n=Math.sin(a);
    s+=`<line x1="${(200+108*c).toFixed(1)}" y1="${(150+108*n).toFixed(1)}" x2="${(icx+irx*c).toFixed(1)}" y2="${(icy+iry*n).toFixed(1)}" stroke="${K.seaD}" stroke-width="1" opacity=".7"/>`;
    const b=a+Math.PI/44;s+=`<line x1="${(200+109*Math.cos(b)).toFixed(1)}" y1="${(150+109*Math.sin(b)).toFixed(1)}" x2="${(200+119*Math.cos(b+.03)).toFixed(1)}" y2="${(150+119*Math.sin(b+.03)).toFixed(1)}" stroke="${K.seaD}" stroke-width="1"/>`}
  return s}
function d_e_blastula(){return seaWall(200,145,92,88)}
function d_e_pmc(){let s=seaWall(200,140,90,78);
  [[176,205],[190,211],[204,207],[218,211],[230,203],[166,197],[199,198]].forEach(([x,y],i)=>{s+=`<line x1="${x}" y1="${y}" x2="${x+(i%2?14:-12)}" y2="${y-10-(i%3)*4}" stroke="${K.mesD}" stroke-width="1"/>`+cir(x,y,6,K.mes,K.mesD,1.2)});return s}
function d_e_gastrula(){let s=seaWall(200,145,92,86)+rct(180,92,40,176,20,K.sea,K.seaD,1.5)+rct(191,102,18,170,9,K.lum)+rct(190,246,20,26,0,K.lum);
  [[150,52],[250,52],[200,44],[170,47],[232,48]].forEach(([x,y],i)=>{s+=`<line x1="${[186,214,200,192,208][i]}" y1="90" x2="${x}" y2="${y}" stroke="${K.mesD}" stroke-width=".9"/>`});
  s+=cir(186,92,5.5,K.mesL,K.mesD,1.2)+cir(214,92,5.5,K.mesL,K.mesD,1.2)+cir(200,85,5.5,K.mesL,K.mesD,1.2);
  [[150,218],[160,226],[140,209],[250,218],[240,226],[260,209]].forEach(([x,y])=>s+=cir(x,y,5.5,K.mes,K.mesD,1.2));
  s+=pth('M150 218 l-10 -12 M150 218 l12 -6 M150 218 l2 14 M250 218 l10 -12 M250 218 l-12 -6 M250 218 l-2 14','none','#555',1.5);return s}

/* ---------- POLLO ---------- */
function d_p_blastodisco(){return `${cir(200,590,400,K.yolk,K.yolkD,2)}${ell(200,193,85,9,K.lum,'#d8c9b3',1)}
${pth('M50 222 Q200 120 350 222 Q200 150 50 222Z','url(#gOpaca)',K.opacaD,1.5)}
${pth('M120 190 Q200 152 280 190','none','rgba(60,40,20,.25)',1,'stroke-dasharray="3 3"')}`}
function d_p_bilam_corte(){let s=`${rct(0,212,400,90,0,K.yolk)}${pth('M0 212 Q200 196 400 212','none',K.yolkD,2)}
${pth('M40 140 Q200 120 360 140 L360 154 Q200 134 40 154Z',K.ectoL,K.ectoD,1.5)}
${pth('M70 185 Q190 178 300 186 L300 194 Q190 186 70 193Z',K.endoL,K.endoD,1.2)}
${ell(318,166,22,24,'#f08a4b','#b5551d',1.5)}${ell(350,149,14,9,'#f6c26b','#b5801d',1.2)}`;
  for(let x=50;x<356;x+=13)s+=`<line x1="${x}" y1="${(140-20*(1-((x-200)/160)**2)).toFixed(1)}" x2="${x}" y2="${(154-20*(1-((x-200)/160)**2)).toFixed(1)}" stroke="${K.ectoD}" stroke-width=".8" opacity=".6"/>`;
  return s}
function d_p_bilaminar(){return `${cir(200,150,130,K.opaca,K.opacaD,2)}${cir(200,145,85,K.pel,'#d8bf98',1.5)}

/* ===== motor ===== */
const $=(s,el=document)=>el.querySelector(s),$$=(s,el=document)=>[...el.querySelectorAll(s)];
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let UID=0;const uid=()=>'u'+(++UID);
const CATS={quien:'¿Quién y cuándo?',senala:'Señala la estructura',ordena:'Ordena la secuencia',destino:'Destino y origen'};
let STATS={};try{STATS=JSON.parse(localStorage.getItem('emb_stats_v1')||'{}')}catch(e){}
function record(c,ok){const s=STATS[c]||(STATS[c]={ok:0,n:0});s.n++;if(ok)s.ok++;try{localStorage.setItem('emb_stats_v1',JSON.stringify(STATS))}catch(e){}}
const S={mode:null,q:null,answered:false,score:0,total:0,streak:0,best:0,exam:null};
const OKS=['¡Correcto!','¡Eso es!','¡Bien visto!','¡Exacto!'],KOS=['Casi…','No exactamente.','Uy, esta no.'];

function labelsSVG(d,hi){return d.hs.map(([k,t,x,y],i)=>`<g><circle cx="${x}" cy="${y}" r="9.5" fill="${k===hi?'#2e8b57':'#1e2733'}" stroke="#fffaf3" stroke-width="2"/><text x="${x}" y="${y+4}" text-anchor="middle" class="ln">${i+1}</text></g>`).join('')}
function legendHTML(d,hi){return `<ol class="leg">${d.hs.map(([k,t])=>`<li class="${k===hi?'hi':''}">${t}</li>`).join('')}</ol>`}
function figSVG(id,o={}){const d=D[id];return `<svg class="fig${o.click?' click':''}" id="fig" viewBox="-60 -6 520 312">${d.draw(uid())}<g id="lbl" class="lbl${o.show?' show':''}">${labelsSVG(d,o.hi)}</g><g id="mk"></g></svg>`}
function thumbSVG(id){return `<svg viewBox="0 0 400 300">${D[id].draw(uid())}</svg>`}
function chips(){return `<div class="chips"><span class="chip">✓ ${S.score} / ${S.total}</span><span class="chip fire">Racha ${S.streak}</span></div>`}
function accHTML(id){const s=STATS[id];if(!s||!s.n)return '<span>Aún sin jugar</span>';const p=Math.round(100*s.ok/s.n);return `<div class="bar"><div style="width:${p}%"></div></div><span>${p}% · ${s.n}</span>`}
function topbar(title){return `<div class="topbar"><button class="ghost" id="back">← Menú</button><div class="mode-title">${title}</div>${S.mode==='atlas'?'':chips()}</div>${S.exam?`<div class="progress"><div style="width:${100*(S.exam.i-1)/S.exam.queue.length}%"></div></div>`:''}`}

/* ---------- generadores ---------- */
const WHO=Object.keys(D).filter(k=>D[k].who!==false);
let lastFig=null;
function pickFig(pool){let k;do{k=pick(pool)}while(k===lastFig&&pool.length>1);lastFig=k;return k}
function genQuien(){
  const id=pickFig(WHO),d=D[id],orgOk=d.org==='mamifero'?['raton','humano']:[d.org];
  const same=Object.keys(D).filter(k=>k!==id&&D[k].who!==false&&(D[k].org===d.org||(['mamifero','humano','raton'].includes(D[k].org)&&['mamifero','humano','raton'].includes(d.org)))).map(k=>D[k].stage).filter(s=>s!==d.stage);
  const extra={erizo:['Segmentación: 16 células','Larva pluteus','Néurula'],xenopus:[],pollo:['Néurula'],mamifero:[],humano:[],raton:[]};
  const pool=shuffle([...new Set([...same,...(extra[d.org]||[])])]).slice(0,3);
  const st=shuffle([d.stage,...pool]).map((l,i)=>({id:'s'+i,label:l}));
  return {cat:'quien',kind:'quien',fig:id,orgOk,stages:st,stageOk:st.find(s=>s.label===d.stage).id,explain:d.clue+(d.org==='mamifero'?MAM_NOTE:'')};
}
function genSenala(){
  const pool=Object.keys(D).filter(k=>D[k].hs.length>=3),id=pickFig(pool),d=D[id],t=pick(d.hs);
  return {cat:'senala',kind:'senala',fig:id,target:t,explain:`${ORG_NAME[d.org]} · ${d.stage}${d.view?' · '+d.view:''}.`};
}
let lastSeq=-1,lastSet=-1;
function genOrdena(){let i;do{i=Math.floor(Math.random()*SEQ.length)}while(i===lastSeq);lastSeq=i;const s=SEQ[i];
  let order;do{order=shuffle(s.items.map((_,k)=>k))}while(order.every((v,k)=>v===k));
  return {cat:'ordena',kind:'ordena',seq:s,order};}
function genDestino(){let i;do{i=Math.floor(Math.random()*SETS.length)}while(i===lastSet);lastSet=i;return {cat:'destino',kind:'destino',set:SETS[i],order:shuffle(SETS[i].items.map((_,k)=>k))}}
const GEN={quien:genQuien,senala:genSenala,ordena:genOrdena,destino:genDestino};

/* ---------- pantallas ---------- */
const MODES=[
 {id:'quien',ic:'🔍',bg:'#dfe9f6',t:'¿Quién y cuándo?',d:'Ves un embrión y dices de qué organismo es (erizo, Xenopus, pollo, ratón o humano) y en qué fase o día está.'},
 {id:'senala',ic:'👆',bg:'#fbe3dc',t:'Señala la estructura',d:'Te nombro una estructura (labio dorsal, hoz de Koller, sincitiotrofoblasto, nodo…) y la tocas en el dibujo.'},
 {id:'ordena',ic:'🔢',bg:'#fdf0cf',t:'Ordena la secuencia',d:'Toca las tarjetas en orden: fases del embrión, días de la implantación, cascadas de señales…'},
 {id:'destino',ic:'🧩',bg:'#dcefe3',t:'Destino y origen',d:'Coloca cada estructura, gen o tejido en su grupo: de qué capa sale, por dónde entra, qué tipo es.'}
];
function renderHome(){
  S.mode=null;S.exam=null;S.q=null;
  $('#app').innerHTML=`<div class="hero"><div><h1>Embriones, <em>fase a fase</em></h1>
  <p>Temas 15–22: erizo, anfibio, pollo, ratón y humano, desde el huevo hasta la neurulación. Aprende a reconocer cada embrión y lo que lleva dentro.</p></div>
  <div class="legend"><span><i style="background:${K.ecto}"></i>Ectodermo</span><span><i style="background:${K.mes}"></i>Mesodermo</span><span><i style="background:${K.endo}"></i>Endodermo</span><span><i style="background:${K.tro}"></i>Trofoblasto</span></div></div>
  <div class="grid">
   <button class="mcard exam" data-m="exam"><div class="ic" style="background:#2c3846">🎯</div><h3>Modo examen</h3><p>10 preguntas mezcladas de los cuatro juegos, con nota final y lo que más fallas.</p><div class="acc" style="color:#c9c2b5">Ideal para enero</div></button>
   ${MODES.map(m=>`<button class="mcard" data-m="${m.id}"><div class="ic" style="background:${m.bg}">${m.ic}</div><h3>${m.t}</h3><p>${m.d}</p><div class="acc">${accHTML(m.id)}</div></button>`).join('')}
   <button class="mcard" data-m="atlas"><div class="ic" style="background:#ece4f6">📚</div><h3>Atlas</h3><p>Todos los dibujos con sus estructuras rotuladas y la pista para reconocerlos. Para estudiar antes de jugar.</p><div class="acc">${Object.keys(D).length} embriones</div></button>
  </div>`;
  $$('.mcard').forEach(b=>b.onclick=()=>{const m=b.dataset.m;m==='atlas'?renderAtlas():start(m)});
}
function start(m){S.mode=m;S.score=0;S.total=0;S.streak=0;S.best=0;
  S.exam=m==='exam'?{queue:shuffle(['quien','quien','quien','senala','senala','senala','ordena','ordena','destino','destino']),i:0,res:[]}:null;next()}
function next(){if(S.exam){if(S.exam.i>=S.exam.queue.length)return renderResults();S.q=GEN[S.exam.queue[S.exam.i++]]()}else S.q=GEN[S.mode]();S.answered=false;render()}
function render(){const q=S.q,title=S.exam?'Modo examen':CATS[S.mode];let h=topbar(title);
  const catline=`<div class="cat">${CATS[q.cat]}${S.exam?` · ${S.exam.i}/${S.exam.queue.length}`:''}</div>`;
  if(q.kind==='quien'){h+=`<div class="qcard"><div class="figwrap">${figSVG(q.fig)}</div><div class="qside">${catline}<h2>¿Qué embrión es y en qué fase está?</h2><p class="sub">Elige el organismo y la fase. ${D[q.fig].view?`(${D[q.fig].view})`:''}</p>
    <div class="glabel">Organismo</div><div class="opts two" id="go">${ORG_OPTS.map(o=>`<button class="opt" data-g="o" data-id="${o.id}">${o.label}</button>`).join('')}</div>
    <div class="glabel">Fase</div><div class="opts" id="gs">${q.stages.map(o=>`<button class="opt" data-g="s" data-id="${o.id}">${o.label}</button>`).join('')}</div>
    <div><button class="primary" id="chk" disabled>Comprobar</button></div><div id="fb"></div><div id="leg"></div></div></div>`}
  else if(q.kind==='senala'){h+=`<div class="qcard"><div class="figwrap">${figSVG(q.fig,{click:true})}</div><div class="qside">${catline}<h2>Toca: <span style="color:var(--coral)">${q.target[1]}</span></h2><p class="sub">Toca en el dibujo el sitio donde está.</p><div id="fb"></div><div id="leg"></div></div></div>`}
  else if(q.kind==='ordena'){const s=q.seq;h+=`<div class="qcard wide"><div class="qhead">${catline}<h2>${s.t}</h2><p class="sub" style="margin-top:6px">Toca las tarjetas en el orden correcto (de la primera a la última).</p></div><div class="wbody">
    <div class="ocards">${q.order.map(k=>{const it=s.items[k];return `<button class="ocard" data-k="${k}"><span class="num"></span>${it.fig?thumbSVG(it.fig):''}<span>${it.t}</span><span class="should"></span></button>`}).join('')}</div>
    <div class="btnrow"><button class="ghost" id="undo">Deshacer</button><button class="ghost" id="reset">Empezar de nuevo</button><button class="primary" id="chk" disabled>Comprobar</button></div><div id="fb" style="margin-top:12px"></div></div></div>`}
  else if(q.kind==='destino'){const s=q.set;h+=`<div class="qcard wide"><div class="qhead">${catline}<h2>${s.t}</h2><p class="sub" style="margin-top:6px">Toca un elemento y luego el grupo donde va. Para moverlo, tócalo otra vez.</p></div><div class="wbody">
    <div class="tray" id="tray">${q.order.map(k=>`<button class="tag" data-k="${k}">${s.items[k][0]}</button>`).join('')}</div>
    <div class="bins">${s.bins.map((b,i)=>`<div class="bin" data-b="${i}"><h4>${b}</h4><div class="bi"></div></div>`).join('')}</div>
    <div class="btnrow"><button class="primary" id="chk" disabled>Comprobar</button></div><div id="fb" style="margin-top:12px"></div></div></div>`}
  $('#app').innerHTML=h;$('#back').onclick=renderHome;
  ({quien:wireQuien,senala:wireSenala,ordena:wireOrdena,destino:wireDestino})[q.kind]();
}
function finish(ok,html,mid){const q=S.q;S.answered=true;S.total++;if(ok){S.score++;S.streak++;S.best=Math.max(S.best,S.streak)}else S.streak=0;record(q.cat,ok);if(S.exam)S.exam.res.push({cat:q.cat,ok});
  const last=S.exam&&S.exam.i>=S.exam.queue.length;
  $('#fb').innerHTML=`<div class="fb ${ok?'ok':mid?'mid':'ko'}">${html}<div><button class="primary" id="nx">${last?'Ver resultados':'Siguiente →'}</button></div></div>`;
  $('.chips').outerHTML=chips();$('#nx').onclick=next;$('#nx').focus({preventScroll:true});}
function showLabels(hi){const l=$('#lbl');if(l){l.innerHTML=labelsSVG(D[S.q.fig],hi);l.classList.add('show')}const g=$('#leg');if(g)g.innerHTML=`<div class="glabel" style="margin-bottom:6px">Estructuras del dibujo</div>`+legendHTML(D[S.q.fig],hi)}

function wireQuien(){const q=S.q;let o=null,s=null;
  $$('.opt').forEach(b=>b.onclick=()=>{if(S.answered)return;$$(`.opt[data-g="${b.dataset.g}"]`).forEach(x=>x.classList.remove('sel'));b.classList.add('sel');if(b.dataset.g==='o')o=b.dataset.id;else s=b.dataset.id;$('#chk').disabled=!(o&&s)});
  $('#chk').onclick=()=>{const okO=q.orgOk.includes(o),okS=s===q.stageOk;
    $$('.opt').forEach(b=>{b.disabled=true;const g=b.dataset.g,id=b.dataset.id;if((g==='o'&&q.orgOk.includes(id))||(g==='s'&&id===q.stageOk))b.classList.add('correct');else if(b.classList.contains('sel'))b.classList.add('wrong')});
    $('#chk').style.display='none';showLabels();const d=D[q.fig];
    const head=okO&&okS?pick(OKS):(okO||okS)?'Medio bien.':pick(KOS);
    finish(okO&&okS,`<strong>${head}</strong> Es <b>${ORG_NAME[d.org]}</b>, <b>${d.stage.toLowerCase()}</b>.<p>${q.explain}</p>`,okO!==okS)}}
function wireSenala(){const q=S.q,svg=$('#fig'),d=D[q.fig];
  svg.addEventListener('click',e=>{if(S.answered)return;const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const p=pt.matrixTransform(svg.getScreenCTM().inverse());
    let best=null,bd=1e9;for(const h of d.hs){const dd=Math.hypot(h[2]-p.x,h[3]-p.y);if(dd<bd){bd=dd;best=h}}
    const ok=best[0]===q.target[0];const [,,tx,ty]=q.target;
    $('#mk').innerHTML=`${ok?'':`<path d="M${p.x-7} ${p.y-7} L${p.x+7} ${p.y+7} M${p.x+7} ${p.y-7} L${p.x-7} ${p.y+7}" stroke="#d9654b" stroke-width="3.5" stroke-linecap="round"/>`}<circle cx="${tx}" cy="${ty}" r="15" fill="none" stroke="#2e8b57" stroke-width="3.5"/>`;
    showLabels(q.target[0]);svg.classList.remove('click');
    finish(ok,`<strong>${ok?pick(OKS):pick(KOS)}</strong> ${ok?'':`Has tocado <b>${best[1].toLowerCase()}</b>; lo que buscábamos está marcado en verde.`}<p>${q.explain} ${d.clue}</p>`)})}
function wireOrdena(){const q=S.q,seqArr=[];const upd=()=>{$$('.ocard').forEach(c=>{const i=seqArr.indexOf(c);c.classList.toggle('done',i>=0);c.querySelector('.num').textContent=i>=0?i+1:''});$('#chk').disabled=seqArr.length!==q.seq.items.length};
  $$('.ocard').forEach(c=>c.onclick=()=>{if(S.answered)return;const i=seqArr.indexOf(c);if(i>=0)seqArr.splice(i,1);else seqArr.push(c);upd()});
  $('#undo').onclick=()=>{if(S.answered)return;seqArr.pop();upd()};$('#reset').onclick=()=>{if(S.answered)return;seqArr.length=0;upd()};
  $('#chk').onclick=()=>{let n=0;seqArr.forEach((c,i)=>{c.disabled=true;const k=+c.dataset.k;if(k===i){n++;c.classList.add('correct')}else{c.classList.add('wrong');c.querySelector('.should').textContent='→ va en el '+(k+1)+'º'}});
    $$('#undo,#reset,#chk').forEach(b=>b.style.display='none');const N=q.seq.items.length,ok=n===N;
    finish(ok,`<strong>${ok?pick(OKS):n>=N-2?'Casi lo tienes.':pick(KOS)}</strong> ${n} de ${N} en su sitio.<p><b>Orden correcto:</b> ${q.seq.items.map((it,i)=>`${i+1}. ${it.t}`).join(' · ')}</p><p>${q.seq.ex}</p>`,!ok&&n>=N/2)}}
function wireDestino(){const q=S.q;let sel=null;const tray=$('#tray');
  const upd=()=>{$$('.tag').forEach(t=>t.classList.toggle('sel',t===sel));$$('.bin').forEach(b=>b.classList.toggle('armed',!!sel));tray.classList.toggle('empty',!tray.querySelector('.tag'));$('#chk').disabled=!!tray.querySelector('.tag')};
  $$('.tag').forEach(t=>t.onclick=e=>{e.stopPropagation();if(S.answered)return;const bin=t.closest('.bin');if(sel&&sel!==t&&bin){bin.querySelector('.bi').appendChild(sel);sel=null;upd();return}if(sel&&sel!==t&&!bin){tray.appendChild(sel);sel=null;upd();return}sel=sel===t?null:t;upd()});
  $$('.bin').forEach(b=>b.onclick=()=>{if(S.answered||!sel)return;b.querySelector('.bi').appendChild(sel);sel=null;upd()});
  tray.onclick=()=>{if(S.answered||!sel)return;tray.appendChild(sel);sel=null;upd()};
  $('#chk').onclick=()=>{let n=0;const s=q.set;$$('.bin').forEach(b=>{const bi=+b.dataset.b;b.querySelectorAll('.tag').forEach(t=>{const c=s.items[+t.dataset.k][1];t.disabled=true;if(c===bi){n++;t.classList.add('correct')}else{t.classList.add('wrong');t.insertAdjacentHTML('beforeend',`<small>→ ${s.bins[c]}</small>`)}})});
    $$('.bin').forEach(b=>b.classList.remove('armed'));$('#chk').style.display='none';const N=s.items.length,ok=n===N;
    finish(ok,`<strong>${ok?pick(OKS):pick(KOS)}</strong> ${n} de ${N} bien colocados.<p>${s.ex}</p>`,!ok&&n>=N/2)}}

function renderResults(){const r=S.exam.res,n=r.length,ok=r.filter(x=>x.ok).length,nota=(10*ok/n).toFixed(1).replace('.',',');const by={};r.forEach(x=>{(by[x.cat]=by[x.cat]||{ok:0,n:0}).n++;if(x.ok)by[x.cat].ok++});
  const worst=Object.entries(by).sort((a,b)=>a[1].ok/a[1].n-b[1].ok/b[1].n)[0];
  const msg=ok===n?'Pleno. Enero no tiene nada que hacer.':ok>=n*.75?'Muy bien: ya distingues los embriones.':ok>=n*.5?'Vas bien; repasa la parte que más fallas.':'Toca practicar: pasa antes por el Atlas.';
  $('#app').innerHTML=`<div class="topbar"><button class="ghost" id="back">← Menú</button><div class="mode-title">Resultados</div></div><div class="results"><div class="big">${nota}</div><p style="color:var(--muted);margin:6px 0 0">${ok} de ${n} preguntas perfectas · mejor racha ${S.best}</p><p style="margin:14px 0 0;font-weight:500">${msg}</p>
  <div class="rows">${Object.entries(by).map(([c,v])=>`<div class="row"><span>${CATS[c]}</span><div class="bar"><div style="width:${100*v.ok/v.n}%;background:${v.ok/v.n>=.75?'var(--green)':v.ok/v.n>=.5?'var(--yellow)':'var(--coral)'}"></div></div><span>${v.ok}/${v.n}</span></div>`).join('')}</div>
  <div class="btnrow"><button class="primary" id="again">Repetir examen</button>${worst&&worst[1].ok<worst[1].n?`<button class="ghost" id="weak">Practicar: ${CATS[worst[0]]}</button>`:''}</div></div>`;
  $('#back').onclick=renderHome;$('#again').onclick=()=>start('exam');const w=$('#weak');if(w)w.onclick=()=>start(worst[0]);}

const GROUPS=[['Erizo de mar (T15)',k=>D[k].org==='erizo'],['Anfibio · Xenopus (T15)',k=>D[k].org==='xenopus'],['Ave · pollo (T16)',k=>D[k].org==='pollo'],['Ratón (T16, T22)',k=>D[k].org==='raton'],['Mamífero: preimplantación (T16, T20)',k=>D[k].org==='mamifero'],['Humano: implantación y gastrulación (T21–22)',k=>D[k].org==='humano']];
const ATLAS_ORDER=GROUPS.flatMap(([,f])=>Object.keys(D).filter(f));
function renderAtlas(){S.mode='atlas';S.exam=null;
  $('#app').innerHTML=topbar('Atlas')+GROUPS.map(([g,f])=>`<h3 class="atlas-grp">${g}</h3><div class="thumbs">${Object.keys(D).filter(f).map(k=>`<button class="thumb" data-k="${k}">${thumbSVG(k)}<b>${D[k].stage}</b><span>${D[k].view||'&nbsp;'}</span></button>`).join('')}</div>`).join('');
  $('#back').onclick=renderHome;$$('.thumb').forEach(t=>t.onclick=()=>renderAtlasItem(t.dataset.k))}
function renderAtlasItem(k){const d=D[k],i=ATLAS_ORDER.indexOf(k);
  $('#app').innerHTML=`<div class="topbar"><button class="ghost" id="back">← Atlas</button><div class="mode-title">${d.stage}</div><button class="ghost" id="prev">←</button><button class="ghost" id="nextA">→</button></div>
  <div class="qcard"><div class="figwrap">${figSVG(k,{show:true})}</div><div class="qside"><div class="cat">${ORG_NAME[d.org]} · Tema ${d.tema}</div><h2>${d.stage}</h2>${d.view?`<span class="pill" style="align-self:flex-start">${d.view}</span>`:''}<p style="line-height:1.55;margin:0">${d.clue}</p>
  <div class="glabel">Estructuras</div>${legendHTML(d)}</div></div>`;
  $('#back').onclick=renderAtlas;$('#prev').onclick=()=>renderAtlasItem(ATLAS_ORDER[(i-1+ATLAS_ORDER.length)%ATLAS_ORDER.length]);$('#nextA').onclick=()=>renderAtlasItem(ATLAS_ORDER[(i+1)%ATLAS_ORDER.length])}
document.addEventListener('keydown',e=>{if(S.answered&&e.key==='Enter'){const n=$('#nx');if(n){e.preventDefault();n.click()}}});
renderHome();
</script>
