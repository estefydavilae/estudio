<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Centro de estudio</title>
<meta name="theme-color" content="#1b1f2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Estudio">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ec; --card:#fffdf9; --ink:#1b1f2e; --muted:#646a7a; --line:#e4ddd2;
  --neuro:#4a4dc0; --desa:#d9654b; --endo:#b3336a; --gen:#6b2f8f;
  --shadow:0 1px 2px rgba(40,30,20,.05),0 8px 24px rgba(40,30,20,.07);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13151d; --card:#1c1f2b; --ink:#eceef5; --muted:#a0a5b8; --line:#2c3040;
  --neuro:#9c9ff6; --desa:#f08b72; --endo:#ee7eaa; --gen:#c79be6; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13151d; --card:#1c1f2b; --ink:#eceef5; --muted:#a0a5b8; --line:#2c3040;
  --neuro:#9c9ff6; --desa:#f08b72; --endo:#ee7eaa; --gen:#c79be6; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-top:env(safe-area-inset-top,0px)}
.wrap{max-width:980px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
h1,h2{font-family:Fraunces,Georgia,serif;letter-spacing:-.01em;margin:0}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
header h1{font-size:clamp(30px,6vw,42px);line-height:1.02}
header p{margin:6px 0 0;color:var(--muted);font-size:15px}
.cont{display:none;align-items:center;gap:12px;background:var(--ink);color:var(--bg);border-radius:16px;padding:14px 16px;text-decoration:none;margin-bottom:20px}
.cont.on{display:flex}
.cont small{display:block;opacity:.7;font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.cont b{font-size:16px}
.cont .go{margin-left:auto;font-size:22px}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none}
.filters button{flex:none;font:inherit;font-weight:600;font-size:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
section{margin-top:22px}
section h2{font-size:22px;display:flex;align-items:center;gap:10px;margin-bottom:12px}
section h2 i{width:12px;height:12px;border-radius:4px;background:var(--c)}
section h2 span{font-family:Inter,sans-serif;font-size:13px;font-weight:500;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
a.game{display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:16px;padding:16px;text-decoration:none;color:inherit;box-shadow:var(--shadow);min-height:132px;transition:transform .12s,border-color .12s}
a.game:hover{transform:translateY(-2px)}
a.game:active{transform:scale(.98)}
a.game:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.top{display:flex;align-items:center;gap:10px}
.emo{font-size:22px;line-height:1}
.game h3{margin:0;font-size:17px;line-height:1.2}
.game p{margin:0;color:var(--muted);font-size:14px;line-height:1.4;flex:1}
.tag{align-self:flex-start;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);padding:3px 8px;border-radius:999px}
footer{margin-top:36px;color:var(--muted);font-size:13px;line-height:1.5}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Centro de estudio</h1>
      <p>3º de Ciencias Biomédicas · todos tus juegos en un sitio</p>
    </div>
  </header>

  <a class="cont" id="cont" href="#"><div><small>Seguir donde lo dejaste</small><b id="contName"></b></div><span class="go">→</span></a>

  <nav class="filters" id="filters" aria-label="Filtrar por asignatura"></nav>
  <main id="list"></main>

  <footer>Tu progreso se guarda en este dispositivo, dentro de cada juego. Funciona también sin conexión después de abrirlo una vez.</footer>
</div>

<script>
const SUBJECTS = [
  { id:'neuro', name:'Neurobiología', c:'var(--neuro)', games:[
    { f:'neurolab-bloque-2.html', name:'Neurolab · Bloque 2', emo:'🔬', type:'Juego', d:'Laboratorio de trazas: manipula, predice y construye la figura.' },
    { f:'neuro-al-dia.html', name:'Neuro al día', emo:'🧠', type:'Flashcards', d:'Repaso espaciado de los temas 11–12 hasta el parcial 2.' },
    { f:'autapsis-voltage-clamp.html', name:'Autapsis en voltage-clamp', emo:'⚡', type:'Práctica', d:'Práctica 3 paso a paso: I = N·p·Q, minis, pulsos pareados.' }
  ]},
  { id:'desa', name:'Biología del Desarrollo', c:'var(--desa)', games:[
    { f:'embriones-fase-a-fase.html', name:'Embriones fase a fase', emo:'🥚', type:'Juego', d:'Reconoce estadios, ordena fases y etiqueta estructuras.' },
    { f:'planos-y-perspectivas.html', name:'Planos y perspectivas', emo:'🧭', type:'Juego', d:'Cortes, ejes y orientación en 3D.' },
    { f:'organogenesis.html', name:'Organogénesis', emo:'🫀', type:'Juego', d:'Temas 23–27: cortes, hojas germinales, secuencias y mutantes.' }
  ]},
  { id:'endo', name:'Endocrinología Molecular', c:'var(--endo)', games:[
    { f:'dominios-y-senalizacion.html', name:'Dominios y señalización', emo:'🧩', type:'Juego', d:'Cuatro minijuegos de un minuto: conecta, construye, corta, clasifica.' },
    { f:'flashcards-endocrino.html', name:'Flashcards Endocrino', emo:'🗂️', type:'Flashcards', d:'Tarjetas de los temas 1.1–2.6 y simulacro tipo test.' },
    { f:'mapa-de-senalizacion.html', name:'Mapa de Señalización', emo:'🗺️', type:'Chuleta', d:'Todas las vías en una vista, con conexiones y trampas.' }
  ]},
  { id:'gen', name:'Genética Médica', c:'var(--gen)', games:[
    { f:'genetica-ruta.html', name:'Empieza aquí: Ruta de Genética', emo:'🧭', type:'Guía', d:'El hilo del temario 3–6, plan semanal y un mapa de cada tema antes de estudiarlo.' },
    { f:'lligament-diari.html', name:'Lligament diari', emo:'🧬', type:'Reto diario', d:'10 problemas al día de mapatge, LOD y compañía.' },
    { f:'simulacro-genetica-medica.html', name:'Simulacro Genética Médica', emo:'📝', type:'Examen', d:'30 preguntas tipo test + tema con literales, cronometrado.' }
  ]}
];
const ls = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(filter){
  const list = document.getElementById('list');
  list.innerHTML = SUBJECTS.filter(s => filter==='all' || s.id===filter).map(s => `
    <section style="--c:${s.c}">
      <h2><i></i>${esc(s.name)} <span>${s.games.length}</span></h2>
      <div class="grid">${s.games.map(g => `
        <a class="game" href="${g.f}">
          <div class="top"><span class="emo" aria-hidden="true">${g.emo}</span><h3>${esc(g.name)}</h3></div>
          <p>${esc(g.d)}</p>
          <span class="tag">${esc(g.type)}</span>
        </a>`).join('')}</div>
    </section>`).join('');
}
function filters(){
  const nav = document.getElementById('filters');
  const cur = ls.get('cde-filter') || 'all';
  const opts = [{id:'all',name:'Todas'}, ...SUBJECTS];
  nav.innerHTML = opts.map(o => `<button type="button" data-f="${o.id}" aria-pressed="${o.id===cur}">${esc(o.name)}</button>`).join('');
  nav.onclick = e => {
    const b = e.target.closest('button'); if(!b) return;
    nav.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x===b));
    ls.set('cde-filter', b.dataset.f); render(b.dataset.f);
  };
  render(cur);
}
function lastGame(){
  const f = ls.get('cde-last'); if(!f) return;
  for(const s of SUBJECTS) for(const g of s.games) if(g.f===f){
    const a = document.getElementById('cont');
    a.href = g.f; a.style.background = s.c;
    document.getElementById('contName').textContent = g.emo+'  '+g.name;
    a.classList.add('on');
  }
}
filters(); lastGame();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
