<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neurolab · Bloque 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Osciloscopio de laboratorio: fondo tinta, trazas de fósforo verde, ámbar para lo que manipulas. */
:root{
  --bg:#0d121c; --panel:#151d2b; --panel2:#1b2536; --line:#2a3750; --ink:#e9eef6; --muted:#93a1b8;
  --phos:#5cf2a6; --phos-soft:rgba(92,242,166,.13); --amber:#ffb547; --amber-soft:rgba(255,181,71,.14);
  --coral:#ff6f6f; --coral-soft:rgba(255,111,111,.14); --blue:#6fb2ff; --blue-soft:rgba(111,178,255,.14); --violet:#c49bff;
  --f-d:"Space Grotesk",system-ui,sans-serif; --f-b:Inter,system-ui,sans-serif; --f-m:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-b);-webkit-font-smoothing:antialiased}
body{background-image:linear-gradient(rgba(92,242,166,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(92,242,166,.035) 1px,transparent 1px);background-size:28px 28px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#app{max-width:1040px;margin:0 auto;padding:18px 16px 70px}
h1,h2,h3{font-family:var(--f-d);margin:0;letter-spacing:-.01em}
.muted{color:var(--muted)}
.mono{font-family:var(--f-m)}
.hidden{display:none!important}

/* cabecera */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{font-family:var(--f-d);font-weight:700;font-size:20px;display:flex;align-items:center;gap:10px;flex:1}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--phos);box-shadow:0 0 12px var(--phos)}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.chip b{font-family:var(--f-m)}
.back{width:38px;height:38px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:18px;display:grid;place-items:center}

/* home */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:22px}
@media(max-width:760px){.hero{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px}
.mission h2{font-size:28px;line-height:1.05}
.mission p{color:var(--muted);line-height:1.5;margin:8px 0 14px}
.mission .steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.mission .steps span{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px}
.big-btn{background:var(--phos);color:#06210f;font-weight:700;border-radius:14px;padding:13px 20px;font-size:16px;box-shadow:0 0 0 0 var(--phos);transition:transform .1s}
.big-btn:hover{transform:translateY(-1px)}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.on{background:var(--amber);color:#2a1700;border-color:var(--amber)}
.btn.go{background:var(--phos);color:#06210f;border-color:var(--phos)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--panel2);border-radius:14px;padding:12px}
.stat .n{font-family:var(--f-m);font-size:26px;font-weight:700}
.stat .l{font-size:12.5px;color:var(--muted)}
.week{grid-column:1/-1;font-size:13.5px;line-height:1.5;color:var(--muted)}
.week b{color:var(--amber)}
.section{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;margin:6px 0 12px}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.sala{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:168px;position:relative;transition:transform .12s,border-color .12s}
.sala:hover{transform:translateY(-2px);border-color:var(--phos)}
.sala.focus{border-color:var(--amber)}
.sala.focus::after{content:"foco de la semana";position:absolute;top:12px;right:12px;font-size:11px;font-weight:700;color:var(--amber);background:var(--amber-soft);padding:3px 8px;border-radius:99px}
.sala .num{font-family:var(--f-m);font-size:12px;color:var(--muted)}
.sala h3{font-size:19px}
.sala p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.4;flex:1}
.stars{display:flex;gap:6px;font-size:12.5px}
.stars span{padding:3px 8px;border-radius:8px;background:var(--panel2);color:var(--muted)}
.stars span.ok{background:var(--phos-soft);color:var(--phos)}
.spark{display:inline-block;width:46px;height:14px;vertical-align:middle}

/* sala */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 16px}
.tab{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14.5px}
.tab.on{border-color:var(--phos);color:var(--phos);background:var(--phos-soft)}
.intro{color:var(--muted);line-height:1.55;margin:0 0 14px;max-width:760px}
.mbar{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:-6px 0 16px}
.mbar i{display:block;height:100%;background:var(--phos);transition:width .3s}

/* laboratorio */
.lab{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:14px}
@media(max-width:820px){.lab{grid-template-columns:1fr}}
.scope{background:#0a0f17;border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px}
.scope .hd{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);font-family:var(--f-m)}
.ctrl{display:flex;flex-direction:column;gap:14px}
.grp label,.grp .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;margin-bottom:6px}
.grp label b{font-family:var(--f-m);color:var(--amber);text-transform:none;letter-spacing:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:13.5px;font-weight:600}
.seg button.on{background:var(--amber);color:#2a1700;border-color:var(--amber)}
input[type=range]{width:100%;accent-color:var(--amber)}
.read{background:var(--panel2);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.5}
.read b{color:var(--phos)}
.read .warn{color:var(--amber)}
.retos{background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.retos h4{margin:0;font-family:var(--f-d);font-size:15px}
.reto{display:flex;gap:10px;font-size:14px;line-height:1.4;align-items:flex-start}
.reto i{flex:none;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--muted);display:grid;place-items:center;font-style:normal;font-size:12px;margin-top:1px}
.reto.done i{background:var(--phos);border-color:var(--phos);color:#06210f}
.reto.done span{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(147,161,184,.5)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}

/* SVG */
svg.plot{width:100%;height:auto;display:block}
.ax{stroke:#56627a;stroke-width:1.2;fill:none}
.grid{stroke:#1f2a3c;stroke-width:1}
.tr{fill:none;stroke:var(--phos);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.tr.a{stroke:var(--amber)}.tr.c{stroke:var(--coral)}.tr.b{stroke:var(--blue)}.tr.v{stroke:var(--violet)}.tr.m{stroke:#56627a}
.tr.thin{stroke-width:1.2;opacity:.55}
.sb{stroke:var(--ink);stroke-width:2.2;fill:none}
.tx{fill:var(--ink);font-family:var(--f-b);font-size:12.5px}
.tx.s{font-size:11px;fill:var(--muted)}
.tx.m{font-family:var(--f-m)}
.tx.a{fill:var(--amber)}.tx.g{fill:var(--phos)}.tx.c{fill:var(--coral)}.tx.b{fill:var(--blue)}
.bar{fill:var(--phos);opacity:.85}.bar.a{fill:var(--amber)}.bar.c{fill:var(--coral)}.bar.b{fill:var(--blue)}
.mark{fill:var(--amber)}
.dash{stroke-dasharray:4 4}

/* predice */
.qbox{max-width:880px}
.ctx{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:14px;padding:14px 16px;line-height:1.55;margin-bottom:12px}
.ctx .k{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--amber);font-weight:700;display:block;margin-bottom:4px}
.qtitle{font-family:var(--f-d);font-size:22px;margin:4px 0 12px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.opts.txt{grid-template-columns:1fr}
.opt{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:8px;transition:border-color .12s,transform .08s}
.opt:hover:not(:disabled){border-color:var(--muted);transform:translateY(-1px)}
.opt .k{font-family:var(--f-m);font-size:12px;color:var(--muted)}
.opt.txt{flex-direction:row;align-items:center;gap:12px;font-size:15px;padding:13px 14px}
.opt.ok{border-color:var(--phos);background:var(--phos-soft)}
.opt.ko{border-color:var(--coral);background:var(--coral-soft)}
.opt:disabled{cursor:default}
.fb{margin-top:12px;border-radius:14px;padding:14px 16px;line-height:1.55;font-size:14.5px;animation:pop .25s}
.fb.ok{background:var(--phos-soft);border:1px solid rgba(92,242,166,.35)}
.fb.ko{background:var(--coral-soft);border:1px solid rgba(255,111,111,.35)}
.fb .base{margin-top:10px;background:rgba(0,0,0,.22);border-radius:10px;padding:10px 12px;font-size:13.5px}
.fb .base b{color:var(--amber)}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.next{margin-top:14px}

/* figura */
.figgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px}
@media(max-width:860px){.figgrid{grid-template-columns:1fr}}
.figpanel{background:#0a0f17;border:1px solid var(--line);border-radius:18px;padding:14px;position:sticky;top:10px;align-self:start}
.figpanel .cap{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.45}
.ladder{display:flex;gap:6px;margin-bottom:12px}
.ladder span{flex:1;height:30px;border-radius:9px;background:var(--panel2);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.ladder span.now{background:var(--amber);color:#2a1700}
.ladder span.ok{background:var(--phos-soft);color:var(--phos)}
.ladder span.ko{background:var(--coral-soft);color:var(--coral)}
.stepq{font-family:var(--f-d);font-size:19px;line-height:1.25;margin-bottom:4px}
.stepsub{color:var(--muted);font-size:13.5px;margin-bottom:10px;line-height:1.45}
.hint{font-size:13px;color:var(--amber);background:var(--amber-soft);border-radius:10px;padding:8px 10px;margin-bottom:10px}
.builder{background:var(--panel2);border:1.5px dashed var(--line);border-radius:14px;min-height:96px;padding:10px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;margin-bottom:10px}
.builder.ok{border-color:var(--phos);border-style:solid}
.builder.ko{border-color:var(--coral);border-style:solid}
.frag{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;line-height:1.35;text-align:left}
.frag:hover{border-color:var(--amber)}
.builder .frag{background:var(--blue-soft);border-color:rgba(111,178,255,.4)}
.pool{display:flex;flex-wrap:wrap;gap:6px}
.model{background:rgba(0,0,0,.25);border-left:3px solid var(--phos);border-radius:8px;padding:10px 12px;margin-top:10px;font-size:14px;line-height:1.55}

/* piezas base */
.pieces{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.piece{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.piece h4{margin:0 0 8px;font-family:var(--f-d);font-size:17px;color:var(--amber)}
.piece p,.piece li{font-size:14px;line-height:1.55;color:#cdd6e4;margin:0 0 6px}
.piece ul{padding-left:18px;margin:0}

/* final */
.fin{max-width:620px;margin:20px auto;text-align:center}
.fin .xp{font-family:var(--f-m);font-size:64px;font-weight:700;color:var(--phos);line-height:1}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);background:var(--phos);color:#06210f;font-weight:700;border-radius:14px;padding:12px 18px;opacity:0;transition:all .3s;z-index:50;max-width:92vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
(function(){
"use strict";
/* ========================= utilidades ========================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const binom=(n,p)=>{let k=0;for(let i=0;i<n;i++)if(Math.random()<p)k++;return k};
const fmt=(x,d=1)=>(Math.round(x*10**d)/10**d).toString().replace('.',',');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function seeded(seed){let s=seed%2147483647;if(s<=0)s+=2147483646;return()=>{s=s*16807%2147483647;return(s-1)/2147483646}}
function sgauss(r){let u=r()||1e-9,v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}

/* ========================= guardado ========================= */
const KEY='neurolab_b2_v1';
let S={xp:0,days:{},retos:{},pred:{},fig:{},lab:{},wrong:{}};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function streak(){let n=0;const d=new Date();if(!S.days[today()])d.setDate(d.getDate()-1);
  for(;;){const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');if(S.days[k]){n++;d.setDate(d.getDate()-1)}else break}return n}
let toastT;function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400)}
function addXP(n,msg){S.xp+=n;save();const c=$('#xpchip b');if(c)c.textContent=S.xp;if(msg)toast(msg+'  +'+n+' XP')}

/* ========================= dibujo de figuras ========================= */
function kernel(tr,td){const tp=tr*td/(td-tr)*Math.log(td/tr),nrm=Math.exp(-tp/td)-Math.exp(-tp/tr);return dt=>dt<0?0:(Math.exp(-dt/td)-Math.exp(-dt/tr))/nrm}
/* events: [{t,a,tr,td}] -> pts */
function trace(events,T0,T1,n=500,base=0,noise=0,seed=7){const r=seeded(seed),pts=[],ks=events.map(e=>kernel(e.tr||1,e.td||5));
  for(let i=0;i<=n;i++){const t=T0+(T1-T0)*i/n;let y=base;events.forEach((e,j)=>{y+=e.a*ks[j](t-e.t)});if(noise)y+=noise*sgauss(r);pts.push([t,y])}return pts}
/* plot({w,h,xr,yr,series,sbar,axes,texts,hl,vl,bars,marks}) */
function plot(o){
  const W=o.w||560,H=o.h||230,ax=o.axes,m={l:ax?52:14,r:14,t:o.top||14,b:ax?40:16};
  const X=x=>m.l+(x-o.xr[0])/(o.xr[1]-o.xr[0])*(W-m.l-m.r), Y=y=>H-m.b-(y-o.yr[0])/(o.yr[1]-o.yr[0])*(H-m.t-m.b);
  let g='';
  if(ax){(ax.yt||[]).forEach(v=>{g+=`<line class="grid" x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text class="tx s m" x="${m.l-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`});
    (ax.xt||[]).forEach(v=>{g+=`<text class="tx s m" x="${X(v)}" y="${H-m.b+16}" text-anchor="middle">${v}</text>`});
    g+=`<path class="ax" d="M${m.l} ${m.t} V${H-m.b} H${W-m.r}"/>`;
    if(ax.xl)g+=`<text class="tx s" x="${(m.l+W-m.r)/2}" y="${H-4}" text-anchor="middle">${ax.xl}</text>`;
    if(ax.yl)g+=`<text class="tx s" transform="translate(13 ${(m.t+H-m.b)/2}) rotate(-90)" text-anchor="middle">${ax.yl}</text>`}
  (o.bands||[]).forEach(b=>{g+=`<rect x="${X(b.x0)}" y="${m.t}" width="${X(b.x1)-X(b.x0)}" height="${H-m.t-m.b}" fill="${b.fill||'rgba(255,181,71,.10)'}"/>`;if(b.label)g+=`<text class="tx s a" x="${X(b.x0)+4}" y="${m.t+12}">${b.label}</text>`});
  (o.hl||[]).forEach(h=>{g+=`<line class="ax ${h.dash?'dash':''}" style="${h.color?'stroke:'+h.color:''}" x1="${m.l}" x2="${W-m.r}" y1="${Y(h.y)}" y2="${Y(h.y)}"/>`;if(h.label)g+=`<text class="tx s" x="${W-m.r-4}" y="${Y(h.y)-5}" text-anchor="end" style="${h.color?'fill:'+h.color:''}">${h.label}</text>`});
  (o.vl||[]).forEach(v=>{g+=`<line class="ax dash" style="${v.color?'stroke:'+v.color:''}" x1="${X(v.x)}" x2="${X(v.x)}" y1="${m.t}" y2="${H-m.b}"/>`;if(v.label)g+=`<text class="tx s a" x="${X(v.x)+4}" y="${m.t+11}">${v.label}</text>`});
  (o.bars||[]).forEach(b=>{const y0=Y(Math.max(0,o.yr[0])),y1=Y(b.y);g+=`<rect class="bar ${b.c||''}" x="${X(b.x0)+1}" y="${Math.min(y0,y1)}" width="${Math.max(1,X(b.x1)-X(b.x0)-2)}" height="${Math.abs(y1-y0)}" rx="2"/>`});
  (o.series||[]).forEach(s=>{if(!s.pts.length)return;const d=s.pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(clamp(p[1],o.yr[0]-(o.yr[1]-o.yr[0])*.2,o.yr[1]+(o.yr[1]-o.yr[0])*.2)).toFixed(1)).join('');g+=`<path class="tr ${s.c||''}" d="${d}" ${s.dash?'stroke-dasharray="5 4"':''}/>`;
    if(s.dots)s.pts.forEach(p=>{g+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="${s.r||3.2}" class="mark" style="${s.fill?'fill:'+s.fill:''}"/>`})});
  (o.marks||[]).forEach(k=>{g+=`<path d="M${X(k.x)} ${Y(k.y)+(k.up?10:-10)} l-5 ${k.up?8:-8} h10z" class="mark"/>`;if(k.label)g+=`<text class="tx s a" x="${X(k.x)}" y="${Y(k.y)+(k.up?30:-22)}" text-anchor="middle">${k.label}</text>`});
  (o.texts||[]).forEach(t=>{g+=`<text class="tx ${t.c||''}" x="${t.px?t.x:X(t.x)}" y="${t.px?t.y:Y(t.y)}" text-anchor="${t.a||'start'}">${t.t}</text>`});
  if(o.sbar){const sb=o.sbar,x1=W-m.r-6,y1=H-m.b-4,x0=x1-(sb.x/(o.xr[1]-o.xr[0]))*(W-m.l-m.r),y0=y1-(sb.y/(o.yr[1]-o.yr[0]))*(H-m.t-m.b);
    g+=`<path class="sb" d="M${x0} ${y1} H${x1} V${y0}"/><text class="tx s m" x="${(x0+x1)/2}" y="${y1+13}" text-anchor="middle" style="fill:var(--ink)">${sb.xl}</text><text class="tx s m" x="${x1-5}" y="${(y0+y1)/2+4}" text-anchor="end" style="fill:var(--ink)">${sb.yl}</text>`}
  if(o.label)g+=`<text class="tx" x="${m.l+4}" y="${m.t+12}" style="font-weight:600">${o.label}</text>`;

}
/* tren de eventos sinápticos */
function train(amps,{isi=10,t0=5,T,tr=.5,td=4,sign=-1,base=0,noise=0,seed=3}={}){const ev=amps.map((a,i)=>({t:t0+i*isi,a:sign*a,tr,td}));return trace(ev,0,T||t0+amps.length*isi+td*4,700,base,noise,seed)}
function histBars(counts,bw,c,off=0){return counts.map((n,i)=>({x0:i*bw+off,x1:(i+1)*bw+off,y:n,c:i===0&&c?c:''}))}
/* raster de espigas */
function raster(trials,{T=1.5,on=[.5,1],label='',w=300,h=150}={}){const m={l:10,r:10,t:22,b:22},rowH=(h-m.t-m.b)/trials.length,X=t=>m.l+t/T*(w-m.l-m.r);let g='';
  g+=`<rect x="${X(on[0])}" y="${m.t-12}" width="${X(on[1])-X(on[0])}" height="6" rx="2" fill="var(--amber)"/><text class="tx s a" x="${X(on[0])}" y="${m.t-15}">luz</text>`;
  trials.forEach((sp,i)=>{sp.forEach(t=>{const x=X(t);g+=`<line x1="${x}" x2="${x}" y1="${m.t+i*rowH+2}" y2="${m.t+(i+1)*rowH-2}" stroke="var(--phos)" stroke-width="1.6"/>`})});
  g+=`<line class="ax" x1="${m.l}" x2="${w-m.r}" y1="${h-m.b+2}" y2="${h-m.b+2}"/><text class="tx s" x="${w/2}" y="${h-5}" text-anchor="middle">${label}</text>`;
  return `<svg class="plot" viewBox="0 0 ${w} ${h}">${g}</svg>`}
function spikes(rateFn,T,seed){const r=seeded(seed),out=[];let t=0;const dt=.002;while(t<T){if(r()<rateFn(t)*dt)out.push(t);t+=dt}return out}
function rgcRate(cell,stim){const base=10;let during=base,after=base;
  const on=cell==='on';
  if(stim==='centro'){during=on?75:1;after=on?4:55}
  else if(stim==='anillo'){during=on?1:60;after=on?50:4}
  else if(stim==='difusa'){during=base+4;after=base}
  return t=>t<.5?base:t<1?during:(t<1.15?after:base)}
function rasterFor(cell,stim,label,seedBase=1,h=150){const tr=[];for(let i=0;i<6;i++)tr.push(spikes(rgcRate(cell,stim),1.5,seedBase*31+i*7+(cell==='on'?3:11)));return raster(tr,{label,h})}
function rfIcon(stim,size=70){const c=size/2;let g=`<circle cx="${c}" cy="${c}" r="${c-3}" fill="#0a0f17" stroke="#56627a"/><circle cx="${c}" cy="${c}" r="${c*.38}" fill="none" stroke="#56627a" stroke-dasharray="3 3"/>`;
  if(stim==='centro')g+=`<circle cx="${c}" cy="${c}" r="${c*.32}" fill="var(--amber)" opacity=".9"/>`;
  if(stim==='anillo')g+=`<path d="M${c} 4 a${c-4} ${c-4} 0 1 0 .01 0 M${c} ${c-c*.44} a${c*.44} ${c*.44} 0 1 1 -.01 0" fill="var(--amber)" fill-rule="evenodd" opacity=".9"/>`;
  if(stim==='difusa')g+=`<circle cx="${c}" cy="${c}" r="${c-4}" fill="var(--amber)" opacity=".9"/>`;
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${g}</svg>`}

/* ========================= PIEZAS BASE (lo que falta de Fisiología) ========================= */
const BASE={
 clamp:{t:'Current clamp vs voltage clamp',h:`<p><b>Current clamp:</b> fijas la corriente que inyectas y <b>mides el voltaje</b>. El eje sale en <b>mV</b> y ves PPSE (EPSP), PPSI y potenciales de acción.</p><p><b>Voltage clamp:</b> fijas el voltaje (potencial de <i>holding</i>) y <b>mides la corriente</b> que hace falta para mantenerlo. El eje sale en <b>pA o nA</b> y ves EPSC o IPSC. Aquí no hay potenciales de acción en la célula registrada, porque su voltaje no se mueve.</p><p>👉 Lo primero que miras en cualquier figura es la barra de escala: ¿pone mV o pA?</p>`},
 signo:{t:'¿Por qué las EPSC van hacia abajo?',h:`<p>Es un convenio: la <b>corriente entrante de cationes</b> (Na⁺ entrando) se dibuja <b>negativa, hacia abajo</b>. La corriente saliente se dibuja hacia arriba.</p><p>Por eso la misma sinapsis excitadora sale <b>hacia abajo en voltage clamp</b> (EPSC, una corriente entrante) y <b>hacia arriba en current clamp</b> (EPSP, despolariza).</p>`},
 erev:{t:'Potencial de inversión (E<sub>rev</sub>)',h:`<p>La corriente de un canal es I = g · (V − E<sub>rev</sub>). A (V − E<sub>rev</sub>) se le llama fuerza impulsora.</p><ul><li>AMPA/NMDA (catiónicos): E<sub>rev</sub> ≈ 0 mV. Por debajo de 0 la corriente es entrante (abajo); por encima de 0 se invierte y sale.</li><li>GABA-A (Cl⁻): E<sub>rev</sub> ≈ −70 mV. Si la neurona está justo a −70, abrir el canal casi no cambia el voltaje, pero sí la <i>cortocircuita</i> (inhibición por shunting).</li></ul><p>Regla práctica: un canal abierto siempre empuja el voltaje hacia su E<sub>rev</sub>.</p>`},
 ttx:{t:'TTX y los minis',h:`<p>La <b>TTX</b> bloquea los canales de Na⁺ dependientes de voltaje, así que no hay potenciales de acción. Lo que sigue apareciendo en el registro son los <b>minis</b> (mEPSP o mEPSC): la liberación espontánea de <b>una sola vesícula</b>. Su tamaño medio es el <b>Q</b>.</p>`},
 iono:{t:'Ionotrópico vs metabotrópico',h:`<p><b>Ionotrópico:</b> el receptor es un canal. La respuesta es rápida (ms). Ejemplos: AMPA, kainato, NMDA, GABA-A, nicotínico.</p><p><b>Metabotrópico:</b> el receptor está acoplado a proteína G. La respuesta es más lenta y puede abrir o cerrar canales por una cascada. Ejemplos: mGluR (como el mGluR6 de las bipolares ON), GABA-B, muscarínicos.</p>`},
 elec:{t:'Sinapsis eléctrica vs química',h:`<p><b>Eléctrica:</b> uniones gap (conexinas). La corriente pasa directamente, así que <b>casi no hay retraso</b> y suele ser bidireccional.</p><p><b>Química:</b> llega el PA, entra Ca²⁺, se fusiona la vesícula, el neurotransmisor difunde y se une al receptor. Todo esto tarda unos 0,5–1 ms: es el <b>retraso sináptico</b>.</p><p>Una sinapsis <b>mixta</b> (como las club endings sobre la célula de Mauthner) da las dos respuestas, una detrás de otra.</p>`},
 tipos:{t:'¿Quién es quién? Tipos de neuronas',h:`<ul><li><b>Piramidales</b> (corteza, CA1 y CA3 del hipocampo): <b>glutamatérgicas, excitadoras</b> y de proyección. Tienen muchas espinas dendríticas, que es donde se estudia la LTP.</li><li><b>Interneuronas</b>: casi siempre <b>GABAérgicas (o glicinérgicas en tronco y médula), inhibidoras</b> y locales. Controlan cuándo disparan las demás.</li><li><b>Granulares del giro dentado</b>: excitadoras. Sus axones son las <b>fibras musgosas</b> que van a CA3.</li><li><b>Purkinje</b> (cerebelo): <b>GABAérgica</b> y única salida de la corteza cerebelosa. Recibe la <b>fibra trepadora</b>.</li><li><b>Motoneurona</b>: colinérgica. Su sinapsis es la unión neuromuscular.</li><li><b>Célula de Mauthner</b> (romboencéfalo de peces y anfibios): neurona gigante del escape en C.</li></ul>`},
 sumacion:{t:'Sumación y umbral',h:`<p>Los PPSE son graduados y se suman. En la <b>sumación temporal</b> llegan seguidos y se montan uno sobre otro; en la <b>espacial</b> llegan de sitios distintos. Si el voltaje en el cono axónico supera el <b>umbral</b>, se dispara un PA, que es todo o nada.</p><p>Una inhibición <b>cerca del soma</b> pesa más que una excitación lejana en la dendrita.</p>`}
};

 init(root,api){let N=3,P=.3,Q=.4,ttx=false;

  <div class="ctrl"><div class="grp"><label>Intensidad del sonido <b id="l5iv">3</b></label><input type="range" id="l5i" min="0" max="10" value="3"><div class="muted" style="font-size:12px;margin-top:4px">0–3 ambiental · 4–7 fuerte · 8–10 peligro</div></div>
  <div class="grp"><div class="lbl">Bloqueos</div><div class="seg"><button class="btn" id="l5gap">Bloquear uniones gap</button><button class="btn" id="l5glu">Bloquear glutamato</button><button class="btn" id="l5inh">Bloquear inhibición (estricnina)</button></div></div>
  ${retosHTML(this.retos)}</div></div>`},
 init(root,api){let I=3,gap=false,glu=false,inh=false;
  const draw=()=>{$('#l5iv',root).textContent=I;const {pts,spikeT}=mauthner(I,gap,glu,inh);
   $('#l5tr',root).innerHTML=plot({h:230,xr:[-.5,5],yr:[-100,10],series:[{pts}],hl:[{y:-80,dash:1,label:'reposo −80 mV'},{y:-50,dash:1,color:'var(--coral)',label:'umbral'}],vl:[{x:.35,label:'PA presináptico (VIII)',color:'var(--amber)'}],sbar:{x:1,xl:'1 ms',y:20,yl:'20 mV'}});
   $('#l5st',root).textContent=spikeT!==null?'DISPARA · '+fmt(spikeT-.35,2)+' ms':'no dispara';
   let t=`<b>Componente eléctrico</b> (uniones gap): aparece <b>sin retraso</b>, justo con el PA presináptico. <b>Componente químico</b> (glutamato): llega unos <b>0,7 ms después</b>, que es el retraso sináptico. La <b>inhibición</b> de las interneuronas cercanas al soma (anticipatoria) se resta.`;
   if(spikeT!==null)t+=`<br>✅ La célula dispara a los <b>${fmt(spikeT-.35,2)} ms</b> del PA presináptico → contracción de la musculatura <b>contralateral</b> → curvatura en C que aleja al pez del estímulo.`;
   else t+=`<br>No llega al umbral: la célula está muy hiperpolarizada (−80 mV) y la inhibición anticipatoria la protege del ruido ambiental.`;
   $('#l5read',root).innerHTML=t;
   if(spikeT!==null&&!gap&&!glu&&!inh&&mauthner(I-1,false,false,false).spikeT===null)api.reto('r5a');
   if(spikeT!==null&&inh&&I>=4&&I<=6&&!gap&&!glu)api.reto('r5b');
   if(gap&&!glu&&I>=8)api.reto('r5c')};
  $('#l5i',root).oninput=e=>{I=+e.target.value;draw()};
  const tog=(id,f)=>{$(id,root).onclick=e=>{f();e.currentTarget.classList.toggle('on');draw()}};
  tog('#l5gap',()=>gap=!gap);tog('#l5glu',()=>glu=!glu);tog('#l5inh',()=>inh=!inh);draw();}};

 html(){return `<div class="lab"><div class="scope"><div class="hd"><span>REGISTRO EXTRACELULAR · célula ganglionar</span><span id="l6hz"></span></div>

  <div class="grp"><div class="lbl">Estímulo de luz</div>${seg('stim',[['nada','Oscuridad'],['centro','Punto central'],['anillo','Anillo periférico'],['difusa','Luz difusa']],'centro')}</div>
  ${retosHTML(this.retos)}</div></div>`},
 init(root,api){let cell='on',stim='centro';const seenDiff={};
  const draw=()=>{$('#l6rf',root).innerHTML=rfIcon(stim,96);$('#l6ras',root).innerHTML=rasterFor(cell,stim,'6 ensayos · 1,5 s',stim.length);
   const r=rgcRate(cell,stim)(0.7);$('#l6hz',root).textContent='durante la luz ≈ '+Math.round(r)+' Hz (basal 10)';
   const cLit=stim==='centro'||stim==='difusa';
   const pr=cLit?['Fotorreceptores del centro','se <b>hiperpolarizan</b> con la luz','↓ glutamato']:['Fotorreceptores del centro','en oscuridad: despolarizados (corriente oscura)','↑ glutamato'];
   const bip=cell==='on'?['Bipolar ON (mGluR6 → cierra TRPM1)',cLit?'menos glutamato → TRPM1 se abre → <b>despolariza</b>':'mucho glutamato → TRPM1 cerrado → hiperpolarizada','<b>inversión de signo</b>']:['Bipolar OFF (AMPA/kainato)',cLit?'menos glutamato → <b>se hiperpolariza</b>':'mucho glutamato → despolarizada','<b>conserva el signo</b>'];
   $('#l6chain',root).innerHTML=`<div class="read" style="font-size:13px;display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><b>${pr[0]}</b><br>${pr[1]}<br><span class="muted">${pr[2]}</span></div><div><b>${bip[0]}</b><br>${bip[1]}<br><span class="muted">${bip[2]}</span></div></div>`;
   const txt={nada:'Sin estímulo: disparo basal espontáneo.',centro:cell==='on'?'Luz en el centro de una ON-center: <b>máxima frecuencia</b> mientras dura la luz.':'Luz en el centro de una OFF-center: se <b>inhibe</b> durante la luz y da un rebote al apagarla.',anillo:cell==='on'?'Luz solo en la periferia: la periferia es <b>antagonista</b> → la ON-center se inhibe (y rebota al apagar).':'Luz en la periferia de una OFF-center: se activa (la periferia es antagonista del centro).',difusa:'Luz difusa: centro y periferia se <b>cancelan</b> → casi no cambia nada. Las ganglionares miden <b>contraste</b>, no la intensidad absoluta. La inhibición lateral viene de las <b>células horizontales</b>.'};
   $('#l6read',root).innerHTML=txt[stim];
   if(cell==='on'&&stim==='centro')api.reto('r6a');if(cell==='off'&&stim==='anillo')api.reto('r6b');if(stim==='difusa'){seenDiff[cell]=1;if(seenDiff.on&&seenDiff.off)api.reto('r6c')}};
  bindSeg(root,'cell',v=>{cell=v;draw()});bindSeg(root,'stim',v=>{stim=v;draw()});draw();}};

const vcEPSC=(a,o={})=>plot({w:330,h:170,xr:[0,40],yr:[-320,120],series:[{pts:trace([{t:8,a,tr:.6,td:5}],0,40,300,0,4,o.s||2)}],sbar:{x:10,xl:'10 ms',y:100,yl:'100 pA'}});
const ccEPSP=(a,o={})=>plot({w:330,h:170,xr:[0,60],yr:[-14,14],series:[{pts:trace([{t:10,a,tr:1.2,td:12}],0,60,300,0,.15,o.s||2)}],sbar:{x:10,xl:'10 ms',y:5,yl:'5 mV'}});
const histOpt=(counts,bw,c)=>plot({w:330,h:180,xr:[0,counts.length*bw],yr:[0,Math.max(...counts)+3],bars:histBars(counts,bw,c),axes:{xl:'Amplitud',yl:'Nº',xt:[],yt:[]}});
const trainOpt=(A,isi=12,unit='pA')=>plot({w:330,h:170,xr:[0,10+A.length*isi+20],yr:[-Math.max(...A)*1.15,30],series:[{pts:train(A,{isi,t0:10,T:10+A.length*isi+20,tr:.4,td:3})}],sbar:{x:20,xl:'20 ms',y:100,yl:'100 '+unit}});
const timeOpt=(pts,yr=[40,260],xl='Tiempo (min)')=>plot({w:330,h:180,xr:[pts[0][0],pts[pts.length-1][0]],yr,series:[{pts}],hl:[{y:100,dash:1}],axes:{xl,yl:'%',xt:[],yt:[100]}});
const rasOpt=(fn)=>{const tr=[];for(let i=0;i<5;i++)tr.push(spikes(fn,1.5,i*13+5));return raster(tr,{h:130})};
const mtrOpt=(I,gap,glu,inh)=>{const {pts}=mauthner(I,gap,glu,inh);return plot({w:330,h:170,xr:[-.5,5],yr:[-100,10],series:[{pts}],hl:[{y:-80,dash:1}],vl:[{x:.35}],sbar:{x:1,xl:'1 ms',y:20,yl:'20 mV'}})};
function cumOpt(type){const pts=[];for(let t=0;t<=10;t+=.05){let y;if(type==='ok')y=4*(1-Math.exp(-t/.08))+30*(1-Math.exp(-t/1.2))+5*t;else if(type==='lin')y=12*t;else y=40*(1-Math.exp(-t/.1));pts.push([t,y])}return plot({w:330,h:180,xr:[0,10],yr:[0,100],series:[{pts}],axes:{xl:'Tiempo (s)',yl:'Liberación acum.',xt:[],yt:[]}})}
function stpOpt(P0,isi,buf){const A=stpRun(P0,isi,buf,6).amps.map(a=>a*700);return trainOpt(A,isi)}

 {id:'p4e',s:4,ctx:'Haces imagen de espinas dendríticas <b>in vivo</b>, a cierta profundidad en la corteza, durante días.',q:'¿Qué técnica eliges?',txt:true,

 {id:'p4f',s:4,ctx:'Con imagen de 2 fotones sigues espinas tras inducir <b>LTP</b> y, en otro experimento, <b>LTD</b>.',q:'¿Qué ves?',txt:true,

 {id:'p5c',s:5,ctx:'La célula de Mauthner está en reposo a <b>−80 mV</b> y tiene interneuronas inhibidoras <b>pegadas al soma</b>.',q:'¿Para qué?',txt:true,

  why:'Vivimos (y los peces viven) rodeados de sonido. La hiperpolarización y la <b>inhibición anticipatoria</b> cerca del soma hacen que solo un estímulo fuerte supere el umbral: así la célula discrimina peligro de ruido.'},
 {id:'p5d',s:5,ctx:'Dispara la célula de Mauthner <b>izquierda</b>.',q:'¿Qué pasa?',txt:true,

  why:'El axón cruza y excita motoneuronas <b>contralaterales</b> → curvatura en C. A la vez, la inhibición <b>recurrente/contralateral</b> impide que la otra Mauthner dispare: la respuesta es única e irreversible.'},
 {id:'p5e',s:5,ctx:'En atletismo, salir antes de <b>100 ms</b> tras el disparo cuenta como salida falsa.',q:'¿Por qué no se puede reaccionar antes?',txt:true,

  why:'Cada sinapsis química añade ~0,5–1 ms. Un circuito con muchas sinapsis, más el procesamiento, suma un mínimo que no se puede bajar. Con estímulo visual (Fórmula 1) es aún más lento, unos 200 ms.'},

 {id:'p6a',s:6,ctx:'Célula ganglionar <b>ON-center</b>. Proyectas un <b>anillo de luz</b> solo en la periferia de su campo receptivo.',q:'¿Qué raster esperas?',

 {id:'p6b',s:6,ctx:'Iluminas el campo receptivo entero con <b>luz difusa</b>.',q:'¿Qué raster esperas?',

 {id:'p6c',s:6,ctx:'Se enciende una luz en el centro del campo de una <b>bipolar ON</b>.',q:'¿Qué le pasa?',txt:true,

  why:'Luz → el fotorreceptor se hiperpolariza → <b>menos glutamato</b>. En la bipolar ON el glutamato actúa por <b>mGluR6</b> (metabotrópico) cerrando TRPM1, así que con menos glutamato el TRPM1 se abre y la célula se despolariza: <b>inversión de signo</b>. La OFF (AMPA/kainato) conserva el signo.'},
 {id:'p6d',s:6,ctx:'Un paciente tiene una lesión del <b>tracto óptico derecho</b>.',q:'¿Qué pierde?',txt:true,

 {id:'p6e',s:6,ctx:'Una ganglionar tiene un campo receptivo grande, conducción rápida, mucha sensibilidad al contraste y es insensible al color.',q:'¿Qué es y adónde proyecta?',txt:true,

const STEPNAMES=['📏 Mide','🔧 Hace','👀 Cambia','🧠 Por qué','✍️ Redacta'];
function figReversal(){const Vs=[-80,-40,0,40],cols=['','a','b','c'];return plot({w:560,h:260,xr:[0,50],yr:[-380,200],series:Vs.map((v,i)=>({pts:trace([{t:8,a:4*v,tr:.6,td:5}],0,50,300,0,2,i+1),c:cols[i]})),hl:[{y:0,dash:1,label:'0 pA'}],sbar:{x:10,xl:'10 ms',y:100,yl:'100 pA'},texts:[{x:20,y:-330,t:'−80 mV',c:'g'},{x:20,y:-180,t:'−40 mV',c:'a'},{x:20,y:-30,t:'0 mV',c:'b'},{x:20,y:180,t:'+40 mV',c:'c'}]})}
function figKatz(){const bw=.1,c=[18,0,2,10,30,27,8,3,17,22,12,4,9,11,5,3,4,3,1,1,1];return plot({w:560,h:260,xr:[-.05,c.length*bw-.05],yr:[0,32],bars:histBars(c,bw,'c',-.05),vl:[{x:.4,label:'0,4'},{x:.8,label:'0,8'},{x:1.2,label:'1,2'},{x:1.6,label:'1,6'}],axes:{xl:'Amplitud del EPP (mV)',yl:'Nº de observaciones',xt:[0,.5,1,1.5,2],yt:[0,10,20,30]},texts:[{x:.05,y:20,t:'18 fallos',c:'c'}]})}
function figThal(){const r=seeded(4),pts=[],pts2=[];for(let i=0;i<120;i++){const fail=r()<.6;pts.push([i,fail?2*sgauss(r):-(8*(1+.25*sgauss(r))*(r()<.85?1:2))])}for(let i=0;i<60;i++)pts2.push([130+i,-(8*(1+.25*sgauss(r)))]);
 return plot({w:560,h:260,xr:[0,192],yr:[-26,8],series:[{pts,dots:1,r:2.4,c:'m',fill:'var(--phos)'},{pts:pts2,dots:1,r:2.4,c:'m',fill:'var(--amber)'}],hl:[{y:0,dash:1}],bands:[{x0:126,x1:192,label:'+TTX: minis'}],axes:{xl:'Nº de ensayo',yl:'Amplitud EPSC (pA)',xt:[0,60,120,180],yt:[-24,-16,-8,0]},texts:[{x:5,y:6,t:'evocadas (sin TTX)',c:'g'}]})}
function figPools(){const pts=[];for(let t=0;t<=10;t+=.04)pts.push([t,4*(1-Math.exp(-t/.08))+30*(1-Math.exp(-t/1.2))+5*t]);return plot({w:560,h:260,xr:[0,10],yr:[0,90],series:[{pts}],bands:[{x0:0,x1:.35,label:'A',fill:'rgba(92,242,166,.12)'},{x0:.35,x1:3.5,label:'B',fill:'rgba(255,181,71,.10)'},{x0:3.5,x1:10,label:'C',fill:'rgba(111,178,255,.10)'}],axes:{xl:'Tiempo de estimulación (s)',yl:'Vesículas liberadas (acumulado)',xt:[0,2,4,6,8,10],yt:[0,30,60,90]}})}
function figSTP(){const A=[];let R=1,c=0;for(let i=0;i<40;i++){if(i){c*=Math.exp(-10/45);R+=(1-R)*(1-Math.exp(-10/350))}const p=clamp(1-(1-.35)*Math.exp(-.35*c),0,.97);A.push(p*R*600);R-=p*R;c+=1}
 const T=10+40*10+20,pre=[];for(let i=0;i<40;i++){pre.push({t:10+i*10,a:90,tr:.15,td:.5})}
 return plot({w:560,h:120,xr:[0,T],yr:[-75,95],series:[{pts:trace(pre,0,T,1400,-70,0),c:'a'}],sbar:{x:50,xl:'50 ms',y:50,yl:'50 mV'},label:'PA presinápticos (100 Hz)'})+plot({w:560,h:200,xr:[0,T],yr:[-Math.max(...A)*1.15,20],series:[{pts:train(A,{isi:10,t0:10,T,tr:.3,td:2.5})}],bands:[{x0:0,x1:42,label:'F'},{x0:42,x1:T,label:'D',fill:'rgba(111,178,255,.07)'}],sbar:{x:50,xl:'50 ms',y:200,yl:'200 pA'},label:'EPSC (Ca²⁺ ext. 1 mM)'})}
function figPPR(){const isis=[10,20,40,60,100,200,400],a=[],b=[];isis.forEach(i=>{const x=stpRun(.1,i,'normal',2).amps,y=stpRun(.8,i,'normal',2).amps;a.push([Math.log10(i),x[1]/x[0]]);b.push([Math.log10(i),y[1]/y[0]])});
 return plot({w:560,h:260,xr:[.9,2.7],yr:[0,2.2],series:[{pts:a,dots:1},{pts:b,dots:1,c:'b',fill:'var(--blue)'}],hl:[{y:1,dash:1,label:'PPR = 1'}],axes:{xl:'Intervalo entre pulsos (ms, escala log)',yl:'PPR (2ª / 1ª)',xt:[1,1.5,2,2.5],yt:[0,.5,1,1.5,2]},texts:[{x:1,y:2.05,t:'● sinapsis 1',c:'a'},{x:1,y:.15,t:'● sinapsis 2',c:'b'},{px:1,x:79,y:236,t:'10',c:'s',a:'middle'},{px:1,x:210,y:236,t:'30',c:'s',a:'middle'},{px:1,x:354,y:236,t:'100',c:'s',a:'middle'},{px:1,x:485,y:236,t:'300',c:'s',a:'middle'}]}).replace(/<text class="tx s m"[^>]*>(1|1\.5|2|2\.5)<\/text>/g,'')}
function figNMDA(){const T=150,mk=(a1,a2)=>trace([{t:10,a:a1,tr:.8,td:5},{t:10,a:a2,tr:6,td:60}],0,T,400,0,0);
 return plot({w:560,h:260,xr:[0,T],yr:[-130,15],series:[{pts:mk(-95,-35)},{pts:mk(0,-35),c:'a'},{pts:mk(-95,0),c:'b'},{pts:mk(0,0),c:'c'}],sbar:{x:20,xl:'20 ms',y:50,yl:'50 pA'},texts:[{x:60,y:-110,t:'— control',c:'g'},{x:60,y:-95,t:'— + CNQX',c:'a'},{x:60,y:-80,t:'— + APV',c:'b'},{x:60,y:-65,t:'— + CNQX + APV',c:'c'}],label:'Voltage clamp a −40 mV'})}
function figLTP(){return plot({w:560,h:260,xr:[-30,180],yr:[40,260],series:[{pts:ltpCurve('tet',false,false)},{pts:ltpCurve('tet',false,true),c:'a'},{pts:ltpCurve('tet',true,false),c:'b'}],hl:[{y:100,dash:1}],vl:[{x:0,label:'tétanos 100 Hz'}],axes:{xl:'Tiempo (min)',yl:'Pendiente fEPSP (% basal)',xt:[0,60,120,180],yt:[50,100,150,200,250]},texts:[{x:120,y:245,t:'— control',c:'g'},{x:120,y:230,t:'— + anisomicina',c:'a'},{x:120,y:215,t:'— + APV',c:'b'}]})}
function figMauth(){const {pts}=mauthner(7,false,false,false);return plot({w:560,h:260,xr:[-.5,5],yr:[-100,-40],series:[{pts}],hl:[{y:-80,dash:1}],vl:[{x:.35,label:'pre-spike'}],sbar:{x:1,xl:'1 ms',y:10,yl:'10 mV'},texts:[{x:.5,y:-52,t:'e',c:'a'},{x:1.55,y:-50,t:'c',c:'a'}]})}
function figRGC(){const st=['centro','anillo','difusa'],lab=['A · punto central','B · anillo periférico','C · luz difusa'];
 return `<div style="display:grid;gap:6px">${st.map((s,i)=>`<div style="display:flex;gap:10px;align-items:center">${rfIcon(s,58)}<div style="flex:1">${rasterFor('on',s,lab[i],i+3,120)}</div></div>`).join('')}</div>`}

/* ========================= COMPONENTES ========================= */
function renderPred(item,host,done){
  const letters='ABC';
  host.innerHTML=`<div class="qbox"><div class="ctx"><span class="k">🔬 Experimento · ${SALAS[item.s].t}</span>${item.ctx}</div><div class="qtitle">${item.q}</div>
   <div class="opts ${item.txt?'txt':''}">${shuffle(item.o.map((o,i)=>i)).map((i,pos)=>`<button class="opt ${item.txt?'txt':''}" data-i="${i}"><span class="k">${letters[pos]}</span>${item.txt?`<span>${item.o[i]}</span>`:item.o[i]()}</button>`).join('')}</div><div id="pfb"></div></div>`;
  $$('.opt',host).forEach(b=>b.onclick=()=>{const i=+b.dataset.i,ok=i===item.ok;$$('.opt',host).forEach(x=>{x.disabled=true;if(+x.dataset.i===item.ok)x.classList.add('ok')});if(!ok)b.classList.add('ko');
   S.pred[item.id]=ok;if(!ok)S.wrong[item.id]=(S.wrong[item.id]||0)+1;else if(S.wrong[item.id])S.wrong[item.id]=Math.max(0,S.wrong[item.id]-1);save();if(ok)addXP(10);
   const b2=item.base&&BASE[item.base];
   $('#pfb',host).innerHTML=`<div class="fb ${ok?'ok':'ko'}"><b>${ok?'¡Bien visto!':'Casi. Vamos a verlo con calma:'}</b> ${item.why}${b2&&!ok?`<div class="base"><b>🧩 Pieza base · ${b2.t}</b>${b2.h}</div>`:''}</div><button class="btn go next" id="pnext">Siguiente →</button>`;
   $('#pnext',host).onclick=()=>done(ok)})}

function renderFig(item,host,done){let k=0,score=0;const res=[];
  host.innerHTML=`<div class="figgrid"><div class="figpanel"><div class="hd mono" style="font-size:12px;color:var(--muted);margin-bottom:8px">FIGURA · ${esc(item.t)}</div>${item.fig()}<div class="cap">${item.cap}</div></div><div><div class="ladder">${STEPNAMES.map((n,i)=>`<span data-st="${i}">${n}</span>`).join('')}</div><div id="fstep"></div></div></div>`;
  const ladder=()=>$$('.ladder span',host).forEach((s,i)=>{s.className=i===k?'now':res[i]===true?'ok':res[i]===false?'ko':''});
  const step=()=>{ladder();const box=$('#fstep',host);
   if(k<4){const st=item.steps[k],L='ABC';
    box.innerHTML=`<div class="stepq">${st.q}</div><div class="stepsub">Paso ${k+1} de 5 · ${['Primero, lee los ejes y las barras de escala.','¿Qué variable controla quien hace el experimento?','Solo describe lo que ves. Todavía no expliques.','Ahora sí: conecta lo que ves con la teoría.'][k]}</div>
     ${st.h?`<button class="btn" id="fh" style="margin-bottom:10px">💡 Pista</button>`:''}<div class="opts txt">${shuffle(st.o.map((o,i)=>i)).map((i,pos)=>`<button class="opt txt" data-i="${i}"><span class="k">${L[pos]}</span><span>${st.o[i]}</span></button>`).join('')}</div><div id="ffb"></div>`;
    if(st.h)$('#fh',box).onclick=e=>{e.target.outerHTML=`<div class="hint">💡 ${st.h}</div>`};
    $$('.opt',box).forEach(b=>b.onclick=()=>{const i=+b.dataset.i,ok=i===st.ok;$$('.opt',box).forEach(x=>{x.disabled=true;if(+x.dataset.i===st.ok)x.classList.add('ok')});if(!ok)b.classList.add('ko');res[k]=ok;if(ok){score+=5;addXP(5)}ladder();
     $('#ffb',box).innerHTML=`<div class="fb ${ok?'ok':'ko'}">${st.fb}</div><button class="btn go next" id="fn">Siguiente paso →</button>`;$('#fn',box).onclick=()=>{k++;step()}})}
   else{const frags=item.frase.map((t,i)=>({t,i})),pool=shuffle(frags.concat(item.dis.map(t=>({t,i:-1}))));let ans=[];
    box.innerHTML=`<div class="stepq">Monta tu respuesta de examen</div><div class="stepsub">Toca las piezas en orden: <b>qué se mide → qué se hace → qué cambia → por qué → conclusión</b>. Dos piezas son trampas. Toca una pieza de tu respuesta para quitarla.</div><div class="builder" id="bd"></div><div class="pool" id="pl"></div><div class="seg" style="margin-top:12px"><button class="btn go" id="chk">Comprobar</button></div><div id="bfb"></div>`;
    const paint=()=>{$('#bd',box).innerHTML=ans.map((f,j)=>`<button class="frag" data-j="${j}">${f.t}</button>`).join('')||'<span class="muted" style="font-size:13px">Tu respuesta aparecerá aquí…</span>';
     $('#pl',box).innerHTML=pool.filter(f=>!ans.includes(f)).map(f=>`<button class="frag" data-p="${pool.indexOf(f)}">${f.t}</button>`).join('');
     $$('#bd .frag',box).forEach(b=>b.onclick=()=>{ans.splice(+b.dataset.j,1);paint()});$$('#pl .frag',box).forEach(b=>b.onclick=()=>{ans.push(pool[+b.dataset.p]);paint()})};paint();
    $('#chk',box).onclick=()=>{const hasDis=ans.some(f=>f.i<0),all=item.frase.every((_,i)=>ans.some(f=>f.i===i)),order=ans.every((f,j)=>f.i===j)&&ans.length===item.frase.length;
     const bd=$('#bd',box);let msg,pts=0;
     if(order){msg='<b>¡Respuesta de matrícula!</b> Tiene la estructura completa: qué se mide, qué se hace, qué pasa, por qué y conclusión.';pts=15;bd.className='builder ok';res[4]=true}
     else if(hasDis){msg='Se te ha colado una <b>trampa</b>: '+ans.filter(f=>f.i<0).map(f=>'«'+f.t+'»').join(', ')+'. Quítala y vuelve a probar.';bd.className='builder ko'}
     else if(all){msg='Tienes <b>todas las ideas</b>, pero el orden no es el que convence a un corrector. Recuerda: <b>mide → hace → cambia → por qué → conclusión</b>.';pts=0;bd.className='builder ko'}
     else{msg='Te faltan piezas. Una buena respuesta tiene <b>las cinco partes</b>.';bd.className='builder ko'}
     $('#bfb',box).innerHTML=`<div class="fb ${order?'ok':'ko'}">${msg}${order?'':''}</div>`+(order?`<div class="model">${item.frase.join(' ')}</div><button class="btn go next" id="fend">Terminar figura →</button>`:`<button class="btn next" id="fshow">Ver la respuesta modelo</button>`);
     if(order){score+=pts;addXP(pts,'Respuesta perfecta');$('#fend',box).onclick=fin}
     else $('#fshow',box).onclick=()=>{res[4]=false;ladder();$('#bfb',box).innerHTML+=`<div class="model">${item.frase.join(' ')}</div><button class="btn go next" id="fend">Terminar figura →</button>`;$('#fend',box).onclick=fin;$('#fshow',box).remove()}}}};
  const fin=()=>{S.fig[item.id]=Math.max(S.fig[item.id]||0,score);save();done(score)};step()}

const app=$('#app');
function header(back){return `<div class="top">${back?`<button class="back" id="goback" aria-label="Volver">←</button>`:''}<div class="brand"><span class="dot"></span>Neurolab · Bloque 2</div><span class="chip" id="xpchip">⚡ <b>${S.xp}</b> XP</span><span class="chip">🔥 <b>${streak()}</b> días</span></div>`}
function daysTo(){const d=new Date(2026,11,14),n=new Date();n.setHours(0,0,0,0);return Math.round((d-n)/864e5)}
function focusSalas(){const n=new Date();n.setHours(0,0,0,0);const d=x=>new Date(2026,x[0],x[1]);
  if(n<d([10,24]))return[1,2];if(n<d([11,1]))return[3,4];if(n<d([11,8]))return[5,6];return[1,2,3,4,5,6]}
function salaProgress(id){const labDone=LABS[id].retos.filter(r=>S.retos[r.id]).length,labTot=LABS[id].retos.length;const ps=PREDS.filter(p=>p.s===id),pOk=ps.filter(p=>S.pred[p.id]===true).length;const fs=FIGS.filter(f=>f.s===id),fOk=fs.filter(f=>(S.fig[f.id]||0)>=30).length;
  return{lab:[labDone,labTot],pred:[pOk,ps.length],fig:[fOk,fs.length]}}

  app.innerHTML=header(false)+`<div class="hero"><div class="card mission"><div class="section">Misión del día · ~20 min</div><h2>${S.days[today()]?'Misión de hoy completada ✓':'Tu ronda diaria de neuro'}</h2>

   <div class="stat"><div class="n">${Object.values(S.pred).filter(Boolean).length}/${PREDS.length}</div><div class="l">predicciones acertadas</div></div><div class="stat"><div class="n">${FIGS.filter(f=>(S.fig[f.id]||0)>=30).length}/${FIGS.length}</div><div class="l">figuras dominadas (≥30 pts)</div></div>
   <div class="week">Foco de esta semana: <b>${foc.length>4?'repaso total y simulacros':foc.map(i=>SALAS[i].t).join(' + ')}</b>. El Kit básico aparece mezclado en las misiones para ir tapando huecos de base.</div></div></div>
   <div class="section">Mapa de salas</div><div class="map">${SALAS.map(s=>{const p=salaProgress(s.id),ok=a=>a[0]===a[1]&&a[1]>0;return `<button class="sala ${foc.includes(s.id)&&foc.length<5?'focus':''}" data-s="${s.id}"><span class="num">${s.temas}</span><h3>${s.t}</h3><p>${s.sub}</p><div class="stars"><span class="${ok(p.lab)?'ok':''}">🧪 ${p.lab[0]}/${p.lab[1]}</span><span class="${ok(p.pred)?'ok':''}">🔮 ${p.pred[0]}/${p.pred[1]}</span><span class="${ok(p.fig)?'ok':''}">📈 ${p.fig[0]}/${p.fig[1]}</span></div></button>`}).join('')}</div>`;
  $('#mis').onclick=mission;$$('.sala').forEach(b=>b.onclick=()=>sala(+b.dataset.s));window.scrollTo(0,0)}

function sala(id,tab='lab'){const s=SALAS[id];
  app.innerHTML=header(true)+`<div class="section">${s.temas}</div><h1 style="font-size:32px;margin-bottom:8px">${s.t}</h1><p class="intro">${s.intro}</p>
   <div class="tabs"><button class="tab" data-t="lab">🧪 Laboratorio</button><button class="tab" data-t="pred">🔮 Predice la traza</button><button class="tab" data-t="fig">📈 Lee la figura</button>${id===0?'<button class="tab" data-t="base">🧩 Piezas base</button>':''}</div><div id="tabhost"></div>`;
  $('#goback').onclick=home;$$('.tab').forEach(b=>b.onclick=()=>show(b.dataset.t));
  function show(t){$$('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===t));const h=$('#tabhost');
   if(t==='lab'){h.innerHTML=LABS[id].html();LABS[id].init(h,makeApi(h))}
   else if(t==='pred'){const list=PREDS.filter(p=>p.s===id);let i=0;const nx=()=>{if(i>=list.length){h.innerHTML=`<div class="card fin"><h2>Sala completada</h2><p class="muted">${list.filter(p=>S.pred[p.id]).length}/${list.length} acertadas. Las falladas te volverán a salir en las misiones.</p><button class="btn go" id="again">Repetir</button></div>`;$('#again').onclick=()=>show('pred');return}
     h.innerHTML=`<div class="mbar"><i style="width:${i/list.length*100}%"></i></div><div id="ph"></div>`;renderPred(list[i],$('#ph'),()=>{i++;nx();window.scrollTo(0,0)})};nx()}
   else if(t==='fig'){const list=FIGS.filter(f=>f.s===id);h.innerHTML=`<div class="tabs">${list.map((f,j)=>`<button class="btn" data-f="${j}">${esc(f.t)} ${S.fig[f.id]?'· '+S.fig[f.id]+' pts':''}</button>`).join('')}</div><div id="fh"></div>`;
     const open=j=>{$$('[data-f]',h).forEach(b=>b.classList.toggle('on',+b.dataset.f===j));renderFig(list[j],$('#fh'),sc=>{$('#fh').innerHTML=`<div class="card fin"><div class="xp">${sc}</div><p class="muted">puntos de 35 en esta figura</p><button class="btn go" id="fa">Otra vez</button></div>`;$('#fa').onclick=()=>open(j)})};
     $$('[data-f]',h).forEach(b=>b.onclick=()=>open(+b.dataset.f));open(0)}
   else{h.innerHTML=`<div class="pieces">${Object.values(BASE).map(b=>`<div class="piece"><h4>${b.t}</h4>${b.h}</div>`).join('')}</div>`}}
  show(tab);window.scrollTo(0,0)}

function pickMission(){const foc=focusSalas();const labS=foc.slice().sort((a,b)=>{const pa=salaProgress(a).lab,pb=salaProgress(b).lab;return pa[0]/pa[1]-pb[0]/pb[1]})[0];
  const wrong=shuffle(PREDS.filter(p=>S.wrong[p.id]>0)),fresh=shuffle(PREDS.filter(p=>foc.includes(p.s)&&S.pred[p.id]===undefined)),focAll=shuffle(PREDS.filter(p=>foc.includes(p.s))),base=shuffle(PREDS.filter(p=>p.s===0||!foc.includes(p.s)));
  const out=[];const add=p=>{if(p&&!out.includes(p)&&out.length<4)out.push(p)};
  add(wrong[0]);fresh.forEach(add);focAll.forEach(add);base.forEach(add);
  const figs=FIGS.filter(f=>foc.includes(f.s)).sort((a,b)=>(S.fig[a.id]||0)-(S.fig[b.id]||0));
  return{labS,preds:shuffle(out),fig:figs[0]||FIGS[0]}}

function mission(){const M=pickMission();const steps=[{t:'lab'},...M.preds.map(p=>({t:'pred',p})),{t:'fig'}];let k=0,xp0=S.xp,retoHit=false;
  const go=()=>{if(k>=steps.length){S.days[today()]=true;save();const gained=S.xp-xp0;
    app.innerHTML=header(true)+`<div class="card fin"><div class="section">Misión completada</div><div class="xp">+${gained}</div><p class="muted">XP de hoy · racha de <b>${streak()}</b> ${streak()===1?'día':'días'}</p><p style="line-height:1.55">Mañana te saldrá otra combinación: lo que hoy has fallado vuelve a aparecer.</p><button class="big-btn" id="hm">Volver al mapa</button></div>`;$('#goback').onclick=home;$('#hm').onclick=home;return}
   const st=steps[k];app.innerHTML=header(true)+`<div class="section">Misión del día · paso ${k+1} de ${steps.length}</div><div class="mbar" style="margin-top:6px"><i style="width:${k/steps.length*100}%"></i></div><div id="mh"></div>`;$('#goback').onclick=home;const h=$('#mh');
   if(st.t==='lab'){const s=SALAS[M.labS];h.innerHTML=`<h2 style="font-size:26px;margin-bottom:6px">🧪 ${s.t}</h2><p class="intro">${s.intro} <b style="color:var(--amber)">Consigue al menos un reto nuevo (o, si ya los tienes todos, juega un rato) y continúa.</b></p><div id="lh"></div><button class="btn go next" id="lnext" ${LABS[M.labS].retos.every(r=>S.retos[r.id])?'':'disabled style="opacity:.45"'}>Continuar →</button>`;
    LABS[M.labS].init(($('#lh').innerHTML=LABS[M.labS].html(),$('#lh')),makeApi($('#lh'),()=>{retoHit=true;const b=$('#lnext');b.disabled=false;b.style.opacity=1}));$('#lnext').onclick=()=>{k++;go()}}
   else if(st.t==='pred')renderPred(st.p,h,()=>{k++;go()});
   else renderFig(M.fig,h,()=>{k++;go()});window.scrollTo(0,0)};go()}

home();
})();
</script>
