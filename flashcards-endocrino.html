  { id: "m2.1-06", t: "2.1", q: "Los coactivadores reconocen la hélice expuesta del LBD mediante el motivo:", o: ["PXXP", "LXXLL", "NPXY", "YXXM"], c: 1, e: "Al unirse el ligando, la hélice 12 queda expuesta y el motivo LXXLL interacciona con ella." },
  { id: "m2.1-07", t: "2.1", q: "En ausencia de hormona, los receptores esteroideos (clase I) están:", o: ["En el núcleo unidos al DNA con correpresores", "Como monómeros unidos a HSP70/HSP90", "Como heterodímeros con RXR", "Anclados a la membrana plasmática"], c: 1, e: "Las chaperonas tapan el DBD; la opción del núcleo con correpresores es la de clase II." },
  { id: "m2.1-08", t: "2.1", q: "GR, MR, PR y AR reconocen el HRE:", o: ["AGGTCA palindrómico", "AGAACA palindrómico", "AGGTCA en repetición directa", "TGACGTCA"], c: 1, e: "El ER reconoce AGGTCA palindrómico; las repeticiones directas son de clase II; TGACGTCA es el CRE." },
  { id: "m2.1-09", t: "2.1", q: "El tamoxifeno actúa sobre el receptor de estrógenos como:", o: ["Agonista que expone la hélice 12", "Antagonista que deja la hélice 12 plegada", "Inhibidor de la síntesis de estradiol", "Activador de chaperonas"], c: 1, e: "Impide la unión de coactivadores y favorece la de correpresores." },
  { id: "m2.1-10", t: "2.1", q: "Los receptores de clase II se caracterizan por:", o: ["Formar homodímeros en palíndromos", "Formar heterodímeros con RXR en repeticiones directas", "Ser monómeros", "Estar en el citosol con HSP"], c: 1, e: "Ejemplos: TR, RAR, VDR, PPAR, LXR, FXR (FXR reconoce repeticiones invertidas)." },
  { id: "m2.1-11", t: "2.1", q: "El ligando de RXR es:", o: ["Ácido all-trans retinoico", "9-cis retinoico", "Retinal", "Retinol"], c: 1, e: "RAR une all-trans y 9-cis; RXR solo 9-cis." },
  { id: "m2.1-12", t: "2.1", q: "En un experimento de cotransfección, el gen reporter más habitual es:", o: ["GFP en el plásmido del receptor", "Luciferasa tras el HRE y un promotor basal", "GST", "FLAG"], c: 1, e: "Plásmido 1: receptor; plásmido 2: HRE + promotor basal + luciferasa." },
  { id: "m2.1-13", t: "2.1", q: "El ligando de LXR, identificado con la quimera GAL4-LBD, es:", o: ["Ácidos biliares", "Oxiesteroles", "Ácidos grasos", "Vitamina D"], c: 1, e: "FXR → ácidos biliares; PPAR → ácidos grasos; VDR → vitamina D." },
  { id: "m2.1-14", t: "2.1", q: "El sistema FRET para detectar coactivadores usa:", o: ["Luciferasa y LacZ", "Terbio en el anti-GST y fluoresceína en el péptido", "GFP y RFP", "Aequorina"], c: 1, e: "Solo hay luz si el coactivador está muy cerca del receptor." },
  { id: "m2.1-15", t: "2.1", q: "PPARγ se expresa sobre todo en:", o: ["Tejido adiposo blanco, adipogénesis", "Hígado, β-oxidación", "Macrófagos, salida de colesterol", "Intestino, ácidos biliares"], c: 0, e: "PPARα y δ: hígado, músculo, grasa parda (β-oxidación)." },
  { id: "m2.1-16", t: "2.1", q: "Los fármacos que activan PPARγ y aumentan la sensibilidad a insulina son:", o: ["Fibratos", "Tiazolidinedionas", "Estatinas", "Tamoxifeno"], c: 1, e: "Los fibratos activan PPARα." },
  { id: "m2.1-17", t: "2.1", q: "En el hepatocito, FXR inhibe la síntesis de ácidos biliares induciendo:", o: ["FGF19", "SHP, correpresor de CYP7A", "LXR", "SREBP"], c: 1, e: "FGF19 lo induce FXR en el enterocito y viaja al hígado." },
  { id: "m2.1-18", t: "2.1", q: "La enzima limitante de la síntesis de ácidos biliares es:", o: ["HMG-CoA reductasa", "CYP7A", "RALDH2", "Aromatasa"], c: 1, e: "Citocromo P450 que hidroxila el colesterol en la posición 7." },
  { id: "m2.1-19", t: "2.1", q: "En el ensayo FRET para coactivadores de RXRβ, se detecta señal cuando:", o: ["El terbio emite a 340 nm", "La fluoresceína emite a 520 nm porque el coactivador está unido cerca del terbio", "El GST se separa del receptor", "El ligando desplaza al anticuerpo anti-GST"], c: 1, e: "El terbio (donador) se excita a 340 nm y transfiere energía a la fluoresceína (aceptor) solo a distancias cortas." },
  { id: "m2.1-20", t: "2.1", q: "¿Qué PPAR tiene distribución ubicua?", o: ["PPARα", "PPARδ", "PPARγ", "Ninguno"], c: 1, e: "α: hígado, corazón, músculo, adiposo pardo; γ: adiposo blanco; δ: ubicuo." },
  { id: "m2.1-21", t: "2.1", q: "El 18:0/18:1 GPC:", o: ["Activa PPARγ en tejido adiposo", "Se produce en hígado, circula y activa PPARα del músculo (ritmos circadianos)", "Es el ligando de LXR", "Es una tiazolidinediona"], c: 1, e: "El 16:0/18:1 GPC es el del ayuno hepático; el 1-O-octadecenil… activa PPARγ y la adipogénesis." },
  { id: "m2.2-01", t: "2.2", q: "¿Qué RTK ya es un dímero sin ligando?", o: ["EGFR", "PDGFR", "Receptor de insulina", "FGFR"], c: 2, e: "Los receptores de insulina e IGF están unidos por puentes disulfuro." },
  { id: "m2.2-02", t: "2.2", q: "HB-EGF se libera de su precursor de membrana por:", o: ["Furina", "Metaloproteasa ADAM", "S2P", "Caspasa"], c: 1, e: "La furina procesa el TGFβ; S2P, SREBP." },
  { id: "m2.2-03", t: "2.2", q: "La especificidad de la PLCγ por un p-Tyr del receptor viene de:", o: ["Una Met 2 aa después", "Una Pro 2 aa después", "NP antes de la Tyr", "Una Arg antes"], c: 1, e: "PI3K: Met 2 aa después; Shc: NP antes." },
  { id: "m2.2-04", t: "2.2", q: "En la cascada Ras-MAPK, MEK es:", o: ["La MAPKKK", "Una quinasa dual Thr/Tyr (MAPKK)", "La MAPK", "El GEF de Ras"], c: 1, e: "Raf = MAPKKK; MEK = MAPKK; ERK = MAPK; Sos = GEF." },
  { id: "m2.2-05", t: "2.2", q: "Ras se ancla a la membrana mediante:", o: ["Un dominio PH", "Un lípido unido a Cys del C-terminal", "Un dominio transmembrana", "Grb2"], c: 1, e: "Ras es una proteína G monomérica lipidada." },
  { id: "m2.2-06", t: "2.2", q: "El gen de respuesta rápida más importante inducido por ERK vía SRE es:", o: ["c-fos", "Ciclina D1", "MAPK fosfatasa", "SOCS"], c: 0, e: "Ciclina D1 y MAPK fosfatasa son genes tardíos (vía AP-1)." },
  { id: "m2.2-07", t: "2.2", q: "AKT queda totalmente activa tras ser fosforilada por:", o: ["PDK1 en T308 y mTORC2 en S473", "Solo PDK1", "PKA y PKC", "JAK"], c: 0, e: "Necesita obligatoriamente la doble fosforilación." },
  { id: "m2.2-08", t: "2.2", q: "La subunidad de PI3K con dominio SH2 es:", o: ["p110", "p85", "p53", "p90"], c: 1, e: "p85 es la reguladora; p110, la catalítica." },
  { id: "m2.2-09", t: "2.2", q: "PTEN es:", o: ["Una PI3 quinasa", "Una fosfatasa de la posición 3 del PIP₃", "Una E3 ligasa", "Un adaptador"], c: 1, e: "Sus mutaciones inactivantes causan tumores." },
  { id: "m2.2-10", t: "2.2", q: "Cbl apaga la señal de un RTK porque:", o: ["Desfosforila el receptor", "Lo ubiquitina y promueve su endocitosis", "Inhibe Ras", "Degrada el ligando"], c: 1, e: "Quien desfosforila el receptor es SHP1." },
  { id: "m2.2-11", t: "2.2", q: "¿Cuál de estos ligandos actúa por un receptor asociado a JAK?", o: ["EGF", "Eritropoyetina", "Insulina", "TGFβ"], c: 1, e: "También GH, leptina, prolactina y citoquinas." },
  { id: "m2.2-12", t: "2.2", q: "Las STAT dimerizan mediante:", o: ["Cremallera de leucinas", "SH2 de una con la p-Tyr de la otra", "Puentes disulfuro", "Dominio MH2"], c: 1, e: "El dímero va al núcleo y se une a la secuencia GAS." },
  { id: "m2.2-13", t: "2.2", q: "Las proteínas SOCS:", o: ["Activan STAT", "Tienen SH2, bloquean el receptor y su expresión la induce STAT", "Son tirosina quinasas", "Son receptores sin quinasa"], c: 1, e: "Es un feedback negativo." },
  { id: "m2.2-14", t: "2.2", q: "¿Cuál de estos ligandos NO actúa a través de un receptor tirosina quinasa?", o: ["EGF", "TGFα", "TGFβ", "PDGF"], c: 2, e: "TGFβ usa un receptor Ser/Thr quinasa. TGFα es de la familia EGF." },
  { id: "m2.2-15", t: "2.2", q: "La subunidad catalítica de la PI3K de clase IA es:", o: ["p85", "p110", "PDK1", "Vps34"], c: 1, e: "p85 es la reguladora (SH2 a pYxxM); p110 es la catalítica. Vps34 es clase III." },
  { id: "m2.2-16", t: "2.2", q: "Akt se activa totalmente cuando:", o: ["PDK1 la fosforila en S473", "mTORC1 la fosforila en T308", "PDK1 la fosforila en T308 y mTORC2 en S473", "Se une a PI(4,5)P₂ por su PH"], c: 2, e: "Doble fosforilación obligatoria: PDK1 → T308, mTORC2 → S473, tras reclutarse al PIP₃ por su dominio PH." },
  { id: "m2.2-17", t: "2.2", q: "La MAPK típica activada por estrés, UV y citoquinas es:", o: ["ERK1/2", "JNK", "MEK1/2", "Raf-1"], c: 1, e: "JNK (y p38). ERK1/2 responde a factores de crecimiento." },
  { id: "m2.2-18", t: "2.2", q: "¿Qué es la PI3K clase III y qué produce?", o: ["p110γ, PIP₃", "Vps34, PI3P", "PTEN, PI(4,5)P₂", "PI3K-C2α, PI(3,4)P₂"], c: 1, e: "Vps34 fosforila PI → PI3P, reconocido por dominios PX." },
  { id: "m2.3-01", t: "2.3", q: "En la vía de TGFβ, el receptor que une el ligando y está constitutivamente activo es:", o: ["R1", "R2", "R3", "Smad4"], c: 1, e: "R2 fosforila a R1 en la región GS." },
  { id: "m2.3-02", t: "2.3", q: "El TGFβ maduro unido no covalentemente al LAP forma:", o: ["El complejo latente grande", "El complejo latente pequeño", "El receptor R3", "El trímer de Smad"], c: 1, e: "Al unirse a LTBP forma el complejo latente grande, que se secreta." },
  { id: "m2.3-03", t: "2.3", q: "Las únicas Smad que se fosforilan son:", o: ["Co-Smad (Smad4)", "I-Smad (6, 7)", "R-Smad (2, 3)", "Todas"], c: 2, e: "Se fosforilan en el motivo SSXS de MH2." },
  { id: "m2.3-04", t: "2.3", q: "La NLS de las Smad está en el dominio:", o: ["MH1, tapada por MH2", "MH2", "Linker", "SSXS"], c: 0, e: "La fosforilación de MH2 la deja accesible." },
  { id: "m2.3-05", t: "2.3", q: "Smad7 inhibe la vía porque:", o: ["Desfosforila Smad2", "Se une a R1 e impide la fosforilación de R-Smad", "Degrada TGFβ", "Se une al DNA como represor"], c: 1, e: "Las I-Smad tienen MH2 pero no MH1 ni sitio de fosforilación." },
  { id: "m2.3-06", t: "2.3", q: "La E3 ligasa clásica de la vía TGFβ es:", o: ["Cbl", "SMURF", "MDM2", "NEDD4"], c: 1, e: "Ubiquitina R-Smad y receptores; Cbl es de los RTK." },
  { id: "m2.3-07", t: "2.3", q: "La inhibina bloquea la señal porque:", o: ["Es un homodímero ββ que activa R1", "Su subunidad β se une a R2 y la α al betaglicano, impidiendo la unión de R1", "Fosforila Smad7", "Inhibe la furina"], c: 1, e: "La activina (ββ) sí activa la vía y aumenta la FSH." },
  { id: "m2.3-08", t: "2.3", q: "Las R-Smad de la subfamilia BMP son:", o: ["2 y 3", "1, 5 y 8", "4", "6 y 7"], c: 1, e: "Factor de transcripción asociado: Oaz." },
  { id: "m2.3-09", t: "2.3", q: "En la superfamilia TGFβ, ¿qué receptor une directamente el ligando y es constitutivamente activo?", o: ["RI (ALK5)", "RII", "RIII (betaglicano)", "SARA"], c: 1, e: "RII une el TGFβ y ya está activo; fosforila el dominio GS del RI. RIII solo presenta el ligando." },
  { id: "m2.3-10", t: "2.3", q: "Las R-Smad de la vía de las BMP son:", o: ["Smad2 y 3", "Smad1, 5 y 8", "Smad4", "Smad6 y 7"], c: 1, e: "La vía TGFβ/activina usa Smad2/3; Smad4 es la Co-Smad; Smad6/7 son I-Smad." },
  { id: "m2.3-11", t: "2.3", q: "La inhibina bloquea la señal de la activina porque:", o: ["Fosforila a las I-Smad", "Se une a RII (β) y al betaglicano (α), e impide que entre el RI", "Es un factor de transcripción que reprime FSH", "Degrada la activina"], c: 1, e: "Antagonista funcional en la membrana. El KO de inhibina produce tumores en las gónadas." },
  { id: "m2.3-12", t: "2.3", q: "Ski reprime la transcripción de PAI-1 porque:", o: ["Defosforila Smad3", "Recluta N-CoR, mSin3A y HDAC", "Ubiquitina el receptor", "Compite con TFE3 por el CACGTG"], c: 1, e: "Correpresor inducido por TGFβ (feedback negativo) → desacetilación de histonas." },
  { id: "m2.4-01", t: "2.4", q: "La subunidad γ de la proteína G heterotrimérica se ancla a la membrana por:", o: ["Miristoilación del N-terminal", "Isoprenilación del C-terminal", "Un dominio transmembrana", "Unión a β"], c: 1, e: "La α se ancla por acilación (palmítico o mirístico)." },
  { id: "m2.4-02", t: "2.4", q: "En la activación de la proteína G, el GPCR actúa como:", o: ["GAP", "GEF", "Efector", "Quinasa"], c: 1, e: "Provoca la salida de GDP y la entrada de GTP en Gα." },
  { id: "m2.4-03", t: "2.4", q: "La toxina colérica:", o: ["ADP-ribosila Gαi y la inactiva", "ADP-ribosila Gαs y la deja activa con GTP", "Inhibe la adenilato ciclasa", "Activa RGS"], c: 1, e: "La pertussis ADP-ribosila Gαi y la deja inactiva." },
  { id: "m2.4-04", t: "2.4", q: "La Gα que activa la fosfolipasa C es:", o: ["Gαs", "Gαi", "Gαq", "Gαt"], c: 2, e: "Gαt (transducina) activa la fosfodiesterasa de GMPc." },
  { id: "m2.4-05", t: "2.4", q: "En el corazón, la acetilcolina por receptor muscarínico abre canales de K⁺ mediante:", o: ["Gαs", "La subunidad βγ", "El AMPc", "La PKA"], c: 1, e: "Sale K⁺ y la membrana se hiperpolariza." },
  { id: "m2.4-06", t: "2.4", q: "Las proteínas RGS:", o: ["Son GEF de Gα", "Actúan como GAP y aceleran la inactivación de Gα", "Fosforilan el GPCR", "Son receptores huérfanos"], c: 1, e: "Abundan en neuronas." },
  { id: "m2.4-07", t: "2.4", q: "La desensibilización homóloga de un GPCR la produce:", o: ["PKA", "PKC", "GRK (ej. βARK)", "Calcineurina"], c: 2, e: "PKA y PKC producen la heteróloga." },
  { id: "m2.4-08", t: "2.4", q: "La β-arrestina:", o: ["Activa la proteína G", "Se une al receptor fosforilado, lo desacopla y recluta AP2/clatrina", "Es una GRK", "Hidroliza GTP"], c: 1, e: "Lleva a la endocitosis: degradación o reciclaje (resensibilización)." },
  { id: "m2.4-09", t: "2.4", q: "Un GPCR activado por proteólisis de su propio N-terminal es el de:", o: ["Adrenalina", "Trombina", "LH", "Glutamato"], c: 1, e: "El nuevo extremo amino actúa como ligando." },
  { id: "m2.4-10", t: "2.4", q: "La toxina pertussis provoca un aumento del AMPc porque:", o: ["Activa Gαs", "Activa la adenilil ciclasa directamente", "Impide que el receptor active Gαi, y la AC pierde su inhibición", "Inhibe la fosfodiesterasa"], c: 2, e: "Gαi queda bloqueada con GDP: el freno de la AC deja de funcionar." },
  { id: "m2.4-11", t: "2.4", q: "El receptor α₁-adrenérgico se acopla a:", o: ["Gαs", "Gαi", "Gαq", "Gαt"], c: 2, e: "α₁ → Gq (PLC, IP₃/DAG); α₂ → Gi; β → Gs." },
  { id: "m2.4-12", t: "2.4", q: "En el receptor muscarínico cardíaco, ¿qué abre los canales de K⁺?", o: ["Gαi-GTP", "Gβγ", "Gαs", "El AMPc"], c: 1, e: "Gβγ, liberada al activarse Gi → salida de K⁺ → hiperpolarización." },
  { id: "m2.4-13", t: "2.4", q: "La desensibilización heteróloga la producen:", o: ["Las GRK", "PKA y PKC", "La β-arrestina", "Las RGS"], c: 1, e: "PKA/PKC fosforilan también receptores no ocupados (otros receptores). Las GRK solo fosforilan el receptor ocupado (homóloga)." },
  { id: "m2.4-14", t: "2.4", q: "En el experimento con isoproterenol, al aumentar el tiempo de preincubación:", o: ["Aumenta la actividad máxima de la AC", "Disminuye la actividad máxima de la AC (desensibilización)", "La EC50 baja 100 veces", "Desaparece la actividad basal"], c: 1, e: "0 min → 100 %; 10 min → ~80 %; 160 min → ~60 %. La basal (~20 %) no cambia." },
  { id: "m2.4-15", t: "2.4", q: "Las RGS:", o: ["Son GEF de Gα", "Se unen a Gα y aceleran su GTPasa (actúan como GAP)", "Fosforilan el C-terminal del GPCR", "Son E3 ligasas"], c: 1, e: "Abundan en neuronas: protegen frente a estímulos constantes (neurotransmisores, luz)." },
  { id: "m2.5-01", t: "2.5", q: "La guanilato ciclasa que activa el NO es:", o: ["La de membrana (homodímero)", "La soluble (heterodímero con hemo)", "La adenilato ciclasa", "La PKG"], c: 1, e: "La de membrana la activan ANP y BNP." },
  { id: "m2.5-02", t: "2.5", q: "La PKA inactiva tiene la estructura:", o: ["Homodímero con dominios en la misma cadena", "R2C2", "Monómero", "Tetrámero de subunidades catalíticas"], c: 1, e: "La PKG es la que tiene regulador y catalítico en la misma cadena." },
  { id: "m2.5-03", t: "2.5", q: "¿Cuántas moléculas de AMPc hacen falta para activar una PKA?", o: ["1", "2", "4", "8"], c: 2, e: "2 por cada subunidad reguladora." },
  { id: "m2.5-04", t: "2.5", q: "La PKA activa CREB fosforilando:", o: ["Ser-133", "Ser-117", "Thr-308", "Tyr-185"], c: 0, e: "Ser-117 es la de CREM; T308 la de AKT; Y185 la de ERK." },
  { id: "m2.5-05", t: "2.5", q: "ICER actúa como represor porque:", o: ["No se une al DNA", "Se une al DNA pero no tiene dominio de activación (Q1/Q2)", "Es una fosfatasa", "Degrada AMPc"], c: 1, e: "No puede activarse por fosforilación." },
  { id: "m2.5-06", t: "2.5", q: "EPAC es:", o: ["Una subunidad de PKA", "Un GEF activado por AMPc que activa Rap1/2", "Una fosfodiesterasa", "Un canal de K⁺"], c: 1, e: "Es la tercera diana del AMPc, junto con PKA y canales." },
  { id: "m2.5-07", t: "2.5", q: "La Viagra:", o: ["Activa la guanilato ciclasa", "Inhibe la PDE5", "Activa la PDE5", "Inhibe la PKG"], c: 1, e: "El GMPc se mantiene alto y el músculo liso sigue relajado." },
  { id: "m2.5-08", t: "2.5", q: "¿Qué fosfodiesterasa se estimula por Ca²⁺/calmodulina?", o: ["PDE1", "PDE2", "PDE3", "PDE5"], c: 0, e: "PDE2: estimulada por GMPc; PDE3: inhibida por GMPc; PDE5: activada por GMPc." },
  { id: "m2.5-09", t: "2.5", q: "El ANP se secreta en:", o: ["La corteza suprarrenal", "Los cardiomiocitos cuando aumenta el volumen sanguíneo", "El riñón", "El endotelio por acción del NO"], c: 1, e: "Disminuye la aldosterona y la presión, y aumenta la excreción de Na⁺." },
  { id: "m2.5-10", t: "2.5", q: "¿Cuál NO es un mecanismo de relajación del músculo liso por la PKG?", o: ["Abrir canales de K⁺", "Fosforilar el receptor de IP3", "Activar la MLC fosfatasa", "Activar la adenilato ciclasa"], c: 3, e: "Las tres primeras reducen el Ca²⁺ o desfosforilan la miosina." },
  { id: "m2.5-11", t: "2.5", q: "ICER se produce a partir de:", o: ["Splicing alternativo de CREB", "El promotor interno P2 del gen CREM, inducido por AMPc", "El promotor P1 de CREM", "Proteólisis de CREB"], c: 1, e: "P1 no responde al AMPc; P2 sí y da las isoformas represoras ICER (solo bZIP)." },
  { id: "m2.5-12", t: "2.5", q: "La PDE4 es:", o: ["Específica de GMPc", "Específica de AMPc e insensible a GMPc", "Estimulada por Ca²⁺/CaM", "Inhibida por GMPc"], c: 1, e: "Km AMPc 4 µM vs GMPc >3000 µM." },
  { id: "m2.5-13", t: "2.5", q: "Al aumentar el GMPc, el AMPc puede bajar porque:", o: ["El GMPc inhibe la AC", "El GMPc activa la PDE2", "El GMPc activa la PDE3", "El GMPc activa la PKA"], c: 1, e: "PDE2 estimulada por GMPc degrada AMPc. Inhibir la PDE3 tendría el efecto contrario (↑AMPc)." },
  { id: "m2.5-14", t: "2.5", q: "La PKG relaja el músculo liso porque:", o: ["Activa el canal de Ca²⁺ tipo L", "Inhibe el IP3R, abre canales de K⁺ y activa la MLC-fosfatasa", "Fosforila la MLC", "Activa la PDE5"], c: 1, e: "↓ Ca²⁺ intracelular y defosforilación de la MLC → relajación." },
  { id: "m2.6-01", t: "2.6", q: "La fosfolipasa que genera DAG e IP3 a partir de PIP₂ es:", o: ["A1", "A2", "C", "D"], c: 2, e: "La A2 libera ácido araquidónico." },
  { id: "m2.6-02", t: "2.6", q: "La PLCβ se activa principalmente por:", o: ["RTK vía SH2", "Gαq", "Ca²⁺ exclusivamente", "Ras"], c: 1, e: "La PLCγ se une a RTK con su SH2." },
  { id: "m2.6-03", t: "2.6", q: "Las PKC nuevas (nPKC) se activan por:", o: ["DAG y Ca²⁺", "Solo DAG", "Solo Ca²⁺", "Ni DAG ni Ca²⁺"], c: 1, e: "Clásicas: DAG + Ca²⁺; atípicas: ninguno." },
  { id: "m2.6-04", t: "2.6", q: "La quinasa que preactiva la PKC fosforilando su activation loop es:", o: ["PDK1", "PKA", "CaMK II", "mTORC2"], c: 0, e: "Después la PKC se autofosforila en el C-terminal." },
  { id: "m2.6-05", t: "2.6", q: "La concentración de Ca²⁺ en el RE es aproximadamente:", o: ["0,1 µM", "2 µM", "400 µM", "1–2 mM"], c: 2, e: "0,1 µM en el citosol en reposo; 1–2 mM fuera de la célula." },
  { id: "m2.6-06", t: "2.6", q: "El receptor de rianodina:", o: ["Se abre con IP3", "Responde a Ca²⁺ y se abre con cafeína", "Está en la membrana plasmática", "Es un monómero"], c: 1, e: "Es un homotetrámero del RE y del retículo sarcoplásmico." },
  { id: "m2.6-07", t: "2.6", q: "La proteína del RE que detecta su vaciado y abre los canales SOC es:", o: ["Calmodulina", "STIM", "SERCA", "Calsecuestrina"], c: 1, e: "Forma clústeres que interaccionan con los SOC." },
  { id: "m2.6-08", t: "2.6", q: "La bomba que recapta Ca²⁺ al RE es:", o: ["PMCA", "SERCA", "Intercambiador Na⁺/Ca²⁺", "IP3R"], c: 1, e: "PMCA y el intercambiador sacan Ca²⁺ al exterior." },
  { id: "m2.6-09", t: "2.6", q: "La calmodulina une:", o: ["1 Ca²⁺", "2 Ca²⁺", "4 Ca²⁺", "6 Ca²⁺"], c: 2, e: "2 en el extremo N y 2 en el C." },
  { id: "m2.6-10", t: "2.6", q: "La ciclosporina A es inmunosupresora porque inhibe:", o: ["La PKC", "La calcineurina", "La CaMK II", "La NO sintasa"], c: 1, e: "Sin calcineurina, NF-AT no se desfosforila y no se activan genes inmunes." },
  { id: "m2.6-11", t: "2.6", q: "El Ca²⁺ que llega a la mitocondria (~80 µM) procede sobre todo de:", o: ["El citosol", "El exterior por canales de voltaje", "El RE, en microdominios cercanos", "El Golgi"], c: 2, e: "Las mitofusinas acercan RE y mitocondria; el citosol solo llega a ~2 µM." },
  { id: "m2.6-12", t: "2.6", q: "El IP3R se vuelve menos sensible al IP3 cuando el Ca²⁺ citosólico es:", o: ["Bajo (µM)", "Alto (mM)", "Nulo", "Igual al del RE"], c: 1, e: "Con Ca²⁺ bajo aumenta la sensibilidad y favorece la salida." },
  { id: "m2.6-13", t: "2.6", q: "La tapsigargina produce entrada de Ca²⁺ desde el exterior porque:", o: ["Activa la SERCA", "Inhibe la SERCA, se vacía el RE y se abren los SOC", "Es un agonista del IP3R", "Abre canales de voltaje"], c: 1, e: "Vaciado del RE → STIM pierde el Ca²⁺ → clusters → abre el SOC (Orai)." },
  { id: "m2.6-14", t: "2.6", q: "Las PKC nuevas (nPKC) se activan por:", o: ["DAG y Ca²⁺", "Solo DAG", "Solo Ca²⁺", "Ni DAG ni Ca²⁺"], c: 1, e: "Clásicas (α, βI, βII, γ): DAG + Ca²⁺. Nuevas (δ, ε, η, θ): solo DAG. Atípicas (ζ, λ/ι): ninguno." },
  { id: "m2.6-15", t: "2.6", q: "El receptor de rianodina (RyR):", o: ["Se abre por IP₃", "Se abre por Ca²⁺ citoplasmático y por cafeína", "Es una ATPasa", "Es un heterodímero"], c: 1, e: "Homotetrámero, 3 tipos, RE y retículo sarcoplásmico; no responde al IP₃." },
  { id: "m2.6-16", t: "2.6", q: "La aequorina, frente a FURA:", o: ["Es fluorescente", "Es una proteína luminiscente que se puede dirigir a orgánulos por transfección", "Atraviesa la membrana por ser lipofílica", "Solo mide el Ca²⁺ extracelular"], c: 1, e: "Se transfecta un plásmido con señales de destino: mitocondria, RE, núcleo, citosol." },
  { id: "m2.6-17", t: "2.6", q: "La PLD produce:", o: ["DAG", "IP₃", "Ácido fosfatídico (PA)", "Ácido araquidónico"], c: 2, e: "Corta entre el fosfato y el grupo polar; el fosfato se queda en la membrana como PA." },
  { id: "m2.6-18", t: "2.6", q: "La [Ca²⁺] en el RE (400 µM) respecto al citosol en reposo (0,1 µM) es:", o: ["40 veces mayor", "400 veces mayor", "4000 veces mayor", "10⁴ veces mayor"], c: 2, e: "400 / 0,1 = 4000. El exterior (1 mM) es 10⁴ veces el citosol." },
];

</script>
<script>
(function () {
  const EXAM_DAY = "2026-11-16";
  const PLAN = [
    ["2026-11-04", "1.1 diapositiva a diapositiva"],
    ["2026-11-06", "1.2 Interacción hormona-receptor"],
    ["2026-11-09", "1.3 Regulación"],
    ["2026-11-11", "2.1 Receptores nucleares + 2.2 TK"],
    ["2026-11-13", "2.3 Ser/Thr + 2.4 GPCRs"],
    ["2026-11-14", "2.5 AMPc/GMPc + 2.6 Fosfolípidos y Ca²⁺ (fin del temario)", true],
    ["2026-11-15", "Repaso: c-Src, c-Jun, genes early/late + tarjetas pendientes + simulacro"],
    ["2026-11-16", "Examen", true]
  ];
  const INTERVALS = [0, 1, 2, 4, 7, 12]; // días por caja
  const KEY = "endo-srs-v1";

  const TEMAS = window.TEMAS, CARDS = window.CARDS, MCQ = window.MCQ;
  const byId = Object.fromEntries(CARDS.map(c => [c.id, c]));
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));

  function dayKey(d) { const z = n => String(n).padStart(2, "0"); return d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate()); }
  function dayNum(k) { const [y, m, d] = k.split("-").map(Number); return Math.round(Date.UTC(y, m - 1, d) / 864e5); }
  const TODAY = dayKey(new Date());
  const T = dayNum(TODAY);
  function fmtDay(k) { const [y, m, d] = k.split("-").map(Number); const dt = new Date(y, m - 1, d); return dt.toLocaleDateString("es-ES", { weekday: "short", day: "numeric", month: "short" }); }

  // ---------- estado ----------
  let S = { cards: {}, exams: [] };
  try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
  let dbRef = null, writing = false, dirty = false, timer = null;
  function setSync(t) { $("#sync").textContent = t; }

  function merge(remote) {
    const out = { cards: Object.assign({}, remote.cards || {}), exams: remote.exams || [] };
    for (const [id, st] of Object.entries(S.cards)) {
      const r = out.cards[id];
      if (!r || (st.ts || 0) > (r.ts || 0)) out.cards[id] = st;
    }
    const seen = new Set(out.exams.map(e => e.ts));
    for (const e of S.exams) if (!seen.has(e.ts)) out.exams.push(e);
    out.exams.sort((a, b) => a.ts - b.ts);
    out.exams = out.exams.slice(-20);
    return out;
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
    if (!dbRef) return;
    dirty = true;
    clearTimeout(timer);
    timer = setTimeout(flush, 1500);
  }
  async function flush() {
    if (!dbRef || writing || !dirty) return;
    writing = true; dirty = false;
    try { await dbRef.set(JSON.parse(JSON.stringify(S))); setSync("Progreso guardado en tu cuenta: lo verás igual en el móvil y en el iPad."); }
    catch (e) { setSync("No se pudo guardar en tu cuenta; sigue guardado en este navegador."); }
    writing = false;
    if (dirty) flush();
  }
  async function connect() {
    try {
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) { setSync("Progreso guardado solo en este navegador."); return; }
      const uid = await user.id();
      if (!uid) { setSync("Progreso guardado solo en este navegador."); return; }
      const ref = db.doc("data/users/" + uid + "/srs");
      const snap = await ref.get();
      if (snap.exists) { S = merge(snap.data()); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
      dbRef = ref;
      setSync("Progreso guardado en tu cuenta: lo verás igual en el móvil y en el iPad.");
      if (!snap.exists && Object.keys(S.cards).length) { dirty = true; flush(); }
      render();
    } catch (e) { setSync("Progreso guardado solo en este navegador."); }
  }
  window.addEventListener("pagehide", () => { if (dirty) flush(); });
  document.addEventListener("visibilitychange", () => { if (document.hidden && dirty) flush(); });

  // ---------- helpers SRS ----------
  function st(id) { return S.cards[id]; }
  function isDue(id) { const s = st(id); return s && s.d <= T; }
  function temaStats(t) {
    const cs = CARDS.filter(c => c.t === t);
    let nuevas = 0, due = 0, dom = 0;
    for (const c of cs) { const s = st(c.id); if (!s) nuevas++; else { if (s.d <= T) due++; if (s.b >= 3) dom++; } }
    return { total: cs.length, nuevas, due, dom, mcq: MCQ.filter(m => m.t === t).length };
  }
  function rateCard(id, r) {
    const s = st(id) || { b: 0, d: T, n: 0, l: 0 };
    if (r === 0) { s.b = 0; s.d = T; s.l = (s.l || 0) + 1; }
    else if (r === 1) { s.b = Math.max(1, Math.min(s.b, 2)); s.d = T + INTERVALS[s.b]; }
    else { s.b = Math.min(5, s.b + 1); s.d = T + INTERVALS[s.b]; }
    s.n = (s.n || 0) + 1; s.ts = Date.now();
    S.cards[id] = s; save();
  }

  // ---------- selección de temas ----------
  let sel = new Set();
  try { const r = localStorage.getItem(KEY + "-sel"); if (r) sel = new Set(JSON.parse(r)); } catch (e) {}
  const available = TEMAS.filter(t => CARDS.some(c => c.t === t.id));
  if (!sel.size) available.forEach(t => sel.add(t.id));
  function saveSel() { try { localStorage.setItem(KEY + "-sel", JSON.stringify([...sel])); } catch (e) {} }

  function temaChips(kind) {
    return '<div class="temas">' + TEMAS.map(t => {
      const s = temaStats(t.id); const has = kind === "exam" ? s.mcq > 0 : s.total > 0;
      const on = has && sel.has(t.id);
      const meta = !has ? "aún no hay tarjetas" : kind === "exam" ? s.mcq + " preguntas" :
        s.total + " tarjetas · " + (s.due + s.nuevas) + " para hoy";
      const pct = s.total ? Math.round(100 * s.dom / s.total) : 0;
      return '<label class="chip ' + (on ? "on" : "") + (has ? "" : " off") + '">' +
        '<input type="checkbox" id="chk-' + kind + "-" + t.id + '" data-t="' + t.id + '"' + (on ? " checked" : "") + (has ? "" : " disabled") + '>' +
        '<span style="min-width:0;flex:1"><span class="name">' + t.id + " " + esc(t.nombre) + '</span><br><span class="meta">' + meta + "</span>" +
        (has && kind !== "exam" ? '<span class="bar" title="dominadas"><i style="width:' + pct + '%"></i></span>' : "") + "</span></label>";
    }).join("") + "</div>";
  }
  function bindChips(root) {
    root.querySelectorAll(".chip input").forEach(i => i.addEventListener("change", () => {
      i.checked ? sel.add(i.dataset.t) : sel.delete(i.dataset.t); saveSel(); render();
    }));
  }

  // ---------- vista repasar ----------
  let session = null;
  function buildQueue() {
    const due = [], nuevas = [];
    for (const c of CARDS) {
      if (!sel.has(c.t)) continue;
      const s = st(c.id);
      if (!s) nuevas.push(c.id); else if (s.d <= T) due.push(c.id);
    }
    due.sort((a, b) => (st(a).b - st(b).b) || (st(a).d - st(b).d));
    return due.concat(nuevas);
  }
  function renderStudy() {
    const v = $("#v-study");
    if (session) return renderCard(v);
    const today = PLAN.find(p => p[0] === TODAY);
    const q = buildQueue();
    let tot = 0, dom = 0;
    for (const t of available) { const s = temaStats(t.id); tot += s.total; dom += s.dom; }
    v.innerHTML =
      (today ? '<div class="today"><span class="eyebrow">Hoy, ' + fmtDay(TODAY) + '</span><strong>' + esc(today[1]) + "</strong></div>" : "") +
      '<div class="stats" style="margin-top:16px"><div class="stat"><b>' + q.length + '</b><span>para hoy en lo elegido</span></div>' +
      '<div class="stat"><b>' + dom + "/" + tot + '</b><span>tarjetas dominadas</span></div></div>' +
      '<h2 style="margin-top:18px">Temas</h2><p class="small muted" style="margin:4px 0 10px">Marca los que quieras repasar. Primero salen las que tocan hoy y luego las nuevas.</p>' +
      temaChips("study") +
      '<div style="margin-top:16px"><button class="btn big" id="start"' + (q.length ? "" : " disabled") + ">" +
      (q.length ? "Empezar (" + q.length + " tarjetas)" : "Nada pendiente hoy en estos temas") + "</button></div>" +
      '<p class="small muted" style="margin-top:12px">Atajos: espacio para dar la vuelta; 1, 2, 3 para valorar.</p>';
    bindChips(v);
    const b = $("#start"); if (b) b.onclick = () => { session = { q, i: 0, flipped: false, done: 0, ok: 0 }; render(); };
  }
  function renderCard(v) {
    if (session.i >= session.q.length) {
      v.innerHTML = '<div class="card" style="align-items:center;justify-content:center;text-align:center"><h2>Sesión terminada</h2>' +
        '<p class="muted">' + session.done + " valoraciones · " + session.ok + " a la primera.</p>" +
        '<button class="btn" id="back">Volver a temas</button></div>';
      $("#back").onclick = () => { session = null; render(); };
      return;
    }
    const c = byId[session.q[session.i]]; const s = st(c.id);
    const tema = TEMAS.find(t => t.id === c.t);
    v.innerHTML =
      '<div class="progress"><span>' + (session.i + 1) + " / " + session.q.length + '</span><button class="btn ghost" id="quit" style="padding:4px 12px;font-size:.85rem">Salir</button></div>' +
      '<div class="card" id="card" style="margin-top:10px"><div class="tag"><span class="pill">' + c.t + " · " + esc(tema.nombre) + "</span>" +
      (!s ? '<span class="pill new">Nueva</span>' : "") + (c.x ? '<span class="pill ex">EXAMEN</span>' : "") + "</div>" +
      '<div class="q">' + c.q + "</div>" +
      (session.flipped ? '<div class="a">' + c.a + "</div>" + (c.n ? '<div class="note' + (/^Aviso de clase/.test(c.n) ? " ex" : "") + '">' + esc(c.n) + "</div>" : "") : "") +
      "</div>" +
      (session.flipped
        ? '<div class="rate" style="margin-top:10px"><button class="r0" data-r="0">No la sabía<small>vuelve en esta sesión</small></button>' +
          '<button class="r1" data-r="1">Dudé<small>mañana</small></button>' +
          '<button class="r2" data-r="2">La sabía<small>en ' + INTERVALS[Math.min(5, (s ? s.b : 0) + 1)] + " d</small></button></div>"
        : '<button class="btn big" id="flip" style="margin-top:10px">Mostrar respuesta</button>');
    $("#quit").onclick = () => { session = null; render(); };
    const f = $("#flip"); if (f) f.onclick = flip;
    v.querySelectorAll(".rate button").forEach(b => b.onclick = () => rate(+b.dataset.r));
  }
  function flip() { if (session && !session.flipped) { session.flipped = true; render(); } }
  function rate(r) {
    if (!session || !session.flipped) return;
    const id = session.q[session.i];
    const first = !session.retried || !session.retried[id];
    rateCard(id, r); session.done++;
    if (r === 2 && first) session.ok++;
    if (r === 0) { session.retried = session.retried || {}; session.retried[id] = 1; session.q.splice(Math.min(session.q.length, session.i + 4), 0, id); }
    session.i++; session.flipped = false; render();
  }

  // ---------- modo examen ----------
  let exam = null, tick = null;
  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function renderExam() {
    const v = $("#v-exam");
    if (exam && !exam.end) return renderQ(v);
    if (exam && exam.end) return renderResult(v);
    const pool = MCQ.filter(m => sel.has(m.t));
    const n = Math.min(30, pool.length);
    const secs = n * 30;
    const last = S.exams.slice(-5).reverse();
    v.innerHTML =
      '<h2>Simulacro tipo test</h2><p class="muted" style="margin:6px 0 12px">Como el examen real: 30 preguntas y 15 minutos, unos 30 segundos por pregunta. Con menos preguntas disponibles, el tiempo se ajusta a 30 s por pregunta.</p>' +
      temaChips("exam") +
      '<div style="margin-top:16px"><button class="btn big" id="go"' + (n ? "" : " disabled") + ">Empezar: " + n + " preguntas · " + Math.round(secs / 60 * 10) / 10 + " min</button></div>" +
      (pool.length < 30 && pool.length ? '<p class="small muted" style="margin-top:8px">Hay ' + pool.length + " preguntas en los temas elegidos. Iré añadiendo más con cada tema.</p>" : "") +
      (last.length ? '<h2 style="margin-top:20px">Últimos simulacros</h2><div class="plan" style="margin-top:8px">' + last.map(e =>
        '<div><span class="d">' + fmtDay(e.day) + "</span><span>" + e.ok + "/" + e.n + " aciertos · nota " + e.nota.toFixed(1) + " (con penalización " + e.notaP.toFixed(1) + ")</span></div>").join("") + "</div>" : "");
    bindChips(v);
    const g = $("#go"); if (g) g.onclick = () => {
      const qs = shuffle(pool).slice(0, n).map(m => { const order = shuffle(m.o.map((_, i) => i)); return { m, order, ans: null }; });
      exam = { qs, i: 0, limit: secs, start: Date.now(), end: null, qStart: Date.now() };
      clearInterval(tick); tick = setInterval(examTick, 250); render();
    };
  }
  function left() { return Math.max(0, exam.limit - (Date.now() - exam.start) / 1000); }
  function fmt(s) { s = Math.ceil(s); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
  function examTick() {
    if (!exam || exam.end) { clearInterval(tick); return; }
    if (left() <= 0) return finish();
    const c = $("#clock"); if (c) { c.textContent = fmt(left()); c.classList.toggle("low", left() < 60); }
    const p = $("#pace"); if (p) { const e = (Date.now() - exam.qStart) / 1000; p.style.width = Math.min(100, e / 30 * 100) + "%"; }
  }
  function renderQ(v) {
    const it = exam.qs[exam.i];
    v.innerHTML =
      '<div class="timer"><span class="muted">Pregunta ' + (exam.i + 1) + " de " + exam.qs.length + '</span><span class="clock" id="clock">' + fmt(left()) + "</span></div>" +
      '<div class="pace" title="30 segundos por pregunta"><i id="pace" style="width:0"></i></div>' +
      '<div class="card" style="margin-top:12px;min-height:0"><div class="tag"><span class="pill">' + it.m.t + '</span></div><div class="q">' + esc(it.m.q) + "</div>" +
      '<div class="opts">' + it.order.map((oi, k) => '<button class="opt' + (it.ans === oi ? " sel" : "") + '" data-o="' + oi + '"><span class="k">' + "abcd"[k] + ")</span><span>" + esc(it.m.o[oi]) + "</span></button>").join("") + "</div></div>" +
      '<div style="margin-top:12px;display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px">' +
      '<button class="btn ghost" id="prev"' + (exam.i ? "" : " disabled") + ">Anterior</button>" +
      '<button class="btn ghost" id="blank">Dejar en blanco</button>' +
      '<button class="btn" id="next">' + (exam.i === exam.qs.length - 1 ? "Entregar" : "Siguiente") + "</button></div>";
    v.querySelectorAll(".opt").forEach(b => b.onclick = () => { it.ans = +b.dataset.o; advance(); });
    $("#prev").onclick = () => { exam.i--; exam.qStart = Date.now(); render(); };
    $("#blank").onclick = () => { it.ans = null; advance(); };
    $("#next").onclick = advance;
    examTick();
  }
  function advance() { if (exam.i < exam.qs.length - 1) { exam.i++; exam.qStart = Date.now(); render(); } else finish(); }
  function finish() {
    clearInterval(tick);
    exam.end = Date.now();
    let ok = 0, ko = 0;
    for (const it of exam.qs) { if (it.ans === null) continue; it.ans === it.m.c ? ok++ : ko++; }
    const n = exam.qs.length;
    exam.res = { ok, ko, na: n - ok - ko, n, nota: 10 * ok / n, notaP: Math.max(0, 10 * (ok - ko / 3) / n), secs: Math.round((exam.end - exam.start) / 1000) };
    S.exams.push({ ts: Date.now(), day: TODAY, n, ok, ko, nota: exam.res.nota, notaP: exam.res.notaP, temas: [...new Set(exam.qs.map(i => i.m.t))] });
    S.exams = S.exams.slice(-20); save(); render();
  }
  function renderResult(v) {
    const r = exam.res;
    v.innerHTML = '<h2>Resultado</h2>' +
      '<div class="score" style="margin-top:10px"><div><b>' + r.ok + "/" + r.n + '</b><span class="small muted">aciertos</span></div>' +
      '<div><b>' + r.nota.toFixed(1) + '</b><span class="small muted">nota sin penalización</span></div>' +
      '<div><b>' + r.notaP.toFixed(1) + '</b><span class="small muted">si cada fallo resta 1/3</span></div>' +
      '<div><b class="mono">' + fmt(r.secs) + '</b><span class="small muted">tiempo usado</span></div></div>' +
      '<div class="row" style="margin-top:14px"><button class="btn" id="again">Otro simulacro</button></div>' +
      '<h2 style="margin-top:20px">Revisión</h2><div class="review" style="margin-top:8px">' +
      exam.qs.map((it, k) => {
        const s = it.ans === null ? "na" : it.ans === it.m.c ? "ok" : "ko";
        return '<div class="item"><span class="st ' + s + '">' + (k + 1) + ". " + (s === "ok" ? "ACIERTO" : s === "ko" ? "FALLO" : "EN BLANCO") + " · " + it.m.t + "</span>" +
          "<strong>" + esc(it.m.q) + "</strong>" +
          (s === "ko" ? '<span class="small" style="color:var(--bad)">Tu respuesta: ' + esc(it.m.o[it.ans]) + "</span>" : "") +
          '<span class="small" style="color:var(--good)">Correcta: ' + esc(it.m.o[it.m.c]) + "</span>" +
          '<span class="small muted">' + esc(it.m.e) + "</span></div>";
      }).join("") + "</div>";
    $("#again").onclick = () => { exam = null; render(); };
  }

  // ---------- plan ----------
  function renderPlan() {
    $("#v-plan").innerHTML = '<h2>Plan hasta el examen</h2><p class="muted" style="margin:6px 0 12px">Temario acabado el sábado 14; el domingo 15, repaso y simulacro. Las tarjetas de todos los temas ya están disponibles. Cada día de tema nuevo: mapa rápido (20–30 min), tarjetas del tema y repaso de lo pendiente.</p>' +
      '<div class="plan">' + PLAN.map(([d, txt, key]) => {
        const cls = d === TODAY ? "now" : dayNum(d) < T ? "past" : "";
        return '<div class="' + cls + '"><span class="d">' + fmtDay(d) + '</span><span class="' + (key ? "key" : "") + '">' + esc(txt) + "</span></div>";
      }).join("") + "</div>";
  }

  // ---------- general ----------
  let view = "study";
  function render() {
    const dd = dayNum(EXAM_DAY) - T; $("#days").textContent = dd >= 0 ? dd : "—";
    ["study", "exam", "plan"].forEach(k => { $("#v-" + k).hidden = k !== view; $("#tab-" + k).setAttribute("aria-selected", k === view); });
    if (view === "study") renderStudy(); else if (view === "exam") renderExam(); else renderPlan();
  }
  document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => { view = b.dataset.view; render(); });
  document.addEventListener("keydown", e => {
    if (e.target.closest && e.target.closest("input")) return;
    if (view === "study" && session) {
      if (e.code === "Space" && !session.flipped) { e.preventDefault(); flip(); }
      else if (["1", "2", "3"].includes(e.key) && session.flipped) rate(+e.key - 1);
    } else if (view === "exam" && exam && !exam.end) {
      const k = "abcd".indexOf(e.key.toLowerCase());
      if (k >= 0) { const it = exam.qs[exam.i]; if (it.order[k] !== undefined) { it.ans = it.order[k]; advance(); } }
    }
  });
  render();
  if (window.claude && window.claude.use) connect(); else setSync("Progreso guardado solo en este navegador.");
})();
</script>
