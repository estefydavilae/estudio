<style>
/* Layout: one narrow column, like a stack of index cards on a bench. Palette borrowed from H&E staining: hematoxylin blue-violet + eosin pink. */
:root {
  --bg: #F3F4F1;
  --surface: #FFFFFF;
  --ink: #1A2230;
  --muted: #5D6674;
  --line: #D9DCD6;
  --hema: #3A4796;
  --hema-soft: #E4E7F5;
  --eosin: #B3336A;
  --eosin-soft: #F8E3EC;
  --good: #23784F;
  --good-soft: #DFF1E7;
  --warn: #A3640B;
  --warn-soft: #FBEFD9;
  --bad: #B3332E;
  --bad-soft: #F8E1DF;
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12151B; --surface: #1B2029; --ink: #E8EAEE; --muted: #9AA2AF; --line: #2D3440;
  --hema: #9AA6F0; --hema-soft: #262C48; --eosin: #EE7EAA; --eosin-soft: #3A2030;
  --good: #6FCF9C; --good-soft: #1C3328; --warn: #E8B05A; --warn-soft: #3A2D17; --bad: #F08A84; --bad-soft: #3B2020;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #12151B; --surface: #1B2029; --ink: #E8EAEE; --muted: #9AA2AF; --line: #2D3440;
  --hema: #9AA6F0; --hema-soft: #262C48; --eosin: #EE7EAA; --eosin-soft: #3A2030;
  --good: #6FCF9C; --good-soft: #1C3328; --warn: #E8B05A; --warn-soft: #3A2D17; --bad: #F08A84; --bad-soft: #3B2020;
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--f-body); }
.wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: 1.6rem; font-weight: 700; }
h2 { font-size: 1.2rem; font-weight: 700; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }

header.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.countdown { display: flex; align-items: baseline; gap: 6px; }
.countdown b { font-family: var(--f-mono); font-size: 1.5rem; color: var(--eosin); line-height: 1; }
.eyebrow { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }

nav.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
nav.tabs button { flex: 1; border: 0; background: transparent; color: var(--muted); font: 700 .95rem var(--f-body); padding: 10px 8px; border-radius: 9px; cursor: pointer; }
nav.tabs button[aria-selected="true"] { background: var(--hema); color: var(--surface); }

button { font-family: var(--f-body); }
button:focus-visible, .chip:focus-within { outline: 3px solid var(--eosin); outline-offset: 2px; }
.btn { border: 0; border-radius: 10px; padding: 12px 18px; font-weight: 700; font-size: 1rem; cursor: pointer; background: var(--hema); color: var(--surface); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.ghost { background: transparent; color: var(--hema); border: 1.5px solid var(--hema); }
.btn.big { width: 100%; padding: 16px; font-size: 1.05rem; }

.today { background: var(--hema-soft); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.today strong { font-family: var(--f-display); font-size: 1.1rem; }

.temas { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.chip { display: flex; gap: 10px; align-items: flex-start; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer; }
.chip input { margin-top: 4px; accent-color: var(--hema); width: 18px; height: 18px; flex: none; }
.chip.on { border-color: var(--hema); }
.chip.off { opacity: .5; cursor: default; }
.chip .name { font-weight: 700; line-height: 1.25; }
.chip .meta { font-size: .78rem; color: var(--muted); font-family: var(--f-mono); }
.bar { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--good); }

.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.stats { display: flex; gap: 18px; flex-wrap: wrap; }
.stat b { font-family: var(--f-mono); font-size: 1.3rem; display: block; }
.stat span { font-size: .78rem; color: var(--muted); }

/* tarjeta */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px 20px; min-height: 260px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 1px 0 var(--line), 0 10px 24px -18px rgba(20,30,60,.35); }
.card .tag { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pill { font-size: .72rem; font-weight: 700; letter-spacing: .04em; padding: 3px 8px; border-radius: 99px; background: var(--hema-soft); color: var(--hema); }
.pill.ex { background: var(--eosin-soft); color: var(--eosin); }
.pill.new { background: var(--warn-soft); color: var(--warn); }
.card .q { font-family: var(--f-display); font-size: 1.3rem; font-weight: 500; line-height: 1.3; }
.card .a { border-top: 1px dashed var(--line); padding-top: 14px; font-size: 1.02rem; }
.card .a b { color: var(--hema); }
.note { background: var(--eosin-soft); color: var(--ink); border-radius: 10px; padding: 10px 12px; font-size: .92rem; }
.note::before { content: "OJO  "; font-weight: 700; color: var(--eosin); letter-spacing: .04em; }
.note.ex::before { content: "EXAMEN  "; }
.rate { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.rate button { border: 0; border-radius: 10px; padding: 14px 6px; font-weight: 700; font-size: .95rem; cursor: pointer; }
.r0 { background: var(--bad-soft); color: var(--bad); }
.r1 { background: var(--warn-soft); color: var(--warn); }
.r2 { background: var(--good-soft); color: var(--good); }
.rate small { display: block; font-weight: 400; font-size: .72rem; opacity: .8; }
.progress { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); }

/* examen */
.timer { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.timer .clock { font-family: var(--f-mono); font-size: 1.6rem; }
.timer .clock.low { color: var(--bad); }
.pace { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.pace i { display: block; height: 100%; background: var(--eosin); transition: width .25s linear; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { text-align: left; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 12px 14px; font-size: 1rem; cursor: pointer; display: flex; gap: 10px; }
.opt .k { font-family: var(--f-mono); color: var(--muted); flex: none; }
.opt.sel { border-color: var(--hema); background: var(--hema-soft); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.score { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.score div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.score b { font-family: var(--f-mono); font-size: 1.5rem; display: block; }
.review { display: flex; flex-direction: column; gap: 10px; }
.review .item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.review .item .st { font-size: .75rem; font-weight: 700; letter-spacing: .05em; }
.st.ok { color: var(--good); } .st.ko { color: var(--bad); } .st.na { color: var(--muted); }

/* plan */
.plan { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.plan div { display: grid; grid-template-columns: 92px 1fr; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line); }
.plan div:first-child { border-top: 0; }
.plan .d { font-family: var(--f-mono); font-size: .85rem; color: var(--muted); }
.plan .now { background: var(--hema-soft); }
.plan .now .d { color: var(--hema); font-weight: 700; }
.plan .key { color: var(--eosin); font-weight: 700; }
.plan .past { color: var(--muted); }

.sync { font-size: .78rem; color: var(--muted); text-align: center; }
.empty { text-align: center; padding: 30px 10px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (max-width: 420px) { .card .q { font-size: 1.15rem; } .rate button { font-size: .88rem; } }
</style>

<div class="wrap">

<script>
// Contenido: tarjetas y preguntas tipo test. Se amplía tema a tema.
window.TEMAS = [
  { id: "1.1", nombre: "Bases de la señalización celular" },
  { id: "1.2", nombre: "Interacción hormona-receptor" },
  { id: "1.3", nombre: "Regulación enzimática y transcripcional" },
  { id: "2.1", nombre: "Receptores nucleares" },
  { id: "2.2", nombre: "Receptores tirosina quinasa" },
  { id: "2.3", nombre: "Receptores Ser/Thr quinasa" },
  { id: "2.4", nombre: "GPCRs" },
  { id: "2.5", nombre: "AMPc y GMPc" },
  { id: "2.6", nombre: "Fosfolípidos y calcio" }
];

// n = nota (corrección o aviso). x = true si la profesora lo marcó para examen.
window.CARDS = [
  // ---------- 1.1 ----------
  { id: "1.1-01", t: "1.1", q: "¿Qué dos tipos de respuesta puede dar una señal y cuánto dura cada una?", a: "<b>Rápida</b> (segundos–minutos): modifica proteínas que ya existen, sobre todo por fosforilación.<br><b>Lenta</b> (minutos–horas): cambia la expresión génica (transcripción, traducción).<br>Si la señal se mantiene, suele dar primero la rápida y luego la lenta." },
  { id: "1.1-02", t: "1.1", q: "Señal hidrofílica vs hidrofóbica: ¿dónde está su receptor?", a: "<b>Hidrofílica</b> (grupos polares –OH, –NH₂; puentes de H con el agua): receptor <b>de membrana</b>.<br><b>Hidrofóbica</b>: atraviesa la membrana; receptor <b>intracelular</b> (citosol o núcleo), que suele actuar como factor de transcripción. En sangre necesita transportador." },
  { id: "1.1-03", t: "1.1", q: "¿Qué puede pasar por una unión gap y qué proteína la forma?", a: "La forman las <b>conexinas</b>.<br>Pasan moléculas pequeñas: iones, Ca²⁺, ATP, segundos mensajeros.<br><b>No</b> pasan proteínas ni ácidos nucleicos." },
  { id: "1.1-04", t: "1.1", q: "Diferencia entre señalización autocrina y paracrina.", a: "<b>Autocrina</b>: la señal actúa sobre la misma célula que la secreta (autorregulación).<br><b>Paracrina</b>: actúa sobre células vecinas." },
  { id: "1.1-05", t: "1.1", q: "Señal endocrina vs sináptica: concentración de la señal y afinidad del receptor.", a: "<b>Endocrina</b>: ~10⁻⁸ M (nanomolar), porque se diluye en sangre → receptores de <b>afinidad muy alta</b>. Lenta, larga distancia.<br><b>Sináptica</b>: ~10⁻⁴ M (micromolar) → receptores de menor afinidad. Rápida, corta distancia.", n: "Las diapositivas dan ~10⁻⁸ M para la hormona en sangre; los apuntes del tema 1.2 dan 10⁻⁹–10⁻¹² M. Ambos son 'nanomolar o menos'." },
  { id: "1.1-06", t: "1.1", q: "Exosomas: tamaño, origen y marcador.", a: "<b>20–100 nm</b>.<br>Origen: cuerpo multivesicular (MVE) que se fusiona con la membrana plasmática.<br>Marcador: <b>tetraspaninas</b> (CD63, TSG101). <b>No</b> están enriquecidos en fosfatidilserina." },
  { id: "1.1-07", t: "1.1", q: "Microvesículas: tamaño, origen y marcador.", a: "<b>100–1000 nm</b>.<br>Origen: protrusiones de la membrana plasmática, empaquetan citosol.<br>Marcador: <b>fosfatidilserina</b>." },
  { id: "1.1-08", t: "1.1", q: "Cuerpos apoptóticos: tamaño, origen y marcador.", a: "<b>1–5 µm</b>.<br>Origen: membrana de una célula que muere por apoptosis.<br>Marcador: <b>fosfatidilserina</b>." },
  { id: "1.1-09", t: "1.1", q: "¿De qué 4 formas entra una vesícula extracelular en la célula diana?", a: "1. Unión específica ligando-receptor.<br>2. Fusión directa con la membrana (algo inespecífica).<br>3. Macropinocitosis / fagocitosis (algo inespecífica).<br>4. Endocitosis por clatrina." },
  { id: "1.1-10", t: "1.1", q: "¿Cómo se aíslan y separan las vesículas extracelulares? ¿Para qué sirven en clínica?", a: "Aislar: <b>ultracentrifugación</b>. Separar por tamaño: <b>gradiente de densidad</b> o <b>citometría de flujo</b>.<br>Sirven como <b>biomarcadores</b> (alteradas en diabetes u obesidad; se ven en orina)." },
  { id: "1.1-11", t: "1.1", q: "Integración de señales: ¿qué decide el destino de la célula? ¿Qué pasa si no recibe ninguna?", a: "El <b>conjunto</b> de señales que recibe (no una sola): unas dan supervivencia, más señales crecimiento, más aún diferenciación.<br>Sin ninguna señal: <b>apoptosis</b>.", x: true, n: "Aviso de clase: siempre hay que estudiar el conjunto de hormonas." },
  { id: "1.1-12", t: "1.1", q: "¿Qué es un morfógeno?", a: "Una señal que actúa sobre la forma del organismo por <b>gradiente de concentración</b>: cuanto más lejos de la fuente, menos concentración y otro destino celular." },
  { id: "1.1-13", t: "1.1", q: "Pasos de síntesis de una hormona peptídica hasta que sale del RE.", a: "1. Ribosoma citosólico → <b>preprohormona</b> con péptido señal (hélice anfipática N-terminal).<br>2. Entra al RE; una peptidasa corta el péptido señal → <b>prohormona</b> (inactiva).<br>3. En el RE: <b>N-glicosilación</b> y <b>puentes disulfuro</b> (PDI).<br>4. RE → Golgi → vesículas → secreción." },
  { id: "1.1-14", t: "1.1", q: "¿Por qué la PDI solo forma puentes disulfuro en el RE?", a: "Porque el <b>citosol es reductor</b>; el lumen del RE es oxidante." },
  { id: "1.1-15", t: "1.1", q: "Insulina: formas de maduración y para qué sirve el péptido C.", a: "Preproinsulina (péptido señal) → proinsulina (inactiva) → insulina + <b>péptido C</b>.<br>El péptido C es estable: sirve para <b>medir la producción</b> de insulina. Gracias a él, las dos cadenas salen de <b>un solo gen</b>." },
  { id: "1.1-16", t: "1.1", q: "ADH y oxitocina: tamaño, dónde se liberan y qué transportador tiene cada una.", a: "Péptidos de <b>9 aa</b> con estructura cíclica. Se liberan en la <b>neurohipófisis</b>.<br>ADH (vasopresina) → <b>neurofisina II</b>.<br>Oxitocina → <b>neurofisina I</b>.<br>Hormona y transportador se sintetizan a la vez.", n: "Los apuntes dicen que la neurohipófisis también secreta GH: no. La GH es de la adenohipófisis." },
  { id: "1.1-17", t: "1.1", q: "Eicosanoides: precursor, de dónde sale y qué enzima lo libera.", a: "<b>Ácido araquidónico</b> (20:4, ω-6, dobles enlaces en 5, 8, 11, 14).<br>Está en la <b>posición 2</b> de fosfolípidos de membrana.<br>Lo libera la <b>fosfolipasa A2</b>." },
  { id: "1.1-18", t: "1.1", q: "¿Qué cataliza la COX y por qué la aspirina es antiinflamatoria y anticoagulante?", a: "La COX cierra el anillo del ácido araquidónico → <b>prostaglandinas</b> (dolor, inflamación) y <b>tromboxanos</b> (coagulación).<br>La aspirina inhibe la COX → bloquea ambas.<br>Leucotrienos: asma y respuesta inmune." },
  { id: "1.1-19", t: "1.1", q: "Ruta de síntesis de catecolaminas con sus enzimas.", a: "Tirosina →(<b>tirosina hidroxilasa</b>)→ L-DOPA →(<b>descarboxilasa de aa aromáticos</b>)→ dopamina →(<b>dopamina β-hidroxilasa</b>)→ noradrenalina →(<b>feniletanolamina N-metiltransferasa</b>)→ adrenalina.", x: true, n: "Aviso de clase: este diagrama hay que saberlo de memoria." },
  { id: "1.1-20", t: "1.1", q: "¿Por qué la tirosina no es catecolamina? ¿Cuál es la primera?", a: "Le falta el grupo <b>catecol</b> (anillo aromático con dos –OH). La primera catecolamina es la <b>L-DOPA</b>." },
  { id: "1.1-21", t: "1.1", q: "¿Por qué en el Parkinson se administra L-DOPA y no dopamina?", a: "La dopamina <b>no cruza la barrera hematoencefálica</b>; la L-DOPA sí, y en el cerebro se convierte en dopamina." },
  { id: "1.1-22", t: "1.1", q: "Hormonas tiroideas: cómo se forman MIT, DIT, T3 y T4.", a: "La <b>peroxidasa</b> oxida yoduro a yodo, que se une a tirosinas de la <b>tiroglobulina</b>:<br>MIT = yodo en posición 3; DIT = posiciones 3 y 5.<br><b>DIT + DIT = T4</b> (tiroxina).<br><b>DIT + MIT = T3</b> (activa) o T3 reversa (inactiva)." },
  { id: "1.1-23", t: "1.1", q: "T3 vs T4: ¿cuál abunda más en sangre, cuál es la activa y cuánto dura T4?", a: "En sangre hay <b>más T4</b>, pero la activa es <b>T3</b>. T4 es el reservorio de T3 y tiene vida media de <b>hasta 7 días</b> (excepción: la mayoría duran minutos–horas)." },
  { id: "1.1-24", t: "1.1", q: "Hormonas esteroideas: de dónde derivan, qué conservan y ejemplos.", a: "Del <b>colesterol</b>; conservan el núcleo de <b>4 anillos</b>. A partir de <b>progesterona</b> se forman cortisol, aldosterona (balance osmótico), testosterona y estradiol." },
  { id: "1.1-25", t: "1.1", q: "Clasifica por solubilidad: adrenalina, tiroxina, GH, cortisol, TRH, vitamina D3, ácido retinoico, prostaglandinas.", a: "<b>Hidrosolubles</b>: adrenalina, GH, TRH (y ATP, glucosa, succinato, lactato).<br><b>Liposolubles</b> (con transportador): tiroxina, cortisol, vitamina D3, ácido retinoico, prostaglandinas." },
  { id: "1.1-26", t: "1.1", q: "Dominios de un receptor de membrana. ¿Cuál es el que da la especificidad?", a: "<b>Extracelular</b>: une el ligando → el <b>específico</b>.<br><b>Transmembrana</b>: hélice α de ~20 aa hidrofóbicos.<br><b>Intracelular</b>: transduce (AMPc, GMPc, fosfolípidos, fosforilación, iones).<br>Receptores distintos se parecen en lo transmembrana e intracelular, no en lo extracelular." },
  { id: "1.1-27", t: "1.1", q: "Dominios de un receptor intracelular y cómo es su NLS.", a: "Dominio de unión a la hormona, dominio de unión al DNA y <b>NLS</b> (señal de localización nuclear).<br>NLS: ~5 aa seguidos, básicos (Lys, Arg, His), o dos grupos básicos separados por ~10 aa." },
  { id: "1.1-28", t: "1.1", q: "Secreción constitutiva vs regulada, con un ejemplo de cada.", a: "<b>Constitutiva</b>: constante, células no especializadas. Ej.: <b>leptina</b> (adipocitos).<br><b>Regulada</b>: necesita estímulo, células glandulares. Ej.: <b>hormonas hipofisarias</b>." },
  { id: "1.1-29", t: "1.1", q: "¿Cómo se sintetizan y secretan las señales derivadas de aa y las lipídicas?", a: "<b>Derivadas de aa</b>: síntesis multienzimática en citosol (sin ribosomas) → vesículas → secreción regulada. Ej.: adrenalina (médula adrenal), histamina (basófilos).<br><b>Lipídicas</b>: síntesis multienzimática (citosol, mitocondria, membranas) → salen por <b>difusión</b>, sin vesículas. Ej.: estradiol, prostaglandinas." },
  { id: "1.1-30", t: "1.1", q: "¿Qué requisitos debe cumplir una proteína transportadora de hormonas?", a: "Ser <b>hidrofílica</b>, tener dominio de unión a la hormona con afinidad <b>no demasiado alta</b> (para poder soltarla).<br>El receptor debe tener <b>más afinidad</b> que el transportador. Muchas se llaman <i>binding globulins</i>; la albúmina transporta moléculas hidrofóbicas." },
  { id: "1.1-31", t: "1.1", q: "Vida media de una hormona: definición y cómo se mide.", a: "Tiempo en que la concentración baja a la <b>mitad</b>. Se mide inyectando hormona <b>radiomarcada</b> y tomando sangre a intervalos." },
  { id: "1.1-32", t: "1.1", q: "¿Qué implica que una hormona tenga vida media corta?", a: "Respuesta más <b>rápida, sensible y regulada</b>: su concentración sube y baja enseguida al cambiar la secreción. Vida media larga = concentración más constante." },
  { id: "1.1-33", t: "1.1", q: "Características de los factores locales.", a: "Los sintetizan células no especializadas; no salen a la circulación (paracrinos/autocrinos); no necesitan transportador; vida media corta; química diversa (prostaglandinas, tromboxanos, factores de crecimiento, factores inflamatorios)." },
  { id: "1.1-34", t: "1.1", q: "Familia FGF: nº de genes, por qué son locales y cuál es la excepción.", a: "<b>22 genes</b> en humanos. Son locales porque se unen con alta afinidad al <b>heparán sulfato</b> de la matriz.<br>Excepción: subfamilia <b>FGF19</b> (3 miembros), no une heparanos y <b>circula como hormona</b>." },
  { id: "1.1-35", t: "1.1", q: "Las 3 grandes clases de receptores de superficie.", a: "1. Acoplados a <b>canales iónicos</b> (ej. receptor de acetilcolina).<br>2. Acoplados a <b>proteínas G</b> (7 dominios TM, proteína G heterotrimérica αβγ).<br>3. Acoplados a <b>enzimas</b>." },
  { id: "1.1-36", t: "1.1", q: "Receptor enzimático homodimérico vs heterodimérico.", a: "<b>Homodimérico</b>: ligando dimérico que acerca dos receptores iguales; sus dominios intracelulares se activan (fosforilación mutua). Típico de quinasas.<br><b>Heterodimérico</b>: ligando que acopla dos receptores distintos → activa una enzima propia o asociada." },
  { id: "1.1-37", t: "1.1", q: "GEF vs GAP: ¿qué hace cada uno con una proteína G?", a: "<b>GEF</b>: cambia GDP por GTP → <b>activa</b>.<br><b>GAP</b>: estimula la actividad GTPasa intrínseca (lenta) de la proteína G → GTP a GDP → <b>apaga</b>.", n: "Tu anotación de la diapositiva dice que las GEF tienen actividad GTPasa. Es la proteína G la que la tiene." },
  { id: "1.1-38", t: "1.1", q: "ARF, Rab y Ran: ¿qué son?", a: "<b>Proteínas G monoméricas</b> (pequeñas GTPasas), del tráfico vesicular y nuclear.", n: "En tu anotación aparecen como ejemplos de GEF: es un error." },
  { id: "1.1-39", t: "1.1", q: "¿Qué activa PKA, PKC y PKG? ¿Qué son PKB y PP2A?", a: "<b>PKA</b>: AMPc. <b>PKC</b>: Ca²⁺ + DAG. <b>PKG</b>: GMPc.<br><b>PKB = AKT</b>: vía de la insulina / mTOR.<br><b>PP2A</b>: fosfatasa." },
  { id: "1.1-40", t: "1.1", q: "IP3 y DAG: ¿qué hace cada uno?", a: "<b>IP3</b>: se libera de la membrana por una fosfolipasa, va al RE y abre sus canales de Ca²⁺.<br><b>DAG</b> (glicerol + 2 ácidos grasos): queda en la membrana y, con Ca²⁺, activa la <b>PKC</b>.", x: true, n: "Aviso de clase: aprender la estructura de los segundos mensajeros." },
  { id: "1.1-41", t: "1.1", q: "Formas de transducir una señal y para qué sirve una proteína scaffold.", a: "Cascada de fosforilación, amplificación (segundos mensajeros), integración o extensión a otras vías, inhibición o modulación.<br><b>Scaffold</b>: proteína con varios dominios que reúne los componentes de una cascada para que sea rápida y eficaz. Ejemplo clásico: <b>MAPK</b>." },
  { id: "1.1-42", t: "1.1", q: "Interruptores moleculares: los dos principales y otros tres.", a: "Principales: <b>fosforilación</b> (quinasa/fosfatasa; normalmente fosforilado = activo, no siempre) y <b>unión a GTP</b> (GEF/GAP).<br>Otros: metilación, acetilación, ubiquitinación." },

  { id: "1.1-43", t: "1.1", q: "Óxido nítrico (NO): de qué se sintetiza, tipo de receptor y segundo mensajero.", a: "Es un <b>gas</b>. Se sintetiza a partir de <b>arginina + O₂</b>.<br>Receptor <b>intracelular citosólico</b> (no nuclear): la <b>guanilato ciclasa</b> → <b>GMPc</b>.", n: "No aparece en los apuntes; solo en la tabla de la diapositiva 24." },
  { id: "1.1-44", t: "1.1", q: "Cofactor de cada enzima de la ruta de catecolaminas.", a: "Tirosina hidroxilasa → <b>tetrahidrobiopterina + O₂</b>.<br>Descarboxilasa de aa aromáticos → <b>PLP</b> (sale CO₂).<br>Dopamina β-hidroxilasa → <b>ascorbato + O₂</b>.<br>Feniletanolamina N-metiltransferasa → <b>SAM</b> (dona el metilo)." },
  { id: "1.1-45", t: "1.1", q: "Vasopresina vs oxitocina: secuencias y en qué se diferencian.", a: "Vasopresina: <b>C-Y-F-Q-N-C-P-R-G</b>. Oxitocina: <b>C-Y-I-Q-N-C-P-L-G</b>.<br>Solo cambian las posiciones <b>3</b> (Phe/Ile) y <b>8</b> (Arg/Leu). Anillo por puente <b>Cys1–Cys6</b>; Gly final amidada (Gly-NH₂)." },
  { id: "1.1-46", t: "1.1", q: "Primer paso de la síntesis de esteroides y número de carbonos a lo largo de la ruta.", a: "Colesterol (<b>C27</b>) → enzima mitocondrial de <b>corte de la cadena lateral</b> → <b>pregnenolona (C21)</b> → progesterona (C21) → … → testosterona (<b>C19</b>) → <b>aromatasa</b> → estradiol (<b>C18</b>)." },
  { id: "1.1-47", t: "1.1", q: "¿Qué produce cada zona de la corteza adrenal?", a: "<b>Glomerulosa</b> → aldosterona (mineralocorticoide).<br><b>Fasciculada</b> → cortisol (glucocorticoide).<br><b>Reticular</b> → DHEA (andrógeno débil)." },
  { id: "1.1-48", t: "1.1", q: "Transportador de cada hormona: CBG, TBG, GH-BP, neurofisinas. ¿Qué forma de la hormona actúa?", a: "<b>CBG</b> → glucocorticoides / progesterona.<br><b>TBG</b> → T3 y T4.<br><b>GH-BP</b> → GH.<br><b>Neurofisina I / II</b> → oxitocina / vasopresina.<br>Equilibrio H–T ⇄ T + H: solo la <b>hormona libre</b> llega a la célula diana." },
  { id: "1.1-49", t: "1.1", q: "Vida media típica: aminas, polipéptidos, proteínas, esteroides, T3 y T4.", a: "Aminas <b>2–3 min</b>; polipéptidos 4–40 min; proteínas 15–170 min; esteroides 4–120 min.<br><b>T3 0,75 días</b>; <b>T4 6,7 días</b>." },
  { id: "1.1-50", t: "1.1", q: "Gráfica de concentración tras inhibir o estimular la secreción: ¿qué curva es la de t½ más corta?", a: "La que <b>cambia más rápido</b>: baja antes al inhibir y sube antes al estimular. Vida media corta = más sensible a los cambios." },
  { id: "1.1-51", t: "1.1", q: "Pasos de la cascada de transducción (como en la diapositiva).", a: "Primary transduction → relay → transduce and amplify → integrate → spread → anchor (scaffold) → modulate → effector protein activation → gene transcription (unión al elemento de respuesta del DNA)." },
  { id: "1.1-52", t: "1.1", q: "Cómo reconocer la estructura de AMPc, GMPc, DAG e IP3, y qué activa cada uno.", a: "<b>AMPc</b>: adenina + ribosa + fosfato unido a C3′ y C5′ (anillo) → <b>PKA</b>.<br><b>GMPc</b>: igual con guanina → <b>PKG</b> y abre canales de cationes en bastones.<br><b>DAG</b>: glicerol con 2 ácidos grasos (C1, C2) y –OH en C3 → <b>PKC</b>.<br><b>IP3</b>: anillo de inositol con fosfatos en 1, 4, 5 → abre canales de <b>Ca²⁺ del RE</b>.", x: true, n: "Aviso de clase: aprenderse la estructura." },
  { id: "1.1-53", t: "1.1", q: "¿Por qué microvesículas y cuerpos apoptóticos exponen fosfatidilserina y los exosomas no?", a: "En una célula sana la PS está en la <b>cara interna</b> (la devuelven las <b>flipasas</b>, con ATP).<br>Al formarse microvesículas (sube el Ca²⁺) o en apoptosis (las caspasas cortan flipasas) actúan las <b>scramblasas</b> y la PS sale a la cara externa. Ambas salen de la <b>membrana plasmática</b>.<br>Los exosomas vienen de la membrana del <b>endosoma</b>.", n: "Los apuntes dicen que la PS es el principal componente de la membrana: no, los mayoritarios son fosfatidilcolina y fosfatidiletanolamina." },
  { id: "1.1-54", t: "1.1", q: "¿Para qué sirve la fosfatidilserina expuesta y cómo se detecta?", a: "Es la señal <b>'cómeme'</b> para los macrófagos (eliminan células apoptóticas sin inflamación).<br>Se detecta con <b>anexina V</b>, por ejemplo en citometría." },
  { id: "1.1-55", t: "1.1", q: "¿Qué hace básico a un aminoácido? ¿Cuáles son?", a: "Un grupo de la <b>cadena lateral</b> que capta H⁺ y queda con carga positiva a pH 7,4: <b>Lys</b> (ε-amino), <b>Arg</b> (guanidinio), <b>His</b> (imidazol, solo en parte).<br>Asn y Gln tienen N (amida) pero son <b>neutras</b>." },
  { id: "1.1-56", t: "1.1", q: "Tirosina vs tiroglobulina, y de cuál salen catecolaminas y hormonas tiroideas.", a: "<b>Tirosina</b>: un aminoácido. <b>Tiroglobulina</b>: proteína grande del folículo tiroideo con muchas tirosinas.<br>Catecolaminas → de la <b>tirosina libre</b> (enzimas del citosol).<br>T3/T4 → de las <b>tirosinas dentro de la tiroglobulina</b>: se yodan y acoplan unidas a la proteína, y la proteólisis las libera." },
  { id: "1.1-57", t: "1.1", q: "Los 4 pasos químicos de la síntesis de hormonas tiroideas.", a: "1. <b>Peroxidasa</b>: 2 I⁻ + H₂O₂ → I₂.<br>2. I₂ + Tyr → MIT o DIT.<br>3. DIT + DIT → T4 (3,5,3′,5′).<br>4. DIT + MIT → T3 (3,5,3′, activa) o T3 reversa (3,3′,5′, inactiva)." },
  { id: "1.1-58", t: "1.1", q: "Acetilcolina en corazón, músculo esquelético y glándula salival: efecto y por qué difiere.", a: "Corazón: baja frecuencia y fuerza. Músculo esquelético: contracción. Glándula salival: secreción.<br>Difiere por el <b>tipo de receptor</b>: nicotínico (canal iónico) en músculo esquelético; muscarínico (GPCR) en corazón y glándula." },
  { id: "1.1-59", t: "1.1", q: "Feedback positivo vs negativo. Ejemplo enzimático de positivo.", a: "<b>Positivo</b>: el producto refuerza la señal. <b>Negativo</b>: la inhibe.<br>Ejemplo: el producto se une a un sitio de su propia enzima y la vuelve <b>muy activa</b>." },
  { id: "1.1-60", t: "1.1", q: "Ácido araquidónico: notación completa. ¿La aspirina bloquea los leucotrienos?", a: "<b>20:4 Δ5,8,11,14</b> (ω-6).<br><b>No</b>: la aspirina bloquea la COX (prostaglandinas y tromboxanos); los leucotrienos van por otra vía.", n: "Apuntes: 'COX2'. La aspirina inhibe COX-1 y COX-2." },
  { id: "1.1-61", t: "1.1", q: "Ejemplos de secreción: leptina, hormonas hipofisarias, adrenalina, histamina, estradiol, prostaglandinas.", a: "Leptina → <b>constitutiva</b>.<br>Hormonas hipofisarias, adrenalina, histamina → <b>regulada</b>.<br>Estradiol, prostaglandinas → <b>difusión</b> (lipídicas, sin vesículas)." },
  { id: "1.1-62", t: "1.1", q: "TRH y Leu-encefalina: ¿cuántos aa tienen?", a: "<b>TRH</b>: tripéptido (pyroGlu-His-Pro-NH₂).<br><b>Leu-encefalina</b>: pentapéptido (Tyr-Gly-Gly-Phe-Leu)." },

  // ---------- 1.2 ----------
  { id: "1.2-01", t: "1.2", q: "Propiedades que debe tener la unión hormona-receptor.", a: "Reversible, <b>saturable</b>, alta afinidad, <b>específica</b> (ajuste inducido), presente en las células diana y que produzca <b>respuesta biológica</b>." },
  { id: "1.2-02", t: "1.2", q: "La afinidad depende de ___ y la especificidad de ___.", a: "Afinidad → de la <b>concentración</b>.<br>Especificidad → de la <b>estructura</b>." },
  { id: "1.2-03", t: "1.2", q: "Escribe KD en función de concentraciones y de constantes de velocidad.", a: "KD = [H]·[R] / [HR] = kd / ka = 1 / KA.<br>En el equilibrio: ka·[H]·[R] = kd·[HR]." },
  { id: "1.2-04", t: "1.2", q: "¿Qué unidades tienen KD y KA?", a: "<b>KD</b>: concentración (M).<br><b>KA</b>: concentración⁻¹ (M⁻¹).", x: true, n: "Aviso de clase: pregunta tipo test." },
  { id: "1.2-05", t: "1.2", q: "k minúscula vs K mayúscula.", a: "<b>k</b> (ka, kd): constantes de <b>velocidad</b> (cinéticas).<br><b>K</b> (KA, KD): constantes de <b>equilibrio</b>." },
  { id: "1.2-06", t: "1.2", q: "Ecuación de [B] en función de [F]. ¿A qué se parece y qué forma tiene?", a: "[B] = [N]·[F] / (KD + [F])<br>F = libre, B = unida, N = Bmax = receptores totales.<br>Es como <b>Michaelis-Menten</b>: hipérbola." },
  { id: "1.2-07", t: "1.2", q: "Deducción de [B]: ¿qué sustitución es la clave?", a: "R = N − B. Entonces KD = F·(N − B)/B → B·KD = F·N − F·B → B·(KD + F) = F·N (sacando factor común B)." },
  { id: "1.2-08", t: "1.2", q: "¿Qué es KD en términos de ocupación y cómo se relaciona con la afinidad?", a: "La concentración de hormona libre que ocupa la <b>mitad</b> de los receptores.<br><b>Menor KD = mayor afinidad</b>." },
  { id: "1.2-09", t: "1.2", q: "¿Qué pasa con [B] si [F] ≫ KD?", a: "KD se desprecia → <b>[B] = [N]</b>: saturación, todos los receptores ocupados." },
  { id: "1.2-10", t: "1.2", q: "Valores fisiológicos: hormona en sangre, KD y nº de receptores por célula.", a: "Hormona: <b>10⁻⁹–10⁻¹² M</b>.<br>KD: <b>10⁻⁸–10⁻¹⁰ M</b>.<br>N: ~<b>10⁴</b> receptores/célula (a veces >10⁵)." },
  { id: "1.2-11", t: "1.2", q: "¿Por qué conviene que los receptores no estén saturados en condiciones fisiológicas?", a: "Como la hormona suele estar <b>por debajo de KD</b>, la mayoría de receptores están libres y queda <b>margen de respuesta</b> cuando sube la hormona. Saturados, no podrían responder a más señal." },
  { id: "1.2-12", t: "1.2", q: "Pasos de un ensayo de unión con hormona radiomarcada.", a: "1. Tubos con tampón, misma cantidad de receptor y hormona marcada a concentraciones crecientes.<br>2. Incubación (temperatura y tiempo fijados).<br>3. Separar B de F.<br>4. Medir la radiactividad de B y representar." },
  { id: "1.2-13", t: "1.2", q: "¿Qué método se usa para separar B de F y por qué?", a: "<b>Filtración</b>: es el más rápido y barato. Las células (receptor + hormona unida) quedan en el filtro.<br>Otros: centrifugación, electroforesis, cromatografía." },
  { id: "1.2-14", t: "1.2", q: "¿Cómo se mide la unión no específica (NS)?", a: "Batería paralela idéntica + <b>hormona fría</b> (no marcada) en exceso de <b>10⁴–10⁵ veces</b>. La fría ocupa los receptores; la radiactividad que queda es inespecífica.<br>Específica = total − NS." },
  { id: "1.2-15", t: "1.2", q: "Forma de la curva de unión no específica vs específica, y por qué.", a: "<b>NS: recta</b> (no saturable, no hay receptor).<br><b>Específica: hipérbola</b> (los receptores se saturan)." },
  { id: "1.2-16", t: "1.2", q: "Recta de Scatchard: ecuación, ejes, pendiente y corte con el eje X.", a: "B/F = −KA·B + KA·N<br>Eje Y: B/F. Eje X: B.<br><b>Pendiente = −KA = −1/KD</b>.<br><b>Corte con X = N</b> (nº de receptores)." },
  { id: "1.2-17", t: "1.2", q: "En Scatchard, ¿qué indica un coeficiente de correlación lejos de 1?", a: "Que el experimento está mal hecho y hay que <b>repetirlo</b>." },
  { id: "1.2-18", t: "1.2", q: "Estudio de competencia: diseño, ejes y cómo se lee la afinidad.", a: "Hormona marcada fija + hormona fría a concentraciones crecientes.<br>Y: B/B₀ (%). X: [hormona fría] (log).<br>La que llega antes al <b>50 %</b> (menos concentración) tiene <b>más afinidad</b>. Sin afinidad: línea horizontal al 100 %." },
  { id: "1.2-19", t: "1.2", q: "Dos formas de comparar la especificidad de un receptor por varios ligandos.", a: "1. Comparar sus <b>KA</b> (mayor KA = más afinidad).<br>2. <b>Estudios de competencia</b> (cuando no se conocen las constantes)." },
  { id: "1.2-20", t: "1.2", q: "Experimento de lipólisis por adrenalina: vía y qué se mide.", a: "Adrenalina → receptor β (GPCR) → adenilato ciclasa → AMPc → lipólisis en adipocitos.<br>Se mide <b>glicerol</b> (lo habitual), ácidos grasos o AMPc." },
  { id: "1.2-21", t: "1.2", q: "EC50: definición y por qué se usa el 50 % y no el 100 %.", a: "Concentración que da el <b>50 % del efecto máximo</b> (curva sigmoidea dosis-respuesta). Menor EC50 = más potente.<br>Al 100 % llegan muchas concentraciones; al 50 % solo una." },
  { id: "1.2-22", t: "1.2", q: "¿Hace falta ocupar todos los receptores para la respuesta máxima?", a: "No: se alcanza con ~<b>20 %</b> de ocupación. Ocupación = B/N = F/(KD + F)." },
  { id: "1.2-23", t: "1.2", q: "Agonista vs antagonista, con ejemplos en receptores β.", a: "<b>Agonista</b>: se une y produce el mismo efecto → <b>isoproterenol</b>.<br><b>Antagonista</b>: se une sin activar y bloquea → <b>propranolol</b>.", n: "Los apuntes llaman 'antagonista' al isoproterenol en el apartado de receptores β. Es agonista." },
  { id: "1.2-24", t: "1.2", q: "Experimento del propranolol: ¿por qué con adrenalina y en dosis crecientes?", a: "Sin adrenalina no se vería su efecto (un antagonista no hace nada solo).<br>Dosis crecientes → el glicerol baja progresivamente → demuestra que <b>compite</b> con la adrenalina." },
  { id: "1.2-25", t: "1.2", q: "Fin de la señal a nivel del receptor: dos mecanismos.", a: "<b>Reciclaje</b>: endocitosis; el pH ácido del endosoma separa hormona y receptor; el receptor vuelve.<br><b>Degradación</b>: lisosoma; hay que sintetizar receptores nuevos (más gasto)." },
  { id: "1.2-26", t: "1.2", q: "Fin de la señal en la vía de transducción: tres mecanismos.", a: "1. Inactivar el receptor.<br>2. Inactivar un componente de la cascada.<br>3. Producir una proteína inhibitoria (feedback negativo)." },
  { id: "1.2-27", t: "1.2", q: "Receptores de insulina en linfocitos (1, 10 y 100 nM, 24 h): ¿qué muestra la gráfica?", a: "<b>A más dosis y más tiempo, menos receptores</b>.<br>1 nM: iguales ~12 h y luego bajan lentamente (~85 %).<br>10 nM: bajan a ~50 % hacia las 12 h.<br>100 nM: caen muy rápido a ~45 %.<br>Es degradación (no se recuperan): a dosis bajas, mecanismos lentos; a dosis altas, vía endosoma → lisosoma." },
  { id: "1.2-28", t: "1.2", q: "Resistencia: curva desplazada a la derecha vs respuesta máxima más baja. Causas.", a: "<b>Menor sensibilidad</b> (derecha, mismo máximo, hace falta más hormona): menor <b>afinidad</b> (mutaciones, tumores), menos transportador o enzima activadora.<br><b>Menor respuesta</b> (máximo más bajo): <b>menos receptores</b> (menor expresión/traducción, degradación).", x: true, n: "Aviso de clase: 'a nivel mecanístico, dé ejemplos que expliquen esta gráfica'. Hablar de cantidad de receptores y de afinidad." },
  { id: "1.2-29", t: "1.2", q: "Subtipos β-adrenérgicos: orden de potencia de cada uno y efector.", a: "<b>β1</b>: ISO > NA ≥ A.<br><b>β2</b>: ISO > A > NA.<br><b>β3</b>: ISO = NA > A.<br>Los tres por <b>Gs</b> → adenilato ciclasa → AMPc. Distinta expresión tisular.<br>Hígado (actividad adenilato ciclasa ISO > A > NA) → <b>β2</b>." },
  { id: "1.2-30", t: "1.2", q: "Si una misma hormona tiene efectos distintos, ¿por qué es?", a: "Porque tiene <b>receptores distintos</b>, o el mismo receptor con distinta transducción según el tipo celular." },
  { id: "1.2-31", t: "1.2", q: "¿Cómo se identifica y caracteriza un receptor? ¿Qué es un receptor huérfano?", a: "Gen expresado, transcritos, anticuerpos, especificidad por ligandos (KA y competencia) y respuesta biológica.<br><b>Huérfano</b>: receptor cuyo ligando aún no se conoce." },
  { id: "1.2-32", t: "1.2", q: "Genes, cromosomas y tamaño de los receptores β1, β2 y β3.", a: "β1: <b>ADRB1</b>, cromosoma <b>10</b>, 477 aa.<br>β2: <b>ADRB2</b>, cromosoma <b>5</b>, 413 aa.<br>β3: <b>ADRB3</b>, cromosoma <b>8</b>, 408 aa." },
  { id: "1.2-33", t: "1.2", q: "Vía de la lipólisis activada por adrenalina, paso a paso.", a: "Adrenalina → receptor β (GPCR) → proteína G → <b>adenilato ciclasa</b> (ATP → AMPc) → <b>PKA</b> → fosforila y activa la <b>lipasa sensible a hormonas</b> → TAG → DAG → MAG → (MAG lipasa) → <b>glicerol</b> + 3 ácidos grasos." },
  { id: "1.2-34", t: "1.2", q: "EC50 vs KD: ¿qué mide cada una? ¿Cuál suele ser menor y por qué?", a: "<b>KD</b>: concentración que ocupa el 50 % de los <b>receptores</b>.<br><b>EC50</b>: concentración que da el 50 % del <b>efecto</b>.<br>Normalmente <b>EC50 < KD</b>: la respuesta máxima llega con ~20 % de ocupación (receptores de reserva, amplificación de la cascada)." },
  { id: "1.2-35", t: "1.2", q: "Scatchard: la pendiente es −2·10⁹ M⁻¹. ¿Cuánto valen KA y KD?", a: "KA = <b>2·10⁹ M⁻¹</b>.<br>KD = 1/KA = <b>0,5·10⁻⁹ M = 0,5 nM</b>." },
  { id: "1.2-36", t: "1.2", q: "Recta de Scatchard: ¿qué da el corte con el eje Y?", a: "<b>KA·N</b> (cuando B = 0, B/F = KA·N). El corte con X da <b>N</b>; la pendiente, <b>−KA</b>." },
  { id: "1.2-37", t: "1.2", q: "Competencia: ¿qué es la C50 y cómo se relaciona con la afinidad? ¿Qué es B₀?", a: "<b>C50</b> (IC50): concentración de hormona fría que desplaza el 50 % de la marcada. <b>Menor C50 = más afinidad</b> (curva más a la izquierda).<br><b>B₀</b>: hormona marcada unida sin hormona fría (= 100 %)." },
  { id: "1.2-38", t: "1.2", q: "Medir la NS sin poner receptor (tubos sin células): ¿qué mide y por qué es peor?", a: "Mide solo lo que se pega al <b>filtro y al plástico</b>. No incluye lo que se pega a membranas y otras proteínas de la célula, así que es <b>incompleto</b>. Por eso se usa la hormona fría en exceso con células." },
  { id: "1.2-39", t: "1.2", q: "¿Por qué la hormona fría no altera la NS de la marcada?", a: "Los sitios inespecíficos son prácticamente <b>ilimitados y de baja afinidad</b> (no saturables): fría y marcada no compiten ahí. Solo compiten en el receptor (pocos sitios). Se comprueba porque la NS da una <b>recta</b>." },
  { id: "1.2-40", t: "1.2", q: "Saturación vs competencia: diferencia entre las dos gráficas.", a: "<b>Saturación</b>: B sube con F (hipérbola) → se lee <b>KD</b> y N.<br><b>Competencia</b>: B/B₀ baja con log [fría] (sigmoide decreciente) → se lee <b>C50</b>." },
  { id: "1.2-41", t: "1.2", q: "En condiciones fisiológicas, ¿los receptores están libres u ocupados? ¿Por qué conviene?", a: "<b>Mayoritariamente libres</b>: la hormona (10⁻⁹–10⁻¹² M) suele estar por debajo de la KD (10⁻⁸–10⁻¹⁰ M). Ej.: 10⁻¹⁰ M con KD 10⁻⁸ M → ~1 % ocupado. Deja <b>margen de respuesta</b>." },
  { id: "1.2-42", t: "1.2", q: "Secuestro del receptor vs down-regulation vs inactivación del receptor.", a: "<b>Secuestro</b>: endocitosis; el pH ácido separa hormona y receptor; el receptor se recicla.<br><b>Down-regulation</b>: degradación en lisosoma; hay que sintetizar receptores nuevos.<br><b>Inactivación</b>: sigue en membrana con la actividad bloqueada.<br>Otros mecanismos pueden venir de <b>otra hormona</b>." },
  { id: "1.2-43", t: "1.2", q: "Práctica 1 (RIA de T3): ¿cómo se normalizan B0, Bi y NS y por qué se usa la media de las cuentas totales?", a: "Se hace la <b>media</b> de las cuentas totales (T) porque hay muchas réplicas. Todo se expresa respecto a T: <b>%B/T = (Bi/T)·100</b>, <b>%B0/T = (B0/T)·100</b>, <b>%NS/T = (NS/T)·100</b>.<br>En la práctica: T ≈ 8763 cpm, B0 ≈ 3729 cpm (≈ 42,6 %), NS ≈ 1342 cpm (≈ 15,3 %).", n: "Aviso de clase (13/11, prácticas): lo destacó el profesor." },
  { id: "1.2-44", t: "1.2", q: "Práctica 1: lógica del RIA competitivo y linealización.", a: "T3 marcada (constante) + anticuerpo + T3 fría (patrón o suero). <b>Cuanta más T3 fría, menos marca unida</b> (↓ Bi).<br><b>B0</b> = unión sin T3 fría (máxima); <b>NS</b> = unión inespecífica.<br>Curva de competición: %B/T frente a [T3] (o log[T3]).<br>Linealización <b>logit-log</b>: logit = ln[(Bi − NS)/(B0 − Bi)] frente a log₁₀[T3]. Se interpola la muestra en la recta.<br>El mismo dato se puede representar con <b>otros ejes</b> (p. ej. B/B0 en vez de B/T, o escala log en el eje X); la lógica no cambia.", n: "Aviso de clase (13/11, prácticas): lo destacó el profesor." },
  { id: "1.2-45", t: "1.2", q: "Práctica 1: resultados fisiológicos (T3 en ng/100 mL).", a: "Control ≈ <b>61</b> → con TRH ≈ <b>127</b> (TRH → TSH → tiroides → ↑ T3).<br>Tiroidectomizadas ≈ <b>28</b>, y con TRH ≈ <b>28</b> (no hay tiroides que responda).<br>En el RIA: más T3 en el suero → <b>menos cpm unidas</b>; las ratas TX dan <b>más cpm</b> unidas que las tratadas con TRH.", n: "Aviso de clase (13/11, prácticas): lo destacó el profesor." },
  { id: "1.2-46", t: "1.2", q: "Práctica 2 (Scatchard, endotelinas): ⚠️ unidades. ¿Por qué no es lo mismo fmol/mg que pM?", a: "<b>fmol/mg</b> = cantidad por mg de <b>proteína</b> (no es una concentración). <b>pM</b> = fmol/<b>mL</b> (concentración).<br>Con B y F en fmol/mg, la pendiente da Ka en <b>mg/fmol</b> → Kd = 1/Ka en <b>fmol/mg</b>.<br>Para pasar a pM: <b>Kd(pM) = Kd(fmol/mg) × mg de proteína / mL de volumen</b>.", n: "Aviso de clase (13/11, prácticas): lo destacó el profesor." },
  { id: "1.2-47", t: "1.2", q: "Práctica 2: de la recta de Scatchard al número de receptores por célula.", a: "<b>Ka = −pendiente</b>; <b>Kd = 1/Ka</b>; <b>Bmax = corte con el eje X</b> (= −ordenada/pendiente), en fmol/mg.<br>Receptores/mg = Bmax × <b>6,022·10⁸</b> (moléculas por fmol = Avogadro × 10⁻¹⁵).<br>Receptores/célula = receptores/mg ÷ células por mg (8·10⁷).<br>Resultado: cDNA1 y cDNA2 con <b>Kd igual (~71 pM)</b> pero <b>Bmax distinta</b> (cDNA2 ≈ 22 veces más) → misma afinidad, distinta cantidad de receptor.", n: "Aviso de clase (13/11, prácticas): lo destacó el profesor." },

  // ---------- 1.3 ----------
  { id: "1.3-01", t: "1.3", q: "Regulación de la actividad vs de la cantidad de una proteína: velocidad y mecanismo.", a: "<b>Actividad</b>: rápida (segundos–minutos); cambia la función de la proteína que ya existe (suelen ser enzimas).<br><b>Cantidad</b>: lenta (minutos–horas); cambia su síntesis o degradación (transcripción, mRNA, traducción).", x: true, n: "Aviso de clase: en toda modificación hay que nombrar la enzima que la pone y la que la quita." },
  { id: "1.3-02", t: "1.3", q: "¿Qué es una etapa limitante y por qué se regula ahí?", a: "El paso <b>más lento</b> de la vía: determina la velocidad de toda la vía. Regularlo cambia todo el flujo.<br>Suelen ser pasos <b>irreversibles</b> con dos enzimas distintas para ida y vuelta (e2/e5), regulados por <b>feedback</b> del producto final." },
  { id: "1.3-03", t: "1.3", q: "¿Entre quiénes hay cooperatividad y qué requisito estructural necesita?", a: "Entre los <b>sitios de unión de una misma proteína</b>, normalmente en <b>varias subunidades</b> en contacto. La unión de un ligando cambia la conformación de su subunidad y eso se transmite a las demás, que cambian su afinidad.<br>Una proteína con un solo sitio no puede ser cooperativa." },
  { id: "1.3-04", t: "1.3", q: "S₀,₉/S₀,₁ sin cooperatividad, con cooperatividad positiva y negativa.", a: "<b>Ninguna</b> (hiperbólica): <b>81</b>.<br><b>Positiva</b> (sigmoidea): <b>4</b>.<br><b>Negativa</b>: <b>400</b>.<br>Es cuántas veces hay que multiplicar el ligando para pasar del 10 % al 90 % de saturación.", n: "Los apuntes atribuyen el 400 a la hiperbólica: es de la cooperatividad negativa." },
  { id: "1.3-05", t: "1.3", q: "Tres ejemplos de proteínas cooperativas (enzima, transportador, receptor).", a: "Enzima: <b>PFK-1</b>. Transportador: <b>hemoglobina</b>. Receptor: <b>receptor del IP3</b> (canal de Ca²⁺ del RE)." },
  { id: "1.3-06", t: "1.3", q: "¿Por qué interesa una cinética sigmoidea en los puntos de control?", a: "Con una <b>pequeña variación</b> de sustrato o señal hay un <b>cambio enorme</b> de respuesta (×4 para ir del 10 % al 90 %). Funciona como un interruptor." },
  { id: "1.3-07", t: "1.3", q: "Enzima alostérica: centros, estructura habitual y efecto de los moduladores en la curva.", a: "<b>Centro catalítico</b> (sustrato) + <b>centro alostérico</b> (modulador). Suelen ser <b>tetrámeros</b> (PFK-1).<br>Modulador <b>positivo</b>: curva a la izquierda (↓ Km, ↑ afinidad).<br>Modulador <b>negativo</b>: curva a la derecha (↓ afinidad).<br>La <b>Vmax no cambia</b>." },
  { id: "1.3-08", t: "1.3", q: "Cooperatividad vs alosterismo.", a: "<b>Cooperatividad</b>: las subunidades se afectan entre sí al unir el <b>mismo</b> ligando.<br><b>Alosterismo</b>: <b>otra molécula</b> (modulador) se une a un <b>sitio distinto</b> y cambia la afinidad por el sustrato." },
  { id: "1.3-09", t: "1.3", q: "¿Qué es la Km y en qué se parece a la KD?", a: "[Sustrato] a la que la enzima va a <b>½ Vmax</b>. <b>Menor Km = más afinidad</b>.<br>Equivale a la KD (unión de una molécula a una proteína; curva hiperbólica). La EC50, en cambio, mide la respuesta biológica de todo el sistema." },
  { id: "1.3-10", t: "1.3", q: "Nº de modificaciones covalentes y las reversibles más frecuentes.", a: "Unas <b>500</b>. Reversibles más frecuentes: <b>fosforilación, acetilación, metilación</b>. Ubiquitina y SUMO son proteínas que se unen covalentemente." },
  { id: "1.3-11", t: "1.3", q: "Quinasas en el genoma humano: cuántas y qué proporción son Ser/Thr.", a: "~<b>600</b> quinasas. Ser/Thr quinasas: más del <b>80 %</b> de todas; más del <b>90 %</b> de los residuos fosforilados son Ser o Thr. El otro gran grupo: Tyr quinasas." },
  { id: "1.3-12", t: "1.3", q: "¿Qué residuos se fosforilan y por qué?", a: "<b>Ser, Thr y Tyr</b>: tienen grupo <b>–OH</b>, donde se forma un enlace éster con el fosfato." },
  { id: "1.3-13", t: "1.3", q: "Dominio catalítico de las quinasas: tamaño, qué es común y qué no.", a: "~<b>300 aa</b>, homólogo en todas. Las extensiones <b>N- y C-terminales no están conservadas</b>: ahí están los mecanismos de regulación propios de cada quinasa." },
  { id: "1.3-14", t: "1.3", q: "Partes del centro catalítico de una quinasa y función de cada una.", a: "<b>N-lobe y C-lobe</b> (hendidura entre ellos).<br><b>P-loop</b>: une ATP-Mg²⁺.<br><b>Residuos catalíticos</b> (Lys, Glu, Asp) inter-lóbulos.<br><b>Hélice αC</b>: cambia de conformación según regiones reguladoras externas.<br><b>Activation loop</b>: residuo fosforilable que activa la quinasa." },
  { id: "1.3-15", t: "1.3", q: "Activation loop: residuo fosforilable y quién lo fosforila.", a: "<b>Thr</b> en Ser/Thr quinasas; <b>Tyr</b> en Tyr quinasas.<br>Lo fosforila una <b>quinasa activadora</b> (ej. <b>PDK1</b>) o hay <b>autofosforilación</b> entre subunidades." },
  { id: "1.3-16", t: "1.3", q: "Papel del P-loop, del Mg²⁺ y de los Asp. ¿Qué pasa si Asp → Asn?", a: "<b>P-loop</b>: abraza y sujeta el ATP en su sitio.<br><b>Mg²⁺</b>: neutraliza las cargas negativas de los fosfatos; sin él no hay actividad.<br><b>Asp</b> (−): fijan el Mg²⁺.<br><b>Asp → Asn</b> (amida neutra): no fija el Mg²⁺ → <b>quinasa inactiva</b>." },
  { id: "1.3-17", t: "1.3", q: "Secuencia consenso de la PKA y por qué prefiere residuos básicos.", a: "<b>Arg-Arg/Lys-X-Ser/Thr</b>.<br>Arg y Lys (+) son atraídas por el Glu y el Asp (−) del centro activo." },
  { id: "1.3-18", t: "1.3", q: "¿Puede un sustrato ser fosforilado por varias quinasas? ¿Qué decide cuál lo hace in vivo?", a: "<b>Sí.</b> Cada quinasa reconoce una <b>secuencia consenso</b> alrededor de la Ser/Thr/Tyr (ej. PKA: R-R-X-S), pero las de quinasas parecidas se <b>solapan</b>.<br><i>In vitro</i> (tubo, sin compartimentos, mucha enzima y ATP) casi cualquiera con preferencia parecida acaba fosforilándolo, así que el resultado no demuestra que pase en la célula.<br><i>In vivo</i> decide: que la quinasa se <b>exprese</b> en esa célula, que esté <b>activa</b> en ese momento y, sobre todo, que esté en el <b>mismo sitio</b> que el sustrato (<b>colocalización</b>: proteínas andamio/scaffold, sitios de anclaje)." },
  { id: "1.3-19", t: "1.3", q: "Acetilación: residuo, enzimas, efecto en la cromatina y sustratos.", a: "En <b>Lys</b>. Pone: <b>HAT</b>. Quita: <b>HDAC</b>.<br>Neutraliza la carga + de la Lys → la cromatina se abre → <b>transcripción activa</b>.<br>Sustratos: <b>histonas</b>, factores de transcripción (<b>p53, GATA</b>), coactivadores, enzimas." },
  { id: "1.3-20", t: "1.3", q: "Ubiquitina: tamaño y características.", a: "<b>76 aa, 8 kDa</b>, estable al calor, globular, en todas las eucariotas, <b>96 %</b> de identidad entre humano y levadura." },
  { id: "1.3-21", t: "1.3", q: "Enlace de la ubiquitina con el sustrato.", a: "Entre una <b>Lys del sustrato</b> (grupo amino) y la <b>Gly del C-terminal</b> de la Ub." },
  { id: "1.3-22", t: "1.3", q: "E1, E2, E3 y DUB: función y número.", a: "<b>E1</b> (activadora, 2): une la Ub a su Cys (tioéster), gasta ATP.<br><b>E2</b> (conjugadora, >35 según la diapositiva): recibe la Ub en su Cys.<br><b>E3</b> (ligasa, >600): reconoce el sustrato → <b>especificidad</b>.<br><b>DUB</b> (~100): quita la Ub.", n: "Los apuntes dicen ~20 E2; la diapositiva (2019) dice más de 35." },
  { id: "1.3-23", t: "1.3", q: "E3 RING vs HECT/RBR.", a: "<b>RING</b>: la Ub pasa <b>directamente</b> de E2 al sustrato (la E3 hace de puente).<br><b>HECT y RBR</b>: la Ub pasa antes por una <b>Cys de la propia E3</b>." },
  { id: "1.3-24", t: "1.3", q: "¿Cuántas Lys tiene la ubiquitina y cuáles son?", a: "<b>7</b>: K6, K11, K27, K29, K33, <b>K48</b>, <b>K63</b>. Además, M1 (Met del extremo N)." },
  { id: "1.3-25", t: "1.3", q: "Cadena K48 vs K63.", a: "<b>K48</b>: degradación por <b>proteasoma</b> (mínimo 4 Ub).<br><b>K63</b>: <b>daño al DNA</b> y autofagia antibacteriana.<br>No toda ubiquitinación significa degradación." },
  { id: "1.3-26", t: "1.3", q: "Patrones de ubiquitinación.", a: "Mono, multi-mono, cadena homotípica, heterotípica/ramificada, multi-homotípica y Ub modificada (fosforilada o acetilada)." },
  { id: "1.3-27", t: "1.3", q: "SUMO-1 y NEDD8: ¿en qué se parecen a la ubiquitina?", a: "<b>Poca homología de secuencia</b>, pero <b>misma estructura 3D</b> → mecanismo parecido (sumoilación, neddilación) con funciones que <b>no son de degradación</b>. Estructura similar → función similar." },
  { id: "1.3-28", t: "1.3", q: "SREBP: activación paso a paso.", a: "Proteína de membrana del RE (2 TM). Con <b>pocos esteroles</b> viaja al <b>Golgi</b>. <b>S1P</b> corta en el site 1 (lumen); <b>S2P</b> corta en el site 2 (dentro de la membrana) y libera el <b>bHLH-zip</b> → núcleo → se une a <b>TCACNCCAC</b> → genes de síntesis del colesterol.<br>Con muchos esteroles queda retenida en el RE." },
  { id: "1.3-29", t: "1.3", q: "¿Por qué la proteólisis de SREBP es una modificación covalente irreversible?", a: "Rompe <b>enlaces peptídicos</b> (covalentes) y <b>no hay enzima que los vuelva a unir</b>. Para apagarla hay que degradar el fragmento y sintetizar SREBP nueva. Otro ejemplo: proinsulina → insulina + péptido C." },
  { id: "1.3-30", t: "1.3", q: "Dominios que unen lípidos: PH, PX, C1 y qué reconoce cada uno.", a: "<b>PH</b> (~120 aa, 7 láminas β): <b>PI(3,4,5)P₃</b> y PI(4,5)P₂. Ej.: AKT, RhoGEF, IRS1.<br><b>PX</b> (~120 aa): <b>PI3P</b>. Ej.: PLD, PI3K.<br><b>C1</b>: <b>DAG</b>, el único que no une un fosfolípido (ej. PKC)." },
  { id: "1.3-31", t: "1.3", q: "PI3K y dominios PH: ¿cómo se monta el complejo en la membrana?", a: "La <b>PI3K</b> convierte PI(4,5)P₂ en <b>PI(3,4,5)P₃</b> (una fosfatasa lo revierte). El PIP₃ recluta a la membrana proteínas con dominio PH (<b>PKB/Akt, PDK1, PKCε, PLCγ</b>), que se juntan y se activan." },
  { id: "1.3-32", t: "1.3", q: "¿Qué dominio reconoce p-Tyr, p-Ser, Ac-Lys, mono-Ub, poli-Ub y PXXP?", a: "p-Tyr → <b>SH2</b> y <b>PTB</b>.<br>p-Ser → <b>14-3-3</b>.<br>Ac-Lys → <b>bromodominio</b>.<br>mono-Ub → <b>UIM</b>; poli-Ub → <b>UBA</b>.<br>PXXP → <b>SH3</b>." },
  { id: "1.3-33", t: "1.3", q: "SH2 vs PTB: qué reconocen y qué parte del entorno importa en cada uno.", a: "Ambos ~100 aa, reconocen <b>p-Tyr</b>.<br><b>SH2</b>: residuos del lado <b>C-terminal</b>. Ej.: PI3K, <b>pY-X-X-M</b>.<br><b>PTB</b>: residuos del lado <b>N-terminal</b>. Ej.: Shc, <b>NPXpY</b>." },
  { id: "1.3-34", t: "1.3", q: "Dominio SH3: tamaño, estructura, qué une y función.", a: "<b>50–75 aa</b>, 5–8 láminas β con bolsillo hidrofóbico. Une secuencias ricas en <b>prolinas (PXXP)</b>. Función: relocalización (PLCγ al citoesqueleto) y regulación (<b>Grb2 sobre Sos</b>)." },
  { id: "1.3-35", t: "1.3", q: "Mecanismos de activación tras unirse a un receptor fosforilado (con ejemplo).", a: "<b>Relocalización</b> (citoplasma → membrana).<br><b>↓ Km por fosforilación</b> (PLCγ).<br><b>Cambio de conformación</b> con activación o inhibición (Shc)." },
  { id: "1.3-36", t: "1.3", q: "Proteína adaptadora, docking y scaffold: ejemplo y tamaño de cada una.", a: "<b>Adaptadora</b>: <b>Grb2</b>, 25 kDa, pequeña (SH2 + 2 SH3).<br><b>Docking</b>: <b>IRS1</b>, 131 kDa, grande, anclada al receptor y la membrana (PTB + PH).<br><b>Scaffold</b>: <b>AKAP</b>, 100 kDa, muchos sitios de unión (PKA, PP2B, PKC, AC, Epac, PDE)." },
  { id: "1.3-37", t: "1.3", q: "Ejemplo integrado: receptor → IRS1 → Grb2 → Sos. ¿Qué es Sos?", a: "IRS1 se une al receptor fosforilado (PTB) y a la membrana (PH). Grb2 se une a una p-Tyr de IRS1 (SH2) y a Sos (SH3). <b>Sos es el GEF de Ras</b>." },
  { id: "1.3-38", t: "1.3", q: "El dominio death domain (DD): ¿con qué interacciona y para qué?", a: "Con <b>otros DD</b> (dominio–dominio). Forma <b>multímeros en la apoptosis</b>." },
  { id: "1.3-39", t: "1.3", q: "Técnicas para la estructura 3D de proteínas. ¿Qué cambió en 2021?", a: "Cristalografía, criomicroscopía, RMN. Desde <b>2021</b>, predicción con <b>AlphaFold</b> (<b>Nobel 2024</b>)." },
  { id: "1.3-40", t: "1.3", q: "¿Qué es un HRE y cómo es?", a: "<b>Elemento de respuesta a hormona</b>: secuencia de <b>6–8 nt</b> en el <b>promotor</b>, repetida o no, donde se une un factor de transcripción regulado por hormonas. Permite cambiar la velocidad de transcripción en respuesta a hormonas." },
  { id: "1.3-41", t: "1.3", q: "CRE y Nur77: secuencia y forma del factor que la une.", a: "<b>CRE</b> (cAMP Response Element): <b>TGACGTCA</b>, palindrómica → la une <b>CREB como dímero</b>.<br><b>Nur77</b> (receptor nuclear): <b>AAAAGGTCA</b>, no palindrómica → la une como <b>monómero</b> (menos frecuente)." },
  { id: "1.3-42", t: "1.3", q: "Coactivador: definición y mecanismo.", a: "Proteína que <b>activa la transcripción interaccionando con factores de transcripción, sin tocar el DNA</b>. Forma complejos multiproteicos con actividad <b>HAT</b> (abre la cromatina). Ej.: <b>CBP</b>. Necesita una señal de activación (ligando o cambio covalente)." },
  { id: "1.3-43", t: "1.3", q: "Correpresores: definición, actividad y ejemplos.", a: "Proteínas que <b>inhiben la transcripción sin tocar el DNA</b>; complejos multiproteicos con actividad <b>HDAC</b>. Ejemplos: <b>NCoR, SMRT, RIP</b>. La señal de activación los desplaza y entran los coactivadores." },
  { id: "1.3-44", t: "1.3", q: "Dominios de CBP y sus socios.", a: "<b>NRID</b> → receptores nucleares. <b>TAZ1</b> → HIF-1α, STAT2, p53. <b>KIX</b> → <b>CREB</b>, c-Myb, ATF-1. <b>BRD</b> → Lys acetiladas de histonas. <b>HAT</b>. <b>TAZ2</b> → P/CAF, STAT1, TFIIB, E1A. <b>NCBD</b> → E1A, p53." },
  { id: "1.3-45", t: "1.3", q: "CBP: tamaño en aa y peso aproximado. ¿Qué son P/CAF, TFIIB y E1A?", a: "<b>2441 aa</b> × ~100 Da = <b>~244 kDa</b>.<br><b>P/CAF</b>: otra HAT de los complejos coactivadores. <b>TFIIB</b>: maquinaria basal de la transcripción. <b>E1A</b>: proteína del adenovirus.", n: "Tu anotación pone 244,1 Da: son ~244 kDa." },
{ id: "1.3-46", t: "1.3", q: "¿Para qué sirven las regiones desordenadas de CBP?", a: "Le dan <b>flexibilidad</b> para ajustarse a distintas arquitecturas de promotores y dejar acceder a otros cofactores. Un mismo dominio puede reconocer distintos factores." },
  { id: "1.3-47", t: "1.3", q: "Genes de respuesta primaria vs secundaria.", a: "<b>Primaria</b>: el factor activado por el ligando transcribe el gen directamente.<br><b>Secundaria</b>: necesita una <b>proteína nueva</b> (un factor de transcripción producto de un gen primario). Las proteínas primarias aparecen antes." },
  { id: "1.3-48", t: "1.3", q: "¿Cómo se distingue experimentalmente un gen primario de uno secundario?", a: "Midiendo cuándo aparecen mRNA (qPCR, Northern) o proteína (Western). Con <b>cicloheximida</b> (bloquea la traducción) los <b>primarios siguen</b> transcribiéndose y los <b>secundarios no</b>." },
  { id: "1.3-49", t: "1.3", q: "¿Cómo se mide la vida media de un mRNA?", a: "<b>Actinomicina D</b> (inhibe la transcripción) en tiempo 0 → muestras a distintos tiempos → cuantificar por <b>qPCR o Northern</b> → la vida media es cuando queda la mitad." },
  { id: "1.3-50", t: "1.3", q: "mRNA de albúmina vs PEPCK en hígado.", a: "<b>Albúmina</b>: muy estable (como la mayoría).<br><b>PEPCK</b>: vida media <b>corta</b>; es la enzima limitante de la <b>gluconeogénesis</b>. Los mRNA de vida media corta controlan puntos clave." },
  { id: "1.3-51", t: "1.3", q: "¿Por qué el mRNA de PEPCK es inestable y por qué se estabiliza en ayuno?", a: "Su <b>3′UTR</b> tiene una región de ~<b>600 pb</b> que une proteínas desestabilizadoras que activan <b>endonucleasas</b>.<br>En <b>ayuno</b> (glucagón → <b>AMPc</b>) esa proteína se modifica e <b>inhibe las endonucleasas</b> → mRNA estable.", x: true, n: "Aviso de clase: ayuno = glucagón = vía del AMPc." },
  { id: "1.3-52", t: "1.3", q: "¿Qué son los AREs?", a: "<b>AU-rich elements</b>: secuencias <b>AUUUA</b> del 3′UTR que marcan el mRNA para degradación rápida (proto-oncogenes, factores de transcripción, citoquinas). Las reconocen proteínas como <b>AUF1</b>." },
  { id: "1.3-53", t: "1.3", q: "miRNA: qué son, tamaño y mecanismo.", a: "RNA <b>no codificante</b> de <b>21–23 nt</b>. Con el complejo <b>RISC</b> se unen al <b>3′UTR</b> del mRNA → <b>degradación</b> del mRNA o <b>bloqueo de la traducción</b> (el mRNA se mantiene)." },
  { id: "1.3-54", t: "1.3", q: "miR-25 en la insuficiencia cardíaca.", a: "En la insuficiencia cardíaca ↓ mRNA de <b>SERCA2a</b> (bomba de Ca²⁺ del retículo) y ↑ <b>miR-25</b> (correlación inversa). In vitro, miR-25 en dosis crecientes sobre el 3′UTR de SERCA la reduce (Nature 2014)." },
  { id: "1.3-55", t: "1.3", q: "Regulación de la traducción: ¿es frecuente? Ejemplo.", a: "<b>Menos frecuente</b> que la transcripcional y suele ser global (ribosoma, mTOR). Ejemplo: la <b>insulina activa la traducción de leptina</b>." },
  { id: "1.3-56", t: "1.3", q: "Tres mecanismos de degradación de proteínas.", a: "<b>Proteólisis</b>: la más inespecífica (situaciones patológicas).<br><b>Ubiquitinación-proteasoma</b>: específica y regulada.<br><b>Autofagia</b> (autofagia-lisosoma)." },
  { id: "1.3-57", t: "1.3", q: "CRTC2 en ayuno: qué le pasa y por qué.", a: "CRTC2 (coactivador de <b>CREB</b> en el hígado) <b>disminuye</b> a las 18–24 h de ayuno (la proteína, no el mRNA). ↑ <b>SIRT1</b> (desacetilasa), que se une a CRTC2 (inmunoprecipitación) y desacetila una <b>Lys</b> → queda libre para <b>poliubiquitinarse</b> → proteasoma." },
  { id: "1.3-58", t: "1.3", q: "¿Puede una proteína tener dos vidas medias en las mismas condiciones?", a: "Sí: las <b>subunidades del proteasoma</b> son estables <b>en complejo</b> y de vida corta <b>sueltas</b>. Las sueltas las reconoce un <b>adaptador</b>, las ubiquitina una E3 <b>HERC</b> y se degradan (<i>assembly quality control</i>)." },
  // ---------- 2.1 ----------
  { id: "2.1-01", t: "2.1", q: "¿Cuántos receptores nucleares hay en humanos y qué tipo de hormonas los activan?", a: "<b>48</b> (solo en células animales). Los activan hormonas <b>pequeñas y lipídicas</b> que cruzan la membrana: esteroides (glucocorticoides, estrógenos, andrógenos, mineralocorticoides, progestágenos), tiroideas (T3, T4), ácido retinoico, vitamina D, ácidos grasos." },
  { id: "2.1-02", t: "2.1", q: "Clasificación de los receptores nucleares según su relación con el ligando.", a: "<b>Clásicos</b>: ligando muy conocido.<br><b>Huérfanos</b>: ligando desconocido.<br><b>Adoptados</b>: eran huérfanos y se les encontró ligando de alta afinidad.<br><b>Foster homes</b> ('casa de acogida'): tienen ligando identificado pero de <b>baja afinidad</b>; puede que exista otro mejor." },
  { id: "2.1-03", t: "2.1", q: "Características de los receptores nucleares: KA, nº por célula, tamaño y forma de actuar.", a: "KA <b>10⁸–10¹⁰ M⁻¹</b> (KD 10⁻⁸–10⁻¹⁰ M): mucha afinidad.<br><b>1000–10.000</b> receptores/célula.<br><b>400–1000 aa</b> (40–100 kDa).<br>Suelen actuar como <b>dímeros</b> (homo o hetero); algunos como monómeros. Se unen a <b>HRE</b> en los promotores." },
  { id: "2.1-04", t: "2.1", q: "Dominios A–F de un receptor nuclear.", a: "<b>A/B</b> (N-terminal, NTD): variable, contiene <b>AF-1</b>.<br><b>C</b>: <b>DBD</b>, unión al DNA, muy conservado.<br><b>D</b>: bisagra (hinge), flexible; contiene la <b>CTE</b> y suele llevar señal de localización.<br><b>E</b>: <b>LBD</b>, unión al ligando, contiene <b>AF-2</b> y participa en la dimerización.<br><b>F</b> (C-terminal): específico." },
  { id: "2.1-05", t: "2.1", q: "AF-1 vs AF-2.", a: "<b>AF-1</b> (dominio A/B, N-terminal): activación <b>independiente del ligando</b>.<br><b>AF-2</b> (LBD): activación <b>dependiente del ligando</b>.<br>Cada una puede activar por separado, pero juntas tienen efecto <b>sinérgico</b> (máxima actividad). Ahí se unen coactivadores y correpresores (NCoA/R)." },
  { id: "2.1-06", t: "2.1", q: "¿Qué dominio está más conservado entre receptores de la misma familia y por qué el LBD menos?", a: "El <b>DBD</b>: receptores con DBD muy homólogo (ej. GR 91 % respecto a PR) reconocen la misma secuencia de DNA.<br>El <b>LBD</b> tiene menos homología porque debe ser <b>específico</b> para distinguir ligandos parecidos (corticoides vs andrógenos)." },
  { id: "2.1-07", t: "2.1", q: "Nomenclatura de los receptores nucleares.", a: "Letra del ligando en inglés + R (<b>RAR</b> = retinoic acid receptor). Varios genes → letras griegas (RARα, β, γ). Splicing alternativo → números (RARα1, α2). Los huérfanos no llevan R.<br>Nomenclatura oficial por filogenia: <b>NR</b> + número + letra + número (ej. <b>NR1A1</b>)." },
  { id: "2.1-08", t: "2.1", q: "Estructura del DBD: dedos de zinc.", a: "<b>2 módulos de dedo de zinc</b>; en cada uno, un Zn²⁺ interacciona con <b>4 cisteínas</b> (sin ellas no funciona). Uno cerca del extremo amino y otro cerca del carboxilo." },
  { id: "2.1-09", t: "2.1", q: "P-box, D-box y CTE.", a: "<b>P-box</b>: reconoce la secuencia del DNA (un <b>half site</b>: cada monómero se une a media secuencia).<br><b>D-box</b>: <b>dimerización de homodímeros</b> (no en heterodímeros).<br><b>CTE</b> (25 aa, dominio D): interacciona con el DNA y participa en la dimerización." },
  { id: "2.1-10", t: "2.1", q: "Homodímero vs heterodímero en el DNA: orientación y qué dimeriza.", a: "<b>Homodímero</b>: secuencia <b>palindrómica</b>, monómeros en direcciones opuestas (en V); dimerizan por la <b>D-box</b>.<br><b>Heterodímero</b>: repeticiones <b>directas</b>, monómeros en la misma dirección (//); las D-box quedan lejos y dimerizan por el <b>LBD</b>." },
  { id: "2.1-11", t: "2.1", q: "¿Qué le pasa al LBD al unir el ligando (ejemplo RXR)?", a: "El ligando interacciona con una hélice (la rosa) que se pliega hacia dentro, y la <b>hélice 12</b> (azul, AF-2) queda <b>expuesta</b>. Así se puede unir un <b>coactivador</b>, que reconoce hélices α con su motivo <b>LXXLL</b>." },
  { id: "2.1-12", t: "2.1", q: "¿Por qué una mutación a prolina en la hélice que une coactivadores impide la activación?", a: "La <b>prolina nunca está en una hélice α</b>: la rompe. Sin hélice, el coactivador (motivo LXXLL) no puede interaccionar." },
  { id: "2.1-13", t: "2.1", q: "Correpresor sobre RAR: ¿cómo bloquea y cómo se suelta?", a: "El correpresor tiene una <b>lámina β</b> que se une en antiparalelo a una lámina (S3) del receptor y bloquea la transcripción. Al unirse un agonista, esa lámina S3 se convierte en <b>hélice α</b>, el correpresor se suelta y queda sitio para un coactivador." },
  { id: "2.1-14", t: "2.1", q: "Mecanismo de activación de los receptores de clase I (esteroideos).", a: "1. Receptor inactivo, <b>monómero</b> (citosol o núcleo), unido a <b>chaperonas HSP70 y HSP90</b> (tapan el DBD, sin afinidad por el DNA).<br>2. La hormona se une al LBD → se sueltan las HSP → forma <b>homodímero</b> → núcleo.<br>3. Se une al HRE y recluta coactivadores con actividad HAT (<b>p160, CBP/p300, P/CAF</b>)." },
  { id: "2.1-15", t: "2.1", q: "HRE de los receptores de clase I: GR, MR, PR, AR vs ER.", a: "<b>GR, MR, PR, AR</b>: <b>AGAACA</b>, palindrómico (3 nt de separación). Su DBD es muy homólogo.<br><b>ER</b> (estrógenos): <b>AGGTCA</b>, palindrómico (3 nt). Por eso su homología es menor." },
  { id: "2.1-16", t: "2.1", q: "Otros mecanismos de los receptores esteroideos además de unirse al HRE.", a: "<b>Vía 2</b>: unión a otro factor de transcripción (unión indirecta al DNA).<br><b>Vía 3</b>: inhibición de la transcripción.<br><b>Vía 4</b>: en el citosol activan quinasas (<b>AKT</b>, <b>Src</b>) → efectos rápidos no genómicos y efectos genómicos más lentos." },
  { id: "2.1-17", t: "2.1", q: "Modificaciones postraduccionales de los receptores esteroideos (ejemplo ERα).", a: "Sobre todo <b>fosforilaciones</b> (en ERα la mayoría activadoras), también acetilación, sumoilación, metilación, ubiquitinación, palmitoilación. Suelen ocurrir en la <b>región bisagra</b>. Es el <b>conjunto</b> de modificaciones el que determina el efecto." },
  { id: "2.1-18", t: "2.1", q: "Receptores de estrógenos y cáncer de mama: porcentaje, modelo celular y experimento.", a: "El <b>75 %</b> de los cánceres de mama tienen ER sobreactivado. Línea <b>MCF-7</b> en xenograft (ratón inmunodeprimido).<br>Grupos: vehículo (no crece), <b>E2</b> (crece mucho), <b>E2 + tamoxifeno</b> (no progresa). El estradiol aumenta proliferación y reduce apoptosis." },
  { id: "2.1-19", t: "2.1", q: "¿Qué control falta en el experimento del tamoxifeno?", a: "Un grupo <b>solo con tamoxifeno</b>, para comprobar que las células mueren por falta de hormona y no por un efecto tóxico del fármaco." },
  { id: "2.1-20", t: "2.1", q: "¿Cómo actúa el tamoxifeno a nivel estructural? ¿Y el RU486?", a: "<b>Tamoxifeno</b>: análogo del estradiol, se une al mismo sitio del ER pero la <b>hélice α12 queda plegada</b> sobre la estructura → no se unen coactivadores y entran correpresores → antagonista.<br><b>RU486</b>: se une al receptor de <b>progesterona</b> e induce la unión de correpresores → impide la gestación." },
  { id: "2.1-21", t: "2.1", q: "Clases II, III y IV de la familia tiroides / retinoico / vitamina D.", a: "<b>Clase II</b> (la más numerosa): <b>heterodímeros con RXR</b> (TR, RAR, VDR, PPAR, LXR, FXR).<br><b>Clase III</b>: <b>homodímeros</b> (ej. RXR-RXR, DR1).<br><b>Clase IV</b>: <b>monómeros</b>." },
  { id: "2.1-22", t: "2.1", q: "Receptores de clase II: secuencia de DNA y qué dominio dimeriza.", a: "Repeticiones <b>directas (DR)</b> de <b>AGGTCA</b> (no palindrómicas); varía la <b>n</b> (nt entre repeticiones). Dimerizan por el <b>LBD</b>, no por el DBD.<br>Excepción: <b>FXR</b> reconoce repeticiones <b>invertidas (IR)</b>." },
  { id: "2.1-23", t: "2.1", q: "Mecanismo de los receptores de clase II sin y con ligando.", a: "<b>Sin ligando</b>: ya están en el <b>núcleo, unidos al DNA</b> como heterodímeros, bloqueados por <b>correpresores</b> (HDAC, cromatina cerrada).<br><b>Con ligando</b>: cambio de conformación → se va el correpresor y entran <b>coactivadores</b> (HAT) → transcripción." },
  { id: "2.1-24", t: "2.1", q: "Clase I vs clase II: localización sin ligando, dímero y secuencia.", a: "<b>Clase I</b>: sin ligando en <b>citosol</b> con HSP; <b>homodímeros</b>; <b>palíndromos</b>.<br><b>Clase II</b>: sin ligando en el <b>núcleo unidos al DNA</b> con correpresores; <b>heterodímeros con RXR</b>; <b>repeticiones directas</b>." },
  { id: "2.1-25", t: "2.1", q: "Metabolismo de la vitamina A: enzimas y productos.", a: "Retinol →(<b>retinol deshidrogenasa</b>: –OH → –CHO)→ <b>retinal</b> (visión) →(<b>retinaldehído deshidrogenasa, RALDH</b>: –CHO → –COOH)→ <b>ácido all-trans retinoico</b> (transcripción, morfogénesis, desarrollo)." },
  { id: "2.1-26", t: "2.1", q: "Experimento en ratas con déficit de vitamina A: ¿qué rescata el ácido retinoico y qué no?", a: "El ácido retinoico <b>evita las malformaciones</b> (morfogénesis), pero <b>no la visión</b>: no llega bien a la retina, y para la visión hace falta <b>retinal</b>." },
  { id: "2.1-27", t: "2.1", q: "Receptores RAR: genes y ligando.", a: "<b>3 genes</b> (RARα, β, γ) con alta homología en DBD (algo menos en LBD); difieren en cuándo y dónde se expresan. Su ligando de más afinidad es el <b>ácido all-trans retinoico</b>; también une 9-cis RA." },
  { id: "2.1-28", t: "2.1", q: "Experimento de cotransfección: qué lleva cada plásmido y qué se mide.", a: "<b>Plásmido 1</b>: cDNA del receptor (RAR).<br><b>Plásmido 2</b>: <b>RARE</b> (HRE) + promotor basal + gen reporter (<b>luciferasa</b>).<br>Se añade el ligando y se mide la <b>luz</b>: indica la actividad transcripcional dependiente de ligando. Sin el plásmido 1, solo hay actividad basal." },
  { id: "2.1-29", t: "2.1", q: "Knock-out de RAR: problemas y soluciones.", a: "Un KO simple puede no tener efecto por <b>compensación</b> de los otros genes (hay que hacer dobles o triples KO) o ser <b>letal embrionario</b> → KO condicionado con <b>Cre-LoxP</b>.<br>El triple KO de RAR reproduce las malformaciones del déficit de ácido retinoico." },
  { id: "2.1-30", t: "2.1", q: "RXR: cómo se descubrió, por qué la X y cuál es su ligando.", a: "Con una sonda de RARα se encontraron genes con <b>62 %</b> de homología en DBD y <b>27 %</b> en LBD. Era huérfano (ligando desconocido, de ahí la X). Su ligando es el <b>9-cis RA</b> (lo genera una isomerasa citoplasmática)." },
  { id: "2.1-31", t: "2.1", q: "¿Qué forma de ácido retinoico reconoce RAR y cuál RXR?", a: "<b>RAR</b>: all-trans RA y 9-cis RA.<br><b>RXR</b>: solo <b>9-cis RA</b> (no une all-trans)." },
  { id: "2.1-32", t: "2.1", q: "Ratón transgénico RARE-LacZ y KO de RALDH2: ¿qué se ve?", a: "<b>LacZ</b> codifica la <b>β-galactosidasa</b>: con X-Gal da <b>color azul</b> donde actúa el ácido retinoico (hoy se usaría GFP).<br>En el KO de <b>RALDH2</b> no se sintetiza ácido retinoico: el embrión <b>no se tiñe de azul</b> y su desarrollo se altera." },
  { id: "2.1-33", t: "2.1", q: "Ligandos de los receptores huérfanos adoptados: PPAR, LXR, FXR, VDR.", a: "<b>PPAR</b>: ácidos grasos y derivados.<br><b>LXR</b>: <b>oxiesteroles</b> (colesterol oxidado).<br><b>FXR</b>: <b>ácidos biliares</b>.<br><b>VDR</b>: vitamina D." },
  { id: "2.1-34", t: "2.1", q: "¿Qué receptores de clase II no responden a 9-cis RA aunque formen dímero con RXR?", a: "El receptor de <b>hormonas tiroideas (TR)</b> y el <b>VDR</b>. La respuesta a 9-cis RA depende del otro monómero." },
  { id: "2.1-35", t: "2.1", q: "Receptores sin DBD: ¿cómo actúan? Ejemplos.", a: "Se unen al <b>LBD</b> de un receptor monomérico y actúan como coactivador o correpresor. Ejemplos: <b>SHP</b> y <b>Dax-1</b>." },
  { id: "2.1-36", t: "2.1", q: "Estrategia de quimeras para identificar el ligando de LXR.", a: "Quimera <b>LBD de LXR + DBD de GAL4</b> (levadura). Plásmido reporter: <b>4× UAS</b> + promotor basal + luciferasa. Se prueban extractos de tejido: si aumenta la luz, el extracto contiene el ligando y se purifica. Resultado: <b>oxiesteroles</b> (en la fracción lipídica; control, etanol)." },
  { id: "2.1-37", t: "2.1", q: "Identificación del ligando por unión directa in vitro.", a: "<b>Cromatografía de afinidad</b> (HPLC): receptor inmovilizado en la columna (a menudo con una etiqueta y anticuerpo), se pasa el extracto, se eluye lo unido y se identifica por <b>espectrometría de masas</b>." },
  { id: "2.1-38", t: "2.1", q: "Formas de eluir de una columna de anticuerpo anti-FLAG.", a: "<b>Competencia</b> con péptidos FLAG; <b>detergentes fuertes</b> (SDS, desnaturaliza); <b>cambio de pH</b> (ej. pH 2: no desnaturaliza, por eso es mejor)." },
  { id: "2.1-39", t: "2.1", q: "Identificación del ligando de PPARα in vivo.", a: "Ratón <b>KO de PPARα</b> + <b>adenovirus</b> con PPARα marcado con <b>FLAG</b> (se acumula en el hígado) → homogeneizado de hígado → columna con anticuerpo anti-FLAG → espectrometría de masas. Ligando: un <b>fosfolípido</b> (16:0/18:1-GPC)." },
  { id: "2.1-40", t: "2.1", q: "Etiquetas (epítopos) más usadas.", a: "<b>FLAG</b> (6–10 aa), <b>His6x</b> (6 histidinas), <b>Myc</b> (fragmento del factor Myc), <b>GST</b> (glutatión-S-transferasa, 27 kDa; se purifica con glutatión en columna)." },
  { id: "2.1-41", t: "2.1", q: "Sistema FRET para detectar coactivadores: componentes y cuándo hay luz.", a: "Receptor con etiqueta <b>GST</b> + anticuerpo anti-GST con <b>terbio</b>. Librería de péptidos coactivadores marcados con <b>fluoresceína</b>. Se excita el terbio: solo si el coactivador está <b>muy cerca</b> (unido al receptor con ligando) la energía pasa a la fluoresceína y <b>emite luz</b>." },
  { id: "2.1-42", t: "2.1", q: "PPARs: genes, clase, secuencia y tejidos.", a: "<b>3 genes</b>: PPARα, δ y γ. Clase II (heterodímero <b>PPAR-RXR</b>), reconocen <b>DR-1</b>.<br><b>α</b>: hígado, corazón, músculo, tejido adiposo <b>pardo</b>; <b>δ</b>: <b>ubicuo</b> (diapositiva: \"músculo y otros\"). α y δ → captación de ácidos grasos, <b>β-oxidación</b> y cuerpos cetónicos (ayuno, ejercicio).<br><b>γ</b>: tejido adiposo <b>blanco</b> → <b>adipogénesis</b>, acumulación de TAG (sedentarismo, ingesta alta)." },
  { id: "2.1-43", t: "2.1", q: "Ligandos y fármacos de PPARα y PPARγ.", a: "<b>PPARα</b>: PUFA (ω-3, ω-6), derivados de ácidos grasos (fosfolípidos 16:0/18:1 GPC, 18:0/18:1 GPC), leucotrienos (LTB4). Fármacos: <b>fibratos</b> (↑ β-oxidación).<br><b>PPARγ</b>: PUFA, prostaglandinas, derivados de ácidos grasos. Fármacos: <b>tiazolidinedionas</b> (↑ sensibilidad a insulina)." },
  { id: "2.1-44", t: "2.1", q: "LXR en macrófagos: ¿cómo elimina colesterol?", a: "LXRβ (se expresa en macrófagos). El macrófago oxida el colesterol a <b>oxiesteroles</b> → activan <b>LXR-RXR</b> → transcripción de un transportador de colesterol → sale como <b>HDL</b> → al hígado. Su fallo se asocia a <b>aterosclerosis</b>." },
  { id: "2.1-45", t: "2.1", q: "LXR en el hígado: dos funciones.", a: "1. Activa genes de <b>transportadores de colesterol</b>.<br>2. Activa <b>CYP7A</b> (citocromo P450, hidroxila el C7): es la enzima <b>limitante</b> de la síntesis de <b>ácidos biliares</b>." },
  { id: "2.1-46", t: "2.1", q: "FXR: feedback negativo sobre la síntesis de ácidos biliares (enterocito y hepatocito).", a: "<b>Enterocito</b>: ácidos biliares → FXR → transcripción de <b>FGF19</b> → sangre → hígado → inhibe <b>CYP7A</b>.<br><b>Hepatocito</b>: ácidos biliares → FXR-RXR → transcripción de <b>SHP</b> → correpresor directo de <b>CYP7A</b>." },
  { id: "2.1-47", t: "2.1", q: "Estrategia de unión directa <i>in vitro</i> para identificar el ligando de un huérfano.", a: "Receptor <b>inmovilizado en una columna</b> → se pasan extractos → el ligando queda retenido → <b>elución</b> → identificación por <b>HPLC</b> y <b>espectrometría de masas</b>." },
  { id: "2.1-48", t: "2.1", q: "FRET con RXRβ: ¿quién es el donador y quién el aceptor? Longitudes de onda.", a: "<b>Donador: terbio</b> (en el anti-GST), se excita a <b>340 nm</b>. <b>Aceptor: fluoresceína</b> (en el péptido coactivador), emite a <b>520 nm</b>. Solo hay señal a 520 nm si están <b>muy cerca</b> (ligando unido → coactivador reclutado). Usos: cribar <b>bancos de moléculas</b> y <b>kits comerciales</b> para nuevos fármacos.", n: "Es el terbio el que excita a la fluoresceína, no al revés." },
  { id: "2.1-49", t: "2.1", q: "PPARs: ¿en qué procesos actúan como sensores metabólicos? Acción común a todos.", a: "Metabolismo <b>lipídico</b> y <b>energético</b>, homeostasis de la <b>glucosa</b> y <b>diferenciación del adipocito</b>. Todos pueden tener acción <b>antiinflamatoria</b>. Balance: α/δ → <b>oxidación</b>; γ → <b>acumulación</b>." },
  { id: "2.1-50", t: "2.1", q: "Los tres fosfolípidos ligando de PPAR de la diapositiva: tejido y función.", a: "<b>16:0/18:1 GPC</b> (PPARα): hígado, respuesta al <b>ayuno</b>.<br><b>18:0/18:1 GPC</b> (PPARα): hígado, circula en sangre y activa PPARα del <b>músculo</b>, gasto según <b>ritmos circadianos</b>.<br><b>1-O-octadecenil-2-palmitoil-3-glicerofosfocolina</b> (PPARγ): tejido adiposo, activa la <b>adipogénesis</b>.<br>→ El ligando varía según tejido y situación fisiológica." },
  { id: "2.1-51", t: "2.1", q: "Ligandos naturales exclusivos de PPARα y de PPARγ (los compartidos son PUFA ω3/ω6 y derivados de ácidos grasos).", a: "PPARα: <b>LTB4</b> (leucotrieno).<br>PPARγ: <b>PGJ2</b> y derivados (prostaglandina).<br>El LBD es <b>muy flexible</b>: se une a moléculas diversas." },
  { id: "2.1-52", t: "2.1", q: "Ácidos y sales biliares: síntesis, destino, función y papel de la flora intestinal.", a: "Se sintetizan a partir del colesterol (<b>CYP7A1</b>, etapa limitante), se <b>secretan en la bilis</b>; acción <b>detergente</b>: solubilizan colesterol hepático y lípidos de la dieta. La <b>flora intestinal</b> puede modificarlos y <b>aumentar su afinidad por FXR</b>." },
  // ---------- 2.2 ----------
  { id: "2.2-01", t: "2.2", q: "¿Qué tipo de ligandos usan los receptores tirosina quinasa (RTK)? Excepción importante.", a: "Sobre todo <b>factores de crecimiento</b> (más de 50 descritos: PDGF, EGF, IGF, FGF, NGF…). Excepción: el <b>receptor de insulina</b>, que capta una hormona." },
  { id: "2.2-02", t: "2.2", q: "PDGF: familia, origen y forma de actuar.", a: "Factor de crecimiento derivado de <b>plaquetas</b> (familia de 10). Lo secretan las plaquetas activadas: estimula la proliferación de células que reparan tejidos (fibroblastos, músculo liso). Actúa como <b>homodímero</b>. Se usa en terapia con concentrados de plaquetas." },
