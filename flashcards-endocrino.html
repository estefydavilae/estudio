  { id: "2.2-03", t: "2.2", q: "Dominios de un RTK.", a: "<b>Extracelular</b>: específico de cada familia (dominios ricos en Cys, tipo inmunoglobulina).<br><b>Transmembrana</b>: ~<b>20 aa</b> hidrofóbicos.<br><b>Intracelular</b>: dominio <b>tirosina quinasa</b>, común a todos." },
  { id: "2.2-04", t: "2.2", q: "¿Cómo se encuentran los RTK sin ligando? Excepción.", a: "Como <b>monómeros</b>; dimerizan al unir el factor de crecimiento.<br>Excepción: receptores de <b>insulina e IGF</b>, que ya son dímeros (unidos por <b>puentes disulfuro</b>) sin ligando." },
  { id: "2.2-05", t: "2.2", q: "Tirosina quinasas citoplasmáticas (no receptores).", a: "<b>JAK</b>: se asocian a receptores sin actividad quinasa y actúan como su quinasa.<br><b>Src</b>: citoplasmática, anclada a la membrana por un lípido." },
  { id: "2.2-06", t: "2.2", q: "Familia EGF: miembros y cómo se activa HB-EGF.", a: "EGF, TGFα, HB-EGF, anfirregulina, neurregulinas. Se sintetizan como <b>prohormonas transmembrana</b>.<br>HB-EGF se libera por la <b>metaloproteasa ADAM</b> (sensible a efectos mecánicos, ej. hipertrofia cardíaca) → péptido de ~<b>50 aa</b> → activa receptores <b>ErbB</b> de forma local (afinidad por heparán sulfato)." },
  { id: "2.2-07", t: "2.2", q: "Activación de un RTK paso a paso.", a: "1. Monómeros <b>autoinhibidos</b> (un bucle tapa el centro activo).<br>2. El ligando (normalmente dimérico) acerca dos receptores → <b>dímero</b>.<br>3. Cambio de conformación: se abre el centro activo y entra <b>ATP</b>.<br>4. <b>Transfosforilación</b>: cada monómero fosforila el activation loop del otro y luego otras Tyr fuera del dominio catalítico (sitios de anclaje)." },
  { id: "2.2-08", t: "2.2", q: "Especificidad de reconocimiento de p-Tyr del receptor: PLCγ, PI3K y Shc.", a: "<b>PLCγ</b> (SH2): <b>Pro</b> 2 aa después (C-t) de la p-Tyr.<br><b>PI3K</b> (SH2): <b>Met</b> 2 aa después (C-t) → pYXXM.<br><b>Shc</b> (PTB): <b>Asn-Pro (NP)</b> antes (N-t) → NPXpY." },
  { id: "2.2-09", t: "2.2", q: "¿Cómo se demuestra experimentalmente qué aa del receptor es importante para unir PI3K?", a: "<b>Coinmunoprecipitación</b> del receptor con la proteína de interés, y un plásmido con el receptor <b>mutado</b> en ese aa: si ya no se une, el aa es necesario." },
  { id: "2.2-10", t: "2.2", q: "Vía Ras-MAPK desde el EGFR hasta ERK.", a: "EGFR fosforilado → <b>Grb2</b> (SH2 + 2 SH3) → <b>Sos</b> (GEF; rica en Pro) → <b>Ras</b>-GDP pasa a <b>Ras-GTP</b> (anclado a la membrana por un lípido) → <b>Raf</b> (MAPKKK, Ser/Thr) → <b>MEK</b> (MAPKK, fosforila Thr y Tyr) → <b>ERK</b> (MAPK) → factores de transcripción y enzimas." },
  { id: "2.2-11", t: "2.2", q: "MEK: ¿qué tipo de quinasa es?", a: "Una quinasa <b>dual Thr/Tyr</b>: fosforila ERK en Thr y en Tyr (activation loop: <b>T183 y Y185</b>)." },
  { id: "2.2-12", t: "2.2", q: "¿Por qué hacen falta proteínas scaffold en la cascada MAPK?", a: "Las MAPK están cerca de la membrana pero <b>no ancladas</b>, y MEK y ERK <b>no tienen SH2</b>. El scaffold reúne MAPKKK, MAPKK y MAPK para que se fosforilen de forma rápida y eficiente." },
  { id: "2.2-13", t: "2.2", q: "¿Qué pasa si Ras está siempre activo?", a: "La vía queda activada de forma constitutiva → proliferación descontrolada → <b>tumor</b>. Igual si otra proteína de la cascada es constitutivamente activa." },
  { id: "2.2-14", t: "2.2", q: "Regulación de la transcripción por ERK: p90RSK, SRF, TCF, SRE.", a: "ERK activa <b>p90RSK</b> (fosforila S6 ribosomal; en el núcleo fosforila <b>SRF</b>). ERK también entra al núcleo y fosforila <b>TCF</b>. SRF + TCF se unen al <b>SRE</b> (Serum Response Element) → transcripción de genes de respuesta rápida como <b>c-fos</b>." },
  { id: "2.2-15", t: "2.2", q: "Genes de respuesta rápida (early) vs tardía (late) tras factores de crecimiento.", a: "<b>Early</b> (~50 genes, la mayoría factores de transcripción): <b>fos</b>, jun. Proteínas de vida media corta; ERK fosforila fos para estabilizarla.<br><b>Late</b>: regulados por fos-jun (<b>AP-1</b>): <b>ciclina D1</b> (ciclo celular) y <b>MAPK fosfatasa</b> (feedback negativo que apaga la señal)." },
  { id: "2.2-16", t: "2.2", q: "Ejemplos de MAPK y qué es el crosstalk.", a: "<b>ERK1/2, JNK1-3, p38</b> (p38: estrés, daño al DNA, radiación, inflamación). Distintos estímulos activan distintas cascadas MAPK, que pueden <b>entrecruzarse</b> (crosstalk)." },
  { id: "2.2-17", t: "2.2", q: "PI3K: qué posición fosforila, clases y fosfatasa que la contrarresta.", a: "Fosforila siempre el <b>C3</b> del inositol (clases I, II, III según sustrato). PI(4,5)P₂ → <b>PI(3,4,5)P₃</b>.<br><b>PTEN</b> desfosforila la posición 3; sus mutaciones inactivantes causan <b>tumores</b>." },
  { id: "2.2-18", t: "2.2", q: "Subunidades de la PI3K de clase I.", a: "<b>p85</b>: reguladora, con dominio <b>SH2</b> (se une al receptor).<br><b>p110</b>: catalítica." },
  { id: "2.2-19", t: "2.2", q: "Activación de AKT: quién la fosforila y dónde.", a: "AKT (dominio PH) se une al PIP₃. <b>PDK1</b> la fosforila en <b>T308</b> (parcialmente activa) y <b>mTORC2</b> en <b>S473</b> (totalmente activa). Necesita obligatoriamente la <b>doble fosforilación</b>; entonces se separa de la membrana y fosforila sustratos (metabolismo de glucosa, síntesis proteica, apoptosis, proliferación)." },
  { id: "2.2-20", t: "2.2", q: "Fin de la señal a nivel del RTK.", a: "<b>Tirosina fosfatasas (PTP)</b> como <b>SHP1</b> (2 SH2 + dominio fosfatasa) desfosforilan el receptor.<br><b>E3 ligasas</b> como <b>Cbl</b> (SH2) multiubiquitinan el receptor → <b>endocitosis</b> → reciclaje o lisosoma. <b>NEDD4</b> ubiquitina adaptadores.", n: "Tu anotación dice que Cbl marca el receptor 'para apoptosis': es para endocitosis y reciclaje o degradación. Tampoco es la ubiquitinación K48 que manda al proteasoma." },
  { id: "2.2-21", t: "2.2", q: "Fin de la señal a nivel post-receptor.", a: "<b>MAPK fosfatasas</b> inactivan MAPK; <b>PTEN</b> revierte la acción de PI3K. Mutaciones en ellas → activación constitutiva de MAPK o PI3K." },
  { id: "2.2-22", t: "2.2", q: "Receptores asociados a JAK: ligandos y qué les falta.", a: "<b>GH, leptina, prolactina, eritropoyetina (EPO)</b>, citoquinas (interleucinas, interferones). <b>No tienen actividad quinasa intrínseca</b>: llevan asociada una JAK." },
  { id: "2.2-23", t: "2.2", q: "EPO: función y por qué es dopante.", a: "Activa su receptor en <b>células madre hematopoyéticas</b> → más eritrocitos → más transporte de O₂ → más resistencia muscular." },
  { id: "2.2-24", t: "2.2", q: "Vía JAK-STAT paso a paso.", a: "1. Receptor dímero con JAK inactiva asociada.<br>2. El ligando cambia la conformación → las JAK se <b>transfosforilan en Tyr</b>.<br>3. JAK fosforila Tyr del receptor.<br>4. <b>STAT</b> (citosólica) se une por su <b>SH2</b> y JAK la fosforila.<br>5. STAT se suelta y forma <b>dímero</b> (SH2 de una con p-Tyr de la otra) → núcleo → secuencia <b>GAS</b>." },
  { id: "2.2-25", t: "2.2", q: "Dominios de STAT.", a: "Unión al DNA, <b>SH2</b>, <b>transactivación</b> (une coactivadores como p300, con HAT) y <b>coiled-coil</b> (estabiliza)." },
  { id: "2.2-26", t: "2.2", q: "Inhibidores de la vía JAK-STAT.", a: "<b>Tirosina fosfatasas</b> (receptor), <b>fosfatasas nucleares</b> (STAT) y proteínas <b>SOCS</b>: tienen SH2, se unen a p-Tyr del receptor y lo bloquean, y reclutan E3 ligasas. La transcripción de SOCS la activa el propio STAT (feedback negativo)." },
  { id: "2.2-27", t: "2.2", q: "¿Qué factor de las familias de la diapositiva 5 NO actúa por un TKR? ¿Y TGFα?", a: "<b>TGFβ</b>: su receptor es <b>Ser/Thr quinasa</b> (tema 2.3). <b>TGFα</b> sí: es de la <b>familia EGF</b> (EGF, TGFα, HB-EGF, anfirregulina, neurregulinas) → receptores ErbB.", n: "Trampa típica TGFα vs TGFβ." },
  { id: "2.2-28", t: "2.2", q: "PDGF: año, origen, dianas, forma y familia.", a: "Identificado en <b>1971</b>; lo secretan las <b>plaquetas activadas</b> en la coagulación; estimula la proliferación de <b>fibroblastos y músculo liso</b> → <b>reparación de tejidos</b>. Es un <b>dímero</b> (AA, BB, AB). Familia de <b>10</b>. Se usa en concentrados de plaquetas (articulaciones, lesiones deportivas, estética)." },
  { id: "2.2-29", t: "2.2", q: "¿Qué significa que un TKR tenga el dominio quinasa partido (<i>kinase insert region</i>)? ¿Cuáles lo tienen?", a: "El dominio TK intracelular no es un bloque continuo: está <b>cortado en dos mitades</b> por una secuencia extra metida en medio (la <i>kinase insert</i>), que suele tener tirosinas que, fosforiladas, sirven de anclaje.<br>Lo tienen <b>PDGFR (y MCSFR), FGFR y VEGFR</b>, que además comparten los dominios <b>Ig</b> extracelulares.<br>EGFR y el receptor de insulina tienen el dominio TK <b>continuo</b>." },
  { id: "2.2-48", t: "2.2", q: "¿Cuál es el receptor del NGF y qué respuesta produce?", a: "<b>TrkA</b> (TKR con dominios Ig) → <b>supervivencia y crecimiento de las neuronas</b>." },
  { id: "2.2-49", t: "2.2", q: "¿Cuántos factores de crecimiento hay descritos y cuál es la respuesta más frecuente de los TKR?", a: "<b>Más de 50</b>. Respuesta más frecuente: <b>proliferación y crecimiento</b> (también supervivencia, diferenciación, migración)." },
  { id: "2.2-30", t: "2.2", q: "¿Cómo regula MAPK los genes <i>fos</i> y <i>c-jun</i>?", a: "<b>fos</b>: MAPK induce su <b>transcripción</b> (SRE) y además <b>fosforila la proteína fos y la estabiliza</b>. <b>c-jun</b>: MAPK fosforila el FT <b>MEF2C</b>, que aumenta la expresión de c-jun. Hay unos <b>50 genes de respuesta rápida</b>, sobre todo FT." },
  { id: "2.2-31", t: "2.2", q: "Los 3 módulos MAPK: estímulo y quinasas.", a: "<b>Factores de crecimiento</b>: Raf-1 → MEK1/2 → <b>ERK1/2</b>.<br><b>Estrés, UV, calor, citoquinas</b>: MEKK1/4, MLK → MEK4/7 → <b>JNK1-3</b>.<br><b>Célula-célula</b> (Rho, Rac/CDC42), estrés, inflamación, daño al DNA: MEKK2/3, TAO → MEK3/6 → <b>p38</b>.<br>Por encima pueden estar las <b>MAP4K</b> (GCK, PAK). Hay <b>crosstalk</b> entre vías." },
  { id: "2.2-32", t: "2.2", q: "Clases de PI3K: sustrato y producto. ¿Qué posición fosforilan siempre?", a: "Siempre la <b>posición 3</b> del inositol.<br><b>Clase I</b> (IA p110α/β/δ; IB p110γ): PI(4,5)P₂ → <b>PIP₃</b>.<br><b>Clase II</b> (C2α/β/γ): PI4P → PI(3,4)P₂.<br><b>Clase III</b> (<b>Vps34</b>): PI → PI3P.<br>Nunca se fosforilan las posiciones <b>2 ni 6</b>." },
  { id: "2.2-33", t: "2.2", q: "Fosfatasas que apagan el PIP₃.", a: "<b>PTEN</b>: <b>3-fosfatasa</b> (PIP₃ → PI(4,5)P₂); es un supresor tumoral y sus mutaciones inactivantes llevan a tumores. <b>SHIP1/2</b>: <b>5-fosfatasas</b> (PIP₃ → PI(3,4)P₂)." },
  { id: "2.2-34", t: "2.2", q: "Dominios de Cbl y cómo ubiquitina al EGFR.", a: "<b>TKB</b> (une la pY del receptor, pY1045), <b>linker</b> con una Tyr, <b>RING finger</b> (E3: recoge la E2-Ub), <b>PRO</b> (une el SH3 de <b>Grb2</b>, que a su vez se une a pY1068/1086). El receptor fosforila la Tyr de Cbl → gira el linker → se expone el RING → activa alostéricamente la E2 → EGFR <b>multimono- y poliubiquitinado</b> → <b>endocitosis</b>." },
  { id: "2.2-35", t: "2.2", q: "Endocitosis del EGFR: adaptadores, E3 y destinos.", a: "Adaptadores <b>EPS15 y EPSIN-1</b> (ubiquitinados por la E3 <b>NEDD4</b>) → endocitosis → <b>endosoma</b> (pH ácido: el ligando se disocia; <b>HRS</b> reconoce la Ub) → <b>reciclaje</b> a membrana, o <b>ESCRT</b> → <b>MVB</b> → lisosoma (degradación)." },
  { id: "2.2-36", t: "2.2", q: "Mecanismos de final de la señal a nivel del propio TKR.", a: "<b>PTP</b> (ej. <b>SHP1</b>: 2 SH2 + dominio fosfatasa) defosforila las pY; <b>Cbl</b> (E3) ubiquitina → endocitosis; <b>PKC</b> fosforila e inhibe el receptor. Post-receptor: ↑ <b>MAPK-fosfatasa</b> y ↑ <b>PTEN</b>." },
  { id: "2.2-37", t: "2.2", q: "EPO: receptor, célula diana y efecto. ¿Qué pasa sin EPO?", a: "Receptor <b>asociado a JAK</b>: <b>1 EPO une 2 EpoR</b>. Actúa sobre el <b>progenitor eritroide (CFU-E)</b>: con EPO prolifera y se diferencia a eritrocitos maduros; <b>sin EPO, apoptosis</b>. Más glóbulos rojos → más O₂ → sustancia <b>dopante</b>." },
  { id: "2.2-38", t: "2.2", q: "Estructura de STAT (N → C) y cómo dimeriza.", a: "<b>N-terminal – coiled-coil – DBD – linker – SH2 – transactivación</b> (pY ~701, pS cerca del C-terminal). Dimeriza por unión <b>recíproca SH2 ↔ pY</b> de la otra STAT. La TA recluta coactivadores como <b>p300</b> (HAT). Se une a <b>GAS</b> (TTC/ACNNNAA).", n: "El SH2 se une a la <b>fosfotirosina</b>, no al -OH de la tirosina (error de los apuntes)." },
  { id: "2.2-39", t: "2.2", q: "¿Pueden varios receptores usar las mismas JAK/STAT? Ejemplo de vía preferente. ¿Qué otras vías inicia JAK?", a: "Sí: pueden <b>converger</b> en las mismas JAK y STAT o tener una vía preferente: <b>receptor de leptina → STAT3</b>. JAK también inicia <b>Shc, Src, PI3K</b> → MAPK, etc." },
  { id: "2.2-40", t: "2.2", q: "Ficha: c-jun", a: "<b>Qué es:</b> factor de transcripción (dominio <b>bZIP</b>: región básica + cremallera de leucinas), producto de un gen de <b>respuesta rápida</b>.<br><b>Cómo se induce:</b> MAPK fosforila <b>MEF2C</b> → ↑ expresión de c-jun. La <b>JNK</b> (<i>Jun N-terminal kinase</i>) fosforila su extremo N-terminal.<br><b>Función:</b> se une a <b>fos</b> → <b>AP-1</b> → activa la <b>ciclina D1</b> (ciclo) y la <b>MAPK-fosfatasa</b> (fin). Jun también es cofactor de las Smad (TGFβ).", n: "Aviso de clase: saber estructura, función y dominios." },
  { id: "2.2-41", t: "2.2", q: "Ficha: Sos", a: "<b>Qué es:</b> <i>Son of sevenless</i>, el <b>GEF de Ras</b> (cambia <b>GDP → GTP</b>).<br><b>Dominios:</b> catalítico GEF + <b>región rica en prolinas</b> (C-t).<br><b>Cómo actúa:</b> está en el citosol; sus prolinas se unen a los <b>SH3 de Grb2</b>, que está unido por SH2 a la pY del receptor → Sos llega a la membrana junto a <b>Ras</b> (anclado por un lípido) → Ras-GTP → RAF.", n: "Aviso de clase: saber estructura, función y dominios." },
  { id: "2.2-42", t: "2.2", q: "Ficha: c-Src", a: "<b>Qué es:</b> tirosina quinasa <b>citoplasmática</b> (no es receptor), <b>anclada a la membrana por un lípido</b> (miristoilación N-t).<br><b>Dominios:</b> <b>SH3 – SH2 – TK</b> (+ cola C-t reguladora).<br><b>Cómo actúa:</b> se une por SH2 a pY del <b>PDGFR (Y579/581)</b> y del <b>EGFR (920)</b>; también la activan las JAK. Su dominio TK es homólogo al de los TKR.<br><i>Extra:</i> la pTyr527 de la cola se une a su propio SH2 y la mantiene cerrada (inactiva).", n: "Aviso de clase: saber estructura, función y dominios." },
  { id: "2.2-43", t: "2.2", q: "Ficha: STAT", a: "<b>Qué es:</b> <i>Signal Transducer and Activator of Transcription</i>: FT latente en el citoplasma.<br><b>Dominios (N→C):</b> N-t – <b>coiled-coil</b> – <b>DBD</b> – linker – <b>SH2</b> – <b>TA</b> (pY ~701, pS).<br><b>Cómo actúa:</b> SH2 → pY del receptor → <b>JAK</b> la fosforila en Tyr → se suelta → <b>dímero recíproco SH2–pY</b> → núcleo → <b>GAS</b> → recluta p300 (HAT). También la activa el EGFR. Freno: <b>SOCS</b> (inducida por STAT) y fosfatasas nucleares.", n: "Aviso de clase: saber estructura, función y dominios." },
  { id: "2.2-44", t: "2.2", q: "Ficha: RSK (p90RSK)", a: "<b>Qué es:</b> <i>p90 ribosomal S6 kinase</i>, una <b>Ser/Thr quinasa</b> de 90 kDa.<br><b>Cómo actúa:</b> <b>ERK</b> la fosforila en el <b>citosol</b> → fosforila la proteína <b>S6 del ribosoma</b> (síntesis proteica) → <b>entra al núcleo</b> y fosforila <b>SRF</b> → SRF + TCF (fosforilado por ERK) sobre el <b>SRE</b> → <i>c-fos</i>.<br>Es la rama <b>indirecta</b> de ERK hacia el SRE.", n: "Aviso de clase: saber estructura, función y dominios." },
  { id: "2.2-45", t: "2.2", q: "Ficha: Shp2", a: "<b>Qué es:</b> <b>proteína tirosina fosfatasa</b> (= Syp).<br><b>Dominios:</b> <b>SH2 – SH2 – dominio fosfatasa</b>.<br><b>Cómo actúa:</b> se une por SH2 a la <b>pY1009 del PDGFR</b> y quita fosfatos de tirosinas. Su pariente <b>SHP1</b> (misma arquitectura) es la PTP que apaga el receptor.", n: "Aviso de clase: saber estructura, función y dominios. No confundir con SHP, el correpresor sin DBD de FXR (tema 2.1)." },
  { id: "2.2-46", t: "2.2", q: "Ficha: PLCγ", a: "<b>Qué es:</b> fosfolipasa C <b>γ</b>, la isoforma que activan los <b>TKR</b>.<br><b>Dominios:</b> <b>PH</b>, dominio catalítico <b>partido (X…Y)</b> con <b>2 SH2 + SH3</b> en medio, <b>C2</b>.<br><b>Cómo actúa:</b> SH2 → <b>pYxxP</b> (PDGFR <b>Y1021</b>, EGFR <b>Y992</b>) → el receptor la fosforila en Tyr → hidroliza <b>PI(4,5)P₂ → DAG + IP₃</b> → IP₃ → <b>Ca²⁺</b>; DAG + Ca²⁺ → <b>PKC</b> (tema 2.6).", n: "Aviso de clase: saber estructura, función y dominios. PLCγ = TKR; PLCβ = GPCR (Gq)." },
  { id: "2.2-47", t: "2.2", q: "Ficha: MEK", a: "<b>Qué es:</b> MEK1/2 = <b>MAPKK</b>, quinasa de <b>doble especificidad</b> (Thr y Tyr).<br><b>Cómo actúa:</b> <b>RAF</b> la fosforila en <b>Ser</b> → MEK fosforila a <b>ERK</b> en <b>Thr183 y Tyr185</b> (motivo <b>Thr-x-Tyr</b>) de la lazada de activación.<br><b>Particularidad:</b> no tiene SH2; la mantiene junto a RAF y ERK una proteína <b>scaffold</b>.", n: "Aviso de clase: saber estructura, función y dominios." },
  // ---------- 2.3 ----------
  { id: "2.3-01", t: "2.3", q: "Superfamilia TGFβ: miembros y tipo de receptor.", a: "Unos <b>30</b>: <b>activinas e inhibinas</b>, <b>BMPs</b>, <b>GDFs</b>, <b>TGFβ1, 2, 3</b>. Parahormonas <b>diméricas</b> que actúan por receptores con actividad <b>Ser/Thr quinasa</b>.", n: "No confundir con TGFα, que va por un receptor tirosina quinasa (familia EGF)." },
  { id: "2.3-02", t: "2.3", q: "Efectos de TGFβ según el tipo celular.", a: "Suele <b>inhibir el crecimiento</b> en tejidos adultos (para el ciclo celular). <b>Epitelio</b>: para el ciclo, apoptosis, MEC. <b>Fibroblastos</b>: efecto fibrogénico (MEC). <b>Inmunes</b>: antiinflamatorio. <b>Endotelio</b>: migración, morfogénesis. Es una <b>parahormona</b> (paracrina)." },
  { id: "2.3-03", t: "2.3", q: "Síntesis y secreción de TGFβ: complejo latente pequeño y grande.", a: "1. Precursor lineal que <b>dimeriza</b> con 2 puentes disulfuro en el RE.<br>2. La <b>furina</b> corta → TGFβ maduro unido <b>no covalentemente</b> al <b>LAP</b> = <b>complejo latente pequeño</b>.<br>3. Se une por puentes S–S a la <b>LTBP</b> = <b>complejo latente grande</b>, que se secreta.<br>4. Queda retenido en la MEC (fibronectina, fibrilina) como reservorio." },
  { id: "2.3-04", t: "2.3", q: "Receptores de TGFβ: tipos I, II y III.", a: "<b>R1</b>: Ser/Thr quinasa, <b>inactivo</b>, no une directamente TGFβ.<br><b>R2</b>: Ser/Thr quinasa, <b>constitutivamente activo</b>, une TGFβ.<br><b>R3</b>: proteoglicano (betaglicano), solo une el ligando y lo presenta a R2; sin actividad y no siempre está." },
  { id: "2.3-05", t: "2.3", q: "Vía de señalización de TGFβ hasta el núcleo.", a: "1. TGFβ se une a <b>R2</b>, que recluta a <b>R1</b>.<br>2. R2 fosforila R1 en la región <b>GS</b> (rica en Gly y Ser) → R1 activo.<br>3. R1 fosforila <b>Smad2/3</b> (R-Smad) en el motivo <b>SSXS</b> del MH2.<br>4. Se forma un <b>trímer</b> 2 R-Smad + <b>Smad4</b>.<br>5. Las NLS quedan libres → importinas → núcleo → con <b>TFE3</b> y coactivadores (HAT) se unen al DNA en <b>AGAC</b>." },
  { id: "2.3-06", t: "2.3", q: "Genes que activa TGFβ y relación con la metástasis.", a: "<b>p27</b> y p15 (inhibidores del ciclo) y <b>PAI-1</b> (inhibidor del plasminógeno, una proteasa de la MEC). Si la vía está inactiva, la MEC se degrada y las células se mueven → <b>metástasis</b>, invasión y angiogénesis." },
  { id: "2.3-07", t: "2.3", q: "Las 3 familias de Smad.", a: "<b>R-Smad</b> (2, 3; y 1, 5, 8 en BMP): MH1 + MH2 con motivo <b>SSXS</b>; las <b>únicas que se fosforilan</b>.<br><b>Co-Smad</b> (<b>Smad4</b>): MH1 + MH2, <b>no se fosforila</b>. ¿NLS propia? Los apuntes dicen que no, pero las diapositivas 8 y 9 dibujan en Smad4 señal de importación <b>y</b> de exportación nuclear (pendiente de preguntar al profesor).<br><b>I-Smad</b> (<b>6 y 7</b>): solo MH2, inhiben por competencia." },
  { id: "2.3-08", t: "2.3", q: "Dominios MH1 y MH2 de las Smad.", a: "<b>MH1</b> (N-t): unión al <b>DNA</b> y a factores de transcripción; contiene la <b>NLS</b>.<br><b>MH2</b> (C-t): tapa la NLS, interacciona con el receptor, se <b>fosforila</b>, oligomeriza con otras Smad y une coactivadores (<b>CBP/p300</b>).<br>Entre ambos, un <b>linker</b> con muchas fosforilaciones reguladoras." },
  { id: "2.3-09", t: "2.3", q: "¿Por qué no puede formarse un trímer de tres Smad fosforiladas?", a: "Por estructura: el trímer necesita una <b>Smad4</b> (Co-Smad), que no se fosforila." },
  { id: "2.3-10", t: "2.3", q: "¿Cómo inhiben las I-Smad (6 y 7)?", a: "Sin MH1 ni sitio de fosforilación, pero con MH2: se unen a <b>R1</b> e impiden que se fosforilen las R-Smad, o se unen a R-Smad fosforilada formando un complejo no funcional. Ej.: BMP induce Smad6." },
  { id: "2.3-11", t: "2.3", q: "Quinasas que fosforilan el linker de las Smad.", a: "<b>Cdk8/9</b> (estabilizan el trímer y estimulan la transcripción), <b>GSK3</b> y <b>MAPK</b> (relacionadas con el fin de la señal)." },
  { id: "2.3-12", t: "2.3", q: "Subfamilia BMP: R-Smad y factor de transcripción.", a: "R-Smad <b>1, 5 y 8</b>, Co-Smad <b>Smad4</b>, factor de transcripción <b>Oaz</b>." },
  { id: "2.3-13", t: "2.3", q: "Mecanismos que apagan la vía TGFβ.", a: "<b>Ser/Thr fosfatasas</b> (PPM1A, PP2A en R-Smad; PP1 en R1).<br><b>I-Smad</b>.<br><b>Correpresores</b> (<b>SnoN, SKI</b>, reclutan HDAC).<br><b>Ubiquitinación</b> por la E3 <b>SMURF</b> (Smad y receptores; complejo SMURF2-Smad7 ubiquitina el receptor).<br><b>Hormonas antagonistas</b> (inhibina)." },
  { id: "2.3-14", t: "2.3", q: "Estructura del TGFβ maduro: nudo de cisteínas.", a: "Dímero con un puente disulfuro intercatenario; cada monómero tiene <b>3 puentes disulfuro</b> que forman un sándwich de 4 láminas β antiparalelas: el <b>nudo de cisteínas</b>, muy estable frente a proteasas." },
  { id: "2.3-15", t: "2.3", q: "BMP-7 y Noggin.", a: "<b>BMP-7</b>: homodímero, importante en la formación de hueso y el desarrollo; se une a 2 R1 + 2 R2. <b>Noggin</b>: se une al ligando y actúa como antagonista." },
  { id: "2.3-16", t: "2.3", q: "Activina vs inhibina.", a: "<b>Activina</b>: homodímero <b>ββ</b>; vía TGFβ normal (R1, R2, Smad) → ↑ <b>FSH</b> en la hipófisis.<br><b>Inhibina</b>: heterodímero <b>βα</b>; la β se une a R2 y la α al <b>betaglicano (R3)</b> → impide la unión de R1 → bloquea la señal. KO de inhibina → tumores en las gónadas." },
  { id: "2.3-17", t: "2.3", q: "Receptores tipo I de la superfamilia TGFβ: ¿cómo se llaman? Ejemplos de parejas.", a: "Los RI se llaman <b>ALK</b>. TGFβ: TβR-II + <b>TβR-I (ALK5)</b>; activina/GDF11: ActR-IIB + <b>ALK4</b>; BMP4/BMP7: BMPR-II + <b>ALK3,6</b>; BMP7: ActR-II/B + <b>ALK2</b>; AMH/MIS: AMHR-II + ALK2,3,6." },
  { id: "2.3-18", t: "2.3", q: "Subfamilia TGFβ vs subfamilia BMP: R-Smad, Co-Smad y cofactores.", a: "<b>TGFβ/activina</b>: R-Smad <b>2 y 3</b>; cofactores <b>Fast1, Jun</b>…<br><b>BMP</b>: R-Smad <b>1, 5 y 8</b>; cofactor <b>Oaz</b>.<br>En las dos, Co-Smad = <b>Smad4</b>. Se regulan <b>más de 500 genes</b> en cada caso (supresión tumoral: diferenciación, apoptosis; MEC, señalización, citoquinas)." },
  { id: "2.3-19", t: "2.3", q: "¿Qué es SARA?", a: "<b>Smad Anchor for Receptor Activation</b>: proteína acompañante que <b>presenta la R-Smad al receptor</b> para que la fosforile, en los <i>pits</i> de clatrina y endosomas." },
  { id: "2.3-20", t: "2.3", q: "Regulación de Smad3 fuera de la fosforilación por RI.", a: "<b>MH1</b>: fosforilado por CDK2/4, PKC, GSK3; <b>acetilado</b> por p300/CBP; <b>PARilado</b> por PARP-1.<br><b>Linker</b>: fosforilado por <b>CDK8/9</b> (estabilizan el trímer, ↑ transcripción), GSK3, <b>MAPK</b> (ERK, p38, JNK; relacionadas con el final de la señal), TAK-1, CDK2/4. Tiene un motivo <b>PY</b> al que se unen Pin1 y la E3 <b>Nedd4L</b>.<br>El SSXS del C-terminal es la diana del <b>RI</b>." },
  { id: "2.3-21", t: "2.3", q: "Ubiquitinación del receptor de TGFβ por SMURF2–SMAD7.", a: "<b>SMURF2</b> (E3 tipo <b>HECT</b>, con dominios <b>C2</b> y <b>WW</b>) se une por WW a <b>SMAD7</b> (I-Smad: NTD + MH2). SMAD7 se une al receptor por <b>MH2</b> y lleva a SMURF2 → el HECT <b>ubiquitina el receptor</b> → <b>endocitosis</b>.", n: "Comparar con Cbl (E3 tipo RING) en el EGFR." },
  { id: "2.3-22", t: "2.3", q: "Fin de la señal TGFβ: fosfatasas y represión de PAI-1 por Ski.", a: "Defosforilan la R-Smad las Ser/Thr fosfatasas <b>PPM1A y PP2A</b>; <b>PP1</b> defosforila el <b>RI</b>.<br><b>Ski</b> (correpresor inducido por TGFβ, como SnoN) se une a Smad3-P/Smad4 sobre el promotor de PAI-1 → recluta <b>N-CoR → mSin3A → HDAC</b> → desacetilación de histonas → se apaga la transcripción." },
  { id: "2.3-23", t: "2.3", q: "Activina e inhibina: receptor de cada una, efecto en FSH y KO de inhibina.", a: "<b>Activina (ββ)</b>: RII + RI → R-Smad + Smad4 → <b>↑ FSH</b> en la hipófisis.<br><b>Inhibina (αβ)</b>: β se une a <b>RII</b>, α al <b>betaglicano</b> → el <b>RI no se puede unir</b> → sin señal (antagonista funcional).<br><b>KO de inhibina</b>: activina desregulada → <b>tumores en las gónadas</b>.", n: "La inhibina es una hormona, no un factor de transcripción (error de los apuntes)." },
  // ---------- 2.4 ----------
  { id: "2.4-01", t: "2.4", q: "Clasificación de las proteínas de unión a GTP.", a: "<b>Monoméricas</b>: Ras, Rho, Rac, ARF (tráfico vesicular), Ran.<br><b>Heterotriméricas</b> (α, β, γ): acopladas a GPCR.<br><b>Heterodiméricas</b>: <b>Rag</b>.<br>Todas tienen actividad GTPasa intrínseca; las GAP la aceleran." },
  { id: "2.4-02", t: "2.4", q: "¿Cómo se anclan a la membrana las subunidades de la proteína G heterotrimérica?", a: "<b>α</b>: por <b>acilación</b> (ácido palmítico o mirístico en el extremo amino).<br><b>γ</b>: por <b>isoprenilación</b> (isopreno en el extremo carboxilo).<br><b>β</b>: no se ancla; va siempre unida a γ (complejo βγ)." },
  { id: "2.4-03", t: "2.4", q: "¿Cuántos GPCR hay y por qué no hay una proteína G específica para cada receptor?", a: "Más de <b>1000</b> GPCR. Hay muchos menos tipos de subunidades α, β y γ: las combinaciones son <b>compartidas</b> por varios receptores. Los efectores suelen ser enzimas, pero también canales iónicos." },
  { id: "2.4-04", t: "2.4", q: "Estructura de un GPCR.", a: "Una sola cadena con <b>7 dominios transmembrana</b>.<br><b>N-terminal extracelular</b>, a menudo glicosilado; puede haber puentes S–S entre exoloops 1 y 2.<br><b>C-terminal citoplasmático</b>: a veces palmitoilado (forma un bucle) y regulado por fosforilación.<br>Loops: exoloops (fuera) y cytoloops (dentro)." },
  { id: "2.4-05", t: "2.4", q: "¿Por qué el N-terminal de un GPCR puede glicosilarse y tener puentes disulfuro, y el C-terminal no?", a: "En el RE, el N-terminal queda <b>dentro</b> de la vesícula (lumen, donde están la PDI y la glicosilación) y acaba fuera de la célula. El C-terminal queda en el <b>citosol</b> (reductor), así que no forma puentes S–S." },
  { id: "2.4-06", t: "2.4", q: "Receptor β2-adrenérgico: ¿dónde se une la adrenalina?", a: "<b>Entre las hélices transmembrana</b>. Por eso esas hélices, además de ~20 aa hidrofóbicos, tienen aa <b>polares o ácidos</b> que interaccionan con el ligando y dan la especificidad." },
  { id: "2.4-07", t: "2.4", q: "Distintos mecanismos de activación de GPCR según el ligando.", a: "Pequeñas moléculas (adrenalina) entre las hélices TM.<br>Péptidos (<b>glucagón</b>).<br><b>Trombina</b>: proteasa que corta el N-terminal; el nuevo extremo actúa como ligando.<br><b>LH, FSH</b>: se unen a un N-terminal muy grande que se pliega hacia el receptor.<br>Neurotransmisores (<b>Ca²⁺, glutamato, GABA</b>): se unen al N-terminal." },
  { id: "2.4-08", t: "2.4", q: "Ciclo de activación de una proteína G por un GPCR.", a: "1. El ligando activa el receptor.<br>2. El receptor interacciona con la Gα-<b>GDP</b>.<br>3. Sale el GDP y entra <b>GTP</b>: el receptor actúa como <b>GEF</b>.<br>4. Gα-GTP se separa del receptor y de <b>βγ</b>.<br>5. Gα (a veces βγ) activa el <b>efector</b>.<br>6. La GTPasa intrínseca hidroliza el GTP → Gα-GDP vuelve a unirse a βγ." },
  { id: "2.4-09", t: "2.4", q: "Toxina colérica vs toxina pertussis.", a: "Ambas <b>ADP-ribosilan</b> la Gα (usando <b>NAD</b>).<br><b>Colérica</b> → <b>Gαs</b>: queda bloqueada con GTP (sin GTPasa) → <b>siempre activa</b> → ↑ AMPc.<br><b>Pertussis</b> → <b>Gαi</b>: no puede unirse al receptor → queda <b>inactiva</b> (GDP) → no inhibe la adenilato ciclasa → <b>también ↑ AMPc</b> (se pierde el freno).<br>Colérica: ADP-ribosila una <b>Arg</b> de Gαs necesaria para la GTPasa (el GTP sigue en su sitio). Pertussis: una <b>Cys</b> C-terminal de Gαi. Se usan como <b>herramienta</b> para saber qué G usa una vía." },
  { id: "2.4-10", t: "2.4", q: "Principales Gα y su efector.", a: "<b>Gαs</b>: ↑ adenilato ciclasa (colérica).<br><b>Gαi</b>: ↓ adenilato ciclasa; su βγ abre canales de K⁺ (pertussis).<br><b>Gαq</b>: activa <b>fosfolipasa C</b> → IP3 + DAG.<br><b>Gαt</b> (transducina): activa <b>fosfodiesterasa</b> → ↓ GMPc (colérica y pertussis)." },
  { id: "2.4-11", t: "2.4", q: "Funciones de la subunidad βγ. Ejemplo en el corazón.", a: "Acetilcolina → receptor <b>muscarínico</b> → βγ se separa y abre <b>canales de K⁺</b> → sale K⁺ → <b>hiperpolarización</b> (músculo cardíaco).<br>Además: mantiene inhibida la α, participa en la desensibilización y regula efectores (PLCβ, adenilato ciclasa II y IV)." },
  { id: "2.4-12", t: "2.4", q: "Cuatro ventajas del sistema de proteínas G.", a: "1. <b>Amplificación</b>: con poca ocupación, gran respuesta.<br>2. Varias hormonas activan la <b>misma</b> proteína G (convergencia).<br>3. Una hormona puede activar <b>distintas</b> proteínas G.<br>4. Una hormona puede tener <b>distintos receptores</b> y cada uno distinta proteína G (una estimula y otra inhibe)." },
  { id: "2.4-13", t: "2.4", q: "Proteínas RGS.", a: "<b>Regulators of G protein Signaling</b>: actúan como <b>GAP</b> sobre la Gα, aceleran la hidrólisis del GTP y la inactivan antes. Abundan en <b>neuronas</b> (protegen frente a estímulos constantes: neurotransmisión, luz)." },
  { id: "2.4-14", t: "2.4", q: "Experimento de desensibilización con isoproterenol.", a: "Se preincuban células con isoproterenol <b>0, 10 y 160 min</b>, se aíslan las membranas y se mide la actividad <b>adenilato ciclasa</b>. A más tiempo de preincubación, <b>menor respuesta</b>: el receptor se desensibiliza (menos receptores, por endocitosis)." },
  { id: "2.4-15", t: "2.4", q: "Desensibilización homóloga vs heteróloga.", a: "<b>Homóloga</b>: <b>GRK</b> (G protein-coupled Receptor Kinase, ej. <b>βARK</b>) fosforila el C-terminal del receptor <b>activado</b>; es específica.<br><b>Heteróloga</b>: <b>PKA o PKC</b> fosforilan el receptor; no es específica (tienen muchos sustratos)." },
  { id: "2.4-16", t: "2.4", q: "β-arrestina: qué hace tras la fosforilación del GPCR.", a: "Se une al C-terminal fosforilado y <b>desacopla</b> la proteína G. Recluta <b>AP2 y clatrina</b> → endocitosis → endosoma: lisosoma (degradación) o, con la acidificación, se pierden los fosfatos y el receptor se <b>recicla</b> (resensibilización). También recluta Src, JNK → otras vías MAPK." },
  { id: "2.4-17", t: "2.4", q: "¿Puede ubiquitinarse un GPCR?", a: "Sí: la ubiquitinación de GPCR participa en su endocitosis y degradación (down-regulation)." },
  { id: "2.4-18", t: "2.4", q: "Nobel relacionados con el tema 2.4.", a: "<b>1994</b> (Fisiología o Medicina): <b>Gilman y Rodbell</b>, por las <b>proteínas G</b>.<br><b>2012</b> (Química): <b>Kobilka y Lefkowitz</b>, por los <b>GPCR</b>." },
  { id: "2.4-19", t: "2.4", q: "Números del sistema GPCR y por qué las G no son específicas de un receptor.", a: "<b>~1300 GPCR</b> aislados (adrenérgicos, dopaminérgicos, de hormonas glicoproteicas, de los sentidos, huérfanos). <b>15 α, 6 β, 12 γ</b>. Hay muchos menos tipos de subunidades que de receptores → las proteínas G se <b>comparten</b> (convergencia).<br>Efectores: AC, <b>PLC y PLA2</b>, PDE de GMPc, canales de K⁺ y de Ca²⁺." },
  { id: "2.4-20", t: "2.4", q: "¿Dónde y con qué aminoácidos se une la adrenalina al receptor β₂-adrenérgico?", a: "<b>Entre las hélices TM</b>, cerca de la cara externa: <b>Asp113 (TM3)</b>, <b>Ser203/204/207 (TM5)</b>, Phe289/290 y Asn293 (TM6). Las TM tienen aa <b>polares/ácidos</b> que estabilizan el ligando y dan la especificidad.<br>La adrenalina es una <b>amina</b> (catecolamina), no un lípido." },
  { id: "2.4-21", t: "2.4", q: "Tabla de Gα: efector, 2º mensajero, receptores y toxina.", a: "<b>Gαs</b> (C): AC → ↑AMPc; β-adrenérgico, glucagón, serotonina, vasopresina.<br><b>Gαi</b> (P): ↓AC + canal de K⁺ (por <b>βγ</b>); α₂-adrenérgico, muscarínico.<br><b>Gαolf</b> (C): AC → ↑AMPc; receptores <b>olfativos</b>.<br><b>Gαq</b> (P): PLC → IP₃/DAG; α₁-adrenérgico.<br><b>Gαo</b> (P): PLC; ACh en células endoteliales.<br><b>Gαt</b> (C, P): PDE-GMPc → ↓GMPc; <b>rodopsina</b> (bastones).<br>Adrenérgicos: <b>α₁-q, α₂-i, β-s</b>.", n: "Según la diapositiva, Gαq es sensible a la pertussis (en la bibliografía clásica no lo es)." },
  { id: "2.4-22", t: "2.4", q: "Acciones de Gβγ.", a: "<b>Sobre las proteínas G</b>: mantienen <b>inhibida a α</b>; participan en la <b>desensibilización</b> del GPCR.<br><b>Regulan efectores</b>: ↑ <b>PLCβ</b>, ↑ <b>adenilil ciclasa II y IV</b>, ↑ <b>canales de K⁺</b> (muscarínico en el corazón → hiperpolarización → frena el corazón)." },
  { id: "2.4-23", t: "2.4", q: "Versatilidad de las proteínas G: tres situaciones.", a: "1. <b>Diferentes hormonas → la misma G</b> → mismo efector y misma vía (convergencia).<br>2. <b>Una hormona → diferentes G</b> (Gi, Go, Gq) → vías distintas.<br>3. <b>Una hormona → diferentes receptores → diferentes G</b> (HR1 → Gs, HR2 → Gi) → efectos opuestos; decide el balance (ej. adrenalina β/α₂/α₁)." },
  { id: "2.4-24", t: "2.4", q: "β-arrestina como plataforma: ¿con qué proteínas forma complejo y qué activa?", a: "Se une a las <b>P</b> del C-terminal del GPCR. Con <b>AP2 + clatrina</b> (y la E3 <b>NEDD4</b>) → <b>endocitosis</b>. Con <b>ASK-1, MKK-4, JNK-3</b> → <b>cascada de c-Jun quinasa</b>. Con <b>c-Src</b> → <b>cascada MAPK</b> (ERK, también desde el endosoma).", n: "Los apuntes dicen que estas vías 'amplifican la regulación negativa': en realidad son señales nuevas, independientes de la proteína G." },
  { id: "2.4-25", t: "2.4", q: "Ubiquitinación de GPCR: el ejemplo del CXCR4.", a: "El receptor de quimioquina <b>CXCR4</b> se fosforila en <b>Ser</b> del C-terminal → la E3 <b>ITCH</b> (tipo <b>HECT</b>, con <b>C2 y WW</b>) se une → <b>ubiquitina</b> el receptor → <b>endocitosis y degradación</b>. Misma familia de E3 que NEDD4 y SMURF." },
  // ---------- 2.5 ----------
  { id: "2.5-01", t: "2.5", q: "Los 4 segundos mensajeros principales.", a: "<b>AMPc, GMPc, DAG e IP3</b>." },
  { id: "2.5-02", t: "2.5", q: "AMPc y GMPc: síntesis, diana y degradación.", a: "<b>AMPc</b>: de ATP por la <b>adenilato ciclasa</b> → activa <b>PKA</b>.<br><b>GMPc</b>: de GTP por la <b>guanilato ciclasa</b> → activa <b>PKG</b>.<br>Ambos se degradan a AMP/GMP por <b>fosfodiesterasas</b> (hidrolizan el enlace cíclico). Basales casi indetectables; picos transitorios con la hormona." },
  { id: "2.5-03", t: "2.5", q: "Estructura de la adenilato ciclasa.", a: "Proteína de membrana <b>monomérica</b>: <b>2 dominios transmembrana</b> de <b>6 hélices α</b> cada uno y <b>2 dominios catalíticos</b> intercalados." },
  { id: "2.5-04", t: "2.5", q: "Guanilato ciclasa de membrana vs soluble.", a: "<b>Membrana</b>: <b>homodímero</b>; extracelular (une <b>ANP/BNP</b>), transmembrana, <b>pseudoquinasa</b> (parece quinasa pero no lo es), dimerización y catalítico.<br><b>Soluble</b> (citoplasmática): <b>heterodímero</b> (α, β) con grupo <b>hemo</b> → la activa el <b>NO</b>." },
  { id: "2.5-05", t: "2.5", q: "Regulación de la adenilato ciclasa por hormonas.", a: "<b>Gαs</b> la activa: vasopresina, glucagón, LH, FSH.<br><b>Gαi</b> la inhibe: opioides, somatostatina, angiotensina, adrenalina vía receptor <b>α2</b>.<br>Respuesta muy rápida (ms–s)." },
  { id: "2.5-06", t: "2.5", q: "Tres dianas del AMPc.", a: "1. <b>Canales iónicos</b> (ej. K⁺ en el corazón).<br>2. <b>PKA</b> (Ser/Thr quinasa).<br>3. <b>EPAC 1-2</b>: GEF que activa <b>RAP1/2</b> (exocitosis, citoesqueleto) → PLCε → movilización de Ca²⁺." },
  { id: "2.5-07", t: "2.5", q: "Estructura y activación de la PKA.", a: "<b>R2C2</b> (2 reguladoras + 2 catalíticas), inactiva, anclada por <b>AKAP</b>. Cada R une <b>2 AMPc</b> (4 en total) → las <b>C se liberan</b> como monómeros activos y fosforilan sustratos (Ser/Thr)." },
  { id: "2.5-08", t: "2.5", q: "Amplificación de la señal por AMPc.", a: "Adrenalina a <b>10⁻¹⁰ M</b> → AMPc a <b>10⁻⁶ M</b> (micromolar). Cada AMPc activa PKA y cada PKA fosforila muchas enzimas." },
  { id: "2.5-09", t: "2.5", q: "Regulación de la transcripción por AMPc: PKA, CREB y CBP.", a: "Sin hormona: PKA inactiva en AKAP (membrana nuclear). Con hormona: ↑ AMPc → subunidades C libres → <b>núcleo</b> → fosforilan <b>CREB en Ser-133</b> → se une <b>CBP/p300</b> (HAT) → transcripción de genes con <b>CRE</b> (TGACGTCA)." },
  { id: "2.5-10", t: "2.5", q: "Dominios de CREB.", a: "<b>C-terminal</b>: unión al DNA = dominio básico + <b>cremallera de leucinas</b> (bZip, dimeriza).<br><b>N-terminal</b>: activación, con <b>Q1 y Q2</b> (ricas en glutamina) y entre ellas la <b>P-box</b>, fosforilada por PKA en <b>Ser-133</b>." },
  { id: "2.5-11", t: "2.5", q: "Familia CREB: CREB, CREM, ATF1, ICER.", a: "<b>CREB</b>: activador (Ser-133).<br><b>CREM</b>: gen propio (no es el mismo gen que CREB), Ser-117, 341 aa, 2 promotores: <b>P1</b> (no responde al AMPc) → CREM activador; <b>P2 interno</b> (sí responde al AMPc) → <b>ICER</b>.<br><b>ATF1</b>: 271 aa, Ser-63, <b>un solo dominio Q</b>; activador.<br><b>ICER</b>: 108 aa, solo bZIP, <b>sin dominio de activación</b> → se une al DNA pero no se activa → <b>represor</b>." },
  { id: "2.5-12", t: "2.5", q: "Genes regulados por CREB en el ayuno.", a: "Gluconeogénesis hepática: <b>PEPCK</b>, glucosa-6-fosfatasa, somatostatina…" },
  { id: "2.5-13", t: "2.5", q: "Tres mecanismos que apagan la transcripción por CREB.", a: "1. <b>PP1</b> desfosforila CREB (Ser-133) → se suelta CBP.<br>2. <b>Fosfodiesterasas</b> → ↓ AMPc → PKA vuelve a R2C2.<br>3. <b>ICER</b> (desde el promotor interno P2 de CREM, inducido por AMPc) compite como represor.<br>El máximo de transcripción llega ~1 h después (entrada de la PKA al núcleo)." },
  { id: "2.5-14", t: "2.5", q: "Activación de la guanilato ciclasa soluble por NO (vasodilatación).", a: "Acetilcolina → receptor de la célula <b>endotelial</b> → <b>NO sintasa</b> (de arginina) → el NO difunde (paracrino) a la célula de <b>músculo liso</b> → se une al <b>hemo</b> de la guanilato ciclasa soluble → ↑ GMPc → <b>relajación</b>.<br>La guanilato ciclasa de membrana no responde a NO (no tiene hemo)." },
  { id: "2.5-15", t: "2.5", q: "ANP: dónde se secreta y sus efectos.", a: "Péptido natriurético atrial: lo secretan los <b>cardiomiocitos</b> cuando ↑ el volumen sanguíneo. Activa la guanilato ciclasa de membrana.<br>Suprarrenal: ↓ <b>aldosterona</b>. Riñón: ↑ excreción de Na⁺ y agua. Circulación: ↓ presión. Efecto contrario a la aldosterona." },
  { id: "2.5-16", t: "2.5", q: "Tres dianas del GMPc.", a: "<b>Canales iónicos</b> (Na⁺, Ca²⁺; visión), <b>PKG</b> y <b>fosfodiesterasas</b> (modulador alostérico)." },
  { id: "2.5-17", t: "2.5", q: "PKG vs PKA: estructura y activación.", a: "<b>PKA</b>: R2C2, subunidades separadas.<br><b>PKG</b>: <b>homodímero</b>; cada monómero tiene dominio regulador (<b>LZ</b> dimerización, <b>AD</b> autoinhibición, <b>CNB-A/B</b> que unen GMPc) y catalítico en la <b>misma cadena</b>. Une 2 GMPc por monómero → <b>autofosforilación</b> en Ser/Thr → repulsión de cargas → se abre el centro activo." },
  { id: "2.5-18", t: "2.5", q: "¿Cómo produce la PKG relajación del músculo liso? (3 dianas)", a: "1. Fosforila <b>canales de K⁺</b> → se abren → hiperpolarización → se cierran canales de Ca²⁺ dependientes de voltaje.<br>2. Fosforila el <b>receptor de IP3</b> → no sale Ca²⁺ del RE.<br>3. Activa la <b>MLC fosfatasa</b> → desfosforila la cadena ligera de miosina.<br>Resultado: ↓ Ca²⁺ y relajación." },
  { id: "2.5-19", t: "2.5", q: "PDE5 y Viagra.", a: "La <b>PDE5</b> hidroliza el GMPc y acaba la relajación. La <b>Viagra</b> inhibe la PDE5 → GMPc alto → relajación sostenida del músculo liso → erección." },
  { id: "2.5-20", t: "2.5", q: "Dominios de las fosfodiesterasas.", a: "<b>Catalítico</b> central: une <b>Zn</b>, muy conservado; ahí actúan los inhibidores.<br><b>N-terminal regulador</b>: variable (unión a Ca²⁺/calmodulina, sitios de fosforilación, dominio <b>GAF</b> que une AMPc/GMPc, SH3).<br><b>C-terminal</b>: fosforilable por MAPK; puede anclarse a membrana (prenilación).", n: "Los apuntes dicen 'actividad fosfatasa': es actividad fosfodiesterasa (rompe el enlace fosfodiéster cíclico)." },
  { id: "2.5-21", t: "2.5", q: "Regulación de PDE1, PDE2, PDE3 y PDE5. ¿Cuántas isoformas hay?", a: "<b>11</b> isoformas.<br><b>PDE1</b>: estimulada por Ca²⁺/calmodulina.<br><b>PDE2</b>: estimulada por GMPc.<br><b>PDE3</b>: inhibida por GMPc.<br><b>PDE5</b>: activada por GMPc." },
  { id: "2.5-22", t: "2.5", q: "¿Cómo se sabe si una PDE prefiere AMPc o GMPc?", a: "Por su <b>Km</b> para cada uno: <b>menor Km = más afinidad</b>. PDE2: igual para los dos. PDE4: prefiere AMPc. PDE5: prefiere GMPc (Km 1 µM vs 150 µM para AMPc)." },
  { id: "2.5-23", t: "2.5", q: "Crosstalk entre Ca²⁺, GMPc y AMPc a través de las PDE.", a: "↑ GMPc → activa <b>PDE2</b> (↓ AMPc) e inhibe <b>PDE3</b> (↑ AMPc).<br>↑ Ca²⁺ → calmodulina → <b>PDE1</b> → ↓ AMPc y GMPc.<br>El efecto final depende de qué PDE predomine en la célula." },
  { id: "2.5-24", t: "2.5", q: "AKAP en la membrana nuclear de cardiomiocitos: feedback de PKA y PDE.", a: "AKAP ancla <b>PKA y PDE</b> juntas. ↑ AMPc → PKA activa → fosforila (y activa) la <b>PDE</b> y entra al núcleo. La PDE activa ↓ AMPc → las C vuelven a las R → reposo. Es un feedback negativo local." },
  { id: "2.5-25", t: "2.5", q: "Secuencia consenso de la PKA según la diapositiva.", a: "<b>R/K-R/K-X-S/T-Φ</b> (Φ = aa hidrofóbico)." },
  { id: "2.5-26", t: "2.5", q: "CREB vs CREM: ¿cómo genera cada gen sus isoformas represoras?", a: "<b>CREB</b>: varios <b>ATG</b> de inicio → <b>control traduccional</b> (los ATG internos dan formas truncadas sin transactivación).<br><b>CREM</b>: <b>dos promotores</b> → <b>control transcripcional</b>: P2 interno (inducido por AMPc) → <b>ICER I, Iγ, II, IIγ</b> (exones Ia/Ib del bZIP por splicing)." },
  { id: "2.5-27", t: "2.5", q: "Estímulos que activan las guanilil ciclasas de membrana.", a: "<b>ANP/BNP</b> (y otras hormonas), <b>Ca²⁺ intracelular</b> (fotorreceptores) e incluso el <b>frío</b>. No responden al NO (no tienen hemo)." },
  { id: "2.5-28", t: "2.5", q: "Hormonas que estimulan e inhiben la adenilil ciclasa (diapositiva).", a: "<b>Estimulan (Gs)</b>: vasopresina, glucagón, LH, FSH, TSH, ACTH, adrenalina (β), GnRH, adenosina (A2).<br><b>Inhiben (Gi)</b>: opioides, somatostatina, angiotensina, adrenalina (α₂), adenosina (A1)." },
  { id: "2.5-29", t: "2.5", q: "Tabla de PDE: ¿cómo sabes por qué nucleótido es más afín? Ejemplos.", a: "Por la <b>Km</b>: menor Km = <b>más afinidad</b>.<br><b>PDE4</b>: AMPc 4 µM / GMPc >3000 → <b>específica de AMPc</b> (insensible a GMPc).<br><b>PDE5</b>: AMPc 150 / GMPc 1 → <b>específica de GMPc</b> (diana de la Viagra).<br><b>PDE2</b>: 15/15 → igual para los dos; <b>estimulada por GMPc</b>.<br><b>PDE6</b>: GMPc, fotorreceptores. Hay <b>11 familias</b>." },
  { id: "2.5-30", t: "2.5", q: "Estructura general de las PDE.", a: "<b>N-terminal regulador</b> (variable): une Ca²⁺/CaM, GMPc (<b>dominio GAF</b>), ácido fosfatídico; dimerización, SH3, unión a membrana; sitios de fosforilación de CaMK, PKA, PKG, PKC, PKB.<br><b>Núcleo catalítico conservado (~270 aa)</b>: une <b>Zn²⁺</b>; diana de los inhibidores (inserción de 44 aa en PDE3).<br><b>C-terminal</b>: <b>prenilación</b>; regulado por <b>MAPK</b>." },
  { id: "2.5-31", t: "2.5", q: "mAKAP en el cardiomiocito: ¿cómo se apaga sola la señal de AMPc?", a: "mAKAP (membrana nuclear externa) ancla <b>PKA y PDE juntas</b>. ↑AMPc → se liberan las C → fosforilan la <b>PDE</b> (y algunas van al núcleo) → la PDE fosforilada se <b>activa</b> → ↓AMPc → las C vuelven con las R → reposo. <b>Feedback negativo local.</b>" },
  // ---------- 2.6 ----------
  { id: "2.6-01", t: "2.6", q: "Las 4 fosfolipasas y qué enlace corta cada una.", a: "<b>A1</b>: éster glicerol – 1er acilo.<br><b>A2</b>: éster glicerol – 2º acilo (libera ácido araquidónico).<br><b>C</b>: éster glicerol – fosfato → <b>DAG + IP3</b> (desde PIP₂).<br><b>D</b>: éster fosfato – grupo polar → ácido fosfatídico." },
  { id: "2.6-02", t: "2.6", q: "Experimento de los Hokin (1954).", a: "Células pancreáticas + <b>acetilcolina</b> + <b>³²P</b>: la radiactividad acababa en <b>fosfolípidos de membrana</b>. Demostró un <b>recambio de fosfatidilinositoles</b> estimulado por la señal." },
  { id: "2.6-03", t: "2.6", q: "Regeneración del PIP₂ a partir del DAG.", a: "DAG →(<b>DAG quinasa</b>)→ <b>ácido fosfatídico</b> →(<b>PI sintasa</b>, incorpora inositol <b>no fosforilado</b>)→ PI →(<b>PI quinasa, PIP quinasa</b>)→ PIP → PIP₂." },
  { id: "2.6-04", t: "2.6", q: "Dominios comunes de las PLC específicas de fosfatidilinositol.", a: "Dominios catalíticos <b>X e Y</b>; <b>PH</b> (une fosfolípidos); <b>C2</b> (une Ca²⁺ y aumenta la afinidad por fosfolípidos); <b>EF-hand</b> (une Ca²⁺: se modulan por calcio).", x: true, n: "Aviso de clase: pregunta tipo comentario de las 3 PLC (β, γ, ε): dominios comunes y qué las diferencia." },
  { id: "2.6-05", t: "2.6", q: "Dominios específicos de algunas PLC.", a: "<b>RA</b> (une Rap GTPasa y Ras): <b>PLCε</b>.<br><b>GEF</b> (Ras-GEF): PLCε.<br><b>SH2 y SH3</b> (p-Tyr): <b>PLCγ</b>.", n: "Los apuntes ponen 'SH1': es SH2." },
  { id: "2.6-06", t: "2.6", q: "PLCβ vs PLCγ: cómo se activa cada una.", a: "<b>PLCβ</b>: por proteínas G <b>Gαq</b> (también αi y βγ), tras GPCR (acetilcolina, adrenalina, vasopresina). Gq = indicador de PLCβ.<br><b>PLCγ</b>: tiene <b>SH2/SH3</b> → se une a <b>RTK</b> activados (factores de crecimiento).<br>Las dos hidrolizan PIP₂ → IP3 + DAG." },
  { id: "2.6-07", t: "2.6", q: "PLCε: ¿por qué vías puede activarse?", a: "Por las dos: <b>GPCR</b> y <b>factores de crecimiento</b> (tiene dominio RA para Ras/Rap). También la activan Rap1/2 tras EPAC (AMPc)." },
  { id: "2.6-08", t: "2.6", q: "Características de la PKC.", a: "Grupo heterogéneo de <b>Ser/Thr quinasas</b>, especificidad de sustrato <b>amplia</b>. Su activación se asocia a ↑ proliferación y ↓ diferenciación. Algunas isoformas tienen <b>NLS</b>." },
  { id: "2.6-09", t: "2.6", q: "PKC clásicas, nuevas y atípicas.", a: "<b>Clásicas (cPKC)</b>: necesitan <b>DAG + Ca²⁺</b>.<br><b>Nuevas (nPKC)</b>: sin dominio de Ca²⁺ → solo <b>DAG</b>.<br><b>Atípicas (aPKC)</b>: sin Ca²⁺ y dominio DAG incompleto → <b>independientes de ambos</b>.<br>Todas: dominio de ATP, de sustrato y de <b>pseudosustrato</b>." },
  { id: "2.6-10", t: "2.6", q: "¿Qué es el dominio pseudosustrato de la PKC?", a: "Una secuencia que <b>imita al sustrato</b> y ocupa el centro activo sin ser fosforilada → mantiene la enzima <b>inhibida</b>." },
  { id: "2.6-11", t: "2.6", q: "Preactivación y activación de la PKC clásica.", a: "<b>Preactivación</b>: <b>PDK1</b> fosforila el activation loop → la PKC se <b>autofosforila</b> en la cola C-terminal (2 fosfatos). Sigue plegada.<br><b>Activación</b>: PLC → DAG + IP3; el IP3 libera Ca²⁺. La PKC une <b>Ca²⁺</b> (se abre), va a la <b>membrana</b> y une <b>DAG</b> → totalmente activa." },
  { id: "2.6-12", t: "2.6", q: "Fin de la señal de la PKC y regulación de la expresión génica.", a: "Fin: la <b>DAG quinasa</b> convierte el DAG en ácido fosfatídico.<br>Expresión génica: vía <b>directa</b> (isoformas con NLS entran al núcleo y fosforilan factores de transcripción) o <b>indirecta</b> (cascada de fosforilación desde la membrana)." },
  { id: "2.6-13", t: "2.6", q: "Detección de Ca²⁺: fluorescencia vs luminiscencia.", a: "<b>Fluorescencia</b>: sondas lipófilas quelantes (<b>quin2</b>, <b>FURA</b>, mejor); al unir Ca²⁺ fluorescen en proporción a su concentración.<br><b>Luminiscencia</b>: <b>aequorina</b> (proteína con luciferina); al ser proteína se puede transfectar dirigida a un compartimento (mitocondria, RE, núcleo, citosol)." },
  { id: "2.6-14", t: "2.6", q: "Concentraciones de Ca²⁺: extracelular, citosol en reposo y RE.", a: "Extracelular: <b>1–2 mM</b>. Citosol en reposo: <b>0,1 µM</b> (~10.000 veces menos). RE: <b>400 µM</b> (~4000 veces más que el citosol): es el reservorio." },
  { id: "2.6-15", t: "2.6", q: "¿Por qué el Ca²⁺ citosólico debe estar tan controlado?", a: "Un aumento prolongado activa las <b>calpaínas</b>: proteasas muy inespecíficas asociadas a muerte celular." },
  { id: "2.6-16", t: "2.6", q: "Sistemas que mantienen bajo el Ca²⁺ citosólico.", a: "<b>Salida al exterior</b>: <b>PMCA</b> (ATPasa de Ca²⁺ de la membrana) e <b>intercambiador Na⁺/Ca²⁺</b>.<br><b>Almacén en el RE</b>: <b>SERCA</b> (ATPasa) y proteínas secuestradoras (<b>calsecuestrina, calreticulina</b>).<br>Salida del RE: <b>IP3R</b> y <b>RyR</b>." },
  { id: "2.6-17", t: "2.6", q: "Receptor de IP3 (IP3R): estructura y especificidad.", a: "<b>Homotetrámero</b> (1 IP3 por subunidad, 4 en total). Ligando específico: <b>I(1,4,5)P₃</b>; los <b>fosfatos 4 y 5</b> son clave. Cada subunidad también une Ca²⁺. Regulable por fosforilación.", n: "Los apuntes hablan de 2 genes (R1 y R2, 69 % de homología); en la literatura se describen 3 tipos de IP3R." },
  { id: "2.6-18", t: "2.6", q: "¿Cómo modula el Ca²⁺ citosólico al IP3R?", a: "Ca²⁺ <b>bajo</b> (µM): ↑ sensibilidad → favorece la salida.<br>Ca²⁺ <b>alto</b> (mM): ↓ sensibilidad → frena la salida.<br>El Ca²⁺ es modulador positivo y negativo." },
  { id: "2.6-19", t: "2.6", q: "Receptor de rianodina (RyR).", a: "<b>Homotetrámero</b>, 3 genes (RyR1-3), en RE y <b>retículo sarcoplásmico</b>. <b>No responde a IP3</b>, sí al <b>Ca²⁺</b> citosólico. Lo abren la <b>rianodina</b> (insecticida) y la <b>cafeína</b>." },
  { id: "2.6-20", t: "2.6", q: "Entrada y salida de Ca²⁺ en Golgi y mitocondria.", a: "<b>Golgi</b>: entra por ATPasa de Ca²⁺; sale por canal sensible a IP3.<br><b>Mitocondria</b>: entra por ATPasa y canales; sale por intercambiador Na⁺/Ca²⁺ y el poro <b>MPT</b> (se abre con Ca²⁺ alto)." },
  { id: "2.6-21", t: "2.6", q: "Tres tipos de canales de Ca²⁺ de la membrana plasmática.", a: "1. <b>Dependientes de voltaje</b>: se abren al despolarizar (−90 → +30 mV), muy rápidos (~3000 Ca²⁺/canal·ms) y breves.<br>2. <b>Regulados por receptor</b>: el receptor es el canal (ionotrópico, ej. glutamato) o lo regulan proteínas G / segundos mensajeros (AMPc, GMPc).<br>3. <b>SOCs</b> (store-operated): se abren cuando el RE se vacía." },
  { id: "2.6-22", t: "2.6", q: "¿Cómo sabe el canal SOC que el RE está vacío? (STIM)", a: "<b>STIM</b> (membrana del RE) une Ca²⁺. Con el RE lleno, mantiene los SOC cerrados. Al vaciarse, STIM pierde el Ca²⁺, cambia de conformación, forma <b>clústeres</b> que interaccionan con los <b>SOC</b> y los abren → entra Ca²⁺." },
  { id: "2.6-23", t: "2.6", q: "Calmodulina: cuántos Ca²⁺ une y qué regula.", a: "<b>4 Ca²⁺</b> (2 en el extremo N y 2 en el C). Con Ca²⁺ activa: <b>PDE, adenilato ciclasa, NO sintasa</b>; quinasas <b>CaMK, MLCK, fosforilasa quinasa</b>; la fosfatasa <b>calcineurina</b>; y la <b>ATPasa de Ca²⁺</b> (fin de la señal)." },
  { id: "2.6-24", t: "2.6", q: "CaMK: qué son y ejemplos.", a: "Ser/Thr quinasas dependientes de <b>Ca²⁺-calmodulina</b>, multifuncionales y de especificidad amplia: <b>CaMK I, II, IV, MLCK</b>. Necesitan además <b>autofosforilarse</b>. Ej.: fosforilan <b>CREB</b>." },
  { id: "2.6-25", t: "2.6", q: "Activación de la CaMK II y por qué sigue activa al bajar el Ca²⁺.", a: "Un dominio inhibidor C-terminal tapa el catalítico. Ca²⁺-CaM se une → se libera la inhibición → <b>autofosforilación</b> → totalmente activa. Al bajar el Ca²⁺ se va la CaM, pero el <b>fosfato la mantiene parcialmente activa</b> hasta que una fosfatasa lo quita." },
  { id: "2.6-26", t: "2.6", q: "Vía completa de vasodilatación: de la acetilcolina a la PKG.", a: "Acetilcolina → GPCR (endotelio) → Gq → <b>PLC</b> → IP3 → Ca²⁺ del RE → <b>Ca²⁺-calmodulina</b> → <b>NO sintasa</b> → NO → músculo liso → <b>guanilato ciclasa soluble</b> → GMPc → <b>PKG</b> → relajación." },
  { id: "2.6-27", t: "2.6", q: "Calcineurina: qué es, qué activa y qué fármaco la inhibe.", a: "<b>Ser/Thr fosfatasa</b> activada por Ca²⁺-calmodulina. <b>Desfosforila NF-AT</b> → entra al núcleo → genes de respuesta inmune/inflamatoria. La inhibe la <b>ciclosporina A</b> (inmunosupresor en trasplantes)." },
  { id: "2.6-28", t: "2.6", q: "Experimento con histamina y aequorina: Ca²⁺ citosólico vs mitocondrial.", a: "Pico citosólico ~<b>2 µM</b>; pico mitocondrial ~<b>80 µM</b>, algo <b>más tardío</b>. En reposo la mitocondria tiene Ca²⁺ parecido al citosol: <b>no es un almacén</b>, recibe ondas transitorias." },
  { id: "2.6-29", t: "2.6", q: "¿De dónde viene el Ca²⁺ mitocondrial y para qué sirve?", a: "No puede venir del citosol (2 µM < 80 µM): viene del <b>RE</b>. Las <b>mitofusinas</b> (2 en el RE, 1 en la mitocondria) acercan los orgánulos; al abrirse el IP3R se forma un <b>microdominio</b> de Ca²⁺ alto que entra a la mitocondria.<br>Activa deshidrogenasas (PDH, isocitrato DH, α-cetoglutarato DH) → más NADH → más <b>ATP</b> para las bombas de Ca²⁺.", x: true, n: "Según los apuntes, esto salió en el examen de otro año." },
  { id: "2.6-30", t: "2.6", q: "Herramientas experimentales para estudiar los SOC.", a: "<b>Tapsigargina</b>: inhibe la <b>SERCA</b>. <b>Ionomicina</b>: ionóforo de Ca²⁺ en el RE. <b>TPEN</b>: quelante liposoluble que secuestra el Ca²⁺ dentro del RE. Las tres <b>vacían el RE</b> (o lo simulan) → STIM se agrupa → se abre el <b>SOC</b>." },
  { id: "2.6-31", t: "2.6", q: "CaMKII: ¿por qué sigue activa cuando baja el Ca²⁺? ¿Cuándo se apaga?", a: "Ca²⁺/CaM se une → separa el dominio inhibidor → <b>autofosforilación</b> → totalmente activa. Si baja el Ca²⁺, se suelta la CaM, pero el <b>fosfato</b> la mantiene <b>independiente de Ca²⁺ (50–80 % activa)</b>: es una 'memoria' de la señal. Se apaga cuando una <b>fosfatasa</b> le quita el fosfato." },
  { id: "2.6-32", t: "2.6", q: "Tipos de CaMK: sustratos y efectos.", a: "<b>CaMK I/II</b>: MLCK (contracción del músculo liso), tirosina hidroxilasa (síntesis de neurotransmisores), glucógeno fosforilasa quinasa (degradación del glucógeno), RyR (salida de Ca²⁺).<br><b>CaMK IV</b> (activada por <b>CaMKK</b> + Ca²⁺/CaM): <b>CREB</b> y otros FT → expresión génica." },
  { id: "2.6-33", t: "2.6", q: "PLC del espermatozoide y onda de Ca²⁺ en la fecundación.", a: "<b>PLCζ</b> (sin PH): entra al óvulo con el espermatozoide → IP₃ → Ca²⁺ del RE → el Ca²⁺ abre más IP3R vecinos (<i>Ca²⁺-induced Ca²⁺ release</i>) → <b>onda de Ca²⁺</b> que cruza el ovocito en ~40 s." },
  { id: "2.6-34", t: "2.6", q: "Fosfolipasas: ¿qué enlace corta cada una y qué produce?", a: "<b>PLA₁</b>: éster sn-1. <b>PLA₂</b>: éster sn-2 (libera a menudo <b>ácido araquidónico</b>). <b>PLC</b>: glicerol–fosfato → <b>DAG + IP₃</b>. <b>PLD</b>: fosfato–grupo polar → <b>PA</b>." },
  { id: "2.6-35", t: "2.6", q: "¿Gq es sensible a la toxina pertussis?", a: "Según el pie de figura de la diap. 8 del 2.6 (y la bibliografía): <b>NO</b>. Gq/11/14/15/16 son <b>insensibles a la PTX</b>; las sensibles son <b>Gi/Go</b> (sus βγ también activan PLCβ).", n: "La tabla del 2.4 marcaba Gαq con P: contradicción (posible duda para el profesor)." },
];

// c = índice de la opción correcta. e = explicación.
window.MCQ = [
  { id: "m1.1-01", t: "1.1", q: "¿Qué puede atravesar una unión gap?", o: ["Proteínas pequeñas", "mRNA", "Iones, ATP y segundos mensajeros", "Hormonas esteroideas unidas a transportador"], c: 2, e: "Las conexinas forman poros para moléculas pequeñas; nunca proteínas ni ácidos nucleicos." },
  { id: "m1.1-02", t: "1.1", q: "El marcador característico de los exosomas es:", o: ["Fosfatidilserina", "Tetraspaninas como CD63", "Clatrina", "Anexina V"], c: 1, e: "Exosomas: tetraspaninas (CD63, TSG101). Microvesículas y cuerpos apoptóticos: fosfatidilserina." },
  { id: "m1.1-03", t: "1.1", q: "Las microvesículas miden aproximadamente:", o: ["20–100 nm", "100–1000 nm", "1–5 µm", "5–10 µm"], c: 1, e: "Exosomas 20–100 nm; microvesículas 100–1000 nm; cuerpos apoptóticos 1–5 µm." },
  { id: "m1.1-04", t: "1.1", q: "Comparada con la sináptica, la señalización endocrina:", o: ["Usa señales a ~10⁻⁴ M", "Necesita receptores de mayor afinidad", "Es más rápida", "No necesita transportadores"], c: 1, e: "La hormona se diluye en sangre (~nanomolar), así que el receptor necesita más afinidad." },
  { id: "m1.1-05", t: "1.1", q: "¿Cuál es la primera catecolamina de la ruta?", o: ["Tirosina", "L-DOPA", "Dopamina", "Noradrenalina"], c: 1, e: "La tirosina no tiene grupo catecol; la L-DOPA es la primera." },
  { id: "m1.1-06", t: "1.1", q: "¿Qué enzima convierte la noradrenalina en adrenalina?", o: ["Tirosina hidroxilasa", "Dopamina β-hidroxilasa", "Feniletanolamina N-metiltransferasa", "Descarboxilasa de aminoácidos aromáticos"], c: 2, e: "Metila el grupo amino de la noradrenalina." },
  { id: "m1.1-07", t: "1.1", q: "La tiroxina (T4) se forma por la unión de:", o: ["MIT + MIT", "MIT + DIT", "DIT + DIT", "DIT + T3"], c: 2, e: "DIT + DIT = T4; DIT + MIT = T3 o T3 reversa." },
  { id: "m1.1-08", t: "1.1", q: "¿Cuál de estas hormonas es liposoluble?", o: ["Adrenalina", "Hormona de crecimiento", "Tiroxina", "TRH"], c: 2, e: "Las tiroideas son hidrofóbicas y viajan con transportador; adrenalina, GH y TRH son hidrosolubles." },
  { id: "m1.1-09", t: "1.1", q: "¿Qué miembro de la familia FGF circula como hormona?", o: ["FGF1", "FGF2", "FGF7", "FGF19"], c: 3, e: "La subfamilia FGF19 no une heparán sulfato y circula; el resto actúa localmente." },
  { id: "m1.1-10", t: "1.1", q: "Una GAP:", o: ["Intercambia GDP por GTP", "Estimula la actividad GTPasa y apaga la proteína G", "Fosforila la proteína G", "Es un tipo de proteína G monomérica"], c: 1, e: "GEF activa (GDP→GTP); GAP acelera la hidrólisis de GTP y apaga." },
  { id: "m1.1-11", t: "1.1", q: "La PDI solo forma puentes disulfuro en el RE porque:", o: ["Solo allí hay cisteínas", "El citosol es reductor", "Necesita ATP del lumen", "Depende del péptido señal"], c: 1, e: "El ambiente reductor del citosol impide formar puentes disulfuro." },
  { id: "m1.1-12", t: "1.1", q: "La aspirina tiene efecto antiinflamatorio y anticoagulante porque inhibe:", o: ["La fosfolipasa A2", "La ciclooxigenasa (COX)", "La fosfolipasa C", "La adenilato ciclasa"], c: 1, e: "Sin COX no se forman prostaglandinas (inflamación) ni tromboxanos (coagulación)." },
  { id: "m1.1-13", t: "1.1", q: "Ejemplo de secreción constitutiva:", o: ["Leptina de los adipocitos", "Hormonas hipofisarias", "Adrenalina de la médula adrenal", "Histamina de los basófilos"], c: 0, e: "La leptina se secreta de forma constante; las otras necesitan estímulo." },
  { id: "m1.1-14", t: "1.1", q: "¿Qué hormona tiene una vida media de hasta 7 días?", o: ["Insulina", "Adrenalina", "T4", "Cortisol"], c: 2, e: "T4 es el reservorio de T3; la mayoría de hormonas duran minutos u horas." },
  { id: "m1.1-15", t: "1.1", q: "La neurofisina I transporta:", o: ["ADH", "Oxitocina", "GH", "Prolactina"], c: 1, e: "Neurofisina I → oxitocina; neurofisina II → ADH (vasopresina)." },
  { id: "m1.1-16", t: "1.1", q: "ARF, Rab y Ran son:", o: ["GEF", "GAP", "Proteínas G monoméricas", "Subunidades α de proteínas G heterotriméricas"], c: 2, e: "Son pequeñas GTPasas del tráfico vesicular y nuclear." },
  { id: "m1.1-17", t: "1.1", q: "El receptor del óxido nítrico es:", o: ["Un receptor nuclear", "Un GPCR", "La guanilato ciclasa citosólica", "Un receptor tirosina quinasa"], c: 2, e: "El NO es un gas que entra en la célula y activa la guanilato ciclasa soluble → GMPc." },
  { id: "m1.1-18", t: "1.1", q: "El cofactor de la feniletanolamina N-metiltransferasa es:", o: ["Tetrahidrobiopterina", "PLP", "Ascorbato", "SAM"], c: 3, e: "La SAM dona el metilo que convierte noradrenalina en adrenalina." },
  { id: "m1.1-19", t: "1.1", q: "El primer producto de la síntesis de esteroides a partir del colesterol es:", o: ["Progesterona", "Pregnenolona", "DHEA", "Cortisol"], c: 1, e: "Corte mitocondrial de la cadena lateral: colesterol (C27) → pregnenolona (C21)." },
  { id: "m1.1-20", t: "1.1", q: "La conversión de testosterona en estradiol la cataliza:", o: ["La 21-hidroxilasa", "La aromatasa", "La 5α-reductasa", "La 11β-hidroxilasa"], c: 1, e: "La aromatasa aromatiza el anillo A: C19 → C18." },
  { id: "m1.1-21", t: "1.1", q: "La TBG transporta:", o: ["Cortisol", "GH", "T3 y T4", "Vasopresina"], c: 2, e: "Thyroxine binding globulin. CBG → glucocorticoides; GH-BP → GH; neurofisinas → ADH y oxitocina." },
  { id: "m1.1-22", t: "1.1", q: "Al inhibir la secreción, la concentración en sangre baja más rápido en la hormona con:", o: ["t½ de 200 min", "t½ de 40 min", "t½ de 10 min", "t½ de 1 min"], c: 3, e: "Vida media corta = más sensible a los cambios de secreción." },
  { id: "m1.1-23", t: "1.1", q: "El GMPc, además de activar la PKG:", o: ["Abre canales de Ca²⁺ del RE", "Abre canales de cationes en los bastones", "Activa la PKC", "Activa la adenilato ciclasa"], c: 1, e: "Los canales del RE los abre el IP3; la PKC la activan Ca²⁺ y DAG." },
  { id: "m1.1-24", t: "1.1", q: "¿Qué segundo mensajero tiene un anillo de inositol con fosfatos en 1, 4 y 5?", o: ["DAG", "IP3", "AMPc", "PIP3"], c: 1, e: "IP3 = inositol 1,4,5-trifosfato; abre los canales de Ca²⁺ del RE." },
  { id: "m1.1-25", t: "1.1", q: "Las T3 y T4 se forman a partir de:", o: ["Tirosina libre en el citosol", "Tirosinas de la tiroglobulina", "L-DOPA", "Triptófano"], c: 1, e: "Las tirosinas se yodan y acoplan dentro de la tiroglobulina; la proteólisis libera T3 y T4." },
  { id: "m1.1-26", t: "1.1", q: "¿Cuál de estos aminoácidos NO es básico?", o: ["Lisina", "Arginina", "Histidina", "Glutamina"], c: 3, e: "La glutamina tiene un N de amida, que no capta protones: es neutra." },

  { id: "m1.2-01", t: "1.2", q: "¿Qué unidades tiene la KD?", o: ["M", "M⁻¹", "Ninguna", "M·s⁻¹"], c: 0, e: "KD es una concentración; KA = 1/KD tiene unidades de M⁻¹." },
  { id: "m1.2-02", t: "1.2", q: "¿Qué receptor tiene mayor afinidad por su hormona?", o: ["KD = 10⁻⁴ M", "KD = 10⁻⁶ M", "KD = 10⁻⁸ M", "KD = 10⁻¹⁰ M"], c: 3, e: "Menor KD = mayor afinidad: basta menos hormona para ocupar la mitad." },
  { id: "m1.2-03", t: "1.2", q: "En la recta de Scatchard (B/F frente a B), la pendiente es:", o: ["N", "KD", "−KA", "−N"], c: 2, e: "B/F = −KA·B + KA·N. La pendiente es −KA = −1/KD." },
  { id: "m1.2-04", t: "1.2", q: "En la recta de Scatchard, el corte con el eje X da:", o: ["KD", "KA", "El número total de receptores (N)", "La hormona libre"], c: 2, e: "Cuando B/F = 0, B = N." },
  { id: "m1.2-05", t: "1.2", q: "Para medir la unión no específica se añade:", o: ["Más hormona marcada", "Hormona fría en exceso (10⁴–10⁵ veces)", "Un antagonista marcado", "Un tampón sin receptor"], c: 1, e: "La hormona fría ocupa los receptores; lo que queda marcado es inespecífico." },
  { id: "m1.2-06", t: "1.2", q: "La curva de unión no específica es:", o: ["Una hipérbola", "Una sigmoide", "Una recta", "Una campana"], c: 2, e: "No es saturable porque no hay receptor." },
  { id: "m1.2-07", t: "1.2", q: "La EC50 es:", o: ["La concentración que ocupa el 50 % de receptores", "La concentración que da el 50 % del efecto máximo", "El 50 % de la KD", "La mitad de N"], c: 1, e: "La concentración que ocupa la mitad de receptores es la KD; la EC50 se refiere a la respuesta." },
  { id: "m1.2-08", t: "1.2", q: "¿Con qué ocupación aproximada se alcanza la respuesta biológica máxima en el ejemplo de clase?", o: ["~20 %", "~50 %", "~80 %", "100 %"], c: 0, e: "No hace falta ocupar todos los receptores (receptores de reserva)." },
  { id: "m1.2-09", t: "1.2", q: "En receptores β-adrenérgicos, el isoproterenol es:", o: ["Un antagonista", "Un agonista", "Un agonista inverso", "Un segundo mensajero"], c: 1, e: "Produce el mismo efecto que la adrenalina (aumenta el glicerol). Ojo: los apuntes lo llaman antagonista en un apartado." },
  { id: "m1.2-10", t: "1.2", q: "Si la curva dosis-respuesta se desplaza a la derecha con la misma respuesta máxima, lo más probable es:", o: ["Menos receptores", "Menor afinidad del receptor", "Más receptores", "Un agonista más potente"], c: 1, e: "Menor sensibilidad: hace falta más hormona para el mismo efecto." },
  { id: "m1.2-11", t: "1.2", q: "Si la respuesta máxima disminuye, lo más probable es:", o: ["Menos receptores", "Menor afinidad", "Más transportador", "Una KD menor"], c: 0, e: "Menor respuesta: menos receptores (menor expresión o más degradación)." },
  { id: "m1.2-12", t: "1.2", q: "En hepatocitos, el orden de potencia ISO > A > NA indica receptor:", o: ["β1", "β2", "β3", "α1"], c: 1, e: "Es el ejemplo de clase con actividad adenilato ciclasa." },
  { id: "m1.2-13", t: "1.2", q: "El método más usado para separar hormona unida y libre es:", o: ["Electroforesis", "Filtración", "Cromatografía de afinidad", "Ultracentrifugación"], c: 1, e: "Es el más rápido y barato." },
  { id: "m1.2-14", t: "1.2", q: "Con [H] = 10⁻¹⁰ M y KD = 10⁻⁸ M, la ocupación de receptores es aproximadamente:", o: ["1 %", "10 %", "50 %", "99 %"], c: 0, e: "Ocupación = F/(KD + F) = 10⁻¹⁰ / (10⁻⁸ + 10⁻¹⁰) ≈ 0,01." },
  { id: "m1.2-15", t: "1.2", q: "En un estudio de competencia, la hormona fría con más afinidad es la que:", o: ["Llega al 50 % de B/B₀ con menos concentración", "Llega al 50 % con más concentración", "Da una línea horizontal", "Aumenta la señal marcada"], c: 0, e: "Desplaza a la marcada con menos concentración." },
  { id: "m1.2-16", t: "1.2", q: "En el reciclaje del receptor, la hormona se separa porque:", o: ["Se degrada en el lisosoma", "El pH ácido del endosoma cambia las cargas del receptor", "Una fosfatasa la desfosforila", "Se une al transportador"], c: 1, e: "El receptor pierde afinidad a pH ácido y vuelve a la membrana." },
  { id: "m1.2-17", t: "1.2", q: "El receptor β-adrenérgico con orden de potencia ISO = NA > A es:", o: ["β1", "β2", "β3", "α2"], c: 2, e: "β1: ISO > NA ≥ A; β2: ISO > A > NA; β3: ISO = NA > A." },
  { id: "m1.2-18", t: "1.2", q: "Los tres subtipos β-adrenérgicos se acoplan a:", o: ["Gi", "Gq", "Gs", "Canales iónicos"], c: 2, e: "Los tres activan la adenilato ciclasa vía Gs; difieren en afinidad y expresión tisular." },
  { id: "m1.2-19", t: "1.2", q: "En la lipólisis por adrenalina, la PKA fosforila y activa:", o: ["La adenilato ciclasa", "La lipasa sensible a hormonas", "La MAG lipasa", "La proteína G"], c: 1, e: "La lipasa sensible a hormonas fosforilada hidroliza los triglicéridos." },
  { id: "m1.2-20", t: "1.2", q: "Normalmente, la EC50 de una hormona es:", o: ["Igual a su KD", "Mayor que su KD", "Menor que su KD", "Igual a N/2"], c: 2, e: "La respuesta máxima se alcanza con ~20 % de ocupación, así que el 50 % del efecto llega antes que el 50 % de ocupación." },
  { id: "m1.2-21", t: "1.2", q: "En el experimento de linfocitos, el tratamiento con 100 nM de insulina:", o: ["No cambia los receptores", "Reduce los receptores muy rápido a ~45 %", "Aumenta los receptores", "Solo los reduce tras 24 h"], c: 1, e: "A más dosis y más tiempo, menos receptores; a 100 nM la caída es rápida (degradación)." },
  { id: "m1.2-22", t: "1.2", q: "En la recta de Scatchard, el corte con el eje Y es:", o: ["N", "KA·N", "−KA", "KD"], c: 1, e: "Con B = 0, B/F = KA·N. El corte con X es N." },
  { id: "m1.2-23", t: "1.2", q: "Una hormona tiene KD = 1 nM. ¿Qué % de receptores ocupa a 1 nM?", o: ["10 %", "50 %", "90 %", "100 %"], c: 1, e: "Ocupación = [H]/([H]+KD) = 1/(1+1) = 50 %. Si [H] = KD, la mitad de los receptores están ocupados." },
  { id: "m1.2-24", t: "1.2", q: "KD = 2 nM. ¿Qué % de ocupación hay con [H] = 18 nM?", o: ["50 %", "75 %", "90 %", "99 %"], c: 2, e: "18/(18+2) = 18/20 = 90 %. Truco: [H] = 9·KD → 90 %." },
  { id: "m1.2-25", t: "1.2", q: "KD = 3 nM. ¿Ocupación con [H] = 1 nM?", o: ["25 %", "33 %", "50 %", "75 %"], c: 0, e: "1/(1+3) = 1/4 = 25 %. [H] = KD/3 → 25 %." },
  { id: "m1.2-26", t: "1.2", q: "Si KD = 10⁻⁹ M, la KA es:", o: ["10⁻⁹ M⁻¹", "10⁹ M⁻¹", "10⁹ M", "10⁻⁹ M"], c: 1, e: "KA = 1/KD = 1/10⁻⁹ M = 10⁹ M⁻¹ (cambia el signo del exponente y las unidades pasan a M⁻¹)." },
  { id: "m1.2-27", t: "1.2", q: "En una recta de Scatchard (B/F frente a B), la pendiente es −0,5 nM⁻¹ y el corte con el eje X es 200 fmol. La KD y la Bmax son:", o: ["KD 0,5 nM; Bmax 200 fmol", "KD 2 nM; Bmax 200 fmol", "KD 2 nM; Bmax 100 fmol", "KD 200 nM; Bmax 2 fmol"], c: 1, e: "Pendiente = −1/KD → KD = 1/0,5 = 2 nM. El corte con el eje X (B cuando B/F = 0) es la Bmax = 200 fmol." },
  { id: "m1.2-28", t: "1.2", q: "Una hormona tiene una vida media de 10 min. ¿Qué fracción queda a los 30 min?", o: ["1/3", "1/4", "1/8", "1/16"], c: 2, e: "30 min = 3 vidas medias → (1/2)³ = 1/8 (12,5 %)." },
  { id: "m1.2-29", t: "1.2", q: "Hormona A: EC50 = 10 nM. Hormona B: EC50 = 100 nM. ¿Cuál es más potente y cuántas veces?", o: ["A, 10 veces", "B, 10 veces", "A, 100 veces", "Igual de potentes"], c: 0, e: "Cuanto menor es la EC50, más potente: A necesita 10 veces menos concentración para el 50 % del efecto." },
  { id: "m1.2-30", t: "1.2", q: "La adrenalina actúa a 10⁻¹⁰ M y el AMPc alcanza 10⁻⁶ M. ¿Cuántas veces se ha amplificado la señal?", o: ["10⁴", "10⁶", "10¹⁶", "4"], c: 0, e: "10⁻⁶ / 10⁻¹⁰ = 10⁴ (resta los exponentes: −6 − (−10) = 4)." },
  { id: "m1.2-31", t: "1.2", q: "RIA: cuentas totales T = 8000 cpm y B0 = 4000 cpm. ¿%B0/T?", o: ["25 %", "40 %", "50 %", "200 %"], c: 2, e: "(4000/8000)·100 = 50 %." },
  { id: "m1.2-32", t: "1.2", q: "En un RIA competitivo de T3, la muestra de una rata tratada con TRH, comparada con la de una rata control, da:", o: ["Más cpm unidas", "Menos cpm unidas", "Las mismas cpm", "Cpm igual a B0"], c: 1, e: "Tiene más T3 fría, que desplaza a la T3 marcada del anticuerpo → menos radioactividad unida." },
  { id: "m1.2-33", t: "1.2", q: "¿Cuántas moléculas hay en 1 fmol?", o: ["6·10⁸", "6·10¹⁵", "6·10²³", "10⁻¹⁵"], c: 0, e: "6,022·10²³ × 10⁻¹⁵ = 6·10⁸ moléculas." },
  { id: "m1.2-34", t: "1.2", q: "Bmax = 1000 fmol/mg y 1 mg de proteína son 6·10⁸ células. Receptores por célula:", o: ["1", "1000", "6·10⁸", "10⁶"], c: 1, e: "1000 fmol × 6·10⁸ moléculas/fmol = 6·10¹¹ receptores/mg; ÷ 6·10⁸ células = 1000 receptores/célula." },
  { id: "m1.2-35", t: "1.2", q: "Kd = 10⁴ fmol/mg de proteína, con 0,5 µg de proteína en 0,1 mL. Kd en pM:", o: ["50 pM", "500 pM", "10⁴ pM", "2 pM"], c: 0, e: "Kd(pM) = 10⁴ fmol/mg × 0,0005 mg / 0,1 mL = 50 fmol/mL = 50 pM." },
  { id: "m1.2-36", t: "1.2", q: "Dos cDNA de receptor dan rectas de Scatchard paralelas con distinto corte en el eje X. Significa:", o: ["Distinta afinidad, mismo número de receptores", "Misma afinidad, distinto número de receptores", "Cooperatividad negativa", "Dos tipos de receptor"], c: 1, e: "Misma pendiente → misma Kd; distinto corte en X → distinta Bmax." },
{ id: "m1.3-01", t: "1.3", q: "Con cooperatividad positiva, para pasar del 10 % al 90 % de saturación hay que multiplicar el ligando por:", o: ["4", "81", "400", "10"], c: 0, e: "Sin cooperatividad ×81; negativa ×400." },
  { id: "m1.3-02", t: "1.3", q: "Un modulador alostérico positivo:", o: ["Aumenta la Vmax", "Desplaza la curva a la izquierda (↓ Km)", "Desplaza la curva a la derecha", "Convierte la enzima en monomérica"], c: 1, e: "Aumenta la afinidad por el sustrato; la Vmax no cambia." },
  { id: "m1.3-03", t: "1.3", q: "¿Cuál de estas proteínas NO es un ejemplo de cooperatividad dado en clase?", o: ["PFK-1", "Hemoglobina", "Receptor del IP3", "Ubiquitina"], c: 3, e: "La ubiquitina es un monómero de 76 aa; las otras tres son multiméricas y cooperativas." },
  { id: "m1.3-04", t: "1.3", q: "El P-loop de las quinasas:", o: ["Contiene el residuo que activa la quinasa", "Une el ATP-Mg²⁺", "Reconoce el sustrato", "Une fosfoinosítidos"], c: 1, e: "El residuo fosforilable activador está en el activation loop." },
  { id: "m1.3-05", t: "1.3", q: "Sustituir un Asp catalítico de una quinasa por Asn:", o: ["Aumenta su actividad", "No tiene efecto", "La inactiva porque no fija el Mg²⁺", "Cambia su especificidad a Tyr"], c: 2, e: "La Asn es una amida neutra: pierde la carga negativa que sujeta el Mg²⁺." },
  { id: "m1.3-06", t: "1.3", q: "El motivo consenso de la PKA es:", o: ["Arg-Arg/Lys-X-Ser/Thr", "Pro-X-X-Pro", "Asn-Pro-X-Tyr", "Tyr-X-X-Met"], c: 0, e: "PXXP lo reconoce SH3; NPXY, PTB; YXXM, el SH2 de la PI3K." },
  { id: "m1.3-07", t: "1.3", q: "La ubiquitina se une al sustrato mediante:", o: ["Su Lys y una Gly del sustrato", "Su Gly C-terminal y una Lys del sustrato", "Un puente disulfuro", "Un enlace éster con una Ser"], c: 1, e: "Enlace entre el grupo amino de una Lys del sustrato y la Gly C-terminal de la Ub." },
  { id: "m1.3-08", t: "1.3", q: "La especificidad de sustrato en la ubiquitinación la da:", o: ["La E1", "La E2", "La E3", "La DUB"], c: 2, e: "Hay más de 600 E3; cada una reconoce un grupo pequeño de sustratos." },
  { id: "m1.3-09", t: "1.3", q: "Las cadenas de ubiquitina que marcan para el proteasoma son las unidas por:", o: ["K63", "K48", "M1", "K6"], c: 1, e: "K48 (mínimo 4 Ub) = degradación; K63 = daño al DNA." },
  { id: "m1.3-10", t: "1.3", q: "SUMO-1 y NEDD8 se parecen a la ubiquitina en:", o: ["Su secuencia de aminoácidos", "Su estructura 3D", "Que marcan para degradación", "Su tamaño de 300 aa"], c: 1, e: "Poca homología de secuencia, pero la misma estructura 3D." },
  { id: "m1.3-11", t: "1.3", q: "La proteasa que libera el bHLH-zip de SREBP cortando dentro de la membrana es:", o: ["S1P", "S2P", "Caspasa 3", "La proteasa del proteasoma"], c: 1, e: "S1P corta primero en el bucle luminal; S2P corta en la membrana." },
  { id: "m1.3-12", t: "1.3", q: "El único dominio de la lista que une un lípido que NO es fosfolípido es:", o: ["PH", "PX", "C1", "FYVE"], c: 2, e: "C1 une DAG (ej. PKC)." },
  { id: "m1.3-13", t: "1.3", q: "El dominio PH reconoce principalmente:", o: ["PI3P", "PI(3,4,5)P₃", "DAG", "Fosfatidilserina"], c: 1, e: "El PIP₃ generado por la PI3K recluta proteínas con PH (AKT, PDK1)." },
  { id: "m1.3-14", t: "1.3", q: "El dominio PTB reconoce p-Tyr dependiendo de residuos situados:", o: ["En el lado C-terminal", "En el lado N-terminal", "En otra proteína", "Solo de la Tyr"], c: 1, e: "PTB mira hacia el N (NPXpY, Shc); SH2 hacia el C (pYXXM, PI3K)." },
  { id: "m1.3-15", t: "1.3", q: "Grb2 es un ejemplo de proteína:", o: ["Scaffold", "Docking", "Adaptadora", "Coactivadora"], c: 2, e: "Grb2 (25 kDa): adaptadora. IRS1: docking. AKAP: scaffold." },
  { id: "m1.3-16", t: "1.3", q: "Sos es:", o: ["Una GAP de Ras", "El GEF de Ras", "Una Tyr quinasa", "Una proteína scaffold"], c: 1, e: "Grb2 lo lleva a la membrana con sus SH3, donde activa Ras." },
  { id: "m1.3-17", t: "1.3", q: "El dominio que reconoce lisinas acetiladas es:", o: ["SH3", "Bromodominio", "Chromodominio", "UIM"], c: 1, e: "Chromo reconoce Lys metiladas; UIM, mono-ubiquitina." },
  { id: "m1.3-18", t: "1.3", q: "La secuencia CRE (TGACGTCA) es reconocida por:", o: ["Nur77 como monómero", "CREB como dímero", "CBP directamente", "SREBP"], c: 1, e: "Es palindrómica; CBP es coactivador y no toca el DNA." },
  { id: "m1.3-19", t: "1.3", q: "Un correpresor:", o: ["Se une al DNA y tiene actividad HAT", "No toca el DNA y recluta actividad HDAC", "Es un factor de transcripción", "Acetila histonas"], c: 1, e: "Ejemplos: NCoR, SMRT, RIP." },
  { id: "m1.3-20", t: "1.3", q: "El dominio de CBP que une CREB es:", o: ["NRID", "KIX", "BRD", "TAZ2"], c: 1, e: "NRID une receptores nucleares; BRD, Lys acetiladas." },
{ id: "m1.3-21", t: "1.3", q: "Para medir la vida media de un mRNA se bloquea la transcripción con:", o: ["Cicloheximida", "Actinomicina D", "Tamoxifeno", "Rapamicina"], c: 1, e: "La cicloheximida bloquea la traducción y sirve para distinguir genes primarios de secundarios." },
  { id: "m1.3-22", t: "1.3", q: "En presencia de cicloheximida, ¿qué genes se siguen transcribiendo tras la señal?", o: ["Solo los secundarios", "Solo los primarios", "Ninguno", "Todos"], c: 1, e: "Los secundarios necesitan una proteína nueva que no se puede sintetizar." },
  { id: "m1.3-23", t: "1.3", q: "En ayuno, el mRNA de PEPCK:", o: ["Se degrada más rápido", "Se estabiliza por una vía dependiente de AMPc", "No cambia", "Se traduce menos"], c: 1, e: "La proteína del 3′UTR se modifica e inhibe las endonucleasas." },
  { id: "m1.3-24", t: "1.3", q: "Los AREs del 3′UTR son secuencias:", o: ["TGACGTCA", "AUUUA", "AGGTCA", "LXXLL"], c: 1, e: "Marcan el mRNA para degradación rápida." },
  { id: "m1.3-25", t: "1.3", q: "Los miRNA miden aproximadamente:", o: ["6–8 nt", "21–23 nt", "76 aa", "600 pb"], c: 1, e: "Actúan con RISC sobre el 3′UTR." },
  { id: "m1.3-26", t: "1.3", q: "En la insuficiencia cardíaca, miR-25:", o: ["Disminuye y SERCA2a aumenta", "Aumenta y SERCA2a disminuye", "No cambia", "Aumenta junto con SERCA2a"], c: 1, e: "Es una correlación inversa; in vitro, miR-25 reduce SERCA." },
  { id: "m1.3-27", t: "1.3", q: "En ayuno, la degradación de CRTC2 la inicia:", o: ["La HAT CBP", "La desacetilasa SIRT1", "La quinasa PKA", "La proteasa S2P"], c: 1, e: "Al desacetilar una Lys, esta queda libre para poliubiquitinarse." },
  { id: "m1.3-28", t: "1.3", q: "El mecanismo de degradación de proteínas más inespecífico es:", o: ["Ubiquitina-proteasoma", "Autofagia", "Proteólisis", "Sumoilación"], c: 2, e: "Suele darse en situaciones patológicas." },
  { id: "m1.3-29", t: "1.3", q: "Una enzima con Km = 2 mM. ¿Qué fracción de la Vmax tiene con [S] = 2 mM?", o: ["25 %", "50 %", "75 %", "100 %"], c: 1, e: "v = Vmax·[S]/(Km+[S]) = 2/(2+2) = 50 %. Por definición, cuando [S] = Km, v = Vmax/2." },
  { id: "m1.3-30", t: "1.3", q: "Km = 1 mM y [S] = 3 mM. ¿v como % de la Vmax?", o: ["33 %", "50 %", "75 %", "90 %"], c: 2, e: "3/(3+1) = 75 %. Es la misma fórmula que la ocupación de receptores." },
  { id: "m1.3-31", t: "1.3", q: "Inhibidor competitivo con [I] = Ki. La Km aparente:", o: ["Se reduce a la mitad", "Se duplica", "No cambia", "Se multiplica por 10"], c: 1, e: "Km aparente = Km·(1 + [I]/Ki) = Km·(1+1) = 2·Km. La Vmax no cambia." },
  { id: "m1.3-32", t: "1.3", q: "Un mRNA tiene vida media de 1,5 h. Tras parar la transcripción con actinomicina D, ¿qué % queda a las 4,5 h?", o: ["50 %", "25 %", "12,5 %", "6,25 %"], c: 2, e: "4,5 h / 1,5 h = 3 vidas medias → (1/2)³ = 12,5 %." },
  { id: "m2.1-01", t: "2.1", q: "¿Cuántos receptores nucleares hay en humanos?", o: ["12", "48", "150", "Más de 1000"], c: 1, e: "Más de 1000 son los GPCR." },
  { id: "m2.1-02", t: "2.1", q: "La función de activación independiente de ligando de un receptor nuclear es:", o: ["AF-1", "AF-2", "La P-box", "La D-box"], c: 0, e: "AF-1 (dominio A/B, N-terminal) no depende de ligando; AF-2 (LBD) sí." },
  { id: "m2.1-03", t: "2.1", q: "El dominio más conservado entre receptores nucleares de la misma familia es:", o: ["El A/B", "El DBD", "El LBD", "El F"], c: 1, e: "El LBD debe ser específico para cada ligando, así que se conserva menos." },
  { id: "m2.1-04", t: "2.1", q: "Cada dedo de zinc del DBD coordina el Zn²⁺ con:", o: ["4 histidinas", "2 Cys y 2 His", "4 cisteínas", "4 aspartatos"], c: 2, e: "Sin las 4 Cys el dedo no funciona." },
  { id: "m2.1-05", t: "2.1", q: "En los receptores nucleares, la D-box participa en:", o: ["El reconocimiento de la secuencia de DNA", "La dimerización de homodímeros", "La unión del ligando", "La unión de coactivadores"], c: 1, e: "La P-box reconoce el half site; en heterodímeros las D-box quedan lejos." },
