<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Organogénesis · Biología del Desarrollo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Misma estética que «Embriones fase a fase»: papel crema, ectodermo azul, mesodermo rojo, endodermo amarillo, anexos verde/violeta */
:root{--bg:#f5efe6;--card:#fffaf3;--ink:#1e2733;--muted:#6b7380;--line:#e6dccd;--blue:#2f6db3;--coral:#d9654b;--green:#2e8b57;--yellow:#e8b931;--violet:#7d4f97;--shadow:0 1px 2px rgba(60,40,20,.06),0 10px 30px rgba(60,40,20,.08)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:1080px;margin:0 auto;padding:22px 16px 80px}
h1,h2,h3,h4{font-family:Fraunces,Georgia,serif;font-weight:700;letter-spacing:-.01em;margin:0}
.hero{margin:10px 0 24px}
.hero h1{font-size:clamp(30px,6vw,46px);line-height:1.02}.hero h1 em{font-style:normal;color:var(--coral)}
.hero p{color:var(--muted);margin:10px 0 0;max-width:600px;line-height:1.5}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:12px}.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;text-align:left;box-shadow:var(--shadow);transition:transform .15s,border-color .15s;display:flex;flex-direction:column;gap:8px;min-height:170px}
.mcard:hover{transform:translateY(-2px);border-color:#cdbca4}
.mcard .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px}
.mcard h3{font-size:19px}.mcard p{margin:0;color:var(--muted);font-size:14px;line-height:1.45;flex:1}
.mcard .acc{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.mcard.exam{background:#1e2733;color:#fdf6ea;border-color:#1e2733}.mcard.exam p{color:#c9c2b5}
.bar{height:6px;background:#eee3d3;border-radius:6px;flex:1;overflow:hidden}.bar div{height:100%;background:var(--green);border-radius:6px}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.ghost{background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px}.ghost:hover{background:#fff}
.mode-title{font-family:Fraunces,serif;font-weight:700;font-size:20px;flex:1}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600}.chip.fire{color:var(--coral)}
.progress{height:6px;background:#e9dfd0;border-radius:6px;margin:-4px 0 14px;overflow:hidden}.progress div{height:100%;background:var(--ink);transition:width .3s}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);overflow:hidden}
.qcard.wide{grid-template-columns:1fr}
.figwrap{background:#fbf6ee;border-right:1px solid var(--line);padding:12px;display:flex;flex-direction:column;justify-content:center}
svg.fig{width:100%;height:auto;display:block}
.figcap{font-size:12.5px;color:var(--muted);text-align:center;margin-top:4px}
.qside{padding:22px;display:flex;flex-direction:column;gap:12px}
.cat{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.qside h2,.qhead h2{font-size:22px;line-height:1.2}
.sub{margin:-4px 0 0;color:var(--muted);font-size:14px;line-height:1.45}
.opts{display:grid;gap:8px}.opts.nums{grid-template-columns:repeat(auto-fill,minmax(52px,1fr))}
.opt{display:flex;align-items:center;gap:10px;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:11px 13px;font-size:15px;font-weight:500;line-height:1.35;transition:border-color .12s,background .12s}
.opts.nums .opt{justify-content:center;font-weight:700;font-size:17px;padding:10px 0}
.opt:hover:not(:disabled){border-color:#bfae96}
.opt.correct{border-color:var(--green);background:#e6f4ec}.opt.wrong{border-color:var(--coral);background:#fbe7e2}.opt:disabled{cursor:default}
.fb{border-radius:14px;padding:14px 16px;font-size:14.5px;line-height:1.55;animation:pop .25s ease}
.fb.ok{background:#e6f4ec;border:1px solid #bfe0cc}.fb.ko{background:#fbeae5;border:1px solid #f1c7bb}.fb.mid{background:#fdf3d8;border:1px solid #f0dc9e}
.fb p{margin:6px 0 0}
.primary{background:var(--ink);color:#fff;border:0;border-radius:999px;padding:11px 20px;font-weight:600;font-size:15px}.primary:hover{background:#000}.primary:disabled{opacity:.35;cursor:default}
.fb .primary{margin-top:12px}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.mk circle{stroke:#fffaf3;stroke-width:2}
.mk text{font:700 11px Inter,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.mk.hi circle{fill:var(--coral)}.mk.ok circle{fill:var(--green)}
.qhead{padding:22px 22px 6px}
.wbody{padding:8px 22px 22px}
.tray{display:flex;flex-wrap:wrap;gap:8px;min-height:54px;padding:12px;border:1.5px dashed #d6c8b2;border-radius:14px;background:#fbf6ee;margin-bottom:14px}
.tray.empty::after{content:'Todo colocado. Pulsa «Comprobar».';color:var(--muted);font-size:13.5px;align-self:center}
.tag{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:500;transition:transform .08s,border-color .12s;text-align:left}
.tag:hover{border-color:#bfae96}.tag.sel{border-color:var(--blue);background:#e3edf9;transform:scale(1.04)}
.tag.correct{border-color:var(--green);background:#e6f4ec}.tag.wrong{border-color:var(--coral);background:#fbe7e2}
.tag small{display:block;font-size:11.5px;color:var(--coral);font-weight:600}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.bin{background:#fff;border:1.5px solid var(--line);border-top:5px solid var(--bc);border-radius:14px;padding:12px;min-height:110px;transition:border-color .12s,background .12s;text-align:left}
.bin.armed{border-color:var(--blue);border-top-color:var(--bc);background:#f3f8fe}
.bin h4{font-size:15px;margin-bottom:2px;font-family:Inter,sans-serif;font-weight:700}
.bin .bs{font-size:12px;color:var(--muted);margin-bottom:8px}
.bin .bi{display:flex;flex-wrap:wrap;gap:6px}
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.deck{background:var(--card);border:1.5px solid var(--line);border-left:6px solid var(--bc);border-radius:14px;padding:14px;text-align:left;font-weight:600;box-shadow:var(--shadow)}
.deck small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:3px}
.ocards{display:grid;gap:8px}
.ocard{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:11px 12px 11px 46px;font-size:14.5px;line-height:1.4;text-align:left;min-height:48px;display:flex;align-items:center;gap:10px;transition:border-color .12s}
.ocard:hover:not(:disabled){border-color:#bfae96}
.ocard .num{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;border:1.5px dashed #cdbca4;font-weight:700;font-size:13px;display:grid;place-items:center;color:var(--muted)}
.ocard.done .num{background:var(--ink);border:0;color:#fff}.ocard.done{border-color:var(--ink);background:#f6f0e6}
.ocard.correct{border-color:var(--green);background:#e6f4ec}.ocard.correct .num{background:var(--green)}
.ocard.wrong{border-color:var(--coral);background:#fbe7e2}.ocard.wrong .num{background:var(--coral)}
.ocard .should{font-size:12px;font-weight:700;color:var(--coral);margin-left:auto;white-space:nowrap}
.ocard svg{width:64px;height:64px;flex:none}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.results{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:30px;max-width:640px;margin:0 auto;text-align:center}
.results .big{font-family:Fraunces,serif;font-size:72px;font-weight:700;line-height:1}
.results .rows{text-align:left;margin:22px 0 6px;display:grid;gap:10px}
.results .row{display:grid;grid-template-columns:170px 1fr 52px;gap:12px;align-items:center;font-size:14px}
.results .btnrow{justify-content:center}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:#efe6d8;color:#5c5346}
.ctx{background:#fff;border:1px solid var(--line);border-left:4px solid var(--coral);border-radius:12px;padding:12px 14px;font-size:14.5px;line-height:1.5}
@media (max-width:820px){.qcard{grid-template-columns:1fr}.figwrap{border-right:0;border-bottom:1px solid var(--line)}.results .row{grid-template-columns:120px 1fr 44px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS='organogenesis_v1';
let STATS={};try{STATS=JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){}
function record(cat,ok){const s=STATS[cat]||(STATS[cat]={ok:0,n:0});s.n++;if(ok)s.ok++;try{localStorage.setItem(LS,JSON.stringify(STATS))}catch(e){}}
const acc=c=>{const s=STATS[c];return s&&s.n?Math.round(100*s.ok/s.n):null};

/* ===================== COLORES (convención por hoja) ===================== */
const K={ecto:'#7eaad8',ectoD:'#3f6fa8',neu:'#5b8fd0',neuD:'#2a5a9a',crest:'#9b7fd0',crestD:'#5e3f99',
mes:'#e48a74',mesD:'#a8432f',mesL:'#f3b6a0',noto:'#b8433a',inter:'#e9a15a',interD:'#a4621f',
endo:'#f0c74e',endoD:'#a98318',lum:'#fffaf2',body:'#fbf1e0',ext:'#9fcf9b',extD:'#4f8a4b',sin:'#c9a3dc',sinD:'#7d4f97',
blood:'#c0392b',vein:'#3b6fb6',yolk:'#f3d27a',yolkD:'#c79d2c'};

/* ===================== FIGURAS ===================== */
function mk(n,x,y,cls='',lx,ly){return `<g class="mk ${cls}" data-n="${n}">${lx!=null?`<line x1="${lx}" y1="${ly}" x2="${x}" y2="${y}" stroke="#1e2733" stroke-width="1.5"/><circle cx="${lx}" cy="${ly}" r="2.5" fill="#1e2733" style="stroke:none"/>`:''}<circle cx="${x}" cy="${y}" r="10" fill="#1e2733"/><text x="${x}" y="${y}">${n}</text></g>`}
function dots(cx,cy,rx,ry,n,col){let s='';for(let i=0;i<n;i++){const a=i*2.399,r=Math.sqrt((i+.5)/n);s+=`<circle cx="${(cx+Math.cos(a)*r*rx*.85).toFixed(1)}" cy="${(cy+Math.sin(a)*r*ry*.85).toFixed(1)}" r="1.8" fill="${col}"/>`}return s}

/* Corte transversal del tronco, embrión ~4 semanas */
function figTrans(){return `
<path d="M20 150 C20 -20 380 -20 380 150" fill="none" stroke="${K.extD}" stroke-width="3" stroke-dasharray="7 4"/>
<ellipse cx="200" cy="160" rx="165" ry="120" fill="${K.body}" stroke="${K.ecto}" stroke-width="7"/>
<ellipse cx="130" cy="205" rx="42" ry="30" fill="${K.lum}"/><ellipse cx="270" cy="205" rx="42" ry="30" fill="${K.lum}"/>
<path d="M130 175 A42 30 0 0 0 130 235" fill="none" stroke="${K.mesD}" stroke-width="7"/>
<path d="M270 175 A42 30 0 0 1 270 235" fill="none" stroke="${K.mesD}" stroke-width="7"/>
<path d="M130 175 A42 30 0 0 1 130 235" fill="none" stroke="${K.mes}" stroke-width="7"/>
<path d="M270 175 A42 30 0 0 0 270 235" fill="none" stroke="${K.mes}" stroke-width="7"/>
<rect x="195" y="158" width="10" height="34" fill="${K.mes}"/>
<circle cx="200" cy="215" r="28" fill="${K.mes}"/><circle cx="200" cy="215" r="20" fill="${K.endo}" stroke="${K.endoD}" stroke-width="1.5"/><circle cx="200" cy="215" r="8" fill="${K.lum}"/>
<ellipse cx="150" cy="114" rx="22" ry="18" fill="${K.mesL}"/>${dots(150,114,22,18,22,K.mesD)}
<ellipse cx="250" cy="114" rx="22" ry="18" fill="${K.mesL}"/>${dots(250,114,22,18,22,K.mesD)}
<path d="M100 66 Q130 50 154 72" fill="none" stroke="${K.mesD}" stroke-width="10" stroke-linecap="round"/>
<path d="M300 66 Q270 50 246 72" fill="none" stroke="${K.mesD}" stroke-width="10" stroke-linecap="round"/>
<ellipse cx="108" cy="146" rx="15" ry="11" fill="${K.inter}" stroke="${K.interD}" stroke-width="1.5"/>
<ellipse cx="292" cy="146" rx="15" ry="11" fill="${K.inter}" stroke="${K.interD}" stroke-width="1.5"/>
<circle cx="178" cy="152" r="8" fill="${K.blood}"/><circle cx="222" cy="152" r="8" fill="${K.blood}"/>
<circle cx="200" cy="128" r="10" fill="${K.noto}"/>
<ellipse cx="200" cy="78" rx="26" ry="32" fill="${K.neu}" stroke="${K.neuD}" stroke-width="2"/><ellipse cx="200" cy="78" rx="5" ry="20" fill="${K.lum}"/>
<g fill="${K.crest}" stroke="${K.crestD}" stroke-width="1"><circle cx="166" cy="52" r="5"/><circle cx="160" cy="60" r="4"/><circle cx="234" cy="52" r="5"/><circle cx="240" cy="60" r="4"/></g>`}
const TRANS=[
 {n:1,x:36,y:160,name:'Ectodermo superficial (epiectodermo)',ex:'Forma la epidermis y sus anexos (pelo, uñas, glándulas). Junto al mesodermo lateral somático forma la <b>somatopleura</b>.'},
 {n:2,x:200,y:96,name:'Tubo neural',ex:'Neuroectodermo → SNC. Arriba está la placa del techo (BMPs) y abajo la placa del suelo (Shh), que lo regionalizan dorso-ventralmente.'},
 {n:3,x:160,y:46,name:'Cresta neural',ex:'Se delamina (EMT) del borde de la placa neural. Es multipotente: ganglios de la raíz dorsal y simpáticos, melanocitos, Schwann, médula adrenal, ganglios entéricos…'},
 {n:4,x:244,y:136,lx:210,ly:128,name:'Notocorda',ex:'Mesodermo axial. Secreta Shh y Noggin: induce la placa del suelo y ventraliza el esclerotomo. De ella queda el <b>núcleo pulposo</b> del disco intervertebral.'},
 {n:5,x:118,y:58,name:'Dermomiotomo',ex:'Parte dorsal del somita (Wnts ↑, Shh ↓). Dermatoma → dermis; miotoma → músculo esquelético (epaxial: espalda; hipaxial: extremidades y pared ventral).'},
 {n:6,x:150,y:114,name:'Esclerotomo',ex:'Parte ventromedial del somita (Shh ↑, Wnts ↓, «BMPs ni en pintura»). Da vértebras, costillas, discos intervertebrales; incluye artrotoma, sindetoma y endotoma.'},
 {n:7,x:246,y:170,lx:224,ly:154,name:'Aorta dorsal',ex:'Vaso pareado ventral a los somitas. El endotoma del somita aporta precursores endoteliales de la aorta dorsal.'},
 {n:8,x:108,y:146,name:'Mesodermo intermedio',ex:'Gononefrótomo: sistema renal (pro-, meso- y metanefros), parte somática de las gónadas y gran parte de los órganos sexuales.'},
 {n:9,x:88,y:205,name:'Mesodermo lateral somático',ex:'En contacto con el ectodermo (somatopleura): pared y cavidades corporales, pelvis, huesos de las extremidades.'},
 {n:10,x:312,y:205,name:'Mesodermo lateral esplácnico',ex:'En contacto con el endodermo (esplacnopleura): sistema circulatorio (corazón incluido) y mesénquima de los órganos endodérmicos.'},
 {n:11,x:130,y:205,name:'Celoma intraembrionario',ex:'Cavidad entre el mesodermo lateral somático y el esplácnico: futuras cavidades corporales.'},
 {n:12,x:200,y:215,name:'Endodermo (intestino)',ex:'Epitelio del tubo digestivo y de sus glándulas. Rodeado de mesodermo esplácnico, colgado del mesenterio dorsal.'},
 {n:13,x:200,y:22,name:'Amnios',ex:'Epiblasto + mesodermo extraembrionario. Contiene el líquido amniótico.'}
];

/* Corte sagital de un embrión plegado (~4–5 semanas) */
function figSag(){return `
<ellipse cx="200" cy="118" rx="188" ry="108" fill="#eef5f9" stroke="${K.extD}" stroke-width="3" stroke-dasharray="7 4"/>
<path d="M318 168 L352 262" stroke="${K.ext}" stroke-width="28" stroke-linecap="round"/>
<circle cx="200" cy="232" r="40" fill="${K.yolk}" stroke="${K.yolkD}" stroke-width="2"/>
<path d="M200 96 L200 196" stroke="${K.endo}" stroke-width="12"/>
<path d="M80 165 C60 80 150 58 200 63 C270 70 330 90 318 166" fill="none" stroke="${K.body}" stroke-width="72" stroke-linecap="round"/>
<path d="M80 165 C60 80 150 58 200 63 C270 70 330 90 318 166" fill="none" stroke="#e8d6bd" stroke-width="74" stroke-linecap="round" opacity=".35"/>
<path d="M60 168 C34 62 150 26 200 30 C285 36 352 70 340 160" fill="none" stroke="${K.neu}" stroke-width="11" stroke-linecap="round"/>
<path d="M100 160 C84 102 152 86 200 90 C262 95 306 112 298 162" fill="none" stroke="${K.endo}" stroke-width="13" stroke-linecap="round"/>
<path d="M200 90 L200 100" stroke="${K.endo}" stroke-width="12"/>
<path d="M296 150 C312 175 324 200 334 228" fill="none" stroke="${K.endoD}" stroke-width="5" stroke-linecap="round"/>
<path d="M90 166 L112 160" stroke="#1e2733" stroke-width="4" stroke-linecap="round"/>
<path d="M288 168 L310 162" stroke="#1e2733" stroke-width="4" stroke-linecap="round"/>
<ellipse cx="128" cy="140" rx="20" ry="15" fill="${K.mes}" stroke="${K.mesD}" stroke-width="2"/>`}
const SAG=[
 {n:1,x:200,y:30,name:'Tubo neural',ex:'Recorre todo el dorso del embrión. Los neuroporos (anterior y posterior) son los últimos puntos en cerrarse.'},
 {n:2,x:126,y:96,name:'Intestino anterior',ex:'Tubo ciego que termina en la membrana orofaríngea. De él salen faringe, tiroides, pulmón…'},
 {n:3,x:220,y:91,name:'Intestino medio',ex:'Comunica con el saco vitelino a través del conducto vitelino, que se va estrechando.'},
 {n:4,x:282,y:120,name:'Intestino posterior',ex:'Tubo ciego que termina en la membrana cloacal. El tabique urorrectal lo separa del seno urogenital.'},
 {n:5,x:118,y:190,lx:102,ly:164,name:'Membrana orofaríngea',ex:'Cierra el intestino anterior. Delante queda el estomodeo (futura boca), que se abrirá al romperse.'},
 {n:6,x:276,y:192,lx:296,ly:166,name:'Membrana cloacal',ex:'Cierra el intestino posterior; la cloaca después se abre para formar el ano (proctodeo).'},
 {n:7,x:128,y:140,name:'Corazón',ex:'Del mesodermo cardiogénico (lateral esplácnico más anterior). Con el plegamiento queda en posición ventral, bajo el intestino anterior.'},
 {n:8,x:200,y:240,name:'Saco vitelino',ex:'Hipoblasto + mesodermo extraembrionario. Primeros islotes sanguíneos, hematopoyesis <2 meses, nutrición semanas 2–3.'},
 {n:9,x:212,y:170,name:'Conducto vitelino',ex:'Une el intestino medio con el saco vitelino; se estrecha a medida que el embrión crece más que el saco.'},
 {n:10,x:334,y:228,name:'Alantoides',ex:'Divertículo del endodermo embrionario del intestino posterior. Da los vasos del cordón umbilical; su base forma el seno urogenital.'},
 {n:11,x:356,y:268,name:'Pedículo de fijación (futuro cordón)',ex:'Mesodermo extraembrionario que conecta el embrión con el corion; formará el cordón umbilical (1 vena + 2 arterias).'},
 {n:12,x:40,y:64,name:'Amnios / cavidad amniótica',ex:'Envuelve al embrión: protección mecánica, evita adherencias, antibacteriano, permite movimiento.'}
];
const FIGS={trans:{title:'Corte transversal del tronco',cap:'Embrión ~4 semanas · dorsal arriba',draw:figTrans,parts:TRANS},
            sag:{title:'Corte sagital del embrión plegado',cap:'Embrión ~4–5 semanas · cabeza a la izquierda, dorsal arriba',draw:figSag,parts:SAG}};
function figSVG(key,hi=null,okn=null){const f=FIGS[key];return `<svg class="fig" viewBox="0 0 400 300" role="img" aria-label="${esc(f.title)}">${f.draw()}${f.parts.map(p=>mk(p.n,p.x,p.y,p.n===okn?'ok':p.n===hi?'hi':'',p.lx,p.ly)).join('')}</svg>`}

/* Vellosidades coriónicas en corte (para ordenar) */
function villus(stage){let s=`<svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="12" fill="#f6dcd6"/><circle cx="50" cy="50" r="40" fill="${K.sin}" stroke="${K.sinD}" stroke-width="1.5"/>`;

 scrollTo(0,0);
}
function topbar(title){const p=G.total?Math.round(100*G.i/G.total):0;return `<div class="topbar"><button class="ghost" id="back">← Menú</button><span class="mode-title">${esc(title)}</span><span class="chip">${G.ok}/${G.i} ✓</span>${G.streak>1?`<span class="chip fire">🔥 ${G.streak}</span>`:''}</div><div class="progress"><div style="width:${p}%"></div></div>`}
function wireBack(){$('#back').onclick=home}
function mark(ok){G.i++;if(ok){G.ok++;G.streak++}else G.streak=0;record(G.cat,ok);if(G.sub)record(G.sub,ok)}

function start(id){
 if(id==='hojas')return pickDeck();
 const m=MODES.find(x=>x.id===id);
 let qs=[];
 if(id==='figura')qs=shuffle(figQs()).slice(0,12);
 if(id==='orden')qs=shuffle(SEQS).slice(0,5).map(s=>({k:'orden',s}));
 if(id==='quepasa')qs=shuffle(WHAT).slice(0,12).map(w=>({k:'what',w}));
 if(id==='examen')qs=shuffle([...shuffle(figQs()).slice(0,5),...shuffle(WHAT).slice(0,5).map(w=>({k:'what',w})),...hojaQs().slice(0,5)]);
 G={id,cat:m.cat,title:m.t,qs,i:0,ok:0,streak:0,total:qs.length,miss:[]};
 next();
}
function figQs(){const out=[];for(const key in FIGS)for(const p of FIGS[key].parts){out.push({k:'fig',f:key,p,type:Math.random()<.55?'name':'where'})}return out}
function hojaQs(){const out=[];for(const dk in DECKS){const d=DECKS[dk];for(const it of d.items)out.push({k:'hoja1',d:dk,it})}return shuffle(out)}
function next(){
 if(G.i>=G.total)return results();
 const q=G.qs[G.i];
 if(q.k==='fig')return figQ(q);
 if(q.k==='what')return whatQ(q.w);
 if(q.k==='orden')return orderQ(q.s);
 if(q.k==='hoja1')return hoja1Q(q);
}
function fbHTML(ok,head,body){return `<div class="fb ${ok?'ok':'ko'}"><b>${head}</b>${body?`<p>${body}</p>`:''}<br><button class="primary" id="nx">${G.i>=G.total?'Ver resultado':'Siguiente →'}</button></div>`}
function wireNext(){const b=$('#nx');b.onclick=next;b.focus({preventScroll:true})}

/* ---------- figura ---------- */
function figQ(q){
 const f=FIGS[q.f],p=q.p;
 let side;
 if(q.type==='name'){
  const opts=shuffle([p,...shuffle(f.parts.filter(x=>x!==p)).slice(0,3)]);
  side=`<div class="cat">${esc(f.title)}</div><h2>¿Qué estructura es la nº ${p.n}?</h2><div class="opts">${opts.map(o=>`<button class="opt" data-n="${o.n}">${esc(o.name)}</button>`).join('')}</div><div id="fb"></div>`;
 }else{
  side=`<div class="cat">${esc(f.title)}</div><h2>¿Qué número es: ${esc(p.name.toLowerCase())}?</h2><p class="sub">Pulsa el número.</p><div class="opts nums">${f.parts.map(o=>`<button class="opt" data-n="${o.n}">${o.n}</button>`).join('')}</div><div id="fb"></div>`;
 }
 $('#app').innerHTML=topbar(G.title)+`<div class="qcard"><div class="figwrap" id="fw">${figSVG(q.f,q.type==='name'?p.n:null)}<div class="figcap">${esc(f.cap)}</div></div><div class="qside">${side}</div></div>`;
 wireBack();
 $$('.opt').forEach(b=>b.onclick=()=>{
  const n=+b.dataset.n,ok=n===p.n;$$('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.n===p.n)x.classList.add('correct')});if(!ok)b.classList.add('wrong');
  mark(ok);if(!ok)G.miss.push(p.name);
  $('#fw').innerHTML=figSVG(q.f,ok?null:n,p.n)+`<div class="figcap">${esc(f.cap)}</div>`;
  $('#fb').innerHTML=fbHTML(ok,ok?'¡Bien!':`Era el ${p.n}: ${p.name}`,p.ex);wireNext();
 });
}

/* ---------- ¿qué pasa si? ---------- */
function whatQ(w){
 const opts=shuffle(w.o.map((t,i)=>({t,ok:i===0})));
 $('#app').innerHTML=topbar(G.title)+`<div class="qcard wide"><div class="qhead"><div class="cat">Tema ${w.t}</div></div><div class="wbody"><div class="ctx">${esc(w.q)}</div><div class="opts" style="margin-top:12px">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o.t)}</button>`).join('')}</div><div id="fb" style="margin-top:12px"></div></div></div>`;
 wireBack();
 $$('.opt').forEach(b=>b.onclick=()=>{const o=opts[+b.dataset.i];$$('.opt').forEach(x=>{x.disabled=true;if(opts[+x.dataset.i].ok)x.classList.add('correct')});if(!o.ok)b.classList.add('wrong');
  mark(o.ok);if(!o.ok)G.miss.push(w.q);$('#fb').innerHTML=fbHTML(o.ok,o.ok?'¡Exacto!':'Respuesta: '+w.o[0],w.e);wireNext()});
}

/* ---------- ¿de dónde viene? (una sola, para examen) ---------- */
function hoja1Q(q){
 const d=DECKS[q.d],[txt,bin,ex]=q.it;
 $('#app').innerHTML=topbar(G.title)+`<div class="qcard wide"><div class="qhead"><div class="cat">${esc(d.name)}</div><h2>${esc(txt)}</h2><p class="sub">¿De dónde viene o a qué pertenece?</p></div><div class="wbody"><div class="opts">${d.bins.map(b=>`<button class="opt" data-b="${b[0]}" style="border-left:5px solid ${b[3]}">${esc(b[1])}${b[2]?` <span class="pill">${esc(b[2])}</span>`:''}</button>`).join('')}</div><div id="fb" style="margin-top:12px"></div></div></div>`;
 wireBack();
 $$('.opt').forEach(b=>b.onclick=()=>{const ok=b.dataset.b===bin;$$('.opt').forEach(x=>{x.disabled=true;if(x.dataset.b===bin)x.classList.add('correct')});if(!ok)b.classList.add('wrong');
  mark(ok);if(!ok)G.miss.push(txt);const right=d.bins.find(x=>x[0]===bin)[1];$('#fb').innerHTML=fbHTML(ok,ok?'¡Bien!':'Es: '+right,ex);wireNext()});
}

/* ---------- ¿de dónde viene? (clasificar en cajas) ---------- */
function pickDeck(){
 $('#app').innerHTML=`<div class="topbar"><button class="ghost" id="back">← Menú</button><span class="mode-title">¿De dónde viene?</span></div>
 <p class="sub" style="margin:0 0 14px">Elige un mazo. Toca una etiqueta y luego la caja donde va.</p>
 <div class="decks">${Object.entries(DECKS).map(([k,d])=>{const a=acc('hojas_'+k);return `<button class="deck" data-d="${k}" style="--bc:${d.c}">${esc(d.name)}<small>${esc(d.sub)}${a!==null?` · ${a}%`:''}</small></button>`}).join('')}</div>`;
 $('#back').onclick=home;
 $$('.deck').forEach(b=>b.onclick=()=>{const k=b.dataset.d;G={id:'hojas',cat:'hojas',sub:'hojas_'+k,title:DECKS[k].name,deck:k,rounds:2,round:0,i:0,ok:0,streak:0,total:0,miss:[]};binsRound()});
}
function binsRound(){
 const d=DECKS[G.deck];
 const items=shuffle(d.items).slice(0,Math.min(8,d.items.length));
 const place={};let sel=null;
 G.total=G.i+items.length;
 const draw=()=>{
  const tray=items.filter((_,i)=>!place[i]);
  $('#app').innerHTML=topbar(d.name+` · ronda ${G.round+1}/${G.rounds}`)+`<div class="tray ${tray.length?'':'empty'}" id="tray">${items.map((it,i)=>place[i]?'':`<button class="tag${sel===i?' sel':''}" data-i="${i}">${esc(it[0])}</button>`).join('')}</div>
  <div class="bins">${d.bins.map(b=>`<div class="bin${sel!==null?' armed':''}" data-b="${b[0]}" style="--bc:${b[3]}" role="button" tabindex="0"><h4>${esc(b[1])}</h4><div class="bs">${esc(b[2])}</div><div class="bi">${items.map((it,i)=>place[i]===b[0]?`<button class="tag" data-i="${i}">${esc(it[0])}</button>`:'').join('')}</div></div>`).join('')}</div>
  <div class="btnrow"><button class="primary" id="chk" ${tray.length?'disabled':''}>Comprobar</button><span class="sub" style="margin:0">${tray.length?`Quedan ${tray.length}`:''}</span></div><div id="fb" style="margin-top:12px"></div>`;
  wireBack();
  $$('.tag').forEach(t=>t.onclick=e=>{e.stopPropagation();const i=+t.dataset.i;if(place[i]){delete place[i];sel=i}else sel=sel===i?null:i;draw()});
  $$('.bin').forEach(b=>b.onclick=()=>{if(sel===null)return;place[sel]=b.dataset.b;sel=null;draw()});
  $('#chk').onclick=check;
 };
 const check=()=>{
  let okc=0;const notes=[];
  items.forEach((it,i)=>{const ok=place[i]===it[1];if(ok)okc++;else{G.miss.push(it[0]);notes.push(`<b>${esc(it[0])}</b> → ${esc(d.bins.find(b=>b[0]===it[1])[1])}${it[2]?'. '+it[2]:''}`)}mark(ok)});
  $$('.bin .tag').forEach(t=>{const i=+t.dataset.i,ok=place[i]===items[i][1];t.classList.add(ok?'correct':'wrong');t.disabled=true;if(!ok)t.innerHTML+=`<small>→ ${esc(d.bins.find(b=>b[0]===items[i][1])[1])}</small>`});
  $('#chk').disabled=true;
  G.round++;const last=G.round>=G.rounds;
  $('#fb').innerHTML=`<div class="fb ${okc===items.length?'ok':okc>=items.length*.6?'mid':'ko'}"><b>${okc}/${items.length} bien colocadas</b>${notes.length?`<p>${notes.join('<br>')}</p>`:''}<br><button class="primary" id="nx">${last?'Ver resultado':'Otra ronda →'}</button></div>`;
  $('#nx').onclick=()=>last?results():binsRound();$('#fb').scrollIntoView({behavior:'smooth',block:'nearest'});
 };
 draw();
}

/* ---------- ordenar ---------- */
function orderQ(s){
 const idx=shuffle(s.steps.map((_,i)=>i));const pickd=[];
 const draw=()=>{
  $('#app').innerHTML=topbar(G.title)+`<div class="qcard wide"><div class="qhead"><div class="cat">Ordena</div><h2>${esc(s.t)}</h2><p class="sub">Toca los pasos en orden. Toca otra vez para quitarlo.</p></div><div class="wbody"><div class="ocards">${idx.map(i=>{const pos=pickd.indexOf(i);return `<button class="ocard${pos>=0?' done':''}" data-i="${i}"><span class="num">${pos>=0?pos+1:''}</span>${s.vis?villus(i+1):''}<span>${esc(s.steps[i].replace(/\s*\([^)]*\)/g,''))}</span></button>`}).join('')}</div>
  <div class="btnrow"><button class="primary" id="chk" ${pickd.length<idx.length?'disabled':''}>Comprobar</button><button class="ghost" id="rst">Borrar</button></div><div id="fb" style="margin-top:12px"></div></div></div>`;
  wireBack();
  $$('.ocard').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,p=pickd.indexOf(i);if(p>=0)pickd.splice(p,1);else pickd.push(i);draw()});
  $('#rst').onclick=()=>{pickd.length=0;draw()};
  $('#chk').onclick=()=>{
   let good=0;$$('.ocard').forEach(b=>{const i=+b.dataset.i,p=pickd.indexOf(i);b.disabled=true;if(p===i){good++;b.classList.add('correct')}else{b.classList.add('wrong');b.insertAdjacentHTML('beforeend',`<span class="should">va ${i+1}º</span>`)}});
   const ok=good===s.steps.length;mark(ok);if(!ok)G.miss.push(s.t);
   $('#rst').remove();$('#chk').disabled=true;
   $('#fb').innerHTML=fbHTML(ok,ok?'¡Orden perfecto!':`${good}/${s.steps.length} en su sitio`,ok?'':'Orden correcto:<br>'+s.steps.map((t,i)=>`${i+1}. ${esc(t)}`).join('<br>'));wireNext();
  };
 };
 draw();
}

/* ---------- resultados ---------- */
function results(){
 const pct=G.i?Math.round(100*G.ok/G.i):0;
 const nota=G.id==='examen'?`<div class="sub" style="margin-top:8px">Nota: <b>${(10*G.ok/G.i).toFixed(1).replace('.',',')}</b> / 10</div>`:'';
 const miss=[...new Set(G.miss)];
 $('#app').innerHTML=`<div class="results"><div class="cat">${esc(G.title)}</div><div class="big">${pct}%</div><div class="sub" style="margin-top:6px">${G.ok} de ${G.i} bien</div>${nota}
 ${miss.length?`<div class="rows"><b>Para repasar:</b>${miss.slice(0,10).map(m=>`<div style="font-size:14px">· ${esc(m)}</div>`).join('')}</div>`:'<p>¡Sin fallos! 🎉</p>'}
 <div class="btnrow"><button class="primary" id="again">Otra vez</button><button class="ghost" id="menu">Menú</button></div></div>`;
 $('#again').onclick=()=>G.id==='hojas'?(G={...G,round:0,i:0,ok:0,streak:0,total:0,miss:[]},binsRound()):start(G.id);
 $('#menu').onclick=home;scrollTo(0,0);
}
home();
</script>
